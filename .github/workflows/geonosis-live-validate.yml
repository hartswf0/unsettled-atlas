name: Geonosis live validation

on:
  pull_request:
    paths:
      - 'icosa-live-*.js'
      - 'geonosis-*.js'
      - 'icosa-syntegrity-live.html'
      - 'geonosis.html'
      - 'tests/geonosis-provider-smoke.mjs'
      - '.github/workflows/geonosis-live-validate.yml'
  push:
    branches:
      - feature/icosa-live-data
      - feature/geonosis-semiosis-lens
      - fix/geonosis-scope-contributions
      - fix/geonosis-startup-cache
    paths:
      - 'icosa-live-*.js'
      - 'geonosis-*.js'
      - 'icosa-syntegrity-live.html'
      - 'geonosis.html'
      - 'tests/geonosis-provider-smoke.mjs'
      - '.github/workflows/geonosis-live-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax check injected JavaScript
        shell: bash
        run: |
          set -euo pipefail
          files=(
            icosa-live-inject.js geonosis-source-registry.js geonosis-signal-core.js
            icosa-live-sources.js icosa-live-motion.js geonosis-live-public.js
            geonosis-live-311.js geonosis-live-nfhl.js geonosis-live-epa.js
            geonosis-live-weather-terrain.js geonosis-live-airnow.js geonosis-inference.js
            icosa-live-context.js geonosis-live-context.js geonosis-source-controls.js
            geonosis-inspector.js geonosis-semantics.js geonosis-place.js
            geonosis-scope.js geonosis-contributions.js geonosis-startup.js
          )
          for f in "${files[@]}"; do node --check "$f"; done

      - name: Verify cache-proof harness references every module
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            icosa-live-inject.js geonosis-source-registry.js geonosis-signal-core.js \
            icosa-live-sources.js icosa-live-motion.js geonosis-live-public.js \
            geonosis-live-311.js geonosis-live-nfhl.js geonosis-live-epa.js \
            geonosis-live-weather-terrain.js geonosis-live-airnow.js geonosis-inference.js \
            icosa-live-context.js geonosis-live-context.js geonosis-source-controls.js \
            geonosis-inspector.js geonosis-semantics.js geonosis-place.js \
            geonosis-scope.js geonosis-contributions.js geonosis-startup.js
          do
            grep -F "'$f'" icosa-syntegrity-live.html >/dev/null || { echo "Harness does not load $f" >&2; exit 1; }
          done
          grep -F "cache:'no-store'" icosa-syntegrity-live.html >/dev/null
          grep -F "?build=" icosa-syntegrity-live.html >/dev/null
          grep -F '2026-08-25.signal-start-v1' icosa-syntegrity-live.html >/dev/null
          grep -F 'icosa-syntegrity-live.html?build=' geonosis.html >/dev/null

      - name: Verify delayed adapters cannot miss startup
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'var geoStartupRegisterBase=registerLiveSource' geonosis-startup.js >/dev/null
          grep -F 'setTimeout(function(){geoStartupKick' geonosis-startup.js >/dev/null
          grep -F 'REGISTERING' geonosis-startup.js >/dev/null
          grep -F 'STARTING' geonosis-startup.js >/dev/null
          grep -F 'IDLE without a stated gate is a runtime fault' geonosis-startup.js >/dev/null
          grep -F 'window.ICOSA_LIVE.runtimeHealth' geonosis-startup.js >/dev/null

      - name: Verify map data stays inspectable
        shell: bash
        run: |
          set -euo pipefail
          grep -F "canvas.addEventListener('pointerup',geoInspectPointer,true)" geonosis-inspector.js >/dev/null
          grep -F 'SIGNALS HERE · ' geonosis-inspector.js >/dev/null
          grep -F 'Select this data center on the map' geonosis-scope.js >/dev/null
          grep -F 'SELECTED TRIANGLE' geonosis-scope.js >/dev/null
          grep -F 'ATTENTION SAMPLE' geonosis-scope.js >/dev/null
          grep -F 'NO HIDDEN HERE' geonosis-scope.js >/dev/null

      - name: Verify consequential Geonosis reaches council context
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'DIFFERENCE × EMPLACEMENT × RESPONSIVE SYSTEM → CONSEQUENCE' geonosis-semantics.js >/dev/null
          grep -F 'OBSERVATION_ONLY means no consequential relation is licensed' geonosis-semantics.js >/dev/null
          grep -F 'datacenter-concentration' geonosis-contributions.js >/dev/null
          grep -F 'datacenter-hydro-proximity' geonosis-contributions.js >/dev/null
          grep -F 'terrain-hydrology-composition' geonosis-contributions.js >/dev/null
          grep -F 'semiotic-aggregate' geonosis-contributions.js >/dev/null
          grep -F 'COUNCIL CANDIDATES' geonosis-contributions.js >/dev/null
          grep -F 'base.contributions=pack.items' geonosis-contributions.js >/dev/null
          grep -F 'x.contributions=p.items.slice(0,8)' geonosis-contributions.js >/dev/null

      - name: Verify explicit source gates
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'NASA FIRMS MAP KEY' geonosis-source-controls.js >/dev/null
          grep -F 'AIRNOW API KEY' geonosis-source-controls.js >/dev/null
          grep -F 'AIRCRAFT CORS BASE URL' geonosis-source-controls.js >/dev/null
          grep -F 'aircraft proxy/base URL not configured' icosa-live-motion.js >/dev/null

      - name: Smoke public provider contracts
        run: node tests/geonosis-provider-smoke.mjs
