name: Geonosis contract

on:
  push:
    paths:
      - 'geonosis/**'
      - 'icosa-world.data.js'
      - 'package.json'
  pull_request:
    paths:
      - 'geonosis/**'
      - 'icosa-world.data.js'
      - 'package.json'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run geonosis:test
