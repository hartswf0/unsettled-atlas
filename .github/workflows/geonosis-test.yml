name: Geonosis contract

on:
  push:
    paths:
      - 'geonosis/**'
      - 'icosa-world.data.js'
      - 'package.json'
      - '.github/workflows/geonosis-test.yml'
  pull_request:
    paths:
      - 'geonosis/**'
      - 'icosa-world.data.js'
      - 'package.json'
      - '.github/workflows/geonosis-test.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Offline contract
        run: npm run geonosis:test
      - name: Wave 2 public-provider smoke
        run: npm run geonosis:smoke
