<!DOCTYPE html>
<html lang="en">

<style>

    font:13px/1.45 ui-monospace,Menlo,Consolas,monospace; }

    border-radius:6px; padding:6px 10px; backdrop-filter:blur(3px); }

    padding:9px 14px; font:inherit; letter-spacing:.05em; cursor:pointer; }

    max-width:92vw; padding:4px 10px; border-radius:5px; font-size:11px; color:var(--dim);
    background:rgba(11,11,9,.85); border:1px solid var(--line); display:none; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis; }
  #wire.busy { color:var(--hot); border-color:#4d431f; }
  #wire.warn { color:var(--bad); border-color:#4d1f1f; }
  #wire.ok { color:var(--ok); border-color:#1f4d28; }

<script>
/* ==================================================================== *
 *  ICOSA DRIVE                                                          *
 *                                                                       *
 *  The triangular grid is the world's land selector, and driving is     *
 *  what a triangle means at street scale.                               *
 *                                                                       *
 *  Seven laws (the full theory is ICOSA-DRIVE.md):                      *
 *   1 THE ADDRESS IS THE DEED — one slug names the triangle on the      *
 *     globe and the drivable tile; #F07.2013 is a place you can stand.  *
 *   2 DEPTH IS SCALE — window size, tile zooms and meters-per-unit are  *
 *     functions of subdivision depth, never free parameters.            *
 *   3 THE CAR LIVES ON THE SPHERE — its authoritative position is a     *
 *     geographic point; the tile is a chart of it, inverted each frame. *
 *   4 THE GROUND IS ONE QUESTION — y(x,z) has one answerer; the sea     *
 *     answers with its floor and the program says so.                   *
 *   5 TRAVEL IS CONTAINMENT FAILURE — leave the triangle and cellAt     *
 *     names the neighbour; the world scrolls by one triangle.           *
 *   6 LAND FETCHED ONCE IS LAND OWNED — every fetch becomes an          *
 *     unsettled.landpack/v1 (+cell) that remounts offline.              *
 *   7 NO ENGINE BUT THE GROUND — hand-rolled WebGL, no libraries; only  *
 *     the two tile services are remote, and only at fetch time.        *
 * ==================================================================== */

var DATA = window.ICOSA_WORLD_DATA;
var TAU = Math.PI * 2, D2R = Math.PI / 180, R2D = 180 / Math.PI;
var EARTH_R = 6371.0088;                       // km
var ICO_EDGE_KM = EARTH_R * Math.acos(Math.sqrt(5) / 5); // ≈7053.65 km
var MAX_DEPTH = 30;

/* ------------------------------------------------------------ vectors */
function dot(a, b) { return a[0] * b[0] + a[1] * b[1] + a[2] * b[2]; }
function cross(a, b) {
  return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
}
function norm(a) {

}
function lerp3(a, b, t) {
  return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
}
function clamp(x, a, b) { return x < a ? a : x > b ? b : x; }
function lonlat(v) { return [Math.atan2(v[1], v[0]) * R2D, Math.asin(clamp(v[2], -1, 1)) * R2D]; }
function fromLonLat(lon, lat) {
  var p = lat * D2R, l = lon * D2R;
  return [Math.cos(p) * Math.cos(l), Math.cos(p) * Math.sin(l), Math.sin(p)];
}

/* -------------------------------------------------------- quaternions */
function qId() { return [0, 0, 0, 1]; }
function qMul(a, b) {
  return [
    a[3] * b[0] + a[0] * b[3] + a[1] * b[2] - a[2] * b[1],
    a[3] * b[1] - a[0] * b[2] + a[1] * b[3] + a[2] * b[0],
    a[3] * b[2] + a[0] * b[1] - a[1] * b[0] + a[2] * b[3],
    a[3] * b[3] - a[0] * b[0] - a[1] * b[1] - a[2] * b[2]

}
function qAxis(axis, ang) {

}
function qNorm(q) {
  var l = Math.hypot(q[0], q[1], q[2], q[3]) || 1;
  return [q[0] / l, q[1] / l, q[2] / l, q[3] / l];
}
function qConj(q) { return [-q[0], -q[1], -q[2], q[3]]; }
function qApply(q, v) {
  var x = q[0], y = q[1], z = q[2], w = q[3];
  var tx = 2 * (y * v[2] - z * v[1]), ty = 2 * (z * v[0] - x * v[2]), tz = 2 * (x * v[1] - y * v[0]);
  return [v[0] + w * tx + y * tz - z * ty, v[1] + w * ty + z * tx - x * tz, v[2] + w * tz + x * ty - y * tx];
}
function qSlerp(a, b, t) {
  var d = a[0] * b[0] + a[1] * b[1] + a[2] * b[2] + a[3] * b[3], bb = b;
  if (d < 0) { bb = [-b[0], -b[1], -b[2], -b[3]]; d = -d; }
  if (d > 0.9995) {
    return qNorm([a[0] + (bb[0] - a[0]) * t, a[1] + (bb[1] - a[1]) * t,
                  a[2] + (bb[2] - a[2]) * t, a[3] + (bb[3] - a[3]) * t]);
  }
  var th = Math.acos(clamp(d, -1, 1)), s = Math.sin(th);
  var k0 = Math.sin((1 - t) * th) / s, k1 = Math.sin(t * th) / s;
  return [a[0] * k0 + bb[0] * k1, a[1] * k0 + bb[1] * k1, a[2] * k0 + bb[2] * k1, a[3] * k0 + bb[3] * k1];
}

  var d = dot(a, b);
  if (d > 0.999999) return qId();

    var ax = Math.abs(a[0]) < 0.9 ? cross(a, [1, 0, 0]) : cross(a, [0, 1, 0]);
    return qAxis(ax, Math.PI);

/* ==================================================================== *
 *  1 · THE WORLD — twenty faces, exact subdivision (verbatim from the   *
 *  parents; the fusion changes what a cell is FOR, not what it is).     *
 * ==================================================================== */

var V = DATA.ico.vertices;
var FACES = DATA.ico.faces;
var NF = FACES.length;

  var a = V[f[0]], b = V[f[1]], c = V[f[2]];

    [(b[1] * c[2] - b[2] * c[1]) / det, (c[0] * b[2] - b[0] * c[2]) / det, (b[0] * c[1] - c[0] * b[1]) / det],
    [(c[1] * a[2] - a[1] * c[2]) / det, (a[0] * c[2] - c[0] * a[2]) / det, (c[0] * a[1] - a[0] * c[1]) / det],
    [(a[1] * b[2] - b[1] * a[2]) / det, (b[0] * a[2] - a[0] * b[2]) / det, (a[0] * b[1] - b[0] * a[1]) / det]

          m[1][0] * p[0] + m[1][1] * p[1] + m[1][2] * p[2],
          m[2][0] * p[0] + m[2][1] * p[1] + m[2][2] * p[2]];

  return [r[0] / s, r[1] / s, r[2] / s];

  return norm([a[0] * w[0] + b[0] * w[1] + c[0] * w[2],
               a[1] * w[0] + b[1] * w[1] + c[1] * w[2],
               a[2] * w[0] + b[2] * w[1] + c[2] * w[2]]);
}
function faceOf(p) {
  var best = 0, bestMin = -Infinity;
  for (var f = 0; f < NF; f++) {
    var r = baryRaw(f, p), s = r[0] + r[1] + r[2];
    if (s <= 0) continue;
    var m = Math.min(r[0], Math.min(r[1], r[2])) / s;
    if (m >= -1e-12) return f;
    if (m > bestMin) { bestMin = m; best = f; }
  }
  return best;
}
var ROOT_TRI = [[1, 0, 0], [0, 1, 0], [0, 0, 1]];
function mid(a, b) { return [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2, (a[2] + b[2]) / 2]; }
function childTri(t, i) {
  var m01 = mid(t[0], t[1]), m12 = mid(t[1], t[2]), m02 = mid(t[0], t[2]);
  if (i === 0) return [t[0], m01, m02];
  if (i === 1) return [m01, t[1], m12];
  if (i === 2) return [m02, m12, t[2]];
  return [m01, m12, m02];
}
function cellTri(face, path) {
  var t = ROOT_TRI;
  for (var i = 0; i < path.length; i++) t = childTri(t, path[i]);
  return t;
}
function makeCell(face, path) {
  return { f: face, path: path.slice(), depth: path.length, tri: cellTri(face, path) };
}
function descend(w) {
  if (w[0] >= 0.5) return [0, [2 * w[0] - 1, 2 * w[1], 2 * w[2]]];
  if (w[1] >= 0.5) return [1, [2 * w[0], 2 * w[1] - 1, 2 * w[2]]];
  if (w[2] >= 0.5) return [2, [2 * w[0], 2 * w[1], 2 * w[2] - 1]];
  return [3, [1 - 2 * w[2], 1 - 2 * w[0], 1 - 2 * w[1]]];
}
function cellAt(p, depth) {
  var f = faceOf(p), w = baryOf(f, p), path = [];
  for (var d = 0; d < depth; d++) {
    var r = descend(w);
    path.push(r[0]); w = r[1];
  }

}
function cellCorners(c) {
  return [baryPoint(c.f, c.tri[0]), baryPoint(c.f, c.tri[1]), baryPoint(c.f, c.tri[2])];
}
function cellCentre(c) {
  var t = c.tri;
  return baryPoint(c.f, [(t[0][0] + t[1][0] + t[2][0]) / 3,
                         (t[0][1] + t[1][1] + t[2][1]) / 3,
                         (t[0][2] + t[1][2] + t[2][2]) / 3]);
}
function cellEdgeKm(c) { return ICO_EDGE_KM / Math.pow(2, c.depth); }
function cellContains(c, p) {
  if (faceOf(p) !== c.f) return false;
  var w = baryOf(c.f, p), t = c.tri;
  var d = (t[1][1] - t[2][1]) * (t[0][0] - t[2][0]) + (t[2][0] - t[1][0]) * (t[0][1] - t[2][1]);
  if (Math.abs(d) < 1e-18) return false;
  var a = ((t[1][1] - t[2][1]) * (w[0] - t[2][0]) + (t[2][0] - t[1][0]) * (w[1] - t[2][1])) / d;
  var b = ((t[2][1] - t[0][1]) * (w[0] - t[2][0]) + (t[0][0] - t[2][0]) * (w[1] - t[2][1])) / d;
  return a >= -1e-9 && b >= -1e-9 && a + b <= 1 + 1e-9;

function sphericalAngle(a, b, c) {
  var n1 = norm(cross(a, b)), n2 = norm(cross(a, c));
  return Math.acos(clamp(dot(n1, n2), -1, 1));
}
function cellAreaKm2(c) {
  var P = cellCorners(c);
  var excess = sphericalAngle(P[0], P[1], P[2]) + sphericalAngle(P[1], P[2], P[0])

  return Math.abs(excess) * EARTH_R * EARTH_R;
}
function areaLabel(km2) {
  if (km2 >= 1e6) return (km2 / 1e6).toFixed(2) + ' million km²';
  if (km2 >= 1) return Math.round(km2).toLocaleString('en') + ' km²';
  if (km2 >= 0.01) return (km2 * 100).toFixed(1) + ' ha';
  return Math.round(km2 * 1e6) + ' m²';
}
function cellSlug(c) {
  return 'F' + (c.f < 10 ? '0' : '') + c.f + (c.path.length ? '.' + c.path.join('') : '');
}
function cellFromSlug(str) {
  var m = /^F?(\d{1,2})[.\-·]?([0-3]*)$/.exec(String(str || '').trim());
  if (!m) return null;
  var f = +m[1];
  if (!(f >= 0 && f < NF)) return null;
  return makeCell(f, m[2].split('').filter(function (s) { return s !== ''; }).map(Number).slice(0, MAX_DEPTH));
}

/* -------------------------------------------------- coastlines, cities */
function decodeLines(s, q) {
  if (!s) return [];
  q = q || 100;
  var out = [], groups = s.split(';');
  for (var g = 0; g < groups.length; g++) {
    var nums = groups[g].split(','), pts = [], x = 0, y = 0;
    for (var i = 0; i < nums.length; i += 2) {
      x += +nums[i]; y += +nums[i + 1];
      pts.push([x / q, y / q]);
    }
    out.push(pts);
  }
  return out;

var LAND_RINGS = decodeLines(DATA.land).map(function (r) {
  return r.map(function (p) { return fromLonLat(p[0], p[1]); });
});
var CITIES = DATA.cities.slice().sort(function (a, b) { return b.pop - a.pop; })
  .map(function (c) { return { name: c.name, v: fromLonLat(c.lon, c.lat), pop: c.pop }; });

/* ==================================================================== *
 *  2 · THE WINDOW — law 2: everything derives from depth.               *
 *  halfM covers the triangle's circumradius (0.577·edge) with margin,   *
 *  floored at THUNDER RIGS' street standard (147 m over 160 units =     *
 *  1.84 m/unit) and capped at the depth-10 fetch budget.                *
 * ==================================================================== */

var WU = 160, GRID_N = 129;
var HALF_MIN = 147, HALF_MAX = 4273, DRIVE_DEPTH = 10;
function windowOf(cell) {
  var edgeM = cellEdgeKm(cell) * 1000;
  var halfM = clamp(0.62 * edgeM, HALF_MIN, HALF_MAX);
  var g = lonlat(cellCentre(cell));
  var ez = halfM <= 260 ? 15 : halfM <= 1100 ? 14 : 13;
  var iz = halfM <= 200 ? 18 : halfM <= 420 ? 17 : halfM <= 1100 ? 16 : 14;
  return { slug: cellSlug(cell), lat: g[1], lon: g[0], halfM: halfM,
           S: 2 * halfM / WU, ez: ez, iz: iz };

// the chart and its inverse — law 3. North is -z, east is +x.
function chartToGeo(win, x, z) {
  var mLat = 111320, mLon = 111320 * Math.cos(win.lat * D2R);
  return [win.lat - z * win.S / mLat, win.lon + x * win.S / mLon];
}
function geoToChart(win, lat, lon) {
  var mLat = 111320, mLon = 111320 * Math.cos(win.lat * D2R);
  var dl = lon - win.lon;
  if (dl > 180) dl -= 360; if (dl < -180) dl += 360;
  return [dl * mLon / win.S, (win.lat - lat) * mLat / win.S];

/* ==================================================================== *
 *  3 · TERRA — the fetch, the pack, the cache. Law 6: every fetch is    *
 *  immediately an unsettled.landpack/v1 (+cell) — cached, savable,      *
 *  mountable offline. Encoding byte-compatible with THUNDER RIGS.       *
 * ==================================================================== */

var LAND_FMT = 'unsettled.landpack/v1';
var LAND_CACHE_KEY = 'icosa.landcache.v1';
function packHeights(H, relief) {
  var bin = '';
  for (var i = 0; i < H.length; i += 2) {
    var a = Math.max(0, Math.min(4095, Math.round(H[i] / relief * 4095)));
    var b = (i + 1 < H.length) ? Math.max(0, Math.min(4095, Math.round(H[i + 1] / relief * 4095))) : 0;
    bin += String.fromCharCode(a >> 4, ((a & 15) << 4) | (b >> 8), b & 255);

function cacheGet(key) {

  var st = [];
  try { st = JSON.parse(localStorage.getItem(LAND_CACHE_KEY) || '[]'); } catch (_) {}
  st = st.filter(function (r) { return r[0] !== key; });
  st.push([key, pack]);
  for (var n = 3; n >= 1; n--) {  // quota guard: keep the newest few deeds
    try { localStorage.setItem(LAND_CACHE_KEY, JSON.stringify(st.slice(-n))); return; } catch (_) {}
  }
  try { localStorage.removeItem(LAND_CACHE_KEY); } catch (_) {}

var t2 = {
  x: function (lon, z) { return (lon + 180) / 360 * Math.pow(2, z); },
  y: function (lat, z) { return (1 - Math.asinh(Math.tan(lat * D2R)) / Math.PI) / 2 * Math.pow(2, z); }

function img(url) {
  return new Promise(function (ok, no) {
    var i = new Image(); i.crossOrigin = 'anonymous';
    i.onload = function () { ok(i); };

}

    WIN = win;
    await mountPack(pack);
    if (tok !== LAND_TOKEN) return false;       // the user rose; stay risen
    // stand on the ground — carried point, resumed pose, or the centroid
    var geo = opts.geo || (resume && resume.geo);
    if (geo) {
      var lc = geoToChart(win, geo[0], geo[1]);
      CAR.x = clamp(lc[0], -WU / 2 + 1, WU / 2 - 1);
      CAR.z = clamp(lc[1], -WU / 2 + 1, WU / 2 - 1);
      if (resume) { CAR.yaw = resume.yaw; CAR.speed = 0; }
    } else { CAR.x = 0; CAR.z = 0; CAR.speed = 0; }
    CAR.y = GROUND.y(CAR.x, CAR.z);
    CAM.x = CAR.x; CAM.y = CAR.y + 6; CAM.z = CAR.z + 10;
    MODE = 'drive';
    enterDriveUI();
    setHash(win.slug);
    var seaNote = (pack.zminM < -5) ? ' · elevations are bathymetric — this is the sea floor' : '';
    wire(win.slug + ' · 1 unit = ' + win.S.toFixed(2) + ' m · relief ' + pack.reliefM + ' m'
      + (resume ? ' · resumed where you stood' : '') + seaNote, 'ok');
    return true;
  } catch (e) {
    if (tok !== LAND_TOKEN) return false;
    MODE = 'select';
    updateSelectUI();
    wire('the land did not come: ' + e.message, 'warn');
    return false;
  }
}

// law 5 — travel is containment failure
var CROSS_LOCK = false;
async function crossInto(p) {
  if (CROSS_LOCK) return;
  var next = cellAt(p, CELL.depth);
  if (cellSlug(next) === cellSlug(CELL)) return;   // numeric jitter at the very edge
  CROSS_LOCK = true;
  MODE = 'crossing';
  var carried = [CAR.lat, CAR.lon];
  var from = cellSlug(CELL);
  wire('crossing ' + from + ' → ' + cellSlug(next) + ' — raising the next triangle', 'busy');
  var prevCell = CELL, prevWin = WIN, prevPack = PACK;
  CELL = next;
  var ok = await land({ geo: carried });
  if (!ok && MODE === 'select') {                   // the user rose mid-crossing: stay risen
    CROSS_LOCK = false;
    return;
  }
  if (!ok) {                                        // the neighbour did not come; stay home
    CELL = prevCell; WIN = prevWin; PACK = prevPack;
    if (prevPack) { await mountPack(prevPack); }
    var lc = geoToChart(WIN, carried[0], carried[1]);
    CAR.x = clamp(lc[0] * 0.94, -WU / 2 + 1, WU / 2 - 1);   // nudged back inside
    CAR.z = clamp(lc[1] * 0.94, -WU / 2 + 1, WU / 2 - 1);
    CAR.speed = 0;
    MODE = 'drive';
  } else {
    CAR.speed *= 0.6;
    wire('crossed into ' + cellSlug(CELL), 'ok');
  }
  CROSS_LOCK = false;
}

/* ==================================================================== *
 *  8 · THE SELECTOR — the orthographic globe. SPIN, DESCEND, ASCEND.    *
 * ==================================================================== */

var globe = document.getElementById('globe');
var g2 = globe.getContext('2d');
var Q = qNorm(DATA.ico.quat ? [DATA.ico.quat[0], DATA.ico.quat[1], DATA.ico.quat[2], DATA.ico.quat[3]] : qId());
var Q_TARGET = null;
function project(p, cx, cy, R) {
  var r = qApply(Q, p);
  return { x: cx + r[0] * R, y: cy - r[2] * R, front: r[1] <= 0.02 };
}
function rotateTo(p) {
  var qt = qMul(qBetween(qApply(Q, p), [0, -1, 0]), Q);
  // roll so north is up at the target — a centred place should read as a map
  var f = 1 - p[2] * p[2];
  if (f > 1e-9) {
    var nt = norm([-p[0] * p[2], -p[1] * p[2], f]);
    var t = qApply(qt, nt);
    qt = qNorm(qMul(qAxis([0, 1, 0], -Math.atan2(t[0], t[2])), qt));
  }
  Q_TARGET = qt;
}
function drawArc(a, b, cx, cy, R, segs) {
  segs = segs || 10;
  var started = false;
  for (var i = 0; i <= segs; i++) {
    var p = project(norm(lerp3(a, b, i / segs)), cx, cy, R);
    if (!p.front) { started = false; continue; }
    if (!started) { g2.moveTo(p.x, p.y); started = true; }
    else g2.lineTo(p.x, p.y);
  }
}
function drawGlobe() {
  var w = globe.clientWidth, h = globe.clientHeight, dpr = Math.min(devicePixelRatio || 1, 2);
  if (globe.width !== w * dpr || globe.height !== h * dpr) {
    globe.width = w * dpr; globe.height = h * dpr;
  }
  g2.setTransform(dpr, 0, 0, dpr, 0, 0);
  g2.clearRect(0, 0, w, h);
  var cx = w / 2, cy = h / 2, R = Math.min(w, h) * 0.42;
  if (Q_TARGET) {
    Q = qSlerp(Q, Q_TARGET, 0.14);
    var d = Math.abs(Q[0] * Q_TARGET[0] + Q[1] * Q_TARGET[1] + Q[2] * Q_TARGET[2] + Q[3] * Q_TARGET[3]);
    if (d > 0.99999) { Q = Q_TARGET; Q_TARGET = null; }
  }
  // the ocean
  g2.beginPath(); g2.arc(cx, cy, R, 0, TAU);
  g2.fillStyle = '#101d26'; g2.fill();
  g2.strokeStyle = '#2a3a46'; g2.lineWidth = 1; g2.stroke();
  // coastlines
  g2.beginPath();
  for (var r = 0; r < LAND_RINGS.length; r++) {
    var ring = LAND_RINGS[r], started = false;
    for (var i = 0; i < ring.length; i++) {
      var p = project(ring[i], cx, cy, R);
      if (!p.front) { started = false; continue; }
      if (!started) { g2.moveTo(p.x, p.y); started = true; }
      else g2.lineTo(p.x, p.y);
    }
  }
  g2.strokeStyle = '#7a7466'; g2.lineWidth = 1; g2.stroke();
  // the icosa wireframe
  g2.beginPath();
  var E = DATA.ico.edges;                      // [faceA, faceB, sideA, sideB, vertA, vertB]
  for (var e = 0; e < E.length; e++) drawArc(V[E[e][4]], V[E[e][5]], cx, cy, R, 12);
  g2.strokeStyle = 'rgba(120,140,160,0.25)'; g2.lineWidth = 1; g2.stroke();
  // cities — the biggest, as orientation
  g2.fillStyle = 'rgba(232,228,216,0.75)';
  g2.font = '10px ui-monospace,monospace';
  for (var c = 0; c < 24; c++) {
    var ct = CITIES[c], pc = project(ct.v, cx, cy, R);
    if (!pc.front) continue;
    g2.beginPath(); g2.arc(pc.x, pc.y, 1.6, 0, TAU); g2.fill();
    if (c < 12) g2.fillText(ct.name, pc.x + 4, pc.y + 3);
  }
  // the selected cell and its four children
  if (CELL) {
    var corners = cellCorners(CELL);
    var landing = MODE === 'landing' || MODE === 'crossing';
    var lph = (performance.now() % 1500) / 1500;
    g2.beginPath();
    drawArc(corners[0], corners[1], cx, cy, R, 16);
    drawArc(corners[1], corners[2], cx, cy, R, 16);
    drawArc(corners[2], corners[0], cx, cy, R, 16);
    g2.strokeStyle = '#ffd75e';
    g2.lineWidth = landing ? 2 + 1.6 * Math.sin(lph * TAU) * Math.sin(lph * TAU) : 2;
    g2.stroke();
    if (landing) {
      // the ground is being raised: rings fall INTO the cell, like descent
      var cp2 = project(cellCentre(CELL), cx, cy, R);
      if (cp2.front) {
        for (var ring = 0; ring < 2; ring++) {
          var rp = (lph + ring * 0.5) % 1;
          g2.beginPath(); g2.arc(cp2.x, cp2.y, 26 * (1 - rp) + 3, 0, TAU);
          g2.strokeStyle = 'rgba(255,215,94,' + (0.7 * rp).toFixed(3) + ')';
          g2.lineWidth = 1.4; g2.stroke();
        }
      }
    }
    if (CELL.depth < MAX_DEPTH) {
      var m01 = baryPoint(CELL.f, mid(CELL.tri[0], CELL.tri[1]));
      var m12 = baryPoint(CELL.f, mid(CELL.tri[1], CELL.tri[2]));
      var m02 = baryPoint(CELL.f, mid(CELL.tri[0], CELL.tri[2]));
      g2.beginPath();
      drawArc(m01, m12, cx, cy, R, 8); drawArc(m12, m02, cx, cy, R, 8); drawArc(m02, m01, cx, cy, R, 8);
      g2.strokeStyle = 'rgba(255,215,94,0.45)'; g2.lineWidth = 1; g2.stroke();
      g2.fillStyle = 'rgba(255,215,94,0.8)';
      g2.font = '11px ui-monospace,monospace';
      for (var ch = 0; ch < 4; ch++) {
        var ct2 = childTri(CELL.tri, ch);
        var cp = project(baryPoint(CELL.f, [(ct2[0][0] + ct2[1][0] + ct2[2][0]) / 3,
          (ct2[0][1] + ct2[1][1] + ct2[2][1]) / 3, (ct2[0][2] + ct2[1][2] + ct2[2][2]) / 3]), cx, cy, R);
        if (cp.front) g2.fillText(String(ch), cp.x - 3, cp.y + 4);
      }
    }
  } else {
    // no selection: name the faces faintly
    g2.fillStyle = 'rgba(160,170,180,0.5)';
    g2.font = '10px ui-monospace,monospace';
    for (var f = 0; f < NF; f++) {
      var fc = project(cellCentre(makeCell(f, [])), cx, cy, R);
      if (fc.front) g2.fillText('F' + (f < 10 ? '0' : '') + f, fc.x - 9, fc.y + 3);
    }
  }
}

/* -------------------------------------------------- selector gestures */
var drag = null;
globe.addEventListener('pointerdown', function (ev) {
  drag = { x: ev.clientX, y: ev.clientY, moved: false, id: ev.pointerId };
  globe.setPointerCapture(ev.pointerId);
});
globe.addEventListener('pointermove', function (ev) {
  if (!drag || ev.pointerId !== drag.id) return;
  var dx = ev.clientX - drag.x, dy = ev.clientY - drag.y;
  if (Math.abs(dx) + Math.abs(dy) > 6) drag.moved = true;
  if (drag.moved) {
    var R = Math.min(globe.clientWidth, globe.clientHeight) * 0.42;
    Q = qNorm(qMul(qAxis([1, 0, 0], dy / R), qMul(qAxis([0, 0, 1], dx / R), Q)));
    Q_TARGET = null;
    drag.x = ev.clientX; drag.y = ev.clientY;
  }
});
globe.addEventListener('pointerup', function (ev) {
  if (!drag || ev.pointerId !== drag.id) return;
  if (!drag.moved) tapGlobe(ev.clientX, ev.clientY);
  drag = null;
});
function unproject(sx, sy) {
  var w = globe.clientWidth, h = globe.clientHeight;
  var cx = w / 2, cy = h / 2, R = Math.min(w, h) * 0.42;
  var vx = (sx - cx) / R, vz = -(sy - cy) / R;
  var rr = vx * vx + vz * vz;
  if (rr > 1) return null;
  return qApply(qConj(Q), [vx, -Math.sqrt(Math.max(0, 1 - rr)), vz]);
}
function tapGlobe(sx, sy) {
  if (MODE !== 'select') return;
  var p = unproject(sx, sy);
  if (!p) return;
  if (!CELL) selectCell(makeCell(faceOf(p), []));
  else if (cellContains(CELL, p) && CELL.depth < MAX_DEPTH) selectCell(cellAt(p, CELL.depth + 1));
  else selectCell(cellAt(p, CELL.depth));       // a lateral move at the same depth
}
function selectCell(c) {
  CELL = c;
  rotateTo(cellCentre(c));
  setHash(cellSlug(c));
  updateSelectUI();
}

/* ==================================================================== *
 *  9 · UI — the address chip is the one truth about where you are.      *
 * ==================================================================== */

var el = function (id) { return document.getElementById(id); };
function updateSelectUI() {
  if (!CELL) {
    el('aSlug').textContent = 'THE PLANET';
    el('aSub').textContent = 'tap a face to begin · drag to spin';
    el('bUp').style.display = 'none';
    el('bLand').style.display = 'none';
    return;
  }
  var slug = cellSlug(CELL), km = cellEdgeKm(CELL);
  el('aSlug').textContent = slug;
  el('aSub').textContent = 'depth ' + CELL.depth + ' · edge ' +
    (km >= 1 ? km.toFixed(km < 10 ? 1 : 0) + ' km' : Math.round(km * 1000) + ' m') +
    ' · ' + areaLabel(cellAreaKm2(CELL));
  el('bUp').style.display = '';
  el('bLand').style.display = '';
  if (CELL.depth >= DRIVE_DEPTH) {
    var win = windowOf(CELL);
    el('bLand').disabled = false;
    el('bLand').className = 'hot';
    el('bLand').textContent = 'LAND — ' + Math.round(win.halfM * 2) + ' m of ground';
  } else {
    el('bLand').disabled = true;
    el('bLand').className = '';
    el('bLand').textContent = 'descend ' + (DRIVE_DEPTH - CELL.depth) + ' more to land';
  }
}
function enterDriveUI() {
  globe.style.display = 'none';
  glCanvas.style.display = 'block';
  el('bUp').style.display = 'none';
  el('bLand').style.display = 'none';
  el('bRise').style.display = '';
  el('bSave').style.display = '';
  el('geo').style.display = 'block';
  el('pad').style.display = 'grid';
  el('aSlug').textContent = WIN.slug;
  el('aSub').textContent = '1 unit = ' + WIN.S.toFixed(2) + ' m · drive across the edge to travel';
}
function enterSelectUI() {
  globe.style.display = 'block';
  glCanvas.style.display = 'none';
  el('bRise').style.display = 'none';
  el('bSave').style.display = 'none';
  el('geo').style.display = 'none';
  el('pad').style.display = 'none';
  updateSelectUI();
}
function fmtGeo(lat, lon) {
  return Math.abs(lat).toFixed(5) + (lat < 0 ? '°S' : '°N') + ' ' +
         Math.abs(lon).toFixed(5) + (lon < 0 ? '°W' : '°E');
}
function updateDriveHUD() {
  el('aSlug').textContent = WIN.slug;
  el('gPos').textContent = fmtGeo(CAR.lat, CAR.lon);
  el('gElev').textContent = 'elev ' + Math.round(elevOfM(CAR.x, CAR.z)) + ' m';
  el('gSpd').textContent = Math.abs(CAR.speed * GROUND.S * 3.6).toFixed(0) + ' km/h';
}

el('bUp').addEventListener('click', function () {
  if (!CELL) return;
  if (!CELL.path.length) { CELL = null; updateSelectUI(); setHash(''); return; }
  selectCell(makeCell(CELL.f, CELL.path.slice(0, -1)));
});
el('bLand').addEventListener('click', function () { land(); });
el('bRise').addEventListener('click', function () {
  // RISE — back to the selector, at the cell you are IN (after driving,
  // generally not the one you landed in). Works mid-crossing too: the
  // token invalidates any landing in flight, and the pose is kept so
  // LAND resumes exactly where the car stood.
  LAND_TOKEN++;
  CROSS_LOCK = false;
  if (WIN) LAST_POSE = { geo: [CAR.lat, CAR.lon], yaw: CAR.yaw };
  MODE = 'select';
  enterSelectUI();
  if (CELL) { rotateTo(cellCentre(CELL)); setHash(cellSlug(CELL)); }
});
el('bSave').addEventListener('click', function () {
  if (!PACK) { wire('no land mounted', 'warn'); return; }
  var blob = new Blob([JSON.stringify(PACK)], { type: 'application/json' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (PACK.cell || 'land') + '.landpack.json';
  document.body.appendChild(a); a.click(); a.remove();
  wire(a.download + ' — mounts anywhere, zero network', 'ok');
});
el('bMount').addEventListener('click', function () { el('fMount').click(); });
el('fMount').addEventListener('change', function (ev) {
  var f = ev.target.files && ev.target.files[0];
  if (!f) return;
  var rd = new FileReader();
  rd.onload = async function () {
    try {
      var pack = JSON.parse(rd.result);
      if (!pack.hf || !pack.nx) throw new Error('not a landpack — no heightfield inside');
      if (!glInit()) throw new Error('no WebGL — the pack is readable but the land cannot rise');
      if (pack.cell) { var c = cellFromSlug(pack.cell); if (c) CELL = c; }
      WIN = { slug: pack.cell || pack.name || 'IMPORTED', lat: pack.lat || 0, lon: pack.lon || 0,
              halfM: pack.halfM || (pack.scale ? pack.scale * WU / 2 : HALF_MIN), S: pack.scale || 1.84 };
      await mountPack(pack);
      CAR.x = (pack.spawn && pack.spawn.x) || 0; CAR.z = (pack.spawn && pack.spawn.z) || 0;
      CAR.speed = 0; CAR.y = GROUND.y(CAR.x, CAR.z);
      MODE = 'drive';
      enterDriveUI();
      wire('mounted ' + WIN.slug + ' from file — zero network', 'ok');
    } catch (e) { wire('mount failed: ' + e.message, 'warn'); }
  };
  rd.readAsText(f);
  ev.target.value = '';
});

/* ------------------------------------------------------------- input */
var KEYMAP = { ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down',
               ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right' };
addEventListener('keydown', function (ev) {
  // the two modes are one keyboard apart: Enter lands, Escape rises
  if (ev.code === 'Escape' && (MODE === 'drive' || MODE === 'crossing')) {
    el('bRise').click(); ev.preventDefault(); return;
  }
  if (ev.code === 'Enter' && MODE === 'select' && CELL && !el('bLand').disabled) {
    land(); ev.preventDefault(); return;
  }
  var k = KEYMAP[ev.code];
  if (k) { INPUT[k] = true; ev.preventDefault(); }
});
addEventListener('keyup', function (ev) {
  var k = KEYMAP[ev.code];
  if (k) INPUT[k] = false;
});
Array.prototype.forEach.call(document.querySelectorAll('#pad button'), function (b) {
  var k = b.dataset.k;
  b.addEventListener('pointerdown', function (ev) { INPUT[k] = true; ev.preventDefault(); });
  b.addEventListener('pointerup', function () { INPUT[k] = false; });
  b.addEventListener('pointercancel', function () { INPUT[k] = false; });
});

/* ==================================================================== *
 *  10 · LOOP & START                                                    *
 * ==================================================================== */

var lastT = 0;
function frame(now) {
  var dt = Math.min(0.05, (now - lastT) / 1000 || 0.016);
  lastT = now;
  if (globe.style.display !== 'none') drawGlobe();
  if (MODE === 'drive') {
    stepCar(dt);
    // law 5, tested every frame with the grid's own membership function
    var p = fromLonLat(CAR.lon, CAR.lat);
    if (!cellContains(CELL, p)) crossInto(p);
    if (MODE === 'drive') { renderDrive(); updateDriveHUD(); }
  } else if ((MODE === 'crossing' || MODE === 'landing') &&
             TERRA_MESH && glCanvas.style.display === 'block') {
    renderDrive();                             // the world keeps moving while it loads
  }
  requestAnimationFrame(frame);
}

(function start() {
  if (!DATA) { el('boot').textContent = 'icosa-world.data.js did not load'; return; }
  var h = decodeURIComponent(location.hash.slice(1) || '');
  var wantDrive = /@drive$/.test(h);
  var c = cellFromSlug(h.replace(/@drive$/, ''));
  rotateTo(c ? cellCentre(c) : fromLonLat(-30, 25));
  Q = Q_TARGET; Q_TARGET = null;               // arrive oriented, no spin-up
  if (c) CELL = c;
  updateSelectUI();
  requestAnimationFrame(frame);
  setTimeout(function () { el('boot').classList.add('gone'); }, 600);
  if (c && wantDrive && c.depth >= DRIVE_DEPTH) setTimeout(function () { land(); }, 700);
})();

/* -------------------------------------------------- verification hooks
 * The laws must be checkable headless. Everything here reads or drives
 * the same state the fingers do — no parallel truth.                   */
window.ICOSA_DRIVE = {
  fmt: LAND_FMT,
  mode: function () { return MODE; },
  slug: function () { return CELL ? cellSlug(CELL) : null; },
  select: function (slug) {
    var c = cellFromSlug(slug);
    if (c) { selectCell(c); return cellSlug(c); }
    return null;
  },
  windowOf: function (slug) { var c = cellFromSlug(slug); return c ? windowOf(c) : null; },
  land: land,
  rise: function () { el('bRise').click(); },
  car: CAR,
  input: INPUT,
  teleport: function (x, z) { CAR.x = x; CAR.z = z; CAR.speed = 0; },
  ground: function (x, z) { return GROUND.on ? GROUND.y(x, z) : null; },
  elevM: elevOfM,
  win: function () { return WIN; },
  pack: function () { return PACK; },
  cellAtGeo: function (lat, lon, depth) { return cellSlug(cellAt(fromLonLat(lon, lat), depth)); },
  geoAt: function (x, z) { return WIN ? chartToGeo(WIN, x, z) : null; },
  chartAt: function (lat, lon) { return WIN ? geoToChart(WIN, lat, lon) : null; },
  contains: function (slug, lat, lon) {
    var c = cellFromSlug(slug); return c ? cellContains(c, fromLonLat(lon, lat)) : null;
  }
};
</script>
</body>
</html>
