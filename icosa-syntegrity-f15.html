<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ICOSA SYNTEGRITY · F15 EARTH</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f1eee4;color:#121514;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
body{display:grid;place-items:center}
#boot{font-size:10px;letter-spacing:.18em}
</style>
<div id="boot">OPENING F15 · EARTH FIRST</div>
<script>
(function () {
  'use strict';
  var BUILD='2026-09-04.f15-earth-lean-v2';
  if(!location.hash)history.replaceState(null,'',location.pathname+location.search+'#F15');

  function load(name){
    return fetch(name+'?build='+encodeURIComponent(BUILD),{cache:'default'}).then(function(r){
      if(!r.ok)throw new Error(name+' '+r.status);
      return r.text();
    });
  }

  Promise.all([
    load('icosa-syntegrity.html'),
    load('geonosis-earth-f15-lite.js')
  ]).then(function(parts){
    var html=parts[0],earth=parts[1];
    var needle='})();',at=html.lastIndexOf(needle);
    if(at<0)throw new Error('main ICOSA closure not found');
    html=html.slice(0,at)+'\n/* --- F15 EARTH WORKING SET · LEAN --- */\n'+earth+'\n'+html.slice(at);
    document.open();document.write(html);document.close();
  }).catch(function(err){
    document.getElementById('boot').textContent='F15 BOOT FAILED · '+String(err&&err.message||err)+' · '+BUILD;
  });
})();
</script>
