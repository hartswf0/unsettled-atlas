<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ICOSA SYNTEGRITY · F15 EARTH</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f1eee4;color:#121514;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
body{display:grid;place-items:center}
#boot{font-size:10px;letter-spacing:.18em}
</style>
<div id="boot">COMPILING F15 · EARTH WORKING SET</div>
<script>
(function () {
  'use strict';
  var BUILD='2026-09-04.f15-earth-v1';
  if(!location.hash)history.replaceState(null,'',location.pathname+location.search+'#F15');
  var files=[
    'icosa-syntegrity.html',
    'icosa-live-inject.js',
    'geonosis-source-registry.js',
    'geonosis-signal-core.js',
    'icosa-live-sources.js',
    'icosa-live-motion.js',
    'geonosis-live-public.js',
    'geonosis-live-311.js',
    'geonosis-live-nfhl.js',
    'geonosis-live-epa.js',
    'geonosis-live-weather-terrain.js',
    'geonosis-live-airnow.js',
    'geonosis-inference.js',
    'icosa-live-context.js',
    'geonosis-live-context.js',
    'geonosis-source-controls.js',
    'geonosis-inspector.js',
    'geonosis-semantics.js',
    'geonosis-place.js',
    'geonosis-scope.js',
    'geonosis-contributions.js',
    'geonosis-startup.js',
    'geonosis-earth-working-set.js'
  ];
  function load(name){
    return fetch(name+'?build='+encodeURIComponent(BUILD),{cache:'no-store'}).then(function(r){
      if(!r.ok)throw new Error(name+' '+r.status);return r.text();
    });
  }
  Promise.all(files.map(load)).then(function(parts){
    var src={};for(var i=0;i<files.length;i++)src[files[i]]=parts[i];
    src['geonosis-startup.js']=src['geonosis-startup.js'].replace(/2026-08-25\.signal-start-v1/g,BUILD);
    var html=src['icosa-syntegrity.html'];
    var preconfig=[
      'window.ICOSA_LIVE_CONFIG = window.ICOSA_LIVE_CONFIG || {};',
      'window.ICOSA_LIVE_CONFIG.buildId = '+JSON.stringify(BUILD)+';',
      'if (!window.ICOSA_LIVE_CONFIG.datacenterUrl) window.ICOSA_LIVE_CONFIG.datacenterUrl =',
      '  "https://raw.githubusercontent.com/bilawalsidhu/gods-eye-view/880a672b5e16ad3e41d318801d3a5203f9201923/src/data/local_data/datacenters/datacenters.geojsonl";'
    ].join('\n');
    var cull=[
      'var liveVisibleBinsUnculled = liveVisibleBins;',
      'liveVisibleBins = function (depth) {',
      '  var bins = liveVisibleBinsUnculled(depth);',
      '  Object.keys(bins).forEach(function (slug) {',
      '    var c = cellFromSlug(slug);',
      '    if (!c || !facingCamera(cellCentre(c))) delete bins[slug];',
      '  });',
      '  return bins;',
      '};'
    ].join('\n');
    var guards=[
      'var live2DrawFiresCoverageGuard = live2DrawFires;',
      'live2DrawFires = function (S) {',
      '  var s = LIVE.sources[FIRMS_SOURCE];',
      '  if (!FIRMS_TARGET || !s || !s.meta || s.meta.coverageCell !== FIRMS_TARGET.slug) return;',
      '  live2DrawFiresCoverageGuard(S);',
      '};',
      'var drawAircraftCoverageGuard = drawAircraft;',
      'drawAircraft = function (S) {',
      '  var s = LIVE.sources[AIR_SOURCE];',
      '  if (!AIR_TARGET || !s || !s.meta || s.meta.coverageCell !== AIR_TARGET.slug) return;',
      '  drawAircraftCoverageGuard(S);',
      '};',
      'var live2RequestFirmsTimerGuard = live2RequestFirms;',
      'live2RequestFirms = function (cell) {',
      '  if (cell && cellEdgeKm(cell) > FIRMS_MAX_KM) {',
      '    var s = LIVE.sources[FIRMS_SOURCE];',
      '    if (s && s.timer) { clearTimeout(s.timer); s.timer = null; }',
      '  }',
      '  return live2RequestFirmsTimerGuard(cell);',
      '};',
      'var requestAircraftTimerGuard = requestAircraft;',
      'requestAircraft = function (cell) {',
      '  if (cell && cellEdgeKm(cell) > AIR_MAX_CELL_KM) {',
      '    var s = LIVE.sources[AIR_SOURCE];',
      '    if (s && s.timer) { clearTimeout(s.timer); s.timer = null; }',
      '  }',
      '  return requestAircraftTimerGuard(cell);',
      '};'
    ].join('\n');
    var blocks=[
      ['ICOSA LIVE DATA HARNESS',src['icosa-live-inject.js']],
      ['VISIBLE-SIDE LIVE CULL',cull],
      ['VERIFIED GEONOSIS SOURCE REGISTRY',src['geonosis-source-registry.js']],
      ['GEONOSIS PRECONFIG',preconfig],
      ['GEONOSIS SIGNAL CONTRACT',src['geonosis-signal-core.js']],
      ['ICOSA LIVE SOURCE ADAPTERS',src['icosa-live-sources.js']],
      ['ICOSA LIVE MOTION ADAPTER',src['icosa-live-motion.js']],
      ['GEONOSIS PUBLIC SIGNAL ADAPTERS',src['geonosis-live-public.js']],
      ['GEONOSIS NYC 311 ADAPTER',src['geonosis-live-311.js']],
      ['GEONOSIS FEMA NFHL ADAPTER',src['geonosis-live-nfhl.js']],
      ['GEONOSIS EPA ECHO/FRS ADAPTER',src['geonosis-live-epa.js']],
      ['GEONOSIS NWS WEATHER + 3DEP TERRAIN',src['geonosis-live-weather-terrain.js']],
      ['GEONOSIS BYOK AIR QUALITY ADAPTER',src['geonosis-live-airnow.js']],
      ['GEONOSIS DIFFERENCE + STATEMENT ENGINE',src['geonosis-inference.js']],
      ['SCOPED COVERAGE GUARDS',guards],
      ['ICOSA LIVE TO MODEL CONTEXT',src['icosa-live-context.js']],
      ['GEONOSIS TO MODEL CONTEXT',src['geonosis-live-context.js']],
      ['GEONOSIS LABELED SOURCE SETUP',src['geonosis-source-controls.js']],
      ['GEONOSIS MAP INSPECTOR',src['geonosis-inspector.js']],
      ['GEONOSIS SEMIOSIS LENS',src['geonosis-semantics.js']],
      ['GEONOSIS HUMAN PLACE ORIENTATION',src['geonosis-place.js']],
      ['GEONOSIS SCOPE COHERENCE',src['geonosis-scope.js']],
      ['GEONOSIS ORDINARY CONTRIBUTIONS',src['geonosis-contributions.js']],
      ['GEONOSIS STARTUP + RUNTIME HEALTH',src['geonosis-startup.js']],
      ['F15 EARTH WORKING SET',src['geonosis-earth-working-set.js']]
    ];
    var injection='\n';
    blocks.forEach(function(b){injection+='\n/* --- '+b[0]+' --- */\n'+b[1]+'\n';});
    var needle='})();',at=html.lastIndexOf(needle);if(at<0)throw new Error('main ICOSA closure not found');
    html=html.slice(0,at)+injection+html.slice(at);
    document.open();document.write(html);document.close();
  }).catch(function(err){
    document.getElementById('boot').textContent='F15 BOOT FAILED · '+String(err&&err.message||err)+' · BUILD '+BUILD;
  });
})();
</script>
