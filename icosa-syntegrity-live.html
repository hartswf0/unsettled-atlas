<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ICOSA SYNTEGRITY · live data</title>
<style>

body{display:grid;place-items:center}

</style>
<div id="boot">COMPILING LIVE WORLD</div>
<script>
(function () {
  'use strict';
  Promise.all([

    fetch('geonosis-source-registry.js',{cache:'no-cache'}).then(function(r){if(!r.ok)throw new Error('geonosis-source-registry.js '+r.status);return r.text();}),
    fetch('geonosis-signal-core.js',{cache:'no-cache'}).then(function(r){if(!r.ok)throw new Error('geonosis-signal-core.js '+r.status);return r.text();}),

    fetch('geonosis-live-public.js',{cache:'no-cache'}).then(function(r){if(!r.ok)throw new Error('geonosis-live-public.js '+r.status);return r.text();}),
    fetch('geonosis-live-311.js',{cache:'no-cache'}).then(function(r){if(!r.ok)throw new Error('geonosis-live-311.js '+r.status);return r.text();}),
    fetch('geonosis-live-nfhl.js',{cache:'no-cache'}).then(function(r){if(!r.ok)throw new Error('geonosis-live-nfhl.js '+r.status);return r.text();}),
    fetch('geonosis-live-epa.js',{cache:'no-cache'}).then(function(r){if(!r.ok)throw new Error('geonosis-live-epa.js '+r.status);return r.text();}),
    fetch('geonosis-live-weather-terrain.js',{cache:'no-cache'}).then(function(r){if(!r.ok)throw new Error('geonosis-live-weather-terrain.js '+r.status);return r.text();}),
    fetch('geonosis-live-airnow.js',{cache:'no-cache'}).then(function(r){if(!r.ok)throw new Error('geonosis-live-airnow.js '+r.status);return r.text();}),
    fetch('geonosis-inference.js',{cache:'no-cache'}).then(function(r){if(!r.ok)throw new Error('geonosis-inference.js '+r.status);return r.text();}),

    ].join('\n');
    var cull=[
      'var liveVisibleBinsUnculled = liveVisibleBins;',
      'liveVisibleBins = function (depth) {',
      '  var bins = liveVisibleBinsUnculled(depth);',
      '  Object.keys(bins).forEach(function (slug) {',
      '    var c = cellFromSlug(slug);',
      '    if (!c || !facingCamera(cellCentre(c))) delete bins[slug];',
      '  });',
      '  return bins;',
      '};'

    var guards=[
      'var live2DrawFiresCoverageGuard = live2DrawFires;',
      'live2DrawFires = function (S) {',
      '  var s = LIVE.sources[FIRMS_SOURCE];',
      '  if (!FIRMS_TARGET || !s || !s.meta || s.meta.coverageCell !== FIRMS_TARGET.slug) return;',
      '  live2DrawFiresCoverageGuard(S);',
      '};',
      'var drawAircraftCoverageGuard = drawAircraft;',
      'drawAircraft = function (S) {',
      '  var s = LIVE.sources[AIR_SOURCE];',
      '  if (!AIR_TARGET || !s || !s.meta || s.meta.coverageCell !== AIR_TARGET.slug) return;',
      '  drawAircraftCoverageGuard(S);',
      '};',
      'var live2RequestFirmsTimerGuard = live2RequestFirms;',

      '};',
      'var requestAircraftTimerGuard = requestAircraft;',

      '\n/* --- VERIFIED GEONOSIS SOURCE REGISTRY --- */\n'+registry+

      '\n/* --- GEONOSIS DIFFERENCE + STATEMENT ENGINE --- */\n'+geoInference+
      '\n/* scoped observations only paint the ground they actually queried */\n'+guards+
      '\n/* --- ICOSA LIVE → MODEL CONTEXT BRIDGE --- */\n'+modelContext+
      '\n/* --- GEONOSIS → MODEL CONTEXT BRIDGE --- */\n'+geoContext+
      '\n/* --- GEONOSIS LABELED SOURCE SETUP --- */\n'+geoControls+'\n'+html.slice(at);

  }).catch(function(err){document.getElementById('boot').textContent='LIVE WORLD FAILED · '+String(err&&err.message||err);});
})();
</script>
