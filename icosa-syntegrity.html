<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f1eee4">
<meta name="description" content="ICOSA SYNTEGRITY: every triangle on Earth has an address, a council and a thread. Take a seat, say something, and it stays where you said it.">
<title>ICOSA SYNTEGRITY · take a seat in a triangle</title>
<style>
/* ================================================================== *
 * ICOSA WORLD                                                         *
 * The world owns the screen. Controls emerge from the geometry.       *
 * ================================================================== */
:root{
  --ground:#f1eee4;      /* ocean, paper, ground */
  --ink:#121514;
  --muted:#5f6763;
  --signal:#a8462a;      /* tension */
  --land:#ece7dc;
  --landline:#7d8983;
  --water:#8fa8ad;
  --sea:#dbe3e4;
  --urban:#d6c6a9;
  --road:#ab9d87;
  --paper:#faf8f1;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%;overflow:hidden;background:var(--ground)}
body{
  position:fixed;inset:0;color:var(--ink);
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  -webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%;
  touch-action:none;overscroll-behavior:none;
}
/* The sheet is a sibling of the map, never a lid on it. On a phone the map
   keeps the top half; on a wide screen the sheet takes a column. Either way
   the triangle you are talking about stays visible while you talk. */
body{display:flex;flex-direction:column}
#stage{position:relative;flex:1 1 auto;min-height:0;min-width:0}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}

/* --- readouts ------------------------------------------------------ */
.hud{position:absolute;z-index:10;pointer-events:none}
#situation{
  top:0;left:0;right:0;
  padding:max(10px,env(safe-area-inset-top)) 12px 0 max(12px,env(safe-area-inset-left));
  display:flex;justify-content:space-between;align-items:flex-start;gap:10px
}
.plate{
  background:var(--ground);border:1.5px solid var(--ink);padding:6px 8px;
  font-size:10px;line-height:1.45;letter-spacing:.08em;white-space:nowrap
}
.plate b{font-weight:700}
.plate .dim{color:var(--muted)}
#cellplate{min-width:0;flex:0 1 auto;overflow:hidden}
#scaleplate{flex:0 0 auto}
#cellid{font-weight:700;letter-spacing:.14em}
#scaleplate{text-align:right}

/* --- the ladder: scale is spatially embodied, not a button --------- */
#ladder{
  right:max(8px,env(safe-area-inset-right));top:50%;transform:translateY(-50%);
  display:flex;flex-direction:column;gap:0;align-items:flex-end
}
.rung{
  display:flex;align-items:center;gap:5px;height:19px;
  font-size:8px;letter-spacing:.12em;color:var(--muted)
}
.rung i{display:block;height:1.5px;width:9px;background:var(--muted);font-style:normal}
.rung.on{color:var(--ink);font-weight:700}
.rung.on i{width:20px;height:2.5px;background:var(--signal)}
.rung span{opacity:0;background:var(--ground);padding:1px 3px}
.rung.on span,.rung.near span{opacity:1}
.rung.near{color:var(--muted)}

/* --- containment: where I am, what contains this, how I return ----- */
#chain{
  left:max(10px,env(safe-area-inset-left));bottom:0;right:0;
  padding:0 10px calc(6px + env(safe-area-inset-bottom));
  display:flex;flex-wrap:wrap;align-items:center;gap:3px
}
.link{
  font-size:9px;letter-spacing:.1em;color:var(--muted);
  border:1.5px solid transparent;padding:2px 3px
}
.link.here{color:var(--ink);font-weight:700;border-color:var(--ink);background:var(--ground)}
.link.sep{opacity:.45;padding:0}

/* --- actions appear only where they are possible ------------------- */
#acts{
  position:absolute;z-index:20;display:none;flex-direction:column;gap:-1px;
  align-items:flex-start
}
#acts.open{display:flex}
#acts button{
  font:inherit;font-size:10px;font-weight:700;letter-spacing:.14em;
  background:var(--ground);color:var(--ink);border:1.5px solid var(--ink);
  padding:9px 11px;margin-top:-1.5px;min-width:112px;text-align:left;cursor:pointer;
  display:flex;justify-content:space-between;gap:10px
}
#acts button em{font-style:normal;font-weight:400;color:var(--muted);font-size:9px}
#acts button:active{background:var(--ink);color:var(--ground)}
#acts button:active em{color:var(--ground);opacity:.7}
#acts button.sig{background:var(--signal);border-color:var(--signal);color:var(--paper)}
#acts button.sig em{color:var(--paper);opacity:.75}

/* --- panels -------------------------------------------------------- */
#panel{
  flex:0 0 auto;z-index:30;max-height:52vh;overflow-y:auto;
  background:var(--ground);border-top:2px solid var(--ink);
  padding:14px max(14px,env(safe-area-inset-left)) calc(16px + env(safe-area-inset-bottom));
  display:none;-webkit-overflow-scrolling:touch
}
#panel.open{display:block}
#panel{-webkit-user-select:text;user-select:text}
@media(min-width:860px){
  body{flex-direction:row}
  #panel{max-height:none;height:100%;width:min(440px,40%);
         border-top:none;border-left:2px solid var(--ink);
         padding-top:16px}
}
#panel h2{
  position:sticky;top:0;z-index:2;background:var(--ground);
  font-size:11px;letter-spacing:.2em;font-weight:700;
  margin:-14px 0 10px;padding:14px 0 10px;
  display:flex;justify-content:space-between;align-items:center;gap:10px
}
#panel h2 button{
  font:inherit;font-size:10px;letter-spacing:.14em;font-weight:700;
  border:1.5px solid var(--ink);background:var(--ground);padding:5px 9px;cursor:pointer
}
#panel p{font-size:11px;line-height:1.6;color:var(--muted);margin-bottom:9px;max-width:64ch}
#panel p b{color:var(--ink)}
#panel .row{
  display:flex;justify-content:space-between;gap:10px;align-items:baseline;
  border-top:1px solid rgba(18,21,20,.18);padding:7px 0;font-size:10px;letter-spacing:.06em;
  cursor:pointer
}
#panel .row:last-child{border-bottom:1px solid rgba(18,21,20,.18)}
#panel .row b{font-weight:700}
#panel .row a{color:var(--signal);text-underline-offset:3px}
#panel .row span{color:var(--muted);text-align:right;flex:0 0 auto}
#panel .row.on{background:var(--ink);color:var(--ground);padding-inline:6px}
#panel .row.on span{color:var(--ground);opacity:.75}
@media(max-width:520px){
  #panel .row{flex-wrap:wrap;gap:2px}
  #panel .row b,#panel .row span{flex:1 1 100%;text-align:left}
}
#panel input,#panel textarea{
  font:inherit;font-size:13px;width:100%;background:var(--paper);color:var(--ink);
  border:1.5px solid var(--ink);padding:8px;margin:4px 0;-webkit-user-select:text;user-select:text
}
#panel textarea{min-height:74px;resize:vertical;line-height:1.45}
#panel .seat input{font-size:12px;padding:5px 6px;margin:0}
#panel .seat{display:grid;grid-template-columns:1fr 128px;gap:8px;align-items:center;
  border-top:1px solid rgba(18,21,20,.18);padding:6px 0;font-size:10px;letter-spacing:.06em}
#panel .seat b{font-weight:700}
#panel .seat em{font-style:normal;color:var(--muted);display:block;font-size:9px;margin-top:1px}
#panel .go{
  font:inherit;font-size:11px;font-weight:700;letter-spacing:.14em;cursor:pointer;
  border:1.5px solid var(--ink);background:var(--ink);color:var(--ground);padding:9px 14px;margin-top:6px
}
#panel .go.ghost{background:var(--ground);color:var(--ink)}
#panel .said{border-top:1px solid rgba(18,21,20,.18);padding:8px 0}
#panel .said b{font-size:10px;letter-spacing:.1em}
#panel .said span{color:var(--muted);font-size:9px;letter-spacing:.08em}
#panel .said p{font-size:12px;line-height:1.5;color:var(--ink);margin:4px 0 0;max-width:60ch}
#panel .kbd{font-size:9px;color:var(--muted);letter-spacing:.1em;line-height:1.9;margin-top:8px}
#panel .kbd b{color:var(--ink);font-weight:700}

/* --- corner marks -------------------------------------------------- */
#modes{
  left:max(10px,env(safe-area-inset-left));top:auto;bottom:34px;
  display:flex;gap:0;pointer-events:auto
}
#modes button{
  font:inherit;font-size:9px;font-weight:700;letter-spacing:.12em;
  border:1.5px solid var(--ink);background:var(--ground);color:var(--ink);
  padding:7px 8px;margin-left:-1.5px;cursor:pointer
}
#modes button:first-child{margin-left:0}
#modes button.on{background:var(--ink);color:var(--ground)}
#modes button.sig{background:var(--signal);border-color:var(--signal);color:var(--paper)}
/* Real anchors, positioned over the ground they name. Canvas text cannot be
   opened in a new tab, copied, or long-pressed — a link has to be a link. */
#links{position:absolute;inset:0;pointer-events:none;z-index:6}
#links a{
  position:absolute;transform:translate(-50%,-50%);pointer-events:auto;
  display:flex;align-items:center;gap:4px;white-space:nowrap;
  font:700 8px ui-monospace,monospace;letter-spacing:.06em;
  color:var(--signal);text-decoration:none;padding:3px 5px 3px 3px;
  background:rgba(241,238,228,.86);border:1px solid var(--signal)
}
#links a:hover,#links a:focus{background:var(--signal);color:var(--paper)}
#links a i{display:block;width:5px;height:5px;background:var(--signal);border-radius:50%;flex:0 0 auto}
#links a:hover i,#links a:focus i{background:var(--paper)}
/* A card in context, beside the dot it belongs to. Wikipedia cannot be put
   in an iframe — en.wikipedia.org sends X-Frame-Options, so a frame renders
   blank — so the summary is fetched and drawn here instead. Which is better
   anyway: it matches the map, and it never navigates away. */
#card{
  position:absolute;z-index:12;display:none;width:min(280px,72vw);
  background:var(--ground);border:1.5px solid var(--ink);
  box-shadow:4px 4px 0 rgba(18,21,20,.13);
  max-height:min(46vh,340px);overflow-y:auto;touch-action:pan-y
}
#card.open{display:block}
#card .top{
  display:flex;justify-content:space-between;align-items:flex-start;gap:8px;
  padding:8px 9px 6px;border-bottom:1.5px solid var(--ink);position:sticky;top:0;background:var(--ground)
}
#card .top b{font-size:11px;letter-spacing:.1em;line-height:1.35}
#card .top em{font-style:normal;display:block;font-size:8px;letter-spacing:.14em;color:var(--muted);margin-top:2px}
#card .x{
  font:inherit;font-size:11px;font-weight:700;border:1.5px solid var(--ink);background:var(--ground);
  color:var(--ink);padding:2px 6px;cursor:pointer;flex:0 0 auto
}
#card .body{padding:8px 9px 10px}
#card .body p{font-size:11px;line-height:1.5;color:var(--ink);margin:0 0 7px}
#card .body .fact{display:flex;justify-content:space-between;gap:8px;font-size:9px;letter-spacing:.07em;
  color:var(--muted);border-top:1px solid rgba(18,21,20,.16);padding:4px 0}
#card .body .fact b{color:var(--ink);font-weight:700}
#card img{width:100%;height:auto;display:block;margin:0 0 7px;border:1px solid var(--ink)}
#card .go{
  font:inherit;font-size:9px;font-weight:700;letter-spacing:.12em;display:inline-block;
  border:1.5px solid var(--ink);background:var(--ground);color:var(--ink);
  padding:6px 8px;margin:6px 4px 0 0;cursor:pointer;text-decoration:none
}
#card .go.sig{background:var(--ink);color:var(--ground)}
#reglegend{
  left:max(10px,env(safe-area-inset-left));bottom:72px;
  display:none;flex-direction:column;gap:2px
}
#reglegend.open{display:flex}
#reglegend div{
  display:flex;align-items:center;gap:5px;font-size:8px;letter-spacing:.1em;
  background:var(--ground);padding:1px 4px 1px 2px;width:max-content
}
#reglegend i{display:block;width:14px;height:3px}
#boot{
  position:fixed;inset:0;z-index:40;background:var(--ground);
  display:flex;align-items:center;justify-content:center;
  font-size:10px;letter-spacing:.24em;color:var(--muted)
}
#boot.gone{display:none}
@media (max-width:380px){ .plate{font-size:9px} }
@media (prefers-reduced-motion:reduce){ #acts button{transition:none} }
</style>
</head>
<body>
<div id="stage">
<canvas id="world"></canvas>
<div id="links"></div>
<div id="card"></div>

<div class="hud" id="situation">
  <div class="plate" id="cellplate">
    <div id="cellid">—</div>
    <div class="dim" id="cellextent">—</div>
    <div class="dim" id="cellcouncil">—</div>
  </div>
  <div class="plate" id="scaleplate">
    <div><b id="scalename">EARTH</b></div>
    <div class="dim" id="foldstate">unfolded</div>
  </div>
</div>

<div class="hud" id="ladder"></div>
<div class="hud" id="chain"></div>

<div id="acts"></div>

<div class="hud" id="reglegend"></div>

<div class="hud" id="modes">
  <button id="mFold" title="fold / unfold">FOLD</button>
  <button id="mPaint" title="paint an area across triangles">PAINT</button>
  <button id="mRel" title="relational geometry">TENSION</button>
  <button id="mHelp">?</button>
</div>

</div><!-- /stage -->

<div id="panel"></div>
<div id="boot">COMPILING THE WORLD</div>

<script src="icosa-world.data.js"></script>
<script>
(function () {
'use strict';

/* ==================================================================== *
 *  ICOSA WORLD
 *
 *  A place is not a point on a map. A place is a triangle inside larger
 *  triangles connected by forces to other triangles.
 *
 *  Nothing below projects the Earth once and for all. The topology is
 *  the object; the projection is disposable. Twenty root faces, each
 *  subdividing into four, forever. Every operation in this file is one
 *  of: FOLD, UNFOLD, ENTER, EXIT, TURN, PULL, PRESS, TRACE.
 * ==================================================================== */

var DATA = window.ICOSA_WORLD_DATA;
var TAU = Math.PI * 2, D2R = Math.PI / 180, R2D = 180 / Math.PI;
var EARTH_R = 6371.0088;                    // km
var ICO_EDGE_KM = EARTH_R * Math.acos(Math.sqrt(5) / 5); // ≈7053 km, depth-0 cell edge
var DIHEDRAL = Math.acos(-Math.sqrt(5) / 3); // 138.1897°
var FOLD_ANGLE = Math.PI - DIHEDRAL;         // how far each hinge must close
var MAX_DEPTH = 30;                          // ~6.6 mm. Not a limit of the idea.

/* ------------------------------------------------------------ vectors */
function v3(x, y, z) { return [x, y, z]; }
function add(a, b) { return [a[0] + b[0], a[1] + b[1], a[2] + b[2]]; }
function sub(a, b) { return [a[0] - b[0], a[1] - b[1], a[2] - b[2]]; }
function mul(a, k) { return [a[0] * k, a[1] * k, a[2] * k]; }
function dot(a, b) { return a[0] * b[0] + a[1] * b[1] + a[2] * b[2]; }
function cross(a, b) {
  return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
}
function len(a) { return Math.sqrt(dot(a, a)); }
function norm(a) { var l = len(a) || 1; return [a[0] / l, a[1] / l, a[2] / l]; }
function lerp3(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; }
function clamp(x, a, b) { return x < a ? a : x > b ? b : x; }
function lonlat(v) {
  return [Math.atan2(v[1], v[0]) * R2D, Math.asin(clamp(v[2], -1, 1)) * R2D];
}
function fromLonLat(lon, lat) {
  var p = lat * D2R, l = lon * D2R;
  return [Math.cos(p) * Math.cos(l), Math.cos(p) * Math.sin(l), Math.sin(p)];
}
function arcKm(a, b) { return EARTH_R * Math.acos(clamp(dot(a, b), -1, 1)); }

/* -------------------------------------------------------- quaternions */
function qId() { return [0, 0, 0, 1]; }
function qMul(a, b) {
  return [
    a[3] * b[0] + a[0] * b[3] + a[1] * b[2] - a[2] * b[1],
    a[3] * b[1] - a[0] * b[2] + a[1] * b[3] + a[2] * b[0],
    a[3] * b[2] + a[0] * b[1] - a[1] * b[0] + a[2] * b[3],
    a[3] * b[3] - a[0] * b[0] - a[1] * b[1] - a[2] * b[2]
  ];
}
function qAxis(axis, ang) {
  var a = norm(axis), s = Math.sin(ang / 2);
  return [a[0] * s, a[1] * s, a[2] * s, Math.cos(ang / 2)];
}
function qNorm(q) {
  var l = Math.hypot(q[0], q[1], q[2], q[3]) || 1;
  return [q[0] / l, q[1] / l, q[2] / l, q[3] / l];
}
function qApply(q, v) {
  var x = q[0], y = q[1], z = q[2], w = q[3];
  var tx = 2 * (y * v[2] - z * v[1]), ty = 2 * (z * v[0] - x * v[2]), tz = 2 * (x * v[1] - y * v[0]);
  return [
    v[0] + w * tx + y * tz - z * ty,
    v[1] + w * ty + z * tx - x * tz,
    v[2] + w * tz + x * ty - y * tx
  ];
}
function qSlerp(a, b, t) {
  var d = a[0] * b[0] + a[1] * b[1] + a[2] * b[2] + a[3] * b[3];
  var bb = b;
  if (d < 0) { bb = [-b[0], -b[1], -b[2], -b[3]]; d = -d; }
  if (d > 0.9995) {
    return qNorm([a[0] + (bb[0] - a[0]) * t, a[1] + (bb[1] - a[1]) * t,
                  a[2] + (bb[2] - a[2]) * t, a[3] + (bb[3] - a[3]) * t]);
  }
  var th = Math.acos(clamp(d, -1, 1)), s = Math.sin(th);
  var k0 = Math.sin((1 - t) * th) / s, k1 = Math.sin(t * th) / s;
  return [a[0] * k0 + bb[0] * k1, a[1] * k0 + bb[1] * k1,
          a[2] * k0 + bb[2] * k1, a[3] * k0 + bb[3] * k1];
}
function qBetween(a, b) {                    // minimal arc a → b
  var d = dot(a, b);
  if (d > 0.999999) return qId();
  if (d < -0.999999) {
    var ax = Math.abs(a[0]) < 0.9 ? cross(a, [1, 0, 0]) : cross(a, [0, 1, 0]);
    return qAxis(ax, Math.PI);
  }
  var c = cross(a, b);
  return qNorm([c[0], c[1], c[2], 1 + d]);
}

/* ==================================================================== *
 *  1 · THE WORLD                                                        *
 *  Twenty faces. Every point on Earth resolves into exactly one.        *
 * ==================================================================== */

var V = DATA.ico.vertices;                   // unit sphere, Earth-fixed
var FACES = DATA.ico.faces;                  // 20 × [i,j,k], CCW from outside
var NF = FACES.length;

// Inverse of [v0 v1 v2] per face: turns a direction into barycentric
// weights. Because a gnomonic projection sends great circles to straight
// lines, these weights ARE the flat coordinates of the face. Every
// subdivision below is therefore exact on the sphere.
var BINV = FACES.map(function (f) {
  var a = V[f[0]], b = V[f[1]], c = V[f[2]];
  var det = a[0] * (b[1] * c[2] - b[2] * c[1])
          - b[0] * (a[1] * c[2] - a[2] * c[1])
          + c[0] * (a[1] * b[2] - a[2] * b[1]);
  var m = [
    [(b[1] * c[2] - b[2] * c[1]) / det, (c[0] * b[2] - b[0] * c[2]) / det, (b[0] * c[1] - c[0] * b[1]) / det],
    [(c[1] * a[2] - a[1] * c[2]) / det, (a[0] * c[2] - c[0] * a[2]) / det, (c[0] * a[1] - a[0] * c[1]) / det],
    [(a[1] * b[2] - b[1] * a[2]) / det, (b[0] * a[2] - a[0] * b[2]) / det, (a[0] * b[1] - b[0] * a[1]) / det]
  ];
  return m;
});
function baryRaw(f, p) {
  var m = BINV[f];
  return [m[0][0] * p[0] + m[0][1] * p[1] + m[0][2] * p[2],
          m[1][0] * p[0] + m[1][1] * p[1] + m[1][2] * p[2],
          m[2][0] * p[0] + m[2][1] * p[1] + m[2][2] * p[2]];
}
function baryOf(f, p) {                      // sphere point → face weights
  var r = baryRaw(f, p), s = r[0] + r[1] + r[2];
  return [r[0] / s, r[1] / s, r[2] / s];
}
function baryPoint(f, w) {                   // face weights → sphere point
  var a = V[FACES[f][0]], b = V[FACES[f][1]], c = V[FACES[f][2]];
  return norm([a[0] * w[0] + b[0] * w[1] + c[0] * w[2],
               a[1] * w[0] + b[1] * w[1] + c[1] * w[2],
               a[2] * w[0] + b[2] * w[1] + c[2] * w[2]]);
}
// INVARIANT 1 — exactly one face holds any given point.
// The weights of a point and of its antipode normalise identically, so
// the sum must be positive as well: the far side of the world is not here.
function faceOf(p) {
  var best = 0, bestMin = -Infinity;
  for (var f = 0; f < NF; f++) {
    var r = baryRaw(f, p), s = r[0] + r[1] + r[2];
    if (s <= 0) continue;
    var m = Math.min(r[0], Math.min(r[1], r[2])) / s;
    if (m >= -1e-12) return f;
    if (m > bestMin) { bestMin = m; best = f; }
  }
  return best;                               // seam: nearest face wins
}

/* --------------------------------------------------------------- cells
 * A cell is a face plus a path of child indices. Its three corners live

 * The compiled gazetteer stops at about a village, and below that the
 * triangle went quiet. But the page runs in the reader's browser, not on
 * a server, so it can ask Wikipedia directly — anonymous CORS, no key, no

  // it looked everywhere.

  var radius = Math.max(400, Math.min(10000, want));

    '&gscoord=' + p[1].toFixed(5) + '%7C' + p[0].toFixed(5) +
    '&gsradius=' + radius + '&gslimit=50&format=json&origin=*';

/* ------------------------------------------------------------- the carry
 * The whole mechanism of a syntegration is that every seat sits in two

  return DB.notes.filter(function (n) { return n.kind === 'carry' && n.cell === slug; });
}

function seatHolder(slug, i) { return DB.seats[seatKey(slug, i)] || ''; }

/* -------------------------------------------------------------- an area
 * A triangle is often the wrong unit — a watershed, a district, a burnt

 * model: paint the cells, name it, and it can be argued about like any
 * other ground.                                                          */
var painting = false, brush = {};
function areaCells() { return Object.keys(brush); }

var councilCell = null;    // the cell a council is currently seated in
var councilSeat = null;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2.5);
  W = canvas.clientWidth; H = canvas.clientHeight;
  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}

function faceVisible(f, S) {
  var c = faceCorners[f];

  var minx = Math.min(pa[0], pb[0], pd[0]), maxx = Math.max(pa[0], pb[0], pd[0]);
  var miny = Math.min(pa[1], pb[1], pd[1]), maxy = Math.max(pa[1], pb[1], pd[1]);
  if (maxx < -40 || minx > W + 40 || maxy < -40 || miny > H + 40) return null;

function weightsToScreen(f, arr, S) {

    var x = c0[0] * w0 + c1[0] * w1 + c2[0] * w2;
    var y = c0[1] * w0 + c1[1] * w1 + c2[1] * w2;

    var vx = r[0] - VIEW_ORIGIN[0], vy = r[1] - VIEW_ORIGIN[1], vz = r[2] - VIEW_ORIGIN[2];
    var k = CAM_D / Math.max(0.05, CAM_D - vz);

}
function pathFrom(pts, close) {
  ctx.beginPath();
  ctx.moveTo(pts[0], pts[1]);
  for (var i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]);
  if (close) ctx.closePath();
}

function fillBaryGroups(f, groups, S, fill, stroke, width, box) {
  for (var i = 0; i < groups.length; i++) {
    var b = groups[i].box;
    if (box && b && (b[2] < box[0] || b[0] > box[2] || b[3] < box[1] || b[1] > box[3])) continue;
    var pts = weightsToScreen(f, groups[i], S);

    pathFrom(pts, !!fill);

    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = width || 0.8; ctx.stroke(); }
  }
}
function drawFaceSurface(f, S) {

    fillBaryGroups(f, d.lakes, S, COL.sea, COL.landline, 0.6, vbox);
    fillBaryGroups(f, d.urban, S, COL.urban, null, 0, vbox);
    if (view.zoom > 3.0 && d.roads.length) {
      ctx.strokeStyle = COL.road;
      ctx.lineWidth = 0.9;
      ctx.beginPath();
      for (var r = 0; r < d.roads.length; r++) {
        var rb = d.roads[r].box;

        for (var k = 2; k < rp.length; k += 2) ctx.lineTo(rp[k], rp[k + 1]);

    for (var q = 0; q < rivD.length; q++) {
      var rr = rivD[q];

// recursive grid: subdivide only where the triangle is still big on screen
// and still on screen at all. This is the whole of "infinite scalability".
function drawGrid(f, tri, depth, S, stopPx, budget) {
  var c = faceCorners[f];
  var scr = [];
  for (var k = 0; k < 3; k++) {
    var w = tri[k];
    var p = [c[0][0] * w[0] + c[1][0] * w[1] + c[2][0] * w[2],
             c[0][1] * w[0] + c[1][1] * w[1] + c[2][1] * w[2],
             c[0][2] * w[0] + c[1][2] * w[1] + c[2][2] * w[2]];
    scr.push(project(toView(p), S));
  }
  var minx = Math.min(scr[0][0], scr[1][0], scr[2][0]);
  var maxx = Math.max(scr[0][0], scr[1][0], scr[2][0]);
  var miny = Math.min(scr[0][1], scr[1][1], scr[2][1]);
  var maxy = Math.max(scr[0][1], scr[1][1], scr[2][1]);
  if (maxx < -20 || minx > W + 20 || maxy < -20 || miny > H + 20) return;
  var size = Math.max(maxx - minx, maxy - miny);
  if (size > stopPx && depth < MAX_DEPTH && budget.n < 3000) {
    budget.n++;
    for (var i = 0; i < 4; i++) drawGrid(f, childTri(tri, i), depth + 1, S, stopPx, budget);
    return;
  }
  var a = clamp(0.14 + size / 900, 0.14, 0.5);
  ctx.strokeStyle = 'rgba(18,21,20,' + a.toFixed(3) + ')';
  ctx.lineWidth = 0.7;
  ctx.beginPath();
  ctx.moveTo(scr[0][0], scr[0][1]);
  ctx.lineTo(scr[1][0], scr[1][1]);
  ctx.lineTo(scr[2][0], scr[2][1]);
  ctx.closePath();
  ctx.stroke();
}

function strokeCell(cell, S, colour, width, fill) {

    var w = C[k];
    var p = [c[0][0] * w[0] + c[1][0] * w[1] + c[2][0] * w[2],
             c[0][1] * w[0] + c[1][1] * w[1] + c[2][1] * w[2],
             c[0][2] * w[0] + c[1][2] * w[1] + c[2][2] * w[2]];
    var s = project(toView(p), S);
    if (k === 0) ctx.moveTo(s[0], s[1]); else ctx.lineTo(s[0], s[1]);
  }
  ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  ctx.strokeStyle = colour; ctx.lineWidth = width; ctx.stroke();
}

// relational geometry: places drift toward the things that pull them,

function relaxedPoint(place, S) {

    if (r.pa === place) { pullTo = add(pullTo, r.pb.v); n++; }
    else if (r.pb === place) { pullTo = add(pullTo, r.pa.v); n++; }
  }
  if (!n) return place.v;
  var t = view.relax * 0.55;
  return norm(lerp3(place.v, norm(mul(pullTo, 1 / n)), t));

function facingCamera(p) {                   // is this bit of ground toward us

  var shown = pulled ? [pulled] : RELATIONS;

    var r = shown[i];

    var sep = len(sub(A, B));

// The struts of a council are not drawn beside the map. At world scale they
// ARE the map: the thirty edges of the Dymaxion net, each one a seat. In the
// unfolded net a strut appears on both of the faces it separates and a topic
// appears once for every face that meets it, so the net scatters a council
// that folding gathers back into one.

  var m = {};
  var E = DATA.ico.edges;
  for (var i = 0; i < E.length; i++) {
    var a = E[i][4], b = E[i][5];
    m[Math.min(a, b) + ',' + Math.max(a, b)] = i;
  }
  return m;

function councilPoints(cell, seat) {
  // the embedding's barycentric points, carried into this cell's triangle
  var out = [];

    var w = seat.barycentric[i], t = cell.tri;
    out.push(baryPoint(cell.f, [

      t[0][1] * w[0] + t[1][1] * w[1] + t[2][1] * w[2],
      t[0][2] * w[0] + t[1][2] * w[1] + t[2][2] * w[2]

  }

}

function drawCouncil(S) {

    // struts on every face that carries them, topics at every corner

      if (!faceVisible(f, S)) continue;
      var corner = [[1, 0, 0], [0, 1, 0], [0, 0, 1]];
      var scr = [];

      for (var e = 0; e < 3; e++) {

        var reg = seat.struts[idx].register;
        ctx.strokeStyle = REGCOL[reg] || COL.ink;
        ctx.lineWidth = 3.4;
        ctx.beginPath();
        ctx.moveTo(scr[e][0], scr[e][1]);
        ctx.lineTo(scr[(e + 1) % 3][0], scr[(e + 1) % 3][1]);

  ctx.stroke();

    ctx.font = '7px ui-monospace,monospace';

// What was said is drawn where it was said. A cell carrying a thread gets a
// mark at its centre with the count; a note attached to a council seat is
// drawn at that seat's topic instead, so the argument sits on the point it
// is about.
function drawSaid(S) {
  var byCell = noteCells();
  ctx.textAlign = 'center';
  for (var slug in byCell) {
    var c = cellFromSlug(slug);
    if (!c) continue;
    var notes = byCell[slug];
    var seatPts = null;
    if (councilCell && cellSlug(councilCell) === slug && councilSeat && councilSeat.seating !== 'world') {
      seatPts = councilPoints(councilCell, councilSeat.seat);
    }
    var groups = {};
    for (var i = 0; i < notes.length; i++) {
      var key = (seatPts && notes[i].topic != null && seatPts[notes[i].topic]) ? 't' + notes[i].topic : 'c';
      if (!groups[key]) groups[key] = [];
      groups[key].push(notes[i]);
    }
    for (var g in groups) {
      var p = g === 'c' ? cellCentre(c) : seatPts[+g.slice(1)];
      var f = faceOf(p);
      var vv = toView(worldOf(f, baryOf(f, p)));

      var sp = project(vv, S);
      if (sp[0] < -40 || sp[0] > W + 40 || sp[1] < -40 || sp[1] > H + 40) continue;
      var n = groups[g].length;
      var r = 9 + Math.min(7, n);
      var anyConcern = groups[g].some(function (x) { return x.kind === 'concern'; });
      var escalated = groups[g].some(function (x) {
        return x.kind === 'concern' && x.answer < scaleOf(cellEdgeKm(c));
      });
      ctx.beginPath();
      ctx.moveTo(sp[0], sp[1] - r);
      ctx.lineTo(sp[0] + r, sp[1]);
      ctx.lineTo(sp[0], sp[1] + r);
      ctx.lineTo(sp[0] - r, sp[1]);
      ctx.closePath();
      if (anyConcern) {
        ctx.fillStyle = COL.ground; ctx.fill();
        ctx.strokeStyle = COL.signal; ctx.lineWidth = 2.4; ctx.stroke();
      } else {
        ctx.fillStyle = COL.signal; ctx.fill();
      }
      if (escalated) {                      // it did not stay where it was raised
        ctx.strokeStyle = COL.signal; ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(sp[0] - 5, sp[1] - r - 4);
        ctx.lineTo(sp[0], sp[1] - r - 9);
        ctx.lineTo(sp[0] + 5, sp[1] - r - 4);
        ctx.stroke();
      }
      ctx.fillStyle = anyConcern ? COL.signal : COL.paper;
      ctx.font = '700 9px ui-monospace,monospace';
      ctx.fillText(String(n), sp[0], sp[1] + 3);
      if (r > 12 || view.zoom > 2) {
        ctx.fillStyle = COL.ink;
        ctx.font = '8px ui-monospace,monospace';
        ctx.fillText(groups[g][groups[g].length - 1].who || 'someone', sp[0], sp[1] + r + 10);
      }
    }
  }
  ctx.textAlign = 'left';
}

// A looked-up article is a place on the Earth, so it is drawn at that place

var linkPool = {}, elLinks = null;

    var got = DB.lookups[slug];
    for (var i = 0; i < got.items.length; i++) {
      var it = got.items[i];
      if (!it.inside && view.zoom < 5) continue;
      var v = fromLonLat(it.lon, it.lat);
      var f = faceOf(v);
      var vv = toView(worldOf(f, baryOf(f, v)));
      if (dot(qApply(view.q, faceNormal(f)), sub([0, 0, CAM_D], vv)) <= 0) continue;
      var sp = project(vv, S);
      if (sp[0] < 4 || sp[0] > W - 4 || sp[1] < 4 || sp[1] > H - 4) continue;
      want[it.pageid] = { x: sp[0], y: sp[1], title: it.title, v: v };
    }
  }
  for (var id in linkPool) {
    if (!want[id]) { linkPool[id].remove(); delete linkPool[id]; }
  }
  // anchors stack rather than pile on top of one another
  var placed = [];
  var keys = Object.keys(want).sort(function (a, b) { return want[a].y - want[b].y; });
  for (var q = 0; q < keys.length; q++) {
    var w = want[keys[q]];
    for (var z = 0; z < placed.length; z++) {
      if (Math.abs(placed[z].y - w.y) < 15 && Math.abs(placed[z].x - w.x) < 150) {
        w.y = placed[z].y + 16;
        z = -1;
      }
    }
    placed.push(w);
  }
  for (var id2 in want) {
    var a = linkPool[id2];
    if (!a) {
      a = document.createElement('a');
      a.href = 'https://en.wikipedia.org/?curid=' + id2;
      a.target = '_blank';
      a.rel = 'noopener';
      a.innerHTML = '<i></i>';
      a.appendChild(document.createTextNode(want[id2].title));
      (function (t, href) {
        a.onclick = function (ev) {
          if (ev.metaKey || ev.ctrlKey || ev.shiftKey) return;   // let the browser have it
          ev.preventDefault();
          var r = a.getBoundingClientRect(), st = document.getElementById('stage').getBoundingClientRect();
          openCard({ title: t, kind: 'article', v: a.__v, url: href },
                   r.left - st.left + r.width / 2, r.top - st.top);
          wake();
        };
      })(want[id2].title, a.href);
      elLinks.appendChild(a);
      linkPool[id2] = a;
    }
    a.style.left = want[id2].x + 'px';
    a.style.top = want[id2].y + 'px';
    a.__v = want[id2].v;
  }
}

function drawSeams(S) {
  ctx.setLineDash([5, 4]);
  for (var i = 0; i < SEAMS.length; i++) {
    var s = SEAMS[i];
    var a = V[s.a], b = V[s.b];
    ctx.strokeStyle = COL.ink;
    ctx.lineWidth = 2;
    // the same cut runs along the lip of both faces it separates; in the
    // net those lips are far apart, and that distance is the artifact
    for (var e = 0; e < 2; e++) {
      var f = s.faces[e];
      ctx.beginPath();
      for (var t = 0; t <= 16; t++) {
        var p = norm(lerp3(a, b, t / 16));
        var sp = project(toView(worldOf(f, baryOf(f, p))), S);
        if (t === 0) ctx.moveTo(sp[0], sp[1]); else ctx.lineTo(sp[0], sp[1]);
      }
      ctx.stroke();
    }
  }
  ctx.setLineDash([]);
}

// rivers from the gazetteer, clipped to a face the first time that face is
// looked at, then kept. One face per frame so nothing stutters.
var riverBudget = 0;
function faceRiversOf(f) {
  if (!GAZ) return null;
  if (GAZ.faceRivers[f]) return GAZ.faceRivers[f];
  if (riverBudget > 0) return null;
  riverBudget++;
  var out = [], R = GAZ.rivers;
  for (var r = 0; r < R.name.length; r++) {
    for (var l = R.idx[r][0]; l < R.idx[r][1]; l++) {
      var pts = densify(R.lines[l], 0.9);
      var parts = clipLineToFace(pts, f);
      for (var m = 0; m < parts.length; m++) out.push({ w: toFaceWeights(f, parts[m]), river: r });
    }
  }
  GAZ.faceRivers[f] = out;
  return out;
}
function drawGazRivers(f, S, span) {
  if (!GAZ || view.zoom < 2.6) return;
  if (span < Math.min(W, H) * 0.55) return;
  var rs = faceRiversOf(f);
  if (!rs) return;
  // one path, one stroke. A few hundred separate strokes is most of a frame.
  ctx.strokeStyle = COL.water;
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (var i = 0; i < rs.length; i++) {
    var sp = weightsToScreen(f, rs[i].w, S);
    ctx.moveTo(sp[0], sp[1]);
    for (var k = 2; k < sp.length; k += 2) ctx.lineTo(sp[k], sp[k + 1]);
  }
  ctx.stroke();
}

// Labels have to thin themselves out or the deep view is a wall of type.
// everything painted on the map records where it landed, so the map can be
// asked what is under a finger instead of only which triangle
var HITS = [];
function hit(x, y, r, kind, payload) { HITS.push({ x: x, y: y, r: r, kind: kind, p: payload }); }
function hitAt(x, y) {
  var best = null, bd = 26 * 26;
  for (var i = 0; i < HITS.length; i++) {
    var h = HITS[i], dx = h.x - x, dy = h.y - y, d = dx * dx + dy * dy;
    if (d < bd) { bd = d; best = h; }
  }
  return best;
}

var labelGrid = {};
function claimLabel(x, y) {
  var k = ((x / 74) | 0) + ',' + ((y / 15) | 0);
  if (labelGrid[k]) return false;
  labelGrid[k] = 1;
  return true;
}
function markPoint(set, i, label, size, weight, kind) {
  var f = set.face[i];
  var vv = toView(worldOf(f, [set.bary[i * 3], set.bary[i * 3 + 1], set.bary[i * 3 + 2]]));
  if (dot(qApply(view.q, faceNormal(f)), sub([0, 0, CAM_D], vv)) <= 0) return false;
  var sp = project(vv, S_NOW);
  if (sp[0] < -50 || sp[0] > W + 50 || sp[1] < -20 || sp[1] > H + 20) return false;
  ctx.fillStyle = COL.ink;
  ctx.beginPath();
  ctx.arc(sp[0], sp[1], size, 0, TAU);
  ctx.fill();
  if (kind) hit(sp[0], sp[1], size, kind, { set: set, i: i });
  if (label && claimLabel(sp[0], sp[1])) {
    ctx.font = weight + 'px ui-monospace,monospace';
    ctx.textAlign = 'left';
    ctx.fillStyle = COL.muted;
    ctx.fillText(label, sp[0] + size + 2.5, sp[1] + 2.6);
  }
  return true;
}

// The whole point: descending must reveal, not empty out. The threshold on
// what counts as worth naming falls as the ground gets smaller, so a cell
// that held three capitals at continental scale holds villages at block.
var S_NOW = 1;
function drawGround(S) {
  S_NOW = S;
  labelGrid = {};
  HITS = [];
  if (!GAZ) { drawCities(S); return; }
  var z = view.zoom;
  var minPop = Math.pow(10, clamp(7.0 - z * 0.92, -1, 7.2));
  var drawn = 0;
  // named ground and named water first, so settlements sit on top of them
  if (z < 3.4) {
    ctx.font = '700 8px ui-monospace,monospace';
    for (var r = 0; r < GAZ.regions.n && drawn < 600; r++) {
      if (markPoint(GAZ.regions, r, GAZ.regions.name[r].toUpperCase(), 0.8, '700 8', 'region')) drawn++;
    }
    for (var m = 0; m < GAZ.marine.n && drawn < 900; m++) {
      if (markPoint(GAZ.marine, m, GAZ.marine.name[m].toUpperCase(), 0.8, '8', 'water')) drawn++;
    }
  }
  for (var i = 0; i < GAZ.places.n && drawn < 1400; i++) {
    if (GAZ.places.pop[i] < minPop) continue;
    if (markPoint(GAZ.places, i, GAZ.places.name[i].toUpperCase(), 2.4, '8', 'place')) drawn++;
  }
  if (z > 3.2) {
    for (var a = 0; a < GAZ.airports.n && drawn < 1700; a++) {
      if (markPoint(GAZ.airports, a, '✈ ' + GAZ.airports.name[a].toUpperCase(), 1.8, '7', 'airport')) drawn++;
    }
    for (var o = 0; o < GAZ.ports.n && drawn < 1900; o++) {
      if (markPoint(GAZ.ports, o, '⚓ ' + GAZ.ports.name[o].toUpperCase(), 1.8, '7', 'port')) drawn++;
    }
  }
}

function drawCities(S) {
  var minPop = Math.pow(10, clamp(7.2 - view.zoom * 0.62, 4.0, 7.2));
  var drawn = 0;
  for (var n in PLACES) {
    var pl = PLACES[n];
    if (pl.pop < minPop && !(pl.src === 'fixture' && view.zoom > 0.9)) continue;
    if (drawn > 120) break;
    var f = faceOf(pl.v);
    var wpt = worldOf(f, baryOf(f, pl.v));
    var vv = toView(wpt);
    var nrm = qApply(view.q, faceNormal(f));
    if (dot(nrm, sub([0, 0, CAM_D], vv)) <= 0) continue;
    var s = project(vv, S);
    if (s[0] < -60 || s[0] > W + 60 || s[1] < -30 || s[1] > H + 30) continue;
    drawn++;
    ctx.fillStyle = COL.ink;
    ctx.beginPath();
    ctx.arc(s[0], s[1], 1.9, 0, TAU);
    ctx.fill();
    if (view.zoom > 1.4 || pl.pop > 1.4e7) {
      ctx.font = '8px ui-monospace,monospace';
      ctx.textAlign = 'left';
      ctx.fillStyle = COL.muted;
      ctx.fillText(pl.name.toUpperCase(), s[0] + 4.5, s[1] + 2.6);
    }
  }
}

function drawNorth(S) {
  var np = [0, 0, 1];
  var f = faceOf(np);
  var wpt = worldOf(f, baryOf(f, np));
  var vv = toView(wpt);
  var nrm = qApply(view.q, faceNormal(f));
  if (dot(nrm, sub([0, 0, CAM_D], vv)) <= 0) return;
  var s = project(vv, S);
  ctx.strokeStyle = COL.ink; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(s[0] - 5, s[1]); ctx.lineTo(s[0] + 5, s[1]);
  ctx.moveTo(s[0], s[1] - 5); ctx.lineTo(s[0], s[1] + 5); ctx.stroke();
  ctx.font = '700 9px ui-monospace,monospace';
  ctx.textAlign = 'left'; ctx.fillStyle = COL.ink;
  ctx.fillText('N', s[0] + 7, s[1] + 3);
}

function render() {
  var S = pxScale();
  ctx.fillStyle = COL.ground;
  ctx.fillRect(0, 0, W, H);

  var order = [];
  for (var f = 0; f < NF; f++) {
    var vis = faceVisible(f, S);
    if (vis) order.push({ f: f, z: vis.z, vis: vis });
  }
  order.sort(function (a, b) { return a.z - b.z; });
  setFoldable(order.length > 1);

  var stopPx = Math.min(W, H) * 0.34;
  var focus = focusCell();

  drawRelations(S, 'back');

  for (var i = 0; i < order.length; i++) {
    var f2 = order[i].f, vis2 = order[i].vis;
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(vis2.pa[0], vis2.pa[1]);
    ctx.lineTo(vis2.pb[0], vis2.pb[1]);
    ctx.lineTo(vis2.pd[0], vis2.pd[1]);
    ctx.closePath();
    ctx.fillStyle = COL.sea;
    ctx.fill();
    ctx.clip();
    var spanF = Math.max(
      Math.max(vis2.pa[0], vis2.pb[0], vis2.pd[0]) - Math.min(vis2.pa[0], vis2.pb[0], vis2.pd[0]),
      Math.max(vis2.pa[1], vis2.pb[1], vis2.pd[1]) - Math.min(vis2.pa[1], vis2.pb[1], vis2.pd[1]));
    needDetail(f2, spanF);
    drawFaceSurface(f2, S);
    drawGazRivers(f2, S, spanF);
    var budget = { n: 0 };
    drawGrid(f2, ROOT_TRI, 0, S, stopPx, budget);
    ctx.restore();
    // the face's own edge — the first structure, always legible
    ctx.beginPath();
    ctx.moveTo(vis2.pa[0], vis2.pa[1]);
    ctx.lineTo(vis2.pb[0], vis2.pb[1]);
    ctx.lineTo(vis2.pd[0], vis2.pd[1]);
    ctx.closePath();
    ctx.strokeStyle = COL.ink;
    ctx.lineWidth = f2 === focus.f ? 2.2 : 1.2;
    ctx.stroke();
  }

  // ancestry: what contains this. Never lost. (Invariant 7)
  for (var d = 0; d < focus.depth; d++) {
    var anc = makeCell(focus.f, focus.path.slice(0, d));
    var alpha = 0.16 + 0.5 * (d / Math.max(1, focus.depth));
    strokeCell(anc, S, 'rgba(18,21,20,' + alpha.toFixed(2) + ')', 1.4);
  }
  strokeCell(focus, S, COL.ink, 2.4);

  if (traceCells) {
    for (var t = 0; t < traceCells.length; t++) {
      strokeCell(traceCells[t], S, COL.signal, 1.6, 'rgba(168,70,42,.13)');
    }
  }
  for (var slug in brush) {
    var pc = cellFromSlug(slug);
    if (pc) strokeCell(pc, S, 'rgba(168,70,42,.75)', 1.6, 'rgba(168,70,42,.22)');
  }
  for (var an in DB.areas) {
    if (an === DB.openArea) continue;
    for (var q2 = 0; q2 < DB.areas[an].length; q2++) {
      var ac = cellFromSlug(DB.areas[an][q2]);
      if (ac) strokeCell(ac, S, 'rgba(18,21,20,.45)', 1.2, 'rgba(18,21,20,.07)');
    }
  }
  if (selection) {
    strokeCell(selection, S, COL.signal, 2.6, 'rgba(168,70,42,.10)');
    var nb = neighbours(selection);
    for (var q = 0; q < nb.length; q++) strokeCell(nb[q], S, 'rgba(168,70,42,.55)', 1.2);
  }
  if (pressing) drawSeams(S);

  riverBudget = 0;
  drawCouncil(S);
  drawSaid(S);
  drawGround(S);
  syncLinks(S);
  trackCard(S);
  drawRelations(S, 'front');
  drawNorth(S);

  if (anchor) {
    var f3 = faceOf(anchor.p);
    var av3 = toView(worldOf(f3, baryOf(f3, anchor.p)));
    if (dot(qApply(view.q, faceNormal(f3)), sub([0, 0, CAM_D], av3)) > 0) {
    var sp = project(av3, S);
    ctx.strokeStyle = COL.signal; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(sp[0], sp[1], 9, 0, TAU); ctx.stroke();
    ctx.beginPath(); ctx.arc(sp[0], sp[1], 2.4, 0, TAU);
    ctx.fillStyle = COL.signal; ctx.fill();
    }
  }
}

  }

function setLegend(c) {

var lastHash = '', hashAt = 0;
function syncHash(c) {
  var slug = cellSlug(c);
  if (slug === lastHash) return;
  var now = performance.now();
  if (now - hashAt < 400) return;
  hashAt = now; lastHash = slug;
  try { history.replaceState(null, '', '#' + slug); } catch (e) { }
}

var lastCellKey = '';
function updateReadouts() {
  var c = focusCell();
  var km = cellEdgeKm(c);
  var si = scaleOf(km);
  elCellId.textContent = cellId(c);
  elCellExtent.textContent = kmLabel(km) + ' edge · depth ' + c.depth +
    (km < SOURCE_KM ? ' · past the source' : '');

    ? 'council · ' + council.name + ' ' + council.stat.people + '/' + council.stat.topics
    : 'below the smallest solid';
  elScaleName.textContent = SCALES[si].n;
  elFoldState.textContent = view.fold < 0.02 ? 'unfolded · net'
    : view.fold > 0.98 ? 'folded · icosahedron'

  var rungs = elLadder.children;
  for (var i = 0; i < rungs.length; i++) {

  }

      (c.f < 10 ? '0' : '') + c.f + '</span>';

    var skipped = c.path.length - shown.length;
    if (skipped > 0) html += '<span class="link sep">▸</span><span class="link">+' + skipped + '</span>';
    for (var d = 0; d < shown.length; d++) {
      html += '<span class="link sep">▸</span><span class="link' +
        (d === shown.length - 1 ? ' here' : '') + '">' + shown[d] + '</span>';

/* --------------------------------------------------------- conditions
 * Operations exist only where they are possible. No permanent toolbar of
 * irrelevant verbs.                                                    */
function availableActions(cell) {
  var acts = [];
  acts.push({ k: 'where', t: 'WHERE', s: cellSlug(cell) });
  var said = notesOf(cellSlug(cell)).length;
  var arr = concernsArriving(cell).length;
  acts.push({ k: 'say', t: 'SAID',
    s: arr ? arr + ' climbed here' : said ? said + ' here' : 'say something' });
  if (cell.depth < MAX_DEPTH) acts.push({ k: 'enter', t: 'ENTER', s: 'four children' });
  if (cell.depth > 0) acts.push({ k: 'exit', t: 'EXIT', s: 'parent' });
  acts.push({ k: 'anchor', t: 'HOLD', s: 'make anchor' });
  var rels = relationsIn(cell);
  if (rels.length) acts.push({ k: 'pull', t: 'PULL', s: rels.length + ' relation' + (rels.length > 1 ? 's' : '') });
  var ph = phenomenaIn(cell);
  if (ph.length) acts.push({ k: 'trace', t: 'TRACE', s: ph[0].name });
  var council = councilFor(cellEdgeKm(cell));
  if (council) acts.push({ k: 'council', t: 'COUNCIL', s: council.name });
  if (SEAMS.length) acts.push({ k: 'press', t: 'PRESS', s: 'what resists' });
  return acts;
}
function relationsIn(cell) {
  var out = [];
  for (var i = 0; i < RELATIONS.length; i++) {
    var r = RELATIONS[i];
    if (cellContains(cell, r.pa.v) || cellContains(cell, r.pb.v)) out.push(r);
  }
  return out;
}
var RIVER_PTS = null;
function riverPoints() {
  if (RIVER_PTS) return RIVER_PTS;
  RIVER_PTS = decodeLines(DATA.rivers).map(function (l) {
    return l.map(function (pt) { return fromLonLat(pt[0], pt[1]); });
  });
  return RIVER_PTS;
}
function phenomenaIn(cell) {
  var pts = riverPoints(), out = [];
  for (var i = 0; i < PHENOMENA.length; i++) {
    var ph = PHENOMENA[i], hit = false;
    for (var l = ph.from; l < ph.to && !hit; l++) {
      var line = pts[l];
      for (var j = 0; j < line.length; j++) {
        if (cellContains(cell, line[j])) { hit = true; break; }
      }
    }
    if (hit) out.push(ph);
  }
  return out;
}

var actAt = { x: 0, y: 0 };
function showActions(cell, x, y) {
  var acts = availableActions(cell);
  var html = '';
  for (var i = 0; i < acts.length; i++) {
    html += '<button data-k="' + acts[i].k + '"' + (acts[i].k === 'enter' ? ' class="sig"' : '') +
      '>' + acts[i].t + '<em>' + acts[i].s + '</em></button>';
  }
  elActs.innerHTML = html;
  elActs.classList.add('open');
  actAt.x = x; actAt.y = y;
  var w = 150, h = acts.length * 33;
  var left = x > W * 0.52 ? x - w - 14 : x + 14;
  elActs.style.left = clamp(left, 8, Math.max(8, W - w - 8)) + 'px';
  elActs.style.top = clamp(y - h / 2, 60, Math.max(60, H - h - 62)) + 'px';
}
function hideActions() { elActs.classList.remove('open'); }

elActs.addEventListener('click', function (e) {
  var b = e.target.closest('button');
  if (!b || !selection) return;
  doAction(b.getAttribute('data-k'), selection);
});

/* ==================================================================== *
 *  8 · OPERATIONS                                                       *
 * ==================================================================== */

function zoomForDepth(d) {
  var target = Math.min(W, H) * 0.46;
  return Math.log2(target * Math.pow(2, d) / baseScale());
}
function lookAt(p, depth) {
  view.centreTarget = p;
  view.facing = true;
  if (typeof depth === 'number') view.zoomTarget = zoomForDepth(clamp(depth, 0, MAX_DEPTH));
  wake();
}
function doAction(kind, cell) {
  if (kind === 'enter') {
    // ENTER — the triangle expands; nothing teleports
    var c = cellCentre(cell);
    lookAt(c, cell.depth + 1);
    selection = cellAt(c, cell.depth + 1);
  } else if (kind === 'exit') {
    var par = makeCell(cell.f, cell.path.slice(0, cell.depth - 1));
    lookAt(cellCentre(par), par.depth);
    selection = par;
  } else if (kind === 'anchor') {
    anchor = { p: cellCentre(cell), label: cellId(cell) };
  } else if (kind === 'pull') {
    var rels = relationsIn(cell);
    pulled = rels[0];
    view.relaxTarget = 1;
    openRelations();
  } else if (kind === 'trace') {
    var ph = phenomenaIn(cell);
    startTrace(ph[0]);
  } else if (kind === 'where') {
    openWhere(cell);
  } else if (kind === 'say') {
    openThread(cell);
  } else if (kind === 'council') {
    var already = councilCell && cellId(councilCell) === cellId(cell) && councilSeat;
    if (already) { councilCell = null; councilSeat = null; setLegend(null); }
    else {
      councilCell = cell;
      councilSeat = councilFor(cellEdgeKm(cell));
      setLegend(councilSeat);
      openCouncil(cell);
    }
  } else if (kind === 'press') {
    pressing = !pressing;
    openSeams();
  }
  hideActions();
  if (!elPanel.classList.contains('open')) updateActionsFor(selection);
  wake();
}
function updateActionsFor(cell) {
  if (!cell) return;
  showActions(cell, actAt.x, actAt.y);
}

function startTrace(ph) {
  traced = ph;
  var pts = riverPoints();
  var depth = clamp(depthForZoom(), 3, 9);
  var seen = {}, cells = [];
  for (var l = ph.from; l < ph.to; l++) {
    var line = pts[l];
    for (var i = 0; i < line.length; i++) {
      var c = cellAt(line[i], depth);
      var id = cellId(c);
      if (!seen[id]) { seen[id] = 1; cells.push(c); }
    }
  }
  traceCells = cells;
  if (cells.length) lookAt(cellCentre(cells[Math.floor(cells.length / 2)]), Math.max(2, depth - 3));
  openTrace();
}
function clearTrace() { traced = null; traceCells = null; wake(); }

var pointers = new Map();
var gesture = null;
