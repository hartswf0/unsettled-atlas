<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f1eee4">
<meta name="description" content="ICOSA SYNTEGRITY: every triangle on Earth has an address, a council and a thread. Take a seat, say something, and it stays where you said it.">
<title>ICOSA SYNTEGRITY · take a seat in a triangle</title>
<style>
/* ================================================================== *
 * ICOSA WORLD                                                         *
 * The world owns the screen. Controls emerge from the geometry.       *
 * ================================================================== */
:root{
  --ground:#f1eee4;      /* ocean, paper, ground */
  --ink:#121514;
  --muted:#5f6763;
  --signal:#a8462a;      /* tension */
  --land:#ece7dc;
  --landline:#7d8983;
  --water:#8fa8ad;
  --sea:#dbe3e4;
  --urban:#d6c6a9;
  --road:#ab9d87;
  --paper:#faf8f1;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%;overflow:hidden;background:var(--ground)}
body{
  position:fixed;inset:0;color:var(--ink);
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  -webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%;
  touch-action:none;overscroll-behavior:none;
}
/* The sheet is a sibling of the map, never a lid on it. On a phone the map
   keeps the top half; on a wide screen the sheet takes a column. Either way
   the triangle you are talking about stays visible while you talk. */
body{display:flex;flex-direction:column}
#stage{position:relative;flex:1 1 auto;min-height:0;min-width:0}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}

/* --- readouts ------------------------------------------------------ */
.hud{position:absolute;z-index:10;pointer-events:none}
#situation{
  top:0;left:0;right:0;
  padding:max(10px,env(safe-area-inset-top)) 12px 0 max(12px,env(safe-area-inset-left));
  display:flex;justify-content:space-between;align-items:flex-start;gap:10px
}
.plate{
  background:var(--ground);border:1.5px solid var(--ink);padding:6px 8px;
  font-size:10px;line-height:1.45;letter-spacing:.08em;white-space:nowrap
}
.plate b{font-weight:700}
.plate .dim{color:var(--muted)}
#cellplate{min-width:0;flex:0 1 auto;overflow:hidden}
#wire{margin-top:3px;font-size:8px;letter-spacing:.1em;color:var(--muted);cursor:pointer}
#wire.busy{color:var(--ink)}
#wire.warn{color:var(--signal)}
#wire .wdot{display:inline-block;width:5px;height:5px;border-radius:50%;
  background:var(--signal);margin-right:4px;vertical-align:1px;
  animation:cvbreathe 1.1s ease-in-out infinite}
#wire .wtog{opacity:.55}
#wiretbl{margin-top:4px;padding-top:4px;border-top:1px solid var(--muted);
  font-size:8px;line-height:1.7;letter-spacing:.08em;color:var(--muted);
  white-space:normal;max-width:min(300px,72vw);cursor:default}
#wiretbl .wrow b{color:var(--ink);font-weight:700}
#wiretbl .wnote{margin-top:3px;opacity:.75}
#panel .deck{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));
  gap:8px;margin:12px 0}
#panel .pcard{border:1.5px solid var(--ink);background:var(--paper);
  display:flex;flex-direction:column;gap:2px;align-items:center;text-align:center;
  padding:0 0 6px;overflow:hidden}
#panel .pcard img{width:100%;height:72px;object-fit:cover;
  border-bottom:1px solid var(--ink);filter:grayscale(.25) contrast(1.05)}
#panel .pcard .pface{width:100%;height:72px;display:flex;align-items:center;
  justify-content:center;font-size:30px;font-weight:700;opacity:.5;
  border-bottom:1px solid var(--ink)}
#panel .pcard b{font-size:9px;line-height:1.25;padding:2px 4px 0}
#panel .pcard em{font-style:normal;font-size:7.5px;color:var(--muted);
  padding:0 4px;line-height:1.3}
#panel .pcard i{font-style:normal;font-size:8px;font-weight:700;letter-spacing:.14em}
#panel .pcard span{font-size:7px;color:var(--muted);padding:0 4px;line-height:1.4}
#panel .pcard u{text-decoration:none;font-size:6.5px;color:var(--muted);
  letter-spacing:.08em;opacity:.8}
#panel .team{border-left:2px solid var(--ink);padding:5px 0 5px 8px;margin:8px 0}
#panel .team b{display:block;font-size:10px}
#panel .team b s{text-decoration:none;color:var(--muted);font-size:8px;
  letter-spacing:.14em;margin-right:6px}
#panel .team q{display:block;quotes:none;font-size:9px;margin:2px 0;line-height:1.45}
#panel .team em{display:block;font-style:normal;font-size:8px;
  color:var(--ink);opacity:.85;line-height:1.5}
#scaleplate{flex:0 0 auto}
#cellid{font-weight:700;letter-spacing:.14em}
#scaleplate{text-align:right}

/* --- the ladder: scale is spatially embodied, not a button --------- */
#ladder{
  right:max(8px,env(safe-area-inset-right));top:50%;transform:translateY(-50%);
  display:flex;flex-direction:column;gap:0;align-items:flex-end
}
.rung{
  display:flex;align-items:center;gap:5px;height:19px;
  font-size:8px;letter-spacing:.12em;color:var(--muted)
}
.rung i{display:block;height:1.5px;width:9px;background:var(--muted);font-style:normal}
.rung.on{color:var(--ink);font-weight:700}
.rung.on i{width:20px;height:2.5px;background:var(--signal)}
.rung span{opacity:0;background:var(--ground);padding:1px 3px}
.rung.on span,.rung.near span{opacity:1}
.rung.near{color:var(--muted)}

/* --- containment: where I am, what contains this, how I return ----- */
#chain{
  left:max(10px,env(safe-area-inset-left));bottom:0;right:0;
  padding:0 10px calc(6px + env(safe-area-inset-bottom));
  display:flex;flex-wrap:wrap;align-items:center;gap:3px
}
.link{
  font-size:9px;letter-spacing:.1em;color:var(--muted);
  border:1.5px solid transparent;padding:2px 3px
}
.link.here{color:var(--ink);font-weight:700;border-color:var(--ink);background:var(--ground)}
.link.sep{opacity:.45;padding:0}
#chain .link:not(.sep){cursor:pointer;pointer-events:auto}
#chain .link:not(.sep):hover{color:var(--signal);border-color:var(--signal)}
/* The address drawn as itself: which quarter of its parent this cell is.
   Four digits in a row say nothing; four quarters say where you went. */
#chain .q{display:inline-block;width:11px;height:10px;vertical-align:-1px}
/* The panel described a shape and never drew it. This is the cell as it is
   on screen right now — its four children with what each holds, and the
   three neighbours across its edges — and every part of it is somewhere
   you can go. */
#mini{
  /* the map canvas is absolutely positioned by the bare `canvas` rule
     above; this one belongs in the flow of the panel */
  position:static;inset:auto;
  display:block;width:100%;max-width:420px;height:190px;background:var(--paper);
  border:1.5px solid var(--ink);cursor:pointer;touch-action:manipulation
}

/* --- actions appear only where they are possible ------------------- */
#acts{
  position:absolute;z-index:20;display:none;flex-direction:column;gap:-1px;
  align-items:flex-start
}
#acts.open{display:flex}
#acts button{
  font:inherit;font-size:10px;font-weight:700;letter-spacing:.14em;
  background:var(--ground);color:var(--ink);border:1.5px solid var(--ink);
  padding:9px 11px;margin-top:-1.5px;min-width:112px;text-align:left;cursor:pointer;
  display:flex;justify-content:space-between;gap:10px
}
#acts button em{font-style:normal;font-weight:400;color:var(--muted);font-size:9px}
#acts button:active{background:var(--ink);color:var(--ground)}
#acts button:active em{color:var(--ground);opacity:.7}
#acts button.sig{background:var(--signal);border-color:var(--signal);color:var(--paper)}
#acts button.sig em{color:var(--paper);opacity:.75}

/* --- panels -------------------------------------------------------- */
#panel{
  flex:0 0 auto;z-index:30;max-height:52vh;overflow-y:auto;
  background:var(--ground);border-top:2px solid var(--ink);
  padding:14px max(14px,env(safe-area-inset-left)) calc(16px + env(safe-area-inset-bottom));
  display:none;-webkit-overflow-scrolling:touch
}
#panel.open{display:block}
#panel{-webkit-user-select:text;user-select:text}
@media(min-width:860px){
  body{flex-direction:row}
  #panel{max-height:none;height:100%;width:min(440px,40%);
         border-top:none;border-left:2px solid var(--ink);
         padding-top:16px}
}
#panel h2{
  position:sticky;top:0;z-index:2;background:var(--ground);
  font-size:11px;letter-spacing:.2em;font-weight:700;
  margin:-14px 0 10px;padding:14px 0 10px;
  display:flex;justify-content:space-between;align-items:center;gap:10px
}
#panel h2 button{
  font:inherit;font-size:10px;letter-spacing:.14em;font-weight:700;
  border:1.5px solid var(--ink);background:var(--ground);padding:5px 9px;cursor:pointer
}
#panel p{font-size:11px;line-height:1.6;color:var(--muted);margin-bottom:9px;max-width:64ch}
#panel p b{color:var(--ink)}
#panel .row{
  display:flex;justify-content:space-between;gap:10px;align-items:baseline;
  border-top:1px solid rgba(18,21,20,.18);padding:7px 0;font-size:10px;letter-spacing:.06em;
  cursor:pointer
}
#panel .row:last-child{border-bottom:1px solid rgba(18,21,20,.18)}
#panel .row b{font-weight:700}
#panel .row[data-at]:hover,#panel .row[data-go]:hover{color:var(--signal)}
/* measurements are still true and still here — just not the first thing you
   have to read to find out where you are */
#panel details{margin:8px 0 4px}
#panel details summary{
  cursor:pointer;font-size:10px;letter-spacing:.08em;color:var(--muted);
  padding:6px 0;list-style:none
}
#panel details summary::-webkit-details-marker{display:none}
#panel details summary::before{content:'▸ ';color:var(--signal)}
#panel details[open] summary::before{content:'▾ '}
#panel .row a{color:var(--signal);text-underline-offset:3px}
#panel .row span{color:var(--muted);text-align:right;flex:0 0 auto}
#panel .row.on{background:var(--ink);color:var(--ground);padding-inline:6px}
#panel .row.on span{color:var(--ground);opacity:.75}
@media(max-width:520px){
  #panel .row{flex-wrap:wrap;gap:2px}
  #panel .row b,#panel .row span{flex:1 1 100%;text-align:left}
}
#panel input,#panel textarea{
  font:inherit;font-size:13px;width:100%;background:var(--paper);color:var(--ink);
  border:1.5px solid var(--ink);padding:8px;margin:4px 0;-webkit-user-select:text;user-select:text
}
#panel textarea{min-height:74px;resize:vertical;line-height:1.45}
#panel .seat input{font-size:12px;padding:5px 6px;margin:0}
#panel .seat{display:grid;grid-template-columns:1fr 128px;gap:8px;align-items:center;
  border-top:1px solid rgba(18,21,20,.18);padding:6px 0;font-size:10px;letter-spacing:.06em}
#panel .seat b{font-weight:700}
#panel .seat em{font-style:normal;color:var(--muted);display:block;font-size:9px;margin-top:1px}
/* a topic is a subject at a place, so it stacks: what it is, then where and
   what it is, then the registers that meet in it. Squeezed into a two-column
   row the name broke across three lines and read as noise. */
#panel .topic{border-top:1px solid rgba(18,21,20,.18);padding:7px 0;cursor:pointer}
#panel .topic b{display:block;font-size:11px;letter-spacing:.06em;font-weight:700}
#panel .topic b s{text-decoration:none;color:var(--muted);font-weight:400;
  font-size:9px;letter-spacing:.12em;margin-right:7px}
#panel .topic b a{color:var(--signal);text-decoration:none}
#panel .topic b a:hover{text-decoration:underline}
#panel .topic em{font-style:normal;display:block;color:var(--muted);font-size:9px;margin-top:2px}
#panel .topic i{font-style:normal;display:block;color:var(--muted);font-size:8px;
  letter-spacing:.1em;margin-top:3px}
#panel .topic:hover b{color:var(--signal)}
/* a nomination, marked as one: a name the record ties to this ground, and
   not somebody who agreed to sit in the seat */
#panel .nom{margin-top:5px;padding:5px 7px;border-left:2px solid var(--signal);
  background:rgba(168,70,42,.06)}
#panel .nom a{color:var(--signal);font-weight:700;text-decoration:none;font-size:10px}
#panel .nom a:hover{text-decoration:underline}
#panel .nom span{color:var(--ink);font-size:9px}
#panel .nom em{color:var(--muted);font-size:8px;letter-spacing:.08em;margin-top:2px}
#panel .nom .go{font-size:8px;padding:3px 6px;margin-top:4px;letter-spacing:.1em}
/* the convening's live region: a quiet bar, a breathing dot, and lines
   that land instead of a panel that jumps */
#convene{margin-top:10px}
#convene .cvhead{display:flex;align-items:center;gap:7px;font-size:10px;
  letter-spacing:.08em;color:var(--signal)}
#convene .cvhead b{font-weight:700}
#convene .cvhead span{margin-left:auto;color:var(--muted)}
#convene .cvdot{width:7px;height:7px;border-radius:50%;background:var(--signal);
  flex:0 0 auto;animation:cvbreathe 1.2s ease-in-out infinite}
#convene .cvbar{height:3px;background:rgba(18,21,20,.14);margin:6px 0 8px}
#convene .cvbar i{display:block;height:100%;background:var(--signal);
  transition:width .5s ease}
#convene .said.landin{animation:cvland .5s ease}
@keyframes cvbreathe{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.5);opacity:.55}}
@keyframes cvland{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
/* a guess must not look like a citation. Dashed, grey, and it says so. */
#panel .nom.guess{border-left:2px dashed var(--muted);background:rgba(18,21,20,.04)}
#panel .nom.guess a{color:var(--ink)}
#panel .nom.guess em b{color:var(--signal)}
#panel .topic q{display:block;quotes:none;font-size:10px;line-height:1.45;color:var(--ink);
  margin:3px 0 1px;padding-left:7px;border-left:2px solid var(--signal)}
#panel .go{
  font:inherit;font-size:11px;font-weight:700;letter-spacing:.14em;cursor:pointer;
  border:1.5px solid var(--ink);background:var(--ink);color:var(--ground);padding:9px 14px;margin-top:6px
}
#panel .go.ghost{background:var(--ground);color:var(--ink)}
#panel .said{border-top:1px solid rgba(18,21,20,.18);padding:8px 0}
#panel .said b{font-size:10px;letter-spacing:.1em}
#panel .said.crit{border-left:2px solid var(--signal);padding-left:7px}
#panel .said span{color:var(--muted);font-size:8px;letter-spacing:.1em}
#panel .said span{color:var(--muted);font-size:9px;letter-spacing:.08em}
#panel .said p{font-size:12px;line-height:1.5;color:var(--ink);margin:4px 0 0;max-width:60ch}
#panel .kbd{font-size:9px;color:var(--muted);letter-spacing:.1em;line-height:1.9;margin-top:8px}
#panel .kbd b{color:var(--ink);font-weight:700}

/* --- corner marks -------------------------------------------------- */
#modes{
  left:max(10px,env(safe-area-inset-left));right:max(10px,env(safe-area-inset-right));
  top:auto;bottom:34px;
  display:flex;flex-wrap:wrap;gap:0;pointer-events:auto;justify-content:flex-start
}
#modes button{
  font:inherit;font-size:9px;font-weight:700;letter-spacing:.12em;
  border:1.5px solid var(--ink);background:var(--ground);color:var(--ink);
  padding:7px 8px;margin-left:-1.5px;cursor:pointer
}
#modes button:first-child{margin-left:0}
#modes button.on{background:var(--ink);color:var(--ground)}
#modes button.sig{background:var(--signal);border-color:var(--signal);color:var(--paper)}
/* Real anchors, positioned over the ground they name. Canvas text cannot be
   opened in a new tab, copied, or long-pressed — a link has to be a link. */
#links{position:absolute;inset:0;pointer-events:none;z-index:6}
/* The dot inside the chip sits exactly on the coordinate, so the label
   extends away from its place instead of covering it. Near the right edge
   it extends the other way. */
#links a{
  position:absolute;transform:translate(-6.5px,-50%);pointer-events:auto;
  display:flex;align-items:center;gap:4px;white-space:nowrap;
  font:700 8px ui-monospace,monospace;letter-spacing:.06em;
  color:var(--signal);text-decoration:none;padding:3px 5px 3px 3px;
  background:rgba(241,238,228,.86);border:1px solid var(--signal)
}
#links a.flip{flex-direction:row-reverse;padding:3px 3px 3px 5px;
  transform:translate(calc(-100% + 6.5px),-50%)}
#links a:hover,#links a:focus{background:var(--signal);color:var(--paper)}
#links a i{display:block;width:5px;height:5px;background:var(--signal);border-radius:50%;flex:0 0 auto}
#links a:hover i,#links a:focus i{background:var(--paper)}
/* A card in context, beside the dot it belongs to. Wikipedia cannot be put
   in an iframe — en.wikipedia.org sends X-Frame-Options, so a frame renders
   blank — so the summary is fetched and drawn here instead. Which is better
   anyway: it matches the map, and it never navigates away. */
/* The height is set from the room there actually is, in placeCard. A fixed
   cap put a scrollbar on a card with a thousand pixels of empty map around
   it, which is hiding data to protect space nothing was using. */
#card{
  position:absolute;z-index:12;display:none;width:min(340px,76vw);
  background:var(--ground);border:1.5px solid var(--ink);
  box-shadow:4px 4px 0 rgba(18,21,20,.13);
  max-height:70vh;overflow-y:auto;touch-action:pan-y
}
#card.open{display:block}
#card .top{
  display:flex;justify-content:space-between;align-items:flex-start;gap:8px;
  padding:8px 9px 6px;border-bottom:1.5px solid var(--ink);position:sticky;top:0;background:var(--ground)
}
#card .top b{font-size:11px;letter-spacing:.1em;line-height:1.35}
#card .top em{font-style:normal;display:block;font-size:8px;letter-spacing:.14em;color:var(--muted);margin-top:2px}
#card .x{
  font:inherit;font-size:11px;font-weight:700;border:1.5px solid var(--ink);background:var(--ground);
  color:var(--ink);padding:2px 6px;cursor:pointer;flex:0 0 auto
}
#card .body{padding:8px 9px 10px}
#card .body p{font-size:11px;line-height:1.5;color:var(--ink);margin:0 0 7px}
#card .body .fact{display:flex;justify-content:space-between;gap:8px;font-size:9px;letter-spacing:.07em;
  color:var(--muted);border-top:1px solid rgba(18,21,20,.16);padding:4px 0}
#card .body .fact b{color:var(--ink);font-weight:700}
/* the photograph is data, but a 200px photograph in a 340px card is mostly
   ink — it gets a band, and the words get the rest */
#card img{width:100%;height:auto;max-height:132px;object-fit:cover;
  display:block;margin:0 0 7px;border:1px solid var(--ink)}
#card .go{
  font:inherit;font-size:9px;font-weight:700;letter-spacing:.12em;display:inline-block;
  border:1.5px solid var(--ink);background:var(--ground);color:var(--ink);
  padding:6px 8px;margin:6px 4px 0 0;cursor:pointer;text-decoration:none
}
#card .go.sig{background:var(--ink);color:var(--ground)}
#reglegend{
  left:max(10px,env(safe-area-inset-left));bottom:72px;
  display:none;flex-direction:column;gap:2px
}
#reglegend.open{display:flex}
#reglegend div{
  display:flex;align-items:center;gap:5px;font-size:8px;letter-spacing:.1em;
  background:var(--ground);padding:1px 4px 1px 2px;width:max-content
}
#reglegend i{display:block;width:14px;height:3px}
#boot{
  position:fixed;inset:0;z-index:40;background:var(--ground);
  display:flex;align-items:center;justify-content:center;
  font-size:10px;letter-spacing:.24em;color:var(--muted)
}
#boot.gone{display:none}
#boot .bx{display:flex;flex-direction:column;align-items:center;gap:16px}
#boot svg polygon{fill:none;stroke:var(--ink);stroke-width:1.5;stroke-linejoin:round}
#boot .b0{stroke-dasharray:346;stroke-dashoffset:346;animation:bdraw .9s ease-out forwards}
#boot .b1,#boot .b2,#boot .b3,#boot .b4{opacity:0;stroke-width:1}
#boot .b1{animation:bshow 2s ease-in-out .8s infinite}
#boot .b2{animation:bshow 2s ease-in-out 1.0s infinite}
#boot .b3{animation:bshow 2s ease-in-out 1.2s infinite}
#boot .b4{animation:bshow 2s ease-in-out 1.4s infinite}
#boot .bl{animation:bbreathe 1.6s ease-in-out infinite}
@keyframes bdraw{to{stroke-dashoffset:0}}
@keyframes bshow{0%,100%{opacity:0}35%,65%{opacity:.85}}
@keyframes bbreathe{0%,100%{opacity:.45}50%{opacity:1}}
@media (max-width:380px){ .plate{font-size:9px} }
@media (prefers-reduced-motion:reduce){ #acts button{transition:none} }
</style>
</head>
<body>
<div id="stage">
<canvas id="world"></canvas>
<div id="links"></div>
<div id="card"></div>

<div class="hud" id="situation">
  <div class="plate" id="cellplate">
    <div id="cellid">—</div>
    <div class="dim" id="cellextent">—</div>
    <div class="dim" id="cellcouncil">—</div>
    <div class="dim" id="cellfound" style="display:none;color:var(--signal);font-size:9px"></div>
    <div id="wire" style="display:none"></div>
    <div id="wiretbl" style="display:none"></div>
  </div>
  <div class="plate" id="scaleplate">
    <div><b id="scalename">EARTH</b></div>
    <div class="dim" id="foldstate">unfolded</div>
  </div>
</div>

<div class="hud" id="ladder"></div>
<div class="hud" id="chain"></div>

<div id="acts"></div>

<div class="hud" id="reglegend"></div>

<div class="hud" id="modes">
  <button id="mFold" title="fold / unfold">FOLD</button>
  <button id="mPaint" title="paint an area across triangles">PAINT</button>
  <button id="mRel" title="relational geometry">TENSION</button>
  <button id="mHelp">?</button>
  <button id="mDrop" class="sig" title="drop what the map is holding" style="display:none"></button>
</div>

</div><!-- /stage -->

<div id="panel"></div>
<div id="boot"><div class="bx">
  <svg viewBox="0 0 120 106" width="108" height="95" aria-hidden="true">

  var vv = toView(worldOf(f, baryOf(f, p)));
  return dot(qApply(view.q, faceNormal(f)), sub([0, 0, CAM_D], vv)) > 0;
}
// two passes: what is behind the world is drawn before the world, and the
// world covers it. A tendon that runs through the body should look like it.
function drawRelations(S, pass) {
  // these are a declared fixture about planetary relation, not features of
  // the ground. Drawn at street scale they are just a line across the view.
  if (!pulled && view.relax < 0.02) return;
  var shown = pulled ? [pulled] : RELATIONS;
  for (var i = 0; i < shown.length; i++) {
    var r = shown[i];
    var pa = relaxedPoint(r.pa, S), pb = relaxedPoint(r.pb, S);
    var fa = facingCamera(pa), fb = facingCamera(pb);
    var back = !fa && !fb;
    if ((pass === 'back') !== back) continue;
    var A = worldOfPoint(pa), B = worldOfPoint(pb);
    var sa = project(toView(A), S), sb = project(toView(B), S);
    var sep = len(sub(A, B));
    if (r.kind === 'tendon') {
      // a tendon is a chord: it goes through the body, not around it
      var pull = mul(lerp3(A, B, 0.5), 1 - 0.14 * sep);
      var sm = project(toView(pull), S);
      ctx.strokeStyle = back ? 'rgba(168,70,42,.3)' : COL.signal;
      ctx.lineWidth = pulled ? 2.6 : 1.6;
      ctx.beginPath();
      ctx.moveTo(sa[0], sa[1]);
      ctx.quadraticCurveTo(sm[0], sm[1], sb[0], sb[1]);
      ctx.stroke();
    } else {
      // a strut stands off the surface: it holds things apart
      var lift = mul(norm(add(A, B)), 0.2 * sep);
      var sm2 = project(toView(add(lerp3(A, B, 0.5), lift)), S);
      ctx.strokeStyle = back ? 'rgba(18,21,20,.3)' : COL.ink;
      ctx.lineWidth = pulled ? 3.2 : 2.2;
      ctx.beginPath();
      ctx.moveTo(sa[0], sa[1]);
      ctx.quadraticCurveTo(sm2[0], sm2[1], sb[0], sb[1]);
      ctx.stroke();
    }
    if (pulled || view.relax > 0.02) {
      ctx.fillStyle = back ? COL.muted : COL.ink;
      ctx.font = '700 9px ui-monospace,monospace';
      ctx.textAlign = 'center';
      ctx.fillText(r.label.toUpperCase(), (sa[0] + sb[0]) / 2, (sa[1] + sb[1]) / 2 - 7);
    }
    var named = !!pulled || view.relax > 0.35 || view.zoom > 1.4;

    if (fb || back) markPlace(r.pb, sb, !fb, named);

}
function markPlace(pl, s, dim, named) {
  ctx.fillStyle = dim ? COL.muted : COL.ink;
  ctx.beginPath();
  ctx.arc(s[0], s[1], 3.2, 0, TAU);
  ctx.fill();
  if (!named) return;
  ctx.font = '700 9px ui-monospace,monospace';
  ctx.textAlign = 'left';
  ctx.fillText(pl.name.toUpperCase(), s[0] + 6, s[1] + 3);
}

// The struts of a council are not drawn beside the map. At world scale they
// ARE the map: the thirty edges of the Dymaxion net, each one a seat. In the
// unfolded net a strut appears on both of the faces it separates and a topic
// appears once for every face that meets it, so the net scatters a council
// that folding gathers back into one.
var STRUT_OF_EDGE = (function () {
  var m = {};
  var E = DATA.ico.edges;
  for (var i = 0; i < E.length; i++) {
    var a = E[i][4], b = E[i][5];
    m[Math.min(a, b) + ',' + Math.max(a, b)] = i;
  }
  return m;
})();

function councilPoints(cell, seat) {
  // the embedding's barycentric points, carried into this cell's triangle
  var out = [];
  for (var i = 0; i < seat.barycentric.length; i++) {
    var w = seat.barycentric[i], t = cell.tri;
    out.push(baryPoint(cell.f, [
      t[0][0] * w[0] + t[1][0] * w[1] + t[2][0] * w[2],
      t[0][1] * w[0] + t[1][1] * w[1] + t[2][1] * w[2],
      t[0][2] * w[0] + t[1][2] * w[1] + t[2][2] * w[2]
    ]));
  }
  return out;
}

function drawCouncil(S) {
  if (!councilSeat) return;
  var seat = councilSeat.seat;
  ctx.lineCap = 'round';
  if (councilSeat.seating === 'world') {
    // struts on every face that carries them, topics at every corner
    for (var f = 0; f < NF; f++) {
      if (!faceVisible(f, S)) continue;
      var corner = [[1, 0, 0], [0, 1, 0], [0, 0, 1]];
      var scr = [];
      for (var k = 0; k < 3; k++) scr.push(project(toView(worldOf(f, corner[k])), S));
      for (var e = 0; e < 3; e++) {
        var va = FACES[f][e], vb = FACES[f][(e + 1) % 3];
        var idx = STRUT_OF_EDGE[Math.min(va, vb) + ',' + Math.max(va, vb)];
        var reg = seat.struts[idx].register;
        ctx.strokeStyle = REGCOL[reg] || COL.ink;
        ctx.lineWidth = 3.4;
        ctx.beginPath();
        ctx.moveTo(scr[e][0], scr[e][1]);
        ctx.lineTo(scr[(e + 1) % 3][0], scr[(e + 1) % 3][1]);
        ctx.stroke();
      }
      for (var t2 = 0; t2 < 3; t2++) topicMark(scr[t2], FACES[f][t2]);
    }
  } else {
    var pts = councilPoints(councilCell, seat);
    var scr2 = [];
    for (var i = 0; i < pts.length; i++) {
      var fp = faceOf(pts[i]);
      scr2.push(project(toView(worldOf(fp, baryOf(fp, pts[i]))), S));
    }
    // three of the octahedron's struts join corner to corner straight through
    // a midpoint, so drawn flat they hide under the two short ones and take
    // their registers out of sight with them. Bow those toward the middle.
    var mid2 = [0, 0];
    for (var m2 = 0; m2 < scr2.length; m2++) { mid2[0] += scr2[m2][0] / scr2.length; mid2[1] += scr2[m2][1] / scr2.length; }
    for (var j = 0; j < seat.struts.length; j++) {
      var st = seat.struts[j];
      var pa = scr2[st.topics[0]], pb = scr2[st.topics[1]];
      var through = false;
      for (var k2 = 0; k2 < scr2.length; k2++) {
        if (k2 === st.topics[0] || k2 === st.topics[1]) continue;
        var pc = scr2[k2];
        var dx = pb[0] - pa[0], dy = pb[1] - pa[1], dd = dx * dx + dy * dy;
        if (dd < 1) continue;
        var u2 = ((pc[0] - pa[0]) * dx + (pc[1] - pa[1]) * dy) / dd;
        if (u2 <= 0.02 || u2 >= 0.98) continue;
        var px2 = pa[0] + u2 * dx, py2 = pa[1] + u2 * dy;
        if (Math.hypot(pc[0] - px2, pc[1] - py2) < 3) through = true;
      }
      ctx.strokeStyle = REGCOL[st.register] || COL.ink;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(pa[0], pa[1]);
      if (through) {
        var cx2 = (pa[0] + pb[0]) / 2, cy2 = (pa[1] + pb[1]) / 2;
        ctx.quadraticCurveTo(cx2 + (mid2[0] - cx2) * 1.15, cy2 + (mid2[1] - cy2) * 1.15, pb[0], pb[1]);
      } else {
        ctx.lineTo(pb[0], pb[1]);
      }
      ctx.stroke();
    }
    for (var q = 0; q < scr2.length; q++) topicMark(scr2[q], q, seat.labels ? seat.labels[q] : null);
  }
  ctx.lineCap = 'butt';
}
function topicMark(s, id, label) {
  ctx.fillStyle = COL.ground;
  ctx.strokeStyle = COL.ink;
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  ctx.arc(s[0], s[1], 8, 0, TAU);
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = COL.ink;
  ctx.font = '700 8px ui-monospace,monospace';
  ctx.textAlign = 'center';
  ctx.fillText(String(id), s[0], s[1] + 3);
  if (label) {
    ctx.font = '7px ui-monospace,monospace';
    ctx.fillStyle = COL.muted;
    ctx.fillText(label, s[0], s[1] + 18);
  }
}

// What was said is drawn where it was said. A cell carrying a thread gets a
// mark at its centre with the count; a note attached to a council seat is
// drawn at that seat's topic instead, so the argument sits on the point it
// is about.
function drawSaid(S) {
  var byCell = noteCells();
  ctx.textAlign = 'center';
  for (var slug in byCell) {
    var c = cellFromSlug(slug);
    if (!c) continue;
    var notes = byCell[slug];
    var seatPts = null;
    if (councilCell && cellSlug(councilCell) === slug && councilSeat && councilSeat.seating !== 'world') {
      seatPts = councilPoints(councilCell, councilSeat.seat);
    }
    var groups = {};
    for (var i = 0; i < notes.length; i++) {
      var key = (seatPts && notes[i].topic != null && seatPts[notes[i].topic]) ? 't' + notes[i].topic : 'c';
      if (!groups[key]) groups[key] = [];
      groups[key].push(notes[i]);
    }
    for (var g in groups) {
      var p = g === 'c' ? cellCentre(c) : seatPts[+g.slice(1)];
      var f = faceOf(p);
      var vv = toView(worldOf(f, baryOf(f, p)));
      if (dot(qApply(view.q, faceNormal(f)), sub([0, 0, CAM_D], vv)) <= 0) continue;
      var sp = project(vv, S);
      if (sp[0] < -40 || sp[0] > W + 40 || sp[1] < -40 || sp[1] > H + 40) continue;
      var n = groups[g].length;
      var r = 9 + Math.min(7, n);
      var anyConcern = groups[g].some(function (x) { return x.kind === 'concern'; });
      var escalated = groups[g].some(function (x) {
        return x.kind === 'concern' && x.answer < scaleOf(cellEdgeKm(c));
      });
      ctx.beginPath();
      ctx.moveTo(sp[0], sp[1] - r);
      ctx.lineTo(sp[0] + r, sp[1]);
      ctx.lineTo(sp[0], sp[1] + r);
      ctx.lineTo(sp[0] - r, sp[1]);
      ctx.closePath();
      if (anyConcern) {
        ctx.fillStyle = COL.ground; ctx.fill();
        ctx.strokeStyle = COL.signal; ctx.lineWidth = 2.4; ctx.stroke();
      } else {
        ctx.fillStyle = COL.signal; ctx.fill();
      }
      if (escalated) {                      // it did not stay where it was raised
        ctx.strokeStyle = COL.signal; ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(sp[0] - 5, sp[1] - r - 4);
        ctx.lineTo(sp[0], sp[1] - r - 9);
        ctx.lineTo(sp[0] + 5, sp[1] - r - 4);
        ctx.stroke();
      }
      ctx.fillStyle = anyConcern ? COL.signal : COL.paper;
      ctx.font = '700 9px ui-monospace,monospace';
      ctx.fillText(String(n), sp[0], sp[1] + 3);
      if (r > 12 || view.zoom > 2) {
        ctx.fillStyle = COL.ink;
        ctx.font = '8px ui-monospace,monospace';
        ctx.fillText(groups[g][groups[g].length - 1].who || 'someone', sp[0], sp[1] + r + 10);
      }
    }
  }
  ctx.textAlign = 'left';
}

/* ------------------------------------------------------ finds, by triangle
 * Fifty labels over a fourteen-kilometre triangle is not a map. The anchors
 * collided, the collision rule stacked them, and they became a column down
 * the middle of the world: covering the ground they were meant to point at,
 * telling you nothing about where anything was, repeating the panel
 * underneath, and — because a stack is a screen position and not a place —
 * floating in mid-air the moment the world folded.
 *
 * The instrument already has an index, and it is the subdivision. So a
 * triangle holding more than a few finds shows how many, and splitting it
 * is how you read it: descend, and one number becomes four smaller numbers;
 * descend far enough and the numbers become names. Nothing is hidden and
 * nothing is stacked. A number is a door, a dot is a thing, and both are
 * drawn on the face, so they fold with the world instead of over it.
 *
 * Two constants do the whole job: how many names a triangle may show at
 * once, and how small a triangle may get before it stops being splittable.
 * Everything else follows from the geometry that was already there.      */
var FIND_MAX_DIVE = 9;     // how far below the focus a find is pre-addressed
var FIND_NAME_MAX = 3;     // names one triangle may show before it becomes a count
var FIND_MIN_PX = 46;      // below this a triangle cannot usefully be split
var FIND_NAME_PX = 62;     // and below this a name will not fit inside it
var FIND_MEMO = {};
var FIND_BINS = [], FIND_LABELS = [];

function lookupsKey() {
  var k = '';
  for (var s in (DB.lookups || {})) k += s + ':' + DB.lookups[s].items.length + ';';
  return k;
}
// Each find is addressed once, deep, and after that binning is a prefix
// test on its path — no geometry per frame, the same trick escalation uses.
function findsIn(cell) {
  var key = cellSlug(cell) + '|' + lookupsKey();
  if (FIND_MEMO[key]) return FIND_MEMO[key];
  var out = [], seen = {}, deep = cell.depth + FIND_MAX_DIVE;
  for (var slug in (DB.lookups || {})) {
    var its = DB.lookups[slug].items;
    for (var i = 0; i < its.length; i++) {
      var it = its[i];
      if (seen[it.pageid]) continue;
      var v = fromLonLat(it.lon, it.lat);
      var at = cellAt(v, deep);
      if (at.f !== cell.f) continue;
      var ok = true;
      for (var d = 0; d < cell.depth; d++) if (at.path[d] !== cell.path[d]) { ok = false; break; }
      if (!ok) continue;
      seen[it.pageid] = 1;
      out.push({ title: it.title, pageid: it.pageid, v: v, path: at.path });
    }
  }
  var keys = Object.keys(FIND_MEMO);
  if (keys.length > 8) delete FIND_MEMO[keys[0]];
  FIND_MEMO[key] = out;
  return out;
}
// the same four bins the map draws, in address order, for the panel
function findBins(cell) {
  var list = findsIn(cell), bins = [[], [], [], []];
  for (var i = 0; i < list.length; i++) bins[list[i].path[cell.depth]].push(list[i]);
  return bins;
}
function cellScreen(cell, S) {
  var C = cell.tri, c = faceCorners[cell.f], pts = [];
  for (var k = 0; k < 3; k++) {
    var w = C[k];
    pts.push(project(toView([c[0][0] * w[0] + c[1][0] * w[1] + c[2][0] * w[2],
                             c[0][1] * w[0] + c[1][1] * w[1] + c[2][1] * w[2],
                             c[0][2] * w[0] + c[1][2] * w[1] + c[2][2] * w[2]]), S));
  }
  return pts;
}
function layoutFinds(S) {
  FIND_BINS = []; FIND_LABELS = [];
  var focus = focusCell();
  var list = findsIn(focus);
  if (!list.length) return;
  var nrm = qApply(view.q, faceNormal(focus.f));
  if (dot(nrm, sub([0, 0, CAM_D], toView(worldOf(focus.f, [1 / 3, 1 / 3, 1 / 3])))) <= 0) return;

  (function walk(cell, items, d) {
    var pts = cellScreen(cell, S);
    var x0 = Math.min(pts[0][0], pts[1][0], pts[2][0]), x1 = Math.max(pts[0][0], pts[1][0], pts[2][0]);
    var y0 = Math.min(pts[0][1], pts[1][1], pts[2][1]), y1 = Math.max(pts[0][1], pts[1][1], pts[2][1]);
    if (x1 < -40 || x0 > W + 40 || y1 < -40 || y0 > H + 40) return;
    var span = Math.max(x1 - x0, y1 - y0);
    var cx = (pts[0][0] + pts[1][0] + pts[2][0]) / 3, cy = (pts[0][1] + pts[1][1] + pts[2][1]) / 3;
    if (items.length <= FIND_NAME_MAX && span >= FIND_NAME_PX) {
      for (var i = 0; i < items.length; i++) {
        var f = faceOf(items[i].v);
        var sp = project(toView(worldOf(f, baryOf(f, items[i].v))), S);
        FIND_LABELS.push({ x: sp[0], y: sp[1], item: items[i], show: false });
      }
      return;
    }
    if (d >= FIND_MAX_DIVE || span < FIND_MIN_PX) {
      FIND_BINS.push({ x: cx, y: cy, span: span, cell: cell, items: items });
      return;
    }
    var bins = [[], [], [], []];
    for (var j = 0; j < items.length; j++) bins[items[j].path[cell.depth]].push(items[j]);
    for (var k = 0; k < 4; k++) {
      if (bins[k].length) walk(makeCell(cell.f, cell.path.concat([k])), bins[k], d + 1);
    }
  })(focus, list, 0);
  placeLabels();
}

// A label that overlaps another label is worse than no label: it makes both
// unreadable and buries the ground under them. So they are packed as real
// rectangles, shortest first — a short name costs little room and earns its
// place — and a name that will not fit is simply not drawn. Its dot stays,
// and the dot is what says the thing is there.
var FIND_LABEL_MAX = 14, FIND_TITLE_MAX = 26;
function shortTitle(t) {
  return t.length > FIND_TITLE_MAX ? t.slice(0, FIND_TITLE_MAX - 1).replace(/[\s,.\-]+$/, '') + '…' : t;
}
function placeLabels() {
  if (!FIND_LABELS.length) return;
  ctx.font = '700 8px ui-monospace,monospace';
  var cand = FIND_LABELS.slice();
  for (var i = 0; i < cand.length; i++) {
    cand[i].text = shortTitle(cand[i].item.title);
    cand[i].w = ctx.measureText(cand[i].text).width + 18;   // dot, gaps, border
  }
  cand.sort(function (a, b) { return a.w - b.w; });
  // the counts were placed first and mean more than any one name, so they
  // are reserved before a single label is allowed anywhere
  var taken = [], shown = 0;
  for (var q = 0; q < FIND_BINS.length; q++) {
    var B = FIND_BINS[q];
    var r = B.items.length > 1 ? clamp(Math.round(B.span * 0.30), 10, 26) * 0.75 : 7;
    taken.push([B.x - r, B.y - r, B.x + r, B.y + r]);
  }
  for (var j = 0; j < cand.length && shown < FIND_LABEL_MAX; j++) {
    var L = cand[j];
    if (L.x < 4 || L.x > W - 4 || L.y < 8 || L.y > H - 8) continue;
    var flip = L.x > W - (L.w + 24);
    var x0 = flip ? L.x + 6.5 - L.w : L.x - 6.5, y0 = L.y - 7;
    var clash = false;
    for (var t = 0; t < taken.length; t++) {
      var r = taken[t];
      if (x0 < r[2] && x0 + L.w > r[0] && y0 < r[3] && y0 + 14 > r[1]) { clash = true; break; }
    }
    if (clash) continue;
    taken.push([x0, y0, x0 + L.w, y0 + 14]);
    L.show = true; L.flip = flip;
    shown++;
  }
}
// The count is not a badge pinned to the ground, it is what the ground says.
// So the triangle is tinted by how much it holds — density you read before
// you read anything — and the numeral is painted into it rather than sat in
// a box on top of it. Fifteen boxes look like a control panel; fifteen
// tinted triangles look like a map.
function drawFinds(S) {
  var most = 1;
  for (var q = 0; q < FIND_BINS.length; q++) most = Math.max(most, FIND_BINS[q].items.length);
  for (var i = 0; i < FIND_BINS.length; i++) {
    var b = FIND_BINS[i], n = b.items.length;
    // only a count gets a tinted triangle; a single find is a thing sitting
    // somewhere, not a region worth shading
    if (n > 1 && b.span > 16) {
      var a = 0.07 + 0.20 * (n / most);
      strokeCell(b.cell, S, 'rgba(168,70,42,.42)', 1, 'rgba(168,70,42,' + a.toFixed(3) + ')');
    }
    if (n === 1) {                     // one find is a thing, not a door
      ctx.beginPath(); ctx.arc(b.x, b.y, 5.5, 0, TAU);
      ctx.fillStyle = COL.ground; ctx.fill();
      ctx.strokeStyle = COL.signal; ctx.lineWidth = 1.4; ctx.stroke();
      ctx.beginPath(); ctx.arc(b.x, b.y, 2.2, 0, TAU);
      ctx.fillStyle = COL.signal; ctx.fill();
      hit(b.x, b.y, 6, 'find', { item: b.items[0] });
      continue;
    }
    var size = clamp(Math.round(b.span * 0.30), 10, 26);
    ctx.font = '700 ' + size + 'px ui-monospace,monospace';
    ctx.textAlign = 'center';
    var txt = String(n), ty = b.y + size * 0.35;
    ctx.lineWidth = 3.5; ctx.lineJoin = 'round';
    ctx.strokeStyle = COL.ground; ctx.strokeText(txt, b.x, ty);
    ctx.fillStyle = COL.signal; ctx.fillText(txt, b.x, ty);
    ctx.textAlign = 'left';
    hit(b.x, b.y, Math.max(15, size * 0.9), 'bin', { cell: b.cell, n: n });
  }
  // a named find keeps its dot even when its label could not be fitted, so a
  // place is never represented only by a label that got dropped
  for (var j = 0; j < FIND_LABELS.length; j++) {
    var L = FIND_LABELS[j];
    if (L.show) continue;              // its anchor carries the dot instead
    ctx.beginPath(); ctx.arc(L.x, L.y, 5, 0, TAU);
    ctx.fillStyle = COL.ground; ctx.fill();
    ctx.strokeStyle = COL.signal; ctx.lineWidth = 1.2; ctx.stroke();
    ctx.beginPath(); ctx.arc(L.x, L.y, 2, 0, TAU);
    ctx.fillStyle = COL.signal; ctx.fill();
    hit(L.x, L.y, 6, 'find', { item: L.item });
  }
}

// A named find is a place on the Earth, so it is drawn at that place and
// given a real anchor — openable in a new tab, copyable, long-pressable.
// Canvas text can do none of that, which is why the panel was never enough.
var linkPool = {}, elLinks = null;
function syncLinks(S) {
  if (!elLinks) elLinks = document.getElementById('links');
  var want = {};
  for (var i = 0; i < FIND_LABELS.length; i++) {
    if (FIND_LABELS[i].show) want[FIND_LABELS[i].item.pageid] = FIND_LABELS[i];
  }
  for (var id in linkPool) {
    if (!want[id]) { linkPool[id].remove(); delete linkPool[id]; }
  }
  for (var id2 in want) {
    var a = linkPool[id2];
    if (!a) {
      a = document.createElement('a');
      a.href = 'https://en.wikipedia.org/?curid=' + id2;
      a.target = '_blank';
      a.rel = 'noopener';
      a.innerHTML = '<i></i><span></span>';
      a.title = want[id2].item.title;
      (function (el) {
        el.onclick = function (ev) {
          if (ev.metaKey || ev.ctrlKey || ev.shiftKey) return;   // let the browser have it
          ev.preventDefault();
          openCard({ title: el.__it.title, kind: 'article', v: el.__it.v, url: el.href },
                   el.__x, el.__y);
          wake();
        };
      })(a);
      elLinks.appendChild(a);
      linkPool[id2] = a;
    }
    a.style.left = want[id2].x + 'px';
    a.style.top = want[id2].y + 'px';
    a.classList.toggle('flip', !!want[id2].flip);
    a.querySelector('span').textContent = want[id2].text;
    a.__it = want[id2].item;
    a.__x = want[id2].x; a.__y = want[id2].y;
  }
}

function drawSeams(S) {
  ctx.setLineDash([5, 4]);
  for (var i = 0; i < SEAMS.length; i++) {
    var s = SEAMS[i];
    var a = V[s.a], b = V[s.b];
    ctx.strokeStyle = COL.ink;
    ctx.lineWidth = 2;
    // the same cut runs along the lip of both faces it separates; in the
    // net those lips are far apart, and that distance is the artifact
    for (var e = 0; e < 2; e++) {
      var f = s.faces[e];
      ctx.beginPath();
      for (var t = 0; t <= 16; t++) {
        var p = norm(lerp3(a, b, t / 16));
        var sp = project(toView(worldOf(f, baryOf(f, p))), S);
        if (t === 0) ctx.moveTo(sp[0], sp[1]); else ctx.lineTo(sp[0], sp[1]);
      }
      ctx.stroke();
    }
  }
  ctx.setLineDash([]);
}

// rivers from the gazetteer, clipped to a face the first time that face is
// looked at, then kept. One face per frame so nothing stutters.
var riverBudget = 0;
function faceRiversOf(f) {
  if (!GAZ) return null;
  if (GAZ.faceRivers[f]) return GAZ.faceRivers[f];
  if (riverBudget > 0) return null;
  riverBudget++;
  var out = [], R = GAZ.rivers;
  for (var r = 0; r < R.name.length; r++) {
    for (var l = R.idx[r][0]; l < R.idx[r][1]; l++) {
      var pts = densify(R.lines[l], 0.9);
      var parts = clipLineToFace(pts, f);
      for (var m = 0; m < parts.length; m++) out.push({ w: toFaceWeights(f, parts[m]), river: r });
    }
  }
  GAZ.faceRivers[f] = out;
  return out;
}
function drawGazRivers(f, S, span) {
  if (!GAZ || view.zoom < 2.6) return;
  if (span < Math.min(W, H) * 0.55) return;
  var rs = faceRiversOf(f);
  if (!rs) return;
  // one path, one stroke. A few hundred separate strokes is most of a frame.
  ctx.strokeStyle = COL.water;
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (var i = 0; i < rs.length; i++) {
    var sp = weightsToScreen(f, rs[i].w, S);
    ctx.moveTo(sp[0], sp[1]);
    for (var k = 2; k < sp.length; k += 2) ctx.lineTo(sp[k], sp[k + 1]);
  }
  ctx.stroke();
}

// Labels have to thin themselves out or the deep view is a wall of type.
// everything painted on the map records where it landed, so the map can be
// asked what is under a finger instead of only which triangle
var HITS = [];
function hit(x, y, r, kind, payload) { HITS.push({ x: x, y: y, r: r, kind: kind, p: payload }); }
function hitAt(x, y) {
  var best = null, bd = 26 * 26;
  for (var i = 0; i < HITS.length; i++) {
    var h = HITS[i], dx = h.x - x, dy = h.y - y, d = dx * dx + dy * dy;
    if (d < bd) { bd = d; best = h; }
  }
  return best;
}

var labelGrid = {};
function claimLabel(x, y) {
  var k = ((x / 74) | 0) + ',' + ((y / 15) | 0);
  if (labelGrid[k]) return false;
  labelGrid[k] = 1;
  return true;
}
function markPoint(set, i, label, size, weight, kind) {
  var f = set.face[i];
  var vv = toView(worldOf(f, [set.bary[i * 3], set.bary[i * 3 + 1], set.bary[i * 3 + 2]]));
  if (dot(qApply(view.q, faceNormal(f)), sub([0, 0, CAM_D], vv)) <= 0) return false;
  var sp = project(vv, S_NOW);
  if (sp[0] < -50 || sp[0] > W + 50 || sp[1] < -20 || sp[1] > H + 20) return false;
  ctx.fillStyle = COL.ink;
  ctx.beginPath();
  ctx.arc(sp[0], sp[1], size, 0, TAU);
  ctx.fill();
  if (kind) hit(sp[0], sp[1], size, kind, { set: set, i: i });
  if (label && claimLabel(sp[0], sp[1])) {
    ctx.font = weight + 'px ui-monospace,monospace';
    ctx.textAlign = 'left';
    ctx.fillStyle = COL.muted;
    ctx.fillText(label, sp[0] + size + 2.5, sp[1] + 2.6);
  }
  return true;
}

// The whole point: descending must reveal, not empty out. The threshold on
// what counts as worth naming falls as the ground gets smaller, so a cell
// that held three capitals at continental scale holds villages at block.
var S_NOW = 1;
function drawGround(S) {
  S_NOW = S;
  labelGrid = {};
  HITS = [];
  if (!GAZ) { drawCities(S); return; }
  var z = view.zoom;
  var minPop = Math.pow(10, clamp(7.0 - z * 0.92, -1, 7.2));
  var drawn = 0;
  // named ground and named water first, so settlements sit on top of them
  if (z < 3.4) {
    ctx.font = '700 8px ui-monospace,monospace';
    for (var r = 0; r < GAZ.regions.n && drawn < 600; r++) {
      if (markPoint(GAZ.regions, r, GAZ.regions.name[r].toUpperCase(), 0.8, '700 8', 'region')) drawn++;
    }
    for (var m = 0; m < GAZ.marine.n && drawn < 900; m++) {
      if (markPoint(GAZ.marine, m, GAZ.marine.name[m].toUpperCase(), 0.8, '8', 'water')) drawn++;
    }
  }
  for (var i = 0; i < GAZ.places.n && drawn < 1400; i++) {
    if (GAZ.places.pop[i] < minPop) continue;
    if (markPoint(GAZ.places, i, GAZ.places.name[i].toUpperCase(), 2.4, '8', 'place')) drawn++;
  }
  if (z > 3.2) {
    for (var a = 0; a < GAZ.airports.n && drawn < 1700; a++) {
      if (markPoint(GAZ.airports, a, '✈ ' + GAZ.airports.name[a].toUpperCase(), 1.8, '7', 'airport')) drawn++;
    }
    for (var o = 0; o < GAZ.ports.n && drawn < 1900; o++) {
      if (markPoint(GAZ.ports, o, '⚓ ' + GAZ.ports.name[o].toUpperCase(), 1.8, '7', 'port')) drawn++;
    }
  }
}

function drawCities(S) {
  var minPop = Math.pow(10, clamp(7.2 - view.zoom * 0.62, 4.0, 7.2));
  var drawn = 0;
  for (var n in PLACES) {
    var pl = PLACES[n];
    if (pl.pop < minPop && !(pl.src === 'fixture' && view.zoom > 0.9)) continue;
    if (drawn > 120) break;
    var f = faceOf(pl.v);
    var wpt = worldOf(f, baryOf(f, pl.v));
    var vv = toView(wpt);
    var nrm = qApply(view.q, faceNormal(f));
    if (dot(nrm, sub([0, 0, CAM_D], vv)) <= 0) continue;
    var s = project(vv, S);
    if (s[0] < -60 || s[0] > W + 60 || s[1] < -30 || s[1] > H + 30) continue;
    drawn++;
    ctx.fillStyle = COL.ink;
    ctx.beginPath();
    ctx.arc(s[0], s[1], 1.9, 0, TAU);
    ctx.fill();
    if (view.zoom > 1.4 || pl.pop > 1.4e7) {
      ctx.font = '8px ui-monospace,monospace';
      ctx.textAlign = 'left';
      ctx.fillStyle = COL.muted;
      ctx.fillText(pl.name.toUpperCase(), s[0] + 4.5, s[1] + 2.6);
    }
  }
}

// A convening is drawn on the ground it is about. The room at work pulses
// at its topic's point — one look at the map says who is speaking — and a
// claim that passes the gate travels its seat's strut into the other room
// as a small signal, which is Beer's reverberation made visible.
function drawConvening(S) {
  if (!CONVENE_VIS) return;
  var pts = CONVENE_VIS.pts, now = performance.now();
  function screenOf(p) {
    var f = faceOf(p);
    var vv = toView(worldOf(f, baryOf(f, p)));
    if (dot(qApply(view.q, faceNormal(f)), sub([0, 0, CAM_D], vv)) <= 0) return null;
    return project(vv, S);
  }
  // the active room breathes
  if (CONVENE_VIS.topic >= 0 && pts[CONVENE_VIS.topic]) {
    var sp = screenOf(pts[CONVENE_VIS.topic]);
    if (sp) {
      var ph = (now % 1400) / 1400;
      ctx.beginPath(); ctx.arc(sp[0], sp[1], 9 + 13 * ph, 0, TAU);
      ctx.strokeStyle = 'rgba(168,70,42,' + (0.75 * (1 - ph)).toFixed(3) + ')';
      ctx.lineWidth = 2.2; ctx.stroke();
      if (CONVENE_VIS.stage === 'judge') {          // the gate reads differently
        ctx.setLineDash([3, 4]);
        ctx.beginPath(); ctx.arc(sp[0], sp[1], 14, 0, TAU);
        ctx.strokeStyle = COL.ink; ctx.lineWidth = 1.4; ctx.stroke();
        ctx.setLineDash([]);
      }
    }
  } else if (CONVENE_VIS.stage === 'charter' || CONVENE_VIS.stage === 'outcome') {
    // the whole ground is being written about; the pulse sits on the cell
    var cc = councilCell && cellSlug(councilCell) === CONVENE_VIS.slug
      ? cellCentre(councilCell) : null;
    if (cc) {
      var sc2 = screenOf(cc);
      if (sc2) {
        var ph2 = (now % 1800) / 1800;
        ctx.beginPath(); ctx.arc(sc2[0], sc2[1], 12 + 20 * ph2, 0, TAU);
        ctx.strokeStyle = 'rgba(18,21,20,' + (0.5 * (1 - ph2)).toFixed(3) + ')';
        ctx.lineWidth = 1.6; ctx.stroke();
      }
    }
  }
  // signals in flight along the struts
  var keep = [];
  for (var i = 0; i < CONVENE_VIS.anims.length; i++) {
    var a = CONVENE_VIS.anims[i];
    var p = (now - a.t0) / a.dur;
    if (p < 1) keep.push(a);
    if (p <= 0 || p >= 1) continue;
    var e = p * p * (3 - 2 * p);                    // ease, so it leaves and lands
    var from = pts[a.from], to = pts[a.to];
    if (!from || !to) continue;
    var pos = screenOf(norm(lerp3(from, to, e)));
    if (!pos) continue;
    var tr = screenOf(norm(lerp3(from, to, Math.max(0, e - 0.07))));
    if (tr) {
      ctx.beginPath(); ctx.moveTo(tr[0], tr[1]); ctx.lineTo(pos[0], pos[1]);
      ctx.strokeStyle = 'rgba(168,70,42,.45)'; ctx.lineWidth = 2.6; ctx.stroke();
    }
    ctx.beginPath(); ctx.arc(pos[0], pos[1], 3.6, 0, TAU);
    ctx.fillStyle = COL.signal; ctx.fill();
    ctx.beginPath(); ctx.arc(pos[0], pos[1], 6.2, 0, TAU);
    ctx.strokeStyle = 'rgba(168,70,42,.5)'; ctx.lineWidth = 1.2; ctx.stroke();
  }
  CONVENE_VIS.anims = keep;
  wake();                                           // the show runs until the run ends
}
function drawNorth(S) {
  var np = [0, 0, 1];
  var f = faceOf(np);
  var wpt = worldOf(f, baryOf(f, np));
  var vv = toView(wpt);
  var nrm = qApply(view.q, faceNormal(f));
  if (dot(nrm, sub([0, 0, CAM_D], vv)) <= 0) return;
  var s = project(vv, S);
  ctx.strokeStyle = COL.ink; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(s[0] - 5, s[1]); ctx.lineTo(s[0] + 5, s[1]);
  ctx.moveTo(s[0], s[1] - 5); ctx.lineTo(s[0], s[1] + 5); ctx.stroke();
  ctx.font = '700 9px ui-monospace,monospace';
  ctx.textAlign = 'left'; ctx.fillStyle = COL.ink;
  ctx.fillText('N', s[0] + 7, s[1] + 3);
}

function render() {
  var S = pxScale();
  ctx.fillStyle = COL.ground;
  ctx.fillRect(0, 0, W, H);

  var order = [];
  for (var f = 0; f < NF; f++) {
    var vis = faceVisible(f, S);
    if (vis) order.push({ f: f, z: vis.z, vis: vis });
  }
  order.sort(function (a, b) { return a.z - b.z; });
  setFoldable(order.length > 1);

  var stopPx = Math.min(W, H) * 0.34;
  var focus = focusCell();

  drawRelations(S, 'back');

  for (var i = 0; i < order.length; i++) {
    var f2 = order[i].f, vis2 = order[i].vis;
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(vis2.pa[0], vis2.pa[1]);
    ctx.lineTo(vis2.pb[0], vis2.pb[1]);
    ctx.lineTo(vis2.pd[0], vis2.pd[1]);
    ctx.closePath();
    ctx.fillStyle = COL.sea;
    ctx.fill();
    ctx.clip();
    var spanF = Math.max(
      Math.max(vis2.pa[0], vis2.pb[0], vis2.pd[0]) - Math.min(vis2.pa[0], vis2.pb[0], vis2.pd[0]),
      Math.max(vis2.pa[1], vis2.pb[1], vis2.pd[1]) - Math.min(vis2.pa[1], vis2.pb[1], vis2.pd[1]));
    needDetail(f2, spanF);
    drawFaceSurface(f2, S);
    drawGazRivers(f2, S, spanF);
    var budget = { n: 0 };
    drawGrid(f2, ROOT_TRI, 0, S, stopPx, budget);
    ctx.restore();
    // the face's own edge — the first structure, always legible
    ctx.beginPath();
    ctx.moveTo(vis2.pa[0], vis2.pa[1]);
    ctx.lineTo(vis2.pb[0], vis2.pb[1]);
    ctx.lineTo(vis2.pd[0], vis2.pd[1]);
    ctx.closePath();
    ctx.strokeStyle = COL.ink;
    ctx.lineWidth = f2 === focus.f ? 2.2 : 1.2;
    ctx.stroke();
  }

  // ancestry: what contains this. Never lost. (Invariant 7)
  for (var d = 0; d < focus.depth; d++) {
    var anc = makeCell(focus.f, focus.path.slice(0, d));
    var alpha = 0.16 + 0.5 * (d / Math.max(1, focus.depth));
    strokeCell(anc, S, 'rgba(18,21,20,' + alpha.toFixed(2) + ')', 1.4);
  }
  strokeCell(focus, S, COL.ink, 2.4);

  if (traceCells) {
    for (var t = 0; t < traceCells.length; t++) {
      strokeCell(traceCells[t], S, COL.signal, 1.6, 'rgba(168,70,42,.13)');
    }
  }
  for (var slug in brush) {
    var pc = cellFromSlug(slug);
    if (pc) strokeCell(pc, S, 'rgba(168,70,42,.75)', 1.6, 'rgba(168,70,42,.22)');
  }
  for (var an in DB.areas) {
    if (an === DB.openArea) continue;
    for (var q2 = 0; q2 < DB.areas[an].length; q2++) {
      var ac = cellFromSlug(DB.areas[an][q2]);
      if (ac) strokeCell(ac, S, 'rgba(18,21,20,.45)', 1.2, 'rgba(18,21,20,.07)');
    }
  }
  if (selection) {
    strokeCell(selection, S, COL.signal, 2.6, 'rgba(168,70,42,.10)');
    var nb = neighbours(selection);
    for (var q = 0; q < nb.length; q++) strokeCell(nb[q], S, 'rgba(168,70,42,.55)', 1.2);
  }
  if (pressing) drawSeams(S);

  riverBudget = 0;
  drawCouncil(S);
  drawConvening(S);
  drawSaid(S);
  drawGround(S);
  layoutFinds(S);
  drawFinds(S);
  syncLinks(S);
  trackCard(S);
  drawRelations(S, 'front');
  drawNorth(S);

  if (anchor) {
    var f3 = faceOf(anchor.p);
    var av3 = toView(worldOf(f3, baryOf(f3, anchor.p)));
    if (dot(qApply(view.q, faceNormal(f3)), sub([0, 0, CAM_D], av3)) > 0) {
    var sp = project(av3, S);
    ctx.strokeStyle = COL.signal; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(sp[0], sp[1], 9, 0, TAU); ctx.stroke();
    ctx.beginPath(); ctx.arc(sp[0], sp[1], 2.4, 0, TAU);
    ctx.fillStyle = COL.signal; ctx.fill();
    }
  }
}

 *  7 · READOUTS                                                         *
 * ==================================================================== */

var elCellId = document.getElementById('cellid');
var elCellExtent = document.getElementById('cellextent');
var elCellCouncil = document.getElementById('cellcouncil');
var elCellFound = document.getElementById('cellfound');
var elDrop = document.getElementById('mDrop');
elDrop.onclick = function () { dropOne(); syncDrop(); };
document.getElementById('cellplate').style.pointerEvents = 'auto';
document.getElementById('cellplate').style.cursor = 'pointer';
document.getElementById('cellplate').onclick = function () { openWhere(focusCell()); };
document.getElementById('wire').onclick = function (e) {
  e.stopPropagation(); WIRE.open = !WIRE.open; paintWire();
};
document.getElementById('wiretbl').onclick = function (e) { e.stopPropagation(); };
var elScaleName = document.getElementById('scalename');
var elFoldState = document.getElementById('foldstate');
var elLadder = document.getElementById('ladder');
var elChain = document.getElementById('chain');
// Which quarter of its parent a step took: three corners and the middle,
// drawn the way childTri actually cuts them. There are exactly four, so
// they are built once — the chain rebuilds on every cell change, and
// re-parsing SVG on a drag costs a fifth of the frame rate.
var QUARTER_GLYPH = [
  'M5.5 0.5 L8 5 L3 5 Z',                          // 0 · the corner at A
  'M8 5 L10.5 9.5 L5.5 9.5 Z',                     // 1 · the corner at B
  'M3 5 L5.5 9.5 L0.5 9.5 Z',                      // 2 · the corner at C
  'M3 5 L8 5 L5.5 9.5 Z'                           // 3 · the middle, point down
].map(function (fill, i) {
  return '<svg class="q" viewBox="0 0 11 10" aria-label="quarter ' + i + '">' +
    '<path d="M0.5 9.5 L5.5 0.5 L10.5 9.5 Z" fill="none" stroke="currentColor" stroke-width="1"/>' +
    '<path d="' + fill + '" fill="currentColor"/></svg>';
});
function quarterGlyph(i) { return QUARTER_GLYPH[i]; }
// one listener for the whole breadcrumb, bound once
elChain.addEventListener('click', function (ev) {
  var el = ev.target.closest ? ev.target.closest('[data-up]') : null;
  if (!el) return;
  var c = focusCell(), n = +el.getAttribute('data-up');
  if (n < 0) {
    view.centre = null; view.centreTarget = null; view.zoomTarget = fitZoom(view.fold);
    selection = null; hideActions(); wake(); return;
  }
  var to = makeCell(c.f, c.path.slice(0, n));
  selection = to; lookAt(cellCentre(to), to.depth); wake();
});
var elActs = document.getElementById('acts');
var elLegend = document.getElementById('reglegend');
var elPanel = document.getElementById('panel');

(function buildLadder() {
  var html = '';
  for (var i = 0; i < SCALES.length; i++) {
    html += '<div class="rung" data-i="' + i + '"><span>' + SCALES[i].n + '</span><i></i></div>';
  }
  elLadder.innerHTML = html;
})();

function setLegend(c) {
  if (!c) { elLegend.classList.remove('open'); elLegend.innerHTML = ''; return; }
  var used = {};
  for (var i = 0; i < c.seat.struts.length; i++) used[c.seat.struts[i].register] = 1;
  var html = '';
  for (var r = 0; r < DATA.council.registers.length; r++) {
    var id = DATA.council.registers[r].id;
    if (!used[id]) continue;
    html += '<div><i style="background:' + REGCOL[id] + '"></i>' + id + '</div>';
  }
  elLegend.innerHTML = html;
  elLegend.classList.add('open');
}

var lastHash = '', hashAt = 0;
function syncHash(c) {
  var slug = cellSlug(c);
  if (slug === lastHash) return;
  var now = performance.now();
  if (now - hashAt < 400) return;
  hashAt = now; lastHash = slug;
  try { history.replaceState(null, '', '#' + slug); } catch (e) { }
}

var lastCellKey = '';
function updateReadouts() {
  var c = focusCell();
  var km = cellEdgeKm(c);
  var si = scaleOf(km);
  elCellId.textContent = cellId(c);
  elCellExtent.textContent = kmLabel(km) + ' edge · depth ' + c.depth +
    (km < SOURCE_KM ? ' · past the source' : '');
  var council = councilFor(km);
  elCellCouncil.textContent = council
    ? 'council · ' + council.name + ' ' + council.stat.people + '/' + council.stat.topics
    : 'below the smallest solid';
  // A numeral painted on the ground does not say what it counts, and one
  // line in a plate that is already there beats a plate of its own.
  var nFound = (FIND_BINS.length || FIND_LABELS.length) ? findsIn(c).length : 0;
  elCellFound.style.display = nFound ? '' : 'none';
  if (nFound) {
    var counted = 0;
    for (var b = 0; b < FIND_BINS.length; b++) if (FIND_BINS[b].items.length > 1) counted++;
    elCellFound.textContent = nFound + ' found · ' +
      (counted ? 'tap a number to go in' : 'tap a mark to read');
  }
  elScaleName.textContent = SCALES[si].n;
  elFoldState.textContent = view.fold < 0.02 ? 'unfolded · net'
    : view.fold > 0.98 ? 'folded · icosahedron'
    : 'folding ' + Math.round(view.fold * 100) + '%';
  var rungs = elLadder.children;
  for (var i = 0; i < rungs.length; i++) {
    rungs[i].className = 'rung' + (i === si ? ' on' : Math.abs(i - si) === 1 ? ' near' : '');
  }
  syncDrop();
  syncHash(c);
  var key = cellId(c);
  if (key !== lastCellKey) {
    lastCellKey = key;
    // The breadcrumb was digits nobody could read and nobody could click.
    // A step down this address is a choice of one quarter out of four, so
    // each step is drawn as that quarter — and tapping it goes back to it.
    var html = '<span class="link" data-up="-1">WORLD</span>';
    html += '<span class="link sep">▸</span><span class="link' + (c.depth === 0 ? ' here' : '') +
      '" data-up="0">F' + (c.f < 10 ? '0' : '') + c.f + '</span>';
    var shown = c.path.length > 8 ? c.path.slice(c.path.length - 8) : c.path;
    var skipped = c.path.length - shown.length;
    if (skipped > 0) {
      html += '<span class="link sep">▸</span><span class="link" data-up="' + skipped +
        '">+' + skipped + '</span>';
    }
    for (var d = 0; d < shown.length; d++) {
      html += '<span class="link sep">▸</span><span class="link' +
        (d === shown.length - 1 ? ' here' : '') + '" data-up="' + (skipped + d + 1) + '">' +
        quarterGlyph(shown[d]) + '</span>';
    }
    elChain.innerHTML = html;
  }
}

/* --------------------------------------------------------- conditions
 * Operations exist only where they are possible. No permanent toolbar of
 * irrelevant verbs.                                                    */
function availableActions(cell) {
  var acts = [];
  acts.push({ k: 'where', t: 'WHERE', s: cellSlug(cell) });
  var said = notesOf(cellSlug(cell)).length;
  var arr = concernsArriving(cell).length;
  acts.push({ k: 'say', t: 'SAID',
    s: arr ? arr + ' climbed here' : said ? said + ' here' : 'say something' });
  if (cell.depth < MAX_DEPTH) acts.push({ k: 'enter', t: 'ENTER', s: 'four children' });
  if (cell.depth > 0) acts.push({ k: 'exit', t: 'EXIT', s: 'parent' });
  acts.push({ k: 'anchor', t: 'HOLD', s: 'make anchor' });
  var rels = relationsIn(cell);
  if (rels.length) acts.push({ k: 'pull', t: 'PULL', s: rels.length + ' relation' + (rels.length > 1 ? 's' : '') });
  var ph = phenomenaIn(cell);
