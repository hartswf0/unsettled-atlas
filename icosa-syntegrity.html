      var hit2 = pick(p.x, p.y);
      if (hit2) {
        var d = depthForZoom();
        var cell = cellAt(hit2.p, d);
        selection = cell;
        doAction('enter', cell);
      }
    } else {
      lastTap = now;
      tapTimer = setTimeout(function () {
        // TAP — the triangle becomes the interface
        var onMap = hitAt(p.x, p.y);
        // a number is a door and a dot is a thing: tap the count to go in,
        // tap the mark to read it
        if (onMap && !painting && onMap.kind === 'bin') {
          var bc = onMap.p.cell;
          closeCard();
          selection = bc; hideActions();
          lookAt(cellCentre(bc), bc.depth);
          wake();
          return;
        }
        if (onMap && !painting && onMap.kind === 'find') {
          if (cardFor && cardFor.title === onMap.p.item.title) { closeCard(); wake(); return; }
          openCard({ title: onMap.p.item.title, kind: 'article', v: onMap.p.item.v,
                     url: 'https://en.wikipedia.org/?curid=' + onMap.p.item.pageid },
                   onMap.x, onMap.y);
          wake();
          return;
        }
        if (onMap && !painting) {
          var set = onMap.p.set, ix = onMap.p.i;
          // tapping the mark you are already reading closes it
          if (cardFor && cardFor.title === set.name[ix]) { closeCard(); wake(); return; }
          openCard({
            title: set.name[ix], kind: onMap.kind, v: set.v[ix],
            where: onMap.kind === 'place'
              ? [GAZ.adm1[GAZ.places.a1[ix]], GAZ.adm0[GAZ.places.a0[ix]]].filter(Boolean).join(', ') : '',
            pop: onMap.kind === 'place' ? GAZ.places.pop[ix] : 0
          }, onMap.x, onMap.y);
          wake();
          return;
        }
        closeCard();
        var hit = pick(p.x, p.y);
        if (hit && painting) {
          var pk = cellSlug(cellAt(hit.p, depthForZoom()));
          if (brush[pk]) delete brush[pk]; else brush[pk] = 1;
          elPaint.textContent = 'PAINT ' + areaCells().length;
          wake();
          return;
        }
        if (hit) {
          // tapping the triangle you already have lets it go — the way out
          // is the same gesture as the way in
          var tc = cellAt(hit.p, depthForZoom());
          if (selection && cellSlug(selection) === cellSlug(tc)) {
            selection = null; hideActions();
          } else {
            selection = tc;
            showActions(selection, p.x, p.y);
          }
        } else { selection = null; hideActions(); }
        wake();
      }, 190);
    }
  }
  if (pointers.size === 0) gesture = null;
  else if (pointers.size === 1) {
    var only = [...pointers.values()][0];
    gesture = { mode: 'turn', x: only.x, y: only.y, x0: only.x, y0: only.y, t0: performance.now(), moved: 99 };
  }
  wake();
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);

// desktop equivalents — the phone is the constraint, not the only door
canvas.addEventListener('wheel', function (e) {
  e.preventDefault();
  if (e.shiftKey) {
    view.fold = clamp(view.fold - e.deltaY * 0.0016, 0, 1);
    view.foldTarget = view.fold;
  } else {
    view.zoom = clamp(view.zoom - e.deltaY * 0.0022, ZOOM_MIN, MAX_DEPTH - 1.5);
    view.zoomTarget = view.zoom;
  }
  wake();
}, { passive: false });

window.addEventListener('keydown', function (e) {
  var c = focusCell();
  if (e.key === 'f' && foldable) { elFold.onclick(); }
  else if (e.key === 'Enter' || e.key === '+') { doAction('enter', selection || c); }
  else if (e.key === 'Backspace' || e.key === '-') { if (c.depth) doAction('exit', selection || c); }
  else if (e.key === 'Escape') {
    // one press, one layer — the same order the DROP button peels, so the
    // key and the button are one model rather than two
    if (elPanel.classList.contains('open')) closePanel();
    else if (!dropOne()) hideActions();
    syncDrop();
  }
  else if (e.key === '?') { openHelp(); }
  wake();
});

/* ==================================================================== *
 *  10 · PANELS                                                          *
 * ==================================================================== */

function closePanel() { elPanel.classList.remove('open'); whereCell = null; reflow(); }
function reflow() {
  // the map lost or gained room; re-measure rather than let it stretch
  requestAnimationFrame(function () { resize(); wake(); });
}
// Which panel is showing. A fetch that finishes in the background must not
// redraw the council over a thread you have since opened — the guard used to
// be "is councilCell still set", which stays true after you have walked away.
var PANEL = '';
function panel(title, body) {
  hideActions();
  PANEL = '';                     // an opener claims it after this returns
  whereCell = null;               // only openWhere claims the follow
  var wasOpen = elPanel.classList.contains('open');
  elPanel.innerHTML = '<h2>' + title + '<button id="pclose">CLOSE</button></h2>' + body;
  elPanel.classList.add('open');
  elPanel.scrollTop = 0;
  // the map only lost or gained room if the panel just appeared; re-measuring
  // on every rebuild would resize the canvas as you pan
  if (!wasOpen) reflow();
  document.getElementById('pclose').onclick = closePanel;
}
function openRelations() {
  var rows = RELATIONS.map(function (r, i) {
    return '<div class="row' + (pulled === r ? ' on' : '') + '" data-r="' + i + '">' +
      '<b>' + r.a.toUpperCase() + ' ↔ ' + r.b.toUpperCase() + '</b>' +
      '<span>' + r.label + ' · ' + r.kind + ' · ' + r.km + ' km</span></div>';
  }).join('');
  panel('TENSION · WHAT HOLDS THIS IN RELATION',
    '<p>Surface geometry answers <b>where is it</b>. Relational geometry answers <b>what holds it in relation to everything else</b>. ' +
    'A tendon pulls and runs through the body of the world; a strut holds apart and stands off it. ' +
    'Turn TENSION on and the places drift toward what pulls them while the ground stays where it is — ' +
    'a distant place becoming structurally near.</p>' + rows +
    '<p style="margin-top:10px">Fixture: the five relations the theory names, and no others. ' +
    'Coordinates for Savannah, Washington, Ashburn and the Chattahoochee headwaters are declared here; ' +
    'the rest come from the source place set.</p>');
  elPanel.querySelectorAll('.row').forEach(function (row) {
    row.onclick = function () {
      var r = RELATIONS[+row.getAttribute('data-r')];
      pulled = pulled === r ? null : r;
      if (pulled) {
        view.relaxTarget = 1;
        var m = norm(add(pulled.pa.v, pulled.pb.v));
        lookAt(m, clamp(Math.round(Math.log2(ICO_EDGE_KM / Math.max(60, pulled.km * 0.5))), 0, 8));
      }
      openRelations();
      wake();
    };
  });
}
function openSeams() {
  var land = DATA.net.cutLand;
  var rows = SEAMS.map(function (s, i) {
    var a = lonlat(V[s.a]), b = lonlat(V[s.b]);
    return '<div class="row"><b>CUT ' + (i + 1) + '</b><span>' +
      a[1].toFixed(1) + '°, ' + a[0].toFixed(1) + '° → ' + b[1].toFixed(1) + '°, ' + b[0].toFixed(1) + '°</span></div>';
  }).join('');
  panel('PRESS · WHAT RESISTS',
    '<p>Every flat world map is held open by cuts. Nineteen of the thirty edges stay hinged; ' +
    '<b>eleven are cut</b>, and those eleven are the compression this map runs on. ' +
    'The compiler chose them by the only criterion that matters — cut where there is no land — ' +
    'leaving <b>' + land.toFixed(2) + '</b> edge-lengths of land crossed in total, out of eleven.</p>' +
    '<p>A seam is a projection artifact, not a geographical event. Crossing one changes nothing about the ground. ' +
    'Fold the world and the cuts close.</p>' + rows);
}
function openTrace() {
  var rows = PHENOMENA.map(function (ph, i) {
    return '<div class="row' + (traced === ph ? ' on' : '') + '" data-p="' + i + '"><b>' +
      ph.name.toUpperCase() + '</b><span>' + (traced === ph && traceCells ? traceCells.length + ' cells' : 'trace') + '</span></div>';
  }).join('');
  panel('TRACE · A PHENOMENON ACROSS TRIANGLES',
    '<p>A river does not consult a border. Following one reorganises the map around the phenomenon ' +
    'instead of around jurisdictions: the cells it passes through become the unit of attention, ' +
    'in the order the water takes them.</p>' + rows +
    (traced ? '<p style="margin-top:10px"><b>' + traced.name.toUpperCase() + '</b> currently crosses ' +
      (traceCells ? traceCells.length : 0) + ' cells at this scale. Descend and the count multiplies; ' +
      'the phenomenon does not.</p>' : ''));
  elPanel.querySelectorAll('.row').forEach(function (row) {
    row.onclick = function () {
      var ph = PHENOMENA[+row.getAttribute('data-p')];
      if (traced === ph) clearTrace(); else startTrace(ph);
      openTrace();
      wake();
    };
  });
}
function esc(t) {
  return String(t).replace(/[&<>"]/g, function (c) {
    return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c];
  });
}
function whenLabel(t) {
  var d = new Date(t), n = Date.now();
  var mins = Math.round((n - t) / 60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return mins + ' min ago';
  if (mins < 1440) return Math.round(mins / 60) + ' h ago';
  return d.toISOString().slice(0, 10);
}

// The thread on a triangle. This is the whole point: a thing said about a
// place, kept at that place, addressable by the same slug as the ground.
function openThread(cell, presetTopic) {
  var slug = cellSlug(cell);
  var notes = notesOf(slug).filter(function (n) { return n.kind !== 'second'; })
                           .sort(function (a, b) { return a.t - b.t; });
  var seatedHere = councilCell && cellSlug(councilCell) === slug && councilSeat &&
                   councilSeat.seating !== 'world' ? councilSeat : null;
  var topicOpts = '';
  if (seatedHere) {
    var lab = seatedHere.seat.labels;
    topicOpts = '<option value="">— the whole triangle —</option>';
    for (var i = 0; i < seatedHere.seat.barycentric.length; i++) {
      topicOpts += '<option value="' + i + '"' + (presetTopic === i ? ' selected' : '') + '>topic ' + i +
        (lab ? ' · ' + lab[i] : '') + '</option>';
    }
  }
  var said = notes.map(function (n) {
    var held = n.kind === 'concern' ? seconds(n) : 0;
    return '<div class="said' + (n.kind === 'sim' ? ' crit' : '') + '"><b>' +
      esc((n.who || 'someone').toUpperCase()) + '</b> ' +
      '<span>' + whenLabel(n.t) + (n.topic != null ? ' · topic ' + n.topic : '') +
      (n.kind === 'sim' ? ' · <b style="color:var(--signal)">rehearsal</b> — written by ' +
        esc(n.model || 'a model') + ', not by ' + esc(n.who || 'anyone') : '') +
      (n.kind === 'concern' ? ' · concern, answerable at ' + SCALES[n.answer].n.toLowerCase() +
        ' · ' + (held > 1 ? 'held by ' + held : 'raised by one') : '') +
      '</span><p>' + esc(n.text) + '</p>' +
      (n.kind === 'concern' && held < 2
        ? '<button class="go ghost" data-second="' + n.id + '" style="font-size:9px;padding:5px 9px;margin-top:5px">SECOND THIS</button>'
        : '') + '</div>';
  }).join('') || '<p style="opacity:.7">Nothing has been said about this triangle yet.</p>';

  // concerns that were raised below and belong at this scale
  var arriving = concernsArriving(cell);
  var below = concernsUnder(cell).length - notesOf(slug).filter(function (n) { return n.kind === 'concern'; }).length;
  var answerer = '';
  if (arriving.length && GAZ_STATE === 'ready') {
    var jinv = cellInventory(cell);
    answerer = jinv.countries.length
      ? ' Here that is <b>' + esc(jinv.countries.join(' and ')) + '</b>' +
        (jinv.admin1.length ? ', and below it ' + esc(jinv.admin1.slice(0, 3).join(', ')) : '') + '.'
      : ' No state claims this ground, so the climb ends without an addressee.';
  }
  var climbed = arriving.length ? '<p style="margin-top:14px"><b>' + arriving.length +
    '</b> concern' + (arriving.length === 1 ? ' raised below has' : 's raised below have') +
    ' climbed to this scale, because this is the scale at which something could answer.' +
    answerer + '</p>' +
    arriving.map(function (n) {
      var rc = cellFromSlug(n.cell);
      return '<div class="said"><b>' + esc((n.who || 'someone').toUpperCase()) + '</b> ' +
        '<span>from <a href="#' + n.cell + '" data-go="' + n.cell + '">' + n.cell + '</a>' +
        (rc ? ' · ' + kmLabel(cellEdgeKm(rc)) : '') + ' · ' +
        (seconds(n) > 1 ? 'held by ' + seconds(n) : 'raised by one') + '</span>' +
        '<p>' + esc(n.text) + '</p></div>';
    }).join('') : (below ? '<p style="margin-top:14px">' + below + ' concern' + (below === 1 ? '' : 's') +
      ' raised inside this triangle are answerable at other scales.</p>' : '');

  panel('SAID · ' + slug,
    '<p>' + areaLabel(cellAreaKm2(cell)) + ' of ground, centred ' + ll(cellCentre(cell)) +
    '. What is said here stays here — kept in this browser, keyed to the triangle, ' +
    'and it leaves as a file rather than to anyone\'s server.</p>' +
    said + climbed +
    '<p style="margin-top:14px">Add to it:</p>' +
    '<input id="sWho" placeholder="who are you" value="' + esc(DB.me) + '">' +
    (topicOpts ? '<select id="sTopic" style="width:100%;font:inherit;font-size:12px;padding:7px;border:1.5px solid var(--ink);background:var(--paper);margin:4px 0">' + topicOpts + '</select>' : '') +
    '<textarea id="sText" placeholder="what is true about this triangle"></textarea>' +
    '<div style="display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:center;margin:6px 0">' +
    '<label style="font-size:10px;letter-spacing:.1em"><input type="checkbox" id="sIsC" style="width:auto;margin-right:6px">A CONCERN</label>' +
    '<select id="sAns" style="font:inherit;font-size:12px;padding:6px;border:1.5px solid var(--ink);background:var(--paper)">' +
    SCALES.map(function (sc, i) {
      return '<option value="' + i + '"' + (i === scaleOf(cellEdgeKm(cell)) ? ' selected' : '') +
        '>answerable at ' + sc.n.toLowerCase() + '</option>';
    }).join('') + '</select></div>' +
    '<button class="go" id="sGo">SAY IT HERE</button> ' +
    '<button class="go ghost" id="sWhere">WHERE</button>');

  document.getElementById('sGo').onclick = function () {
    var who = document.getElementById('sWho').value.trim();
    var text = document.getElementById('sText').value.trim();
    if (!text) return;
    var tsel = document.getElementById('sTopic');
    DB.me = who;
    var isC = document.getElementById('sIsC').checked;
    DB.notes.push({
      id: 'n' + Date.now().toString(36) + Math.floor(Math.random() * 1e4).toString(36),
      cell: slug, topic: tsel && tsel.value !== '' ? +tsel.value : null,
      who: who || 'someone', text: text, t: Date.now(),
      kind: isC ? 'concern' : 'note',
      answer: isC ? +document.getElementById('sAns').value : null
    });
    commit();
    openThread(cell, tsel && tsel.value !== '' ? +tsel.value : undefined);
    wake();
  };
  document.getElementById('sWhere').onclick = function () { openWhere(cell); };
  elPanel.querySelectorAll('[data-second]').forEach(function (btn) {
    btn.onclick = function () {
      var who = (document.getElementById('sWho').value || DB.me || '').trim();
      if (!who) { document.getElementById('sWho').focus(); return; }
      DB.me = who;
      DB.notes.push({ id: 'n' + Date.now().toString(36) + Math.floor(Math.random() * 1e4).toString(36),
        cell: slug, topic: null, who: who, text: '', t: Date.now(),
        kind: 'second', second: btn.getAttribute('data-second') });
      commit(); openThread(cell); wake();
    };
  });
  elPanel.querySelectorAll('[data-go]').forEach(function (a) {
    a.onclick = function (ev) {
      ev.preventDefault();
      var c2 = cellFromSlug(a.getAttribute('data-go'));
      if (c2) { selection = c2; lookAt(cellCentre(c2), c2.depth); openThread(c2); }
    };
  });
}

// What is in here, and who a concern about it would be addressed to. This
// is the difference between a triangle and an outline.
function gazBlock(cell, km) {
  if (GAZ_STATE !== 'ready') {
    var inside = cellContents(cell);
    return '<p style="margin-top:12px">' + (GAZ_STATE === 'absent'
      ? 'The gazetteer did not load, so this falls back to the coarse source: '
      : 'The gazetteer is still loading. From the coarse source so far: ') +
      (inside.places.length || 'no') + ' named place' + (inside.places.length === 1 ? '' : 's') +
      (inside.rivers.length ? ', and the ' + inside.rivers.join(', ') : '') + '.</p>';
  }
  var inv = cellInventory(cell);
  var rows = '';
  if (inv.countries.length) {
    rows += '<div class="row"><b>GOVERNED BY</b><span>' + esc(inv.countries.join(' · ')) + '</span></div>';
  }
  if (inv.admin1.length) {
    rows += '<div class="row"><b>ADMINISTERED</b><span>' +
      esc(inv.admin1.slice(0, 6).join(' · ')) + (inv.admin1.length > 6 ? ' +' + (inv.admin1.length - 6) : '') +
      '</span></div>';
  }
  rows += '<div class="row"><b>SETTLEMENTS</b><span>' + inv.places.length +
    (inv.pop ? ' · ' + inv.pop.toLocaleString('en') + ' people at least' : '') + '</span></div>';
  if (inv.regions.length) rows += '<div class="row"><b>GROUND</b><span>' + esc(inv.regions.slice(0, 6).join(' · ')) + '</span></div>';
  if (inv.marine.length) rows += '<div class="row"><b>WATER</b><span>' + esc(inv.marine.slice(0, 6).join(' · ')) + '</span></div>';
  if (inv.rivers.length) rows += '<div class="row"><b>RIVERS</b><span>' + esc(inv.rivers.slice(0, 8).join(' · ')) + '</span></div>';
  if (inv.airports.length) rows += '<div class="row"><b>AIRPORTS</b><span>' + esc(inv.airports.slice(0, 6).join(' · ')) + '</span></div>';
  if (inv.ports.length) rows += '<div class="row"><b>PORTS</b><span>' + esc(inv.ports.slice(0, 6).join(' · ')) + '</span></div>';

  var top = inv.places.slice(0, 8).map(function (pl) {
    var where = [pl.a1, pl.a0].filter(Boolean).join(', ');
    return '<div class="row" data-at="' + pl.lon + ',' + pl.lat + '" data-name="' + esc(pl.name) +
      '" data-kind="place" data-where="' + esc(where) + '" data-pop="' + (pl.pop || 0) + '"><b>' +
      esc(pl.name.toUpperCase()) + '</b><span>' + esc(where) +
      (pl.pop ? ' · ' + pl.pop.toLocaleString('en') : '') + '</span></div>';
  }).join('');

  var empty = !inv.places.length && !inv.regions.length && !inv.marine.length &&
              !inv.rivers.length && !inv.airports.length && !inv.ports.length;
  return rows +
    (inv.countries.length
      ? '<p style="margin-top:12px">A concern about this ground is addressed to <b>' +
        esc(inv.countries.join(' and ')) + '</b>' +
        (inv.admin1.length ? ', and below that to ' + esc(inv.admin1.slice(0, 3).join(', ')) : '') + '.</p>'
      : '<p style="margin-top:12px">No state claims this triangle — it is water, or ice, or ' +
        'outside every boundary in the source. There is nobody to address.</p>') +
    (empty ? nearBlock(cell, km) : top + nearBlock(cell, km)) +
    lookupBlock(cell, km) + ladderBlock(cell);
}

// what the wider record says about this exact ground, fetched live
function lookupBlock(cell, km) {
  var slug = cellSlug(cell);
  var got = lookupOf(slug);
  var head = '<p style="margin-top:14px">The compiled gazetteer stops at about a village. ' +
    'Below that, this page can ask Wikipedia directly from your browser — no key, no account, ' +
    'nothing sent anywhere but the query itself.</p>';
  if (LOOKUP_STATE[slug] === 'busy') return head + '<p style="opacity:.7">Asking…</p>';
  if (!got) {
    return head + '<button class="go" id="wLook">LOOK UP THIS TRIANGLE</button>' +
      (LOOKUP_STATE[slug] === 'error'
        ? '<p style="margin-top:8px;color:var(--signal)">That did not reach Wikipedia. ' +
          'Either the network refused it or this page is being served somewhere that blocks it.</p>' : '');
  }
  var inside = got.items.filter(function (x) { return x.inside; });
  var near = got.items.filter(function (x) { return !x.inside; }).slice(0, 6);
  // the name is a real link to the article; the row takes you to the ground
  var link = function (x, tag) {
    return '<div class="row" data-at="' + x.lon + ',' + x.lat + '" data-name="' + esc(x.title) +
      '" data-kind="article" data-url="https://en.wikipedia.org/?curid=' + x.pageid +
      '"><b><a href="https://en.wikipedia.org/?curid=' + x.pageid +
      '" target="_blank" rel="noopener">' + esc(x.title) + '</a></b><span>' + tag + ' ▸</span></div>';
  };
  var found = head +
    '<p><b>' + inside.length + '</b> article' + (inside.length === 1 ? '' : 's') +
    ' fall inside this triangle' + (near.length ? ', ' + near.length + ' more just outside' : '') +
    '. Searched a ' + (got.radius / 1000).toFixed(1) + ' km radius from the centre' +
    (got.covered ? '' : ', which is smaller than the triangle — this is its middle, not all of it') +
    '. From ' + esc(got.source) + ', ' + whenLabel(got.t) + '.</p>';

  // A list of fifty names is the thing the map was trying not to be, and it
  // says nothing about where any of them are. They sort into the four
  // triangles that hold them, which is what the map draws, so this reads as
  // the legend to the ground rather than a second copy of it.
  var all = findsIn(cell);
  if (all.length > FIND_NAME_MAX + 1) {
    var bins = findBins(cell), rows = '';
    for (var k = 0; k < 4; k++) {
      var kid = makeCell(cell.f, cell.path.concat([k]));
      rows += '<div class="row"' + (bins[k].length ? ' data-go="' + cellSlug(kid) + '"' : '') +
        '><b style="font-weight:400' + (bins[k].length ? '' : ';opacity:.45') + '">' + cellSlug(kid) +
        '</b><span>' + (bins[k].length ? '<b>' + bins[k].length + '</b> here' : 'none') + '</span></div>';
    }
    found += '<p style="margin-top:12px">All <b>' + all.length + '</b> known here sort into the four ' +
      'triangles that hold them — the same numbers the map draws on the ground. Go into one and it ' +
      'divides again, until a triangle holds few enough to name them.</p>' + rows;
  } else {
    found += all.map(function (x) { return link(x, 'inside'); }).join('');
  }
  if (near.length) {
    found += '<p style="margin-top:12px">Just outside it:</p>' +
      near.map(function (x) {
        return link(x, (x.m >= 1000 ? (x.m / 1000).toFixed(1) + ' km' : x.m + ' m'));
      }).join('');
  }
  return found + '<button class="go ghost" id="wLook" style="margin-top:8px">LOOK AGAIN</button>';
}

// containment can come back empty; proximity and ancestry never do
function nearBlock(cell, km) {
  var near = cellNear(cell);
  if (!near) return '';
  var bits = [];
  function say(x) {
    if (!x || !x.name || !x.label) return;
    var at = x.v ? lonlat(x.v) : null;
    bits.push('<div class="row"' +
      (at ? ' data-at="' + at[0].toFixed(4) + ',' + at[1].toFixed(4) + '" data-name="' +
            esc(x.name) + '" data-kind="' + esc(x.label) + '"' : '') +
      '><b>' + x.label.toUpperCase() + '</b><span>' + esc(x.name) +
      ' · ' + kmLabel(x.km) + (x.dir ? ' ' + x.dir : '') + (at ? ' ▸' : '') + '</span></div>');
  }
  say(near.place); say(near.river); say(near.region);
  if (near.port && near.port.km < 400) say(near.port);
  if (near.air && near.air.km < 400) say(near.air);
  if (near.sea && near.sea.km < 900) say(near.sea);
  return '<p style="margin-top:12px">Nothing named may be inside it, but nothing is nowhere. ' +
    'The nearest things the gazetteer knows:</p>' + bits.join('');
}
// the ladder of containment, so a block reads as a block in a city in a
// delta in a country rather than as an unlabelled triangle
function ladderBlock(cell) {
  var rungs = cellLadder(cell);
  if (!rungs.length) return '';
  return '<p style="margin-top:12px">What contains it:</p>' +
    rungs.map(function (r) {
      return '<div class="row" data-go="' + r.slug + '"><b>' + r.scale + '</b><span>' +
        (r.head ? esc(r.head) + ' · ' : '') + r.slug + '</span></div>';
    }).join('');
}

// A model may draft a carry and may not post one. It is given only what is
// already in the source room and in the record, told to cite, and told that
// adding a fact is the one thing it must not do. A person edits and sends.
var SCHEMA_CARRY = {
  type: 'object', additionalProperties: false, required: ['carry', 'cites', 'carries_nothing'],
  properties: { carry: { type: 'string' },
                cites: { type: 'array', items: { type: 'string' } },
                carries_nothing: { type: 'boolean' } }
};
function draftCarry(cell, fromTopic, toTopic, cb) {
  if (!OPENAI_KEY) return cb('no key');
  var slug = cellSlug(cell);
  var src = notesOf(slug).filter(function (n) { return n.topic === fromTopic && n.text; });
  if (!src.length) return cb('nothing has been said in that room yet');
  var ctx = compileContext(cell, councilSeat && councilSeat.seat,
                           councilSeat && councilSeat.seating === 'world', 'DRAFT_CARRY');
  ctx.operation.from_room = fromTopic;
  ctx.operation.into_room = toTopic;
  ctx.operation.material = src.map(function (n) {
    return { id: n.id, who: n.who || 'someone', text: n.text }; });
  ctx.operation.may_infer = false;
  askOpenAI({
    instructions: LAW + '\n\nYou are carrying a claim from operation.from_room into ' +
      'operation.into_room. You may only restate what is in operation.material, and every ' +
      'sentence must end with the bracketed id of the note it came from. Adding a fact that is ' +
      'not in operation.material is the one thing you must not do — not context, not background, ' +
      'not a plausible detail, and nothing from the rest of this context either. The rest of the ' +
      'context is there so you know where you are, not so you can draw on it. ' +
      'operation.may_infer is false: for this call the LAW\'s licence to infer is revoked. ' +
      'List in cites the ids of the notes you restated. If the material does not support a ' +
      'carry, set carries_nothing true, leave carry empty and cites empty. Two sentences ' +
      'at most.',
    context: ctx, schema: SCHEMA_CARRY, schemaName: 'carry', maxOutputTokens: 900
  }, function (err, j) {
    if (err) return cb(err);
    if (!j || j.carries_nothing || !j.carry) return cb(null, 'nothing here carries');
    cb(null, String(j.carry).trim());
  });
}

function openCarry(cell, seatIdx) {
  var slug = cellSlug(cell), seat = councilSeat.seat;
  var st = seat.struts[seatIdx];
  var a = st.topics[0], b = st.topics[1];

  panel('CARRY · SEAT ' + seatIdx,
    '<p>You sit in room <b>' + a + '</b> and room <b>' + b + '</b>. Everything that moves between ' +
    'them moves because you move it, and it changes in the carrying — carrying faithfully is not ' +

    '<div class="row"><b>FROM</b><span>room ' + a + ' · ' + src.length + ' said</span></div>' +
    '<div class="row"><b>INTO</b><span>room ' + b + '</span></div>' +
    (src.length ? src.map(function (n) {
      return '<div class="said"><b>' + esc((n.who || 'someone').toUpperCase()) + '</b> <span>[' +
        n.id + ']</span><p>' + esc(n.text) + '</p></div>';
    }).join('') : '<p style="opacity:.7">Nothing has been said in room ' + a + ' yet.</p>') +
    '<input id="kWho" placeholder="who is carrying" value="' + esc(who) + '">' +
    '<textarea id="kText" placeholder="what of it survives the move"></textarea>' +
    '<button class="go" id="kGo">CARRY IT</button> ' +
    '<button class="go ghost" id="kSwap">CARRY THE OTHER WAY</button>' +
    '<p style="margin-top:14px;font-size:10px;letter-spacing:.08em;color:var(--muted)">' +
    'A model may draft this and may not send it. It gets only what is in room ' + a + ' and ' +
    'what the sources say about this ground, and it is told that adding a fact is the one thing ' +
    'it must not do. You edit it and you send it, or you write it yourself.</p>' +
    '<p style="color:var(--signal);font-size:10px;letter-spacing:.06em">The key is held for this ' +
    'browser tab only. It is never written to the record and never leaves in an export.</p>' +
    '<input id="kKey" type="password" placeholder="openai api key, this tab only" value="' +
      esc(OPENAI_KEY) + '">' +
    '<input id="kModel" placeholder="model, or blank for auto" value="' + esc(DB.model || '') + '">' +
    '<button class="go ghost" id="kDraft">DRAFT IT</button>' +
    '<div id="kMsg" style="font-size:10px;letter-spacing:.06em;color:var(--signal);margin-top:8px"></div>');
  document.getElementById('kSwap').onclick = function () {
    councilSeat.seat.struts[seatIdx] = { topics: [b, a], critiques: st.critiques, register: st.register };
    openCarry(cell, seatIdx);
  };
  document.getElementById('kGo').onclick = function () {
    var text = document.getElementById('kText').value.trim();
    if (!text) return;
    DB.me = document.getElementById('kWho').value.trim() || DB.me;
    DB.notes.push({ id: 'n' + Date.now().toString(36) + Math.floor(Math.random() * 1e4).toString(36),
      cell: slug, topic: b, from: a, seat: seatIdx, who: DB.me || 'someone',
      text: text, t: Date.now(), kind: 'carry' });
    commit(); openCouncil(cell, true); wake();
  };
  document.getElementById('kDraft').onclick = function () {
    setOpenAIKey(document.getElementById('kKey').value);
    DB.model = document.getElementById('kModel').value.trim() || 'auto';
    commit();
    var msg = document.getElementById('kMsg');
    msg.textContent = 'asking the model…';
    draftCarry(cell, a, b, function (err, txt) {
      if (err) { msg.textContent = err === 'no key' ? 'paste a key first' : err; return; }
      document.getElementById('kText').value = txt;
      msg.textContent = 'drafted — it is not sent until you send it';
    });
  };
}

/* -------------------------------------------------------------- the card
 * Opening a place used to mean a full sheet of list, or leaving the site
 * for Wikipedia. Both are wrong: the first buries the map on a phone — 1685
 * pixels of panel behind a 343 pixel window — and the second throws away
 * the context you were looking at.
 *
 * Wikipedia cannot be framed: en.wikipedia.org sends X-Frame-Options, so an
 * iframe renders blank. Its REST summary endpoint answers cross-origin
 * though, so the extract is fetched and drawn here, in our own type, beside
 * the dot. The link out stays for when you do want the whole article.     */
var elCard = null, cardFor = null, cardAt = null;
function closeCard() {
  if (elCard) elCard.classList.remove('open');
  cardFor = null; cardAt = null;
}
// Beside the mark, never on top of it — and "never" has to survive the
// clamp. Choosing a side and then clamping into the viewport was not the
// same thing as not covering the dot: a tall card on a low mark got pulled
// straight back over it, and then you could not tap the mark again either.
// So each candidate is clamped first and rejected if it lands on the mark,
// and if none survives the card is shortened rather than allowed to sit on
// the one thing it is about.
function placeCard(sx, sy) {
  var w, h;
  // Beside the mark the card is free of it whatever its height, so it gets
  // the whole column. Under or over, it gets the gap that is actually
  // there. Either way the number comes from the room and not from a
  // constant, because a constant is what put a scrollbar on a card with a
  // thousand pixels of empty map around it.
  function fit(px) {
    var next = Math.round(clamp(px, 64, 660)) + 'px';
    if (elCard.style.maxHeight !== next) elCard.style.maxHeight = next;
    w = elCard.offsetWidth || 260; h = elCard.offsetHeight || 180;
  }
  function put(x, y) {
    x = clamp(x, 8, Math.max(8, W - w - 8));
    y = clamp(y, 8, Math.max(8, H - h - 8));
    elCard.style.left = Math.round(x) + 'px';
    elCard.style.top = Math.round(y) + 'px';
    return sx < x - 3 || sx > x + w + 3 || sy < y - 3 || sy > y + h + 3;
  }
  fit(H - 16);
  if (put(sx + 16, sy - h / 2)) return;               // beside, right
  if (put(sx - w - 16, sy - h / 2)) return;           // beside, left
  var above = sy - 26, below = H - sy - 26;
  fit(below); if (put(sx - w / 2, sy + 18)) return;   // under
  fit(above); if (put(sx - w / 2, sy - h - 18)) return;  // over
  // Nowhere clears the mark at full height, so take the roomier side and
  // shorten to exactly that. Not to some comfortable minimum — a floor
  // larger than the room is how the card ended up back on the mark. Below
  // about 90 px of stage there is nowhere clear and the ✕ is the way out.
  fit(Math.max(above, below));
  put(sx - w / 2, below >= above ? sy + 18 : sy - h - 18);
}
// The card is about a point on the ground, so it belongs to the point and
// not to the screen. Pan and it follows; turn the point onto the far side of
// the world, or off the edge, and it goes away rather than lying about what
// it is next to.
function trackCard(S) {
  if (!cardFor || !elCard || !cardFor.v) return;
  var f = faceOf(cardFor.v);
  var vv = toView(worldOf(f, baryOf(f, cardFor.v)));
  if (dot(qApply(view.q, faceNormal(f)), sub([0, 0, CAM_D], vv)) <= 0) return closeCard();
  var sp = project(vv, S);
  if (sp[0] < -24 || sp[0] > W + 24 || sp[1] < -24 || sp[1] > H + 24) return closeCard();
  if (!cardAt || Math.abs(cardAt[0] - sp[0]) > 0.5 || Math.abs(cardAt[1] - sp[1]) > 0.5) {
    cardAt = sp; placeCard(sp[0], sp[1]);
  }
  // A leader from the mark to the card, so which dot is being read is not a
  // matter of inference. The anchor ring is already a signal circle of this
  // size, so the subject gets a filled disc on a cleared halo instead —
  // two different things must not look the same.
  var cx = clamp(sp[0], elCard.offsetLeft, elCard.offsetLeft + elCard.offsetWidth);
  var cy = clamp(sp[1], elCard.offsetTop, elCard.offsetTop + elCard.offsetHeight);
  ctx.beginPath(); ctx.moveTo(sp[0], sp[1]); ctx.lineTo(cx, cy);
  ctx.strokeStyle = COL.signal; ctx.lineWidth = 1.4; ctx.stroke();
  ctx.beginPath(); ctx.arc(sp[0], sp[1], 6.5, 0, TAU);
  ctx.fillStyle = COL.ground; ctx.fill();
  ctx.strokeStyle = COL.signal; ctx.lineWidth = 1.4; ctx.stroke();
  ctx.beginPath(); ctx.arc(sp[0], sp[1], 3.4, 0, TAU);
  ctx.fillStyle = COL.signal; ctx.fill();
}
function summaryOf(title, cb) {
  if (!DB.summaries) DB.summaries = {};
  if (DB.summaries[title]) return cb(null, DB.summaries[title]);
  var ctl = window.AbortController ? new AbortController() : null;
  var leash = ctl && setTimeout(function () { ctl.abort(); }, 8000);
  netStart('en.wikipedia.org', 'reading a summary');
  fetch('https://en.wikipedia.org/api/rest_v1/page/summary/' + encodeURIComponent(title),
        { credentials: 'omit', signal: ctl ? ctl.signal : undefined })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (j) {
      if (leash) clearTimeout(leash);
      netEnd('en.wikipedia.org');
      var got = { title: j.title, extract: j.extract || '', type: j.type || '',
                  thumb: j.thumbnail && j.thumbnail.source, url: j.content_urls &&
                  j.content_urls.desktop && j.content_urls.desktop.page };
      DB.summaries[title] = got; commit();
      cb(null, got);
    })
    .catch(function (e) {
      if (leash) clearTimeout(leash);
      netEnd('en.wikipedia.org', true);
      cb(String(e.message || e));
    });
}
/* The card should open already knowing its text. The summaries a reader is
 * most likely to ask for next — the open council's topics and the largest
 * settlements — are warmed quietly and spaced out, landing in the same
 * cache the card reads, so the tap that follows is answered from memory. */
var PREFETCHED = {};
function prefetchSummaries(titles, cap) {
  var want = [];
  titles.forEach(function (t) {
    if (t && !PREFETCHED[t] && !(DB.summaries || {})[t] && want.length < (cap || 8)) {
      PREFETCHED[t] = 1; want.push(t);
    }
  });
  want.forEach(function (t, i) {
    setTimeout(function () { summaryOf(t, function () {}); }, 300 * i);
  });
}
function openCard(o, sx, sy) {
  if (!elCard) elCard = document.getElementById('card');
  cardFor = o;
  // when the card is opened by a jump, the zoom is still on its way, so the
  // caller says what depth it is taking us to rather than the card reading a
  // scale we have already left
  var cell = cellAt(o.v, typeof o.depth === 'number' ? o.depth : depthForZoom());
  var out = o.url || 'https://en.wikipedia.org/w/index.php?search=' + encodeURIComponent(o.title);
  var osm = 'https://www.openstreetmap.org/?mlat=' + lonlat(o.v)[1].toFixed(5) +
            '&mlon=' + lonlat(o.v)[0].toFixed(5) + '#map=15/' +
            lonlat(o.v)[1].toFixed(5) + '/' + lonlat(o.v)[0].toFixed(5);
  elCard.innerHTML =
    '<div class="top"><div><b>' + esc(o.title) + '</b><em>' + esc(o.kind) +
      (o.where ? ' · ' + esc(o.where) : '') + '</em></div><button class="x" id="cX">✕</button></div>' +
    '<div class="body" id="cBody"><p style="opacity:.6">reading…</p>' +
    (o.pop ? '<div class="fact"><b>PEOPLE</b><span>' + o.pop.toLocaleString('en') + '</span></div>' : '') +
    '<div class="fact"><b>AT</b><span>' + ll(o.v) + '</span></div>' +
    '<div class="fact" id="cCell"><b>TRIANGLE</b><span>' + cellSlug(cell) + ' · ' +
      kmLabel(cellEdgeKm(cell)) + '</span></div>' +
    '<a class="go sig" href="' + out + '" target="_blank" rel="noopener">READ IT</a>' +
    '<a class="go" href="' + osm + '" target="_blank" rel="noopener">THE GROUND</a>' +
    '<button class="go" id="cSay">SAY HERE</button></div>';
  elCard.classList.add('open');
  cardAt = null;
  placeCard(sx, sy);
  document.getElementById('cX').onclick = closeCard;
  document.getElementById('cCell').style.cursor = 'pointer';
  document.getElementById('cCell').onclick = function () {
    closeCard(); selection = cell; lookAt(cellCentre(cell), cell.depth); wake();
  };
  document.getElementById('cSay').onclick = function () { closeCard(); openThread(cell); };
  summaryOf(o.title, function (err, got) {
    var body = document.getElementById('cBody');
    if (!body || cardFor !== o) return;
    var first = body.querySelector('p');
    if (err) { first.textContent = 'No summary reached — the network refused it, or there is no article by that name.'; return; }
    if (got.type === 'disambiguation') { first.textContent = 'That name belongs to several places. The link opens the list.'; return; }
    first.textContent = got.extract || 'The article has no summary.';
    if (got.thumb) {
      var img = document.createElement('img');
      img.src = got.thumb; img.alt = '';
      body.insertBefore(img, first);
    }
    cardAt = null;                 // the card grew; let the tracker re-seat it
    placeCard(sx, sy);
    wake();
  });
}

// what is under the finger, with links that are links

// A name in the panel that does not take you to the thing it names is just
// ink. Every row that stands for a place on the ground — a settlement, a
// nearest thing, a find, a council topic — moves the map to it, holds it,
// and reads it there.
function wireGoTo(cell) {
  elPanel.querySelectorAll('[data-at]').forEach(function (el) {
    el.style.cursor = 'pointer';
    el.onclick = function (ev) {
      if (ev.target.tagName === 'A') return;             // a real link stays a link
      var ll2 = el.getAttribute('data-at').split(',');
      var v = fromLonLat(parseFloat(ll2[0]), parseFloat(ll2[1]));
      var d = clamp(Math.max(cell.depth, depthForZoom()), 4, MAX_DEPTH);
      selection = cellAt(v, d);
      lookAt(v, d);
      closePanel();
      var st = document.getElementById('stage').getBoundingClientRect();
      openCard({ title: el.getAttribute('data-name') || '', kind: el.getAttribute('data-kind') || 'place',
                 v: v, depth: d, where: el.getAttribute('data-where') || '',
                 pop: parseInt(el.getAttribute('data-pop') || '0', 10),
                 url: el.getAttribute('data-url') || '' }, st.width / 2, st.height * 0.42);
      wake();
    };
  });
}
function openWhere(cell, keep) {

                elPanel.querySelector('details').open;

      ? '<div class="row" data-go="' + cellSlug(parent) + '"><b>INSIDE</b><span>' +

      : '<div class="row"><b>INSIDE</b><span>the Earth · one of twenty</span></div>') +
    // the measurements are still true and still here; they are just not the

      ' edge · ' + areaLabel(cellAreaKm2(cell)) + '</summary>' +
    '<div class="row"><b>SCALE</b><span>depth ' + cell.depth + ' · one of ' +

    '<div class="row"><b>CENTRE</b><span>' + ll(cellCentre(cell)) + '</span></div>' +

  elPanel.querySelectorAll('[data-go]').forEach(function (el) {
    el.style.cursor = 'pointer';
    el.onclick = function () {
      var c2 = cellFromSlug(el.getAttribute('data-go'));
      if (c2) { selection = c2; lookAt(cellCentre(c2), c2.depth); openWhere(c2); }
    };
  });
  wireGoTo(cell);
  var row = document.getElementById('wlink');
  if (row) row.onclick = function () {

    catch (e) { row.querySelector('span').textContent = 'select and copy'; }
  };
}

// Every topic is a real point on this ground. The record names what is

  panel('COUNCIL · ' + c.name.toUpperCase(),

    '<p style="margin-top:12px">No register lists who <b>lives</b> in a triangle this size. What ' +
    'the record can supply is who it connects to this ground, which is a different and smaller ' +
    'claim — so the filled bench is a reading of the sources, and the way it becomes a body is ' +

    '<div class="row" id="cInvite"><b style="word-break:break-all;font-weight:400">' +

  var ci = document.getElementById('cInvite');

function openHelp() {

  panel('ICOSA SYNTEGRITY',

    '<b>A seat is held by whoever types their name into it.</b> Nothing here invents a voice or ' +

    'the seat opposite yours, and it is a person too.</p>' +
    '<p>Descending reveals more, not less. The gazetteer carries 7,342 settlements, named ' +
    'regions and seas, airports, ports and rivers, and country outlines — so a triangle can say ' +
    'what is inside it and, more to the point, <b>who a concern about it would be addressed to</b>. ' +
    'It loads after the map, so the world appears first and then fills.</p>' +
    '<p>Say something and it stays on the triangle you said it about, drawn where you said it. ' +
    'The record lives in this browser and leaves as a file — there is no server and no account, ' +
    'so a conversation is something you carry rather than something you are lent.</p>' +
    '<p><b>Everything you do here sticks, and everything can be let go.</b> Tap the triangle you ' +
    'already have and it releases — the way out is the same gesture as the way in — and the same ' +
    'goes for a mark you are already reading. When the map is holding anything at all, a ' +
    '<b>DROP</b> button appears naming what it will let go of, most recent first, so you always ' +
    'know what you are about to lose. Painted work is last in that order, because it is the only ' +
    'thing here that somebody actually made.</p>' +
    '<div class="kbd">' +
    '<b>drag</b> turn the world · in the net, slide it<br>' +
    '<b>tap</b> the triangle becomes the interface · tap it again to let it go<br>' +
    '<b>double tap</b> enter<br>' +
    '<b>pinch</b> descend and ascend the scale<br>' +
    '<b>two-finger twist</b> fold toward the icosahedron, unfold toward the map<br>' +
    '<b>long press</b> hold a place as anchor<br>' +
    '<b>tap the address plate</b> corners, area, contents, link<br>' +
    '<b>DROP</b> let go of one thing at a time, most recent first<br>' +
    '<span style="opacity:.6">desktop: wheel = scale, shift+wheel = fold, enter/backspace = enter/exit, f = fold, esc = drop one</span><br>' +
    '<span style="opacity:.6">add <b>?verify</b> to the address to check the seven invariants against random points</span>' +
    '</div>' +
    '<p style="margin-top:12px">Now: <b>' + cellId(c) + '</b>, edge ' + kmLabel(cellEdgeKm(c)) +
    ', one of ' + (c.depth === 0 ? '20' : '20 × 4^' + c.depth) + ' cells at this depth. ' +
    'Depth is capped at ' + MAX_DEPTH + ' here — about ' + kmLabel(ICO_EDGE_KM / Math.pow(2, MAX_DEPTH)) +
    ' — which is a limit of this build, not of the structure.</p>' +
    '<p>The icosahedron\'s orientation and the eleven cuts are not transcribed from Fuller; ' +
    'they are solved from his criteria against coastline data — no vertex on land ' +
    '(closest is ' + DATA.ico.minClearanceKm + ' km offshore), cut where there is no land. ' +
    'Coastlines, lakes, rivers and places: Natural Earth 110m, public domain. ' +
    'Below the resolution of that source the triangles keep going and the coastline does not; ' +
    'what deep cells carry is their identity, their extent, their neighbours and their relations.</p>' +
    '<p style="margin-top:12px"><b>' + DB.notes.length + '</b> thing' + (DB.notes.length === 1 ? '' : 's') +
    ' said, across ' + Object.keys(noteCells()).length + ' triangle' +

    '<input type="file" id="hFile" accept="application/json" style="display:none">' +
    '<p style="opacity:.75;margin-top:12px">Unsettled Atlas · a synthetic place. Its instruments alter what they measure.</p>');
  document.getElementById('hOut').onclick = function () {
    // a record is meant to be handed to other people, so it leaves without a key
    var out = scrubKeys(JSON.parse(JSON.stringify(DB)));
    var blob = new Blob([JSON.stringify(out, null, 1)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'icosa-syntegrity-record.json';
    a.click();
  };
  document.getElementById('hIn').onclick = function () { document.getElementById('hFile').click(); };
  document.getElementById('hFile').onchange = function (ev) {
    var f = ev.target.files[0];
    if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      try {
        var got = JSON.parse(r.result);

        DB.notes.forEach(function (n) { have[n.id] = 1; });
        (got.notes || []).forEach(function (n) { if (!have[n.id]) DB.notes.push(n); });

        commit(); openHelp(); wake();
      } catch (e) { }
    };
    r.readAsText(f);
  };

var awake = 0;
function wake() { awake = performance.now(); }

function step() {
  var moving = false;
  var ease = 0.16;
  if (Math.abs(view.foldTarget - view.fold) > 0.0008) {
    view.fold += (view.foldTarget - view.fold) * ease; moving = true;
  } else view.fold = view.foldTarget;
  if (Math.abs(view.zoomTarget - view.zoom) > 0.0008) {
    view.zoom += (view.zoomTarget - view.zoom) * ease; moving = true;
  } else view.zoom = view.zoomTarget;
  if (Math.abs(view.relaxTarget - view.relax) > 0.0008) {
    view.relax += (view.relaxTarget - view.relax) * ease; moving = true;
  } else view.relax = view.relaxTarget;
  updateFold(view.fold);
  if (view.facing && view.centre) {
    // the correction is recomputed every frame, so a face that swings
    // while the world folds is followed rather than chased
    var nw = qApply(view.q, faceNormal(faceOf(view.centre)));
    var dq = qBetween(nw, [0, 0, 1]);
    if (Math.abs(dq[3]) < 0.999995) {
      view.q = qNorm(qMul(qSlerp(qId(), dq, ease * 1.3), view.q));
      moving = true;
    }
  }

  // hold the view target at the middle of the screen
  if (view.centreTarget) {
    view.centre = view.centre
      ? norm(lerp3(view.centre, view.centreTarget, ease * 1.2))
      : view.centreTarget;
    if (arcKm(view.centre, view.centreTarget) < 1) { view.centre = view.centreTarget; view.centreTarget = null; }
    else moving = true;
  }
  if (view.centre) {
    var f = faceOf(view.centre);
    var wp = qApply(view.q, worldOf(f, baryOf(f, view.centre)));
    // at world scale the object is held by its middle; once you are inside
    // it, the ground under the finger is what stays put
    var pin = clamp((view.zoom - fitZoom(view.fold)) / 1.5, 0, 1);
    VIEW_ORIGIN = [wp[0] * pin, wp[1] * pin, wp[2] * pin];
  } else {
    // free look: whatever is at the centre of the screen becomes the cell
    var hit = pick(W / 2, H / 2);
    if (hit) view.centre = hit.p;
  }
  return moving;
}

function frame() {
  var moving = step();
  render();
  drawMini();
  updateReadouts();
  followWhere(moving);
  requestAnimationFrame(frame);
}

 *  13 · VERIFICATION                                                    *
 *  The invariants are claims, so they are checkable. Load the page with *
 *  ?verify and they are checked, in the browser, against random points. *
 * ==================================================================== */

function verify() {
  var rnd = (function () { var a = 12345; return function () {
    a = (a * 1664525 + 1013904223) >>> 0; return a / 4294967296; }; })();
  function randPoint() {
    var z = rnd() * 2 - 1, t = rnd() * TAU, r = Math.sqrt(1 - z * z);

  }

    ok = ok && pass;

  }

  // 1 — exactly one face holds any given point
  var one = 0, other = 0;
  for (var i = 0; i < 4000; i++) {
    var q = randPoint(), hits = 0;
    for (var f = 0; f < NF; f++) {
      var r = baryRaw(f, q), sm = r[0] + r[1] + r[2];
      if (sm > 0 && Math.min(r[0], Math.min(r[1], r[2])) / sm >= -1e-12) hits++;
    }
    if (hits === 1) one++; else other++;
  }
  claim('INVARIANT', 1, 'one point, one face', other === 0, one + '/4000 points, ' + other + ' ambiguous');

  // 2 — subdivision never destroys the parent
  var held = 0, lost = 0, orphan = 0;
  for (var j = 0; j < 1200; j++) {
    var p2 = randPoint(), d = 1 + Math.floor(rnd() * 18);
    var c = cellAt(p2, d);
    if (cellContains(c, p2)) held++; else lost++;
    if (!cellContains(makeCell(c.f, c.path.slice(0, d - 1)), p2)) orphan++;
  }
  claim('INVARIANT', 2, 'the cell holds its point, and so does its parent',
    lost === 0 && orphan === 0, held + '/1200 to depth 18, ' + orphan + ' orphaned');

  // 3 & 4 — neighbours stay neighbours across scale and across seams,
  // and a seam crossing is a step rather than a jump
  var mutual = 0, broken = 0, shares = 0, worstGap = 0, edgeKm = 0;
  for (var k = 0; k < 900; k++) {
    var p3 = randPoint(), d3 = 1 + Math.floor(rnd() * 12);
    var c3 = cellAt(p3, d3), id = cellId(c3), cc = cellCorners(c3);
    var nb = neighbours(c3);
    for (var m = 0; m < nb.length; m++) {
      var n = nb[m];
      var back = neighbours(n).map(cellId);
      if (n.depth === d3 && back.indexOf(id) >= 0) mutual++; else broken++;
      var nc = cellCorners(n), sh = 0;
      for (var a = 0; a < 3; a++) for (var b = 0; b < 3; b++) {
        if (len(sub(cc[a], nc[b])) < 1e-7) sh++;
      }
      if (sh === 2) shares++;
      var gap = arcKm(cellCentre(c3), cellCentre(n)) / cellEdgeKm(c3);
      if (gap > worstGap) { worstGap = gap; edgeKm = cellEdgeKm(c3); }
    }

    broken === 0 && shares === mutual, mutual + ' relations, ' + broken + ' broken');
  claim('INVARIANT', 4, 'a seam is a step, not an event',
    worstGap < 0.8, 'widest neighbour gap ' + worstGap.toFixed(3) + ' of a cell edge');

  // the council rests on the same solid, so it answers the same way
  var fam = DATA.council.family;
  var ico = null, bigger = [];
  for (var f = 0; f < fam.length; f++) {
    if (fam[f].name === 'icosahedron') ico = fam[f];
    else if (fam[f].closure && ico && fam[f].people > ico.people) bigger.push(fam[f].name);
  }
  claim('COUNCIL', 1, 'a council cannot be scaled by subdividing the world',
    DATA.council.geodesic.every(function (g) { return g.degrees[5] === 12; }),
    'five-valent topics at frequency ' + DATA.council.geodesic.map(function (g) { return g.frequency; }).join('/') +
    ': ' + DATA.council.geodesic.map(function (g) { return g.degrees[5]; }).join(', ') + ' — twelve, forever');
  claim('COUNCIL', 2, 'the icosahedron is the closure ceiling',
    ico.closure && bigger.length === 0,
    ico.covered + ' topic pairs covered; nothing larger keeps closure');
  var seatOk = true, mixOk = true, detail = [];
  for (var name in SEATED) {
    var st = SEATED[name], r = st.registers, stat = null;
    for (var g2 = 0; g2 < fam.length; g2++) if (fam[g2].name === name) stat = fam[g2];
    for (var t2 = 0; t2 < st.struts.length; t2++) {
      var mine = st.struts[t2].register, opp = null;
      for (var q2 = 0; q2 < DATA.council.registers.length; q2++) {
        if (DATA.council.registers[q2].id === mine) opp = DATA.council.registers[q2].opposite;
      }
      var crit = st.struts[t2].critiques;
      var found = false;
      for (var u2 = 0; u2 < st.struts.length; u2++) {
        var o = st.struts[u2];
        if (o.topics[0] === crit[0] && o.topics[1] === crit[1] && o.register === opp) found = true;
      }
      if (!found) seatOk = false;
    }
    if (r.roomsFullyMixed !== stat.topics) mixOk = false;
    detail.push(name + ' ' + r.roomsFullyMixed + '/' + stat.topics);
  }
  claim('COUNCIL', 3, 'every seat is critiqued by its opposed register', seatOk,
    Object.keys(SEATED).length + ' solids seated');
  claim('COUNCIL', 4, 'no room is all one kind of description', mixOk,
    'rooms hearing a full mix: ' + detail.join(', '));

  var html = out.map(function (c) {
    return '<div class="row"><b>' + (c.pass ? '✓' : '✗') + ' ' + c.kind + ' ' + c.n + ' · ' +
      c.text + '</b><span>' + c.detail + '</span></div>';
  }).join('');
  panel('VERIFICATION',
    '<p>The invariants are claims about the structure, so they are checked here against ' +
    'random points on the sphere rather than asserted. The council claims are checked against ' +
    'the compiled solid. Reload without <b>?verify</b> to return ' +
    'to the world.</p>' + html +
    '<p style="margin-top:10px">' + (ok ? 'All invariants hold in this build.'
      : 'An invariant failed. The world is lying to you.') + '</p>');
  return ok;
}
