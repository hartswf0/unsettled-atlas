<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#efeadd">
<meta name="description" content="Common Ground: a living map woven by the people who move through a place.">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Common Ground · Living Mapmaker</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23efeadd'/%3E%3Cpath d='M4 20c6 0 6-10 12-10s6 10 12 10' fill='none' stroke='%23bf4526' stroke-width='2.4'/%3E%3Ccircle cx='16' cy='15' r='3.2' fill='none' stroke='%231d201d' stroke-width='1.6'/%3E%3C/svg%3E">
<style>
  :root{
    --paper:#efeadd;
    --paper-lit:#f6f2e8;
    --ink:#1d201d;
    --ink-soft:rgba(29,32,29,.55);
    --signal:#bf4526;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:var(--paper);color:var(--ink)}
  body{
    font-family:Georgia,"Times New Roman",serif;
    overscroll-behavior:none;
    touch-action:none;
    -webkit-user-select:none;user-select:none;
  }
  #stage{position:fixed;inset:0;touch-action:none}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  #hud{position:fixed;inset:0;pointer-events:none;z-index:5}

  .pip{
    position:absolute;pointer-events:auto;display:grid;place-items:center;
    background:var(--paper-lit);border-radius:50%;
    box-shadow:0 1px 0 rgba(29,32,29,.30),0 6px 18px rgba(29,32,29,.13);
    transition:transform .16s cubic-bezier(.2,.8,.3,1),opacity .22s ease;
    cursor:pointer;
  }
  .pip svg{display:block;overflow:visible}
  .pip:active{transform:scale(.94)}

  #thread{
    width:72px;height:72px;left:50%;transform:translateX(-50%);
    bottom:calc(22px + env(safe-area-inset-bottom));
  }
  #thread:active{transform:translateX(-50%) scale(.94)}
  #thread .ring{fill:none;stroke:var(--ink);stroke-width:1.4;opacity:.85}
  #thread.on .ring{stroke:var(--paper-lit);stroke-width:1.8;opacity:.9}
  #thread .glyph{fill:none;stroke:var(--ink);stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
  #thread .knob{fill:var(--ink);stroke:none}

  #people{width:46px;height:46px;right:calc(16px + env(safe-area-inset-right));bottom:calc(35px + env(safe-area-inset-bottom))}
  #back{
    width:46px;height:46px;left:calc(16px + env(safe-area-inset-left));bottom:calc(35px + env(safe-area-inset-bottom));
    opacity:0;pointer-events:none;
  }
  #back.show{opacity:1;pointer-events:auto}
  #undo{
    width:38px;height:38px;left:50%;
    bottom:calc(30px + env(safe-area-inset-bottom));
    transform:translateX(-92px);opacity:0;pointer-events:none;
  }
  #undo.show{opacity:1;pointer-events:auto}
  #undo:active{transform:translateX(-92px) scale(.92)}

  /* place-anchored word input */
  #say{
    position:absolute;display:none;pointer-events:auto;z-index:7;
    transform:translate(-2px,-50%);
  }
  #say input{
    font:italic 17px/1.2 Georgia,"Times New Roman",serif;
    color:var(--ink);background:transparent;border:0;border-bottom:1.5px solid var(--ink);
    outline:none;padding:2px 2px 4px;width:min(58vw,230px);caret-color:var(--signal);
  }
  #say input::placeholder{color:rgba(29,32,29,.32);font-style:italic}
  #mic{
    display:none;position:absolute;right:-30px;top:-2px;width:24px;height:24px;
    border-radius:50%;background:var(--paper-lit);box-shadow:0 1px 0 rgba(29,32,29,.3);
    place-items:center;cursor:pointer
  }
  #mic.on{background:var(--signal)}
  #mic.avail{display:grid}

  /* the ground key (share) */
  #key{
    position:fixed;inset:0;z-index:9;display:none;place-items:center;
    background:rgba(239,234,221,.90);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
    pointer-events:auto;
  }
  #key.show{display:grid}
  #keyInner{display:grid;justify-items:center;gap:16px;padding:24px;max-width:92vw}
  #qr{width:min(62vw,262px);height:min(62vw,262px);position:static;image-rendering:pixelated}
  #keyUrl{
    font:11px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.02em;
    color:var(--ink-soft);word-break:break-all;text-align:center;max-width:34ch;
  }
  #keyNote{font:italic 14px/1.4 Georgia,serif;color:var(--ink-soft);text-align:center;max-width:26ch}

  #attrib{
    position:fixed;left:50%;transform:translateX(-50%);
    bottom:calc(3px + env(safe-area-inset-bottom));
    font:9px/1 -apple-system,system-ui,sans-serif;letter-spacing:.06em;
    color:rgba(29,32,29,.30);pointer-events:none;z-index:6;white-space:nowrap;
  }
  @media (prefers-reduced-motion:reduce){.pip{transition:none}}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>
</div>

<div id="hud">
  <div id="say"><input id="sayIn" type="text" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="…"><div id="mic"><svg width="11" height="14" viewBox="0 0 11 14"><path d="M5.5 1.2a2 2 0 0 1 2 2v3.4a2 2 0 1 1-4 0V3.2a2 2 0 0 1 2-2Zm-4 5.6a4 4 0 0 0 8 0M5.5 10.8v2" fill="none" stroke="#1d201d" stroke-width="1.3" stroke-linecap="round"/></svg></div></div>

  <div class="pip" id="back" role="button" aria-label="Unweave">
    <svg width="24" height="24" viewBox="0 0 24 24">
      <path id="backGlyph" d="M17.5 12a5.5 5.5 0 1 1-2.6-4.67" fill="none" stroke="#1d201d" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M15.2 4.4 15.3 7.9 11.9 7.6" fill="none" stroke="#1d201d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>

  <div class="pip" id="undo" role="button" aria-label="Unpick last thread">
    <svg width="20" height="20" viewBox="0 0 24 24">
      <path d="M6.6 9.4H14a4.6 4.6 0 0 1 0 9.2h-3" fill="none" stroke="#1d201d" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M9.6 6 6.2 9.4l3.4 3.4" fill="none" stroke="#1d201d" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>

  <div class="pip" id="thread" role="button" aria-label="Leave a thread">
    <svg width="72" height="72" viewBox="0 0 72 72">
      <circle class="ring" cx="36" cy="36" r="27.5"/>
      <path class="glyph" id="threadGlyph" d="M21 44c5.5 0 5.5-16 11-16s5.5 16 11 16 5.5-16 8-16"/>
      <circle class="knob" id="threadKnob" cx="21" cy="44" r="2.6"/>
    </svg>
  </div>

  <div class="pip" id="people" role="button" aria-label="Who is on this ground">
    <svg width="30" height="30" viewBox="0 0 30 30" id="peopleGlyph"></svg>
  </div>
</div>

<div id="key"><div id="keyInner">
  <canvas id="qr"></canvas>
  <div id="keyUrl"></div>
  <div id="keyNote"></div>
</div></div>

<div id="attrib">© OpenStreetMap contributors · ODbL</div>

<script>
"use strict";
/* ============================================================
   COMMON GROUND · LIVING MAPMAKER
   A living map woven by the people who move through a place.
   Single file. No build. Nothing required to render.
   ============================================================ */

/* ---------- constants ---------- */
var TAU = Math.PI * 2;
var COLORS = [
  "#bf4526", /* vermillion */
  "#2f7d84", /* teal */
  "#3a5a8c", /* indigo */
  "#a8762a", /* ochre */
  "#6b5b95", /* violet */
  "#3f6b46", /* moss */
  "#9c3f6d", /* plum */
  "#2b6f9c"  /* lake */
];
var KNOT_CELL_Z = 20;              /* merc cell for knot merging (~19 m) */
var STROKE_MIN_PX = 7;             /* travel before a drag becomes a thread */
var HOLD_MS = 520;                 /* long-press to say something into place */

/* ---------- math / geo ---------- */
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function mercX(lng) { return (lng + 180) / 360; }
function mercY(lat) {
  var s = Math.sin(clamp(lat, -85.05, 85.05) * Math.PI / 180);
  return 0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI);
}
function unMercX(x) { return x * 360 - 180; }
function unMercY(y) { return 180 / Math.PI * Math.atan(Math.sinh(Math.PI * (1 - 2 * y))); }
function lerp(a, b, t) { return a + (b - a) * t; }
function easeOut(t) { return 1 - Math.pow(1 - t, 3); }

/* deterministic hash -> [0,1) ; used for ink wobble, never for geography */
function hash01(n) { var x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }

/* ---------- polyline decode (Google polyline, 1e5) ---------- */
function decodePolylines(str) {
  var out = [], i = 0, n = str.length;
  while (i < n) {
    var lat = 0, lng = 0, pts = [];
    while (i < n && str[i] !== "|") {
      var shift = 0, result = 0, b;
      do { b = str.charCodeAt(i++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
      lng += (result & 1) ? ~(result >> 1) : (result >> 1);
      shift = 0; result = 0;
      do { b = str.charCodeAt(i++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
      lat += (result & 1) ? ~(result >> 1) : (result >> 1);
      pts.push(mercX(lng / 1e5), mercY(lat / 1e5));
    }
    i++;
    if (pts.length >= 4) out.push(Float64Array.from(pts));
  }
  return out;
}

/* ---------- the ground (real geometry, always present) ---------- */
var GROUND = { bbox: [-84.55, 33.62, -84.2, 33.9], layers: {}, places: [] };
try {
  var gd = document.getElementById("ground-data").textContent;
  if (gd && gd.charAt(0) === "{") GROUND = JSON.parse(gd);
} catch (e) { /* ground stays empty; the paper still holds */ }

var INK = {};
for (var lk in GROUND.layers) { try { INK[lk] = decodePolylines(GROUND.layers[lk]); } catch (e) { INK[lk] = []; } }
var PLACES = (GROUND.places || []).map(function (p) {
  return { name: p[0], kind: p[1], x: mercX(p[2] / 1e5), y: mercY(p[3] / 1e5) };
});

/* ---------- identity ---------- */
function readLS(k, d) { try { var v = localStorage.getItem(k); return v == null ? d : v; } catch (e) { return d; } }
function writeLS(k, v) { try { localStorage.setItem(k, v); } catch (e) { } }

var ME = readLS("cg.me", "");
if (!/^[a-z0-9]{6,10}$/.test(ME)) {
  ME = Math.random().toString(36).slice(2, 8);
  writeLS("cg.me", ME);
}
function colorOf(author) {
  var h = 0;
  for (var i = 0; i < author.length; i++) h = (h * 31 + author.charCodeAt(i)) >>> 0;
  return COLORS[h % COLORS.length];
}
var MY_COLOR = colorOf(ME);

/* ---------- ground id (which place we are weaving) ---------- */
function readGroundId() {
  var h = (location.hash || "").replace(/^#/, "");
  var m = /(?:^|&)g=([A-Za-z0-9_-]{1,24})/.exec(h);
  if (m) return m[1];
  var q = new URLSearchParams(location.search).get("g");
  if (q && /^[A-Za-z0-9_-]{1,24}$/.test(q)) return q;
  return "atlanta";
}
var GID = readGroundId();

/* ============================================================
   STORE — append-only ops. The whole history of the ground.
   ============================================================ */
var Store = {
  ops: [],
  seen: Object.create(null),
  seq: 0,
  threads: [],          /* {id,a,t,c,pts:Float64Array(merc pairs),drawn:0..1} */
  notes: [],            /* {id,a,t,c,x,y,text} */
  knots: new Map(),      /* cellKey -> knot */
  bounds: { t0: Infinity, t1: 0 },
  listeners: [],
  onChange: function (f) { this.listeners.push(f); },
  emit: function (kind) { for (var i = 0; i < this.listeners.length; i++) this.listeners[i](kind); }
};

function opId() { return ME + "." + (++Store.seq).toString(36); }

function addOp(op, opts) {
  if (!op || !op.i || Store.seen[op.i]) return false;
  Store.seen[op.i] = 1;
  Store.ops.push(op);
  if (op.a === ME) {
    var n = parseInt((op.i.split(".")[1] || "0"), 36);
    if (n > Store.seq) Store.seq = n;
  }
  materialise(op, opts || {});
  if (op.t < Store.bounds.t0) Store.bounds.t0 = op.t;
  if (op.t > Store.bounds.t1) Store.bounds.t1 = op.t;
  return true;
}

function materialise(op, opts) {
  if (op.k === "t") {
    var raw = op.d.p, pts = new Float64Array(raw.length);
    for (var i = 0; i < raw.length; i += 2) {
      pts[i] = mercX(raw[i + 1] / 1e5);
      pts[i + 1] = mercY(raw[i] / 1e5);
    }
    var th = { id: op.i, a: op.a, t: op.t, c: colorOf(op.a), pts: pts, drawn: opts.animate ? 0 : 1 };
    Store.threads.push(th);
    weaveThread(th);
  } else if (op.k === "n") {
    Store.notes.push({
      id: op.i, a: op.a, t: op.t, c: colorOf(op.a),
      x: mercX(op.d.ll[1] / 1e5), y: mercY(op.d.ll[0] / 1e5),
      text: String(op.d.x || "").slice(0, 140), drawn: opts.animate ? 0 : 1
    });
  }
}

function removeOp(id) {
  var idx = -1;
  for (var i = Store.ops.length - 1; i >= 0; i--) if (Store.ops[i].i === id) { idx = i; break; }
  if (idx < 0) return;
  Store.ops.splice(idx, 1);
  delete Store.seen[id];
  rebuild();
}

function rebuild() {
  Store.threads = []; Store.notes = []; Store.knots = new Map();
  Store.bounds = { t0: Infinity, t1: 0 };
  var ops = Store.ops.slice().sort(function (a, b) { return a.t - b.t; });
  for (var i = 0; i < ops.length; i++) {
    materialise(ops[i], {});
    if (ops[i].t < Store.bounds.t0) Store.bounds.t0 = ops[i].t;
    if (ops[i].t > Store.bounds.t1) Store.bounds.t1 = ops[i].t;
  }
}

/* ---------- weaving: crossings become knots, return thickens them ---------- */
var CELL = 1 / Math.pow(2, KNOT_CELL_Z);
function cellKey(x, y) { return ((x / CELL) | 0) + ":" + ((y / CELL) | 0); }

var segGrid = new Map();  /* cellKey -> [ {x1,y1,x2,y2,a,t} ] */
function gridPut(seg) {
  var k = cellKey((seg.x1 + seg.x2) / 2, (seg.y1 + seg.y2) / 2);
  var arr = segGrid.get(k); if (!arr) { arr = []; segGrid.set(k, arr); }
  arr.push(seg);
}
function gridNear(x, y, out) {
  var cx = (x / CELL) | 0, cy = (y / CELL) | 0;
  for (var i = -1; i <= 1; i++) for (var j = -1; j <= 1; j++) {
    var arr = segGrid.get((cx + i) + ":" + (cy + j));
    if (arr) for (var n = 0; n < arr.length; n++) out.push(arr[n]);
  }
  return out;
}

function segX(a, b) {
  var d = (a.x2 - a.x1) * (b.y2 - b.y1) - (a.y2 - a.y1) * (b.x2 - b.x1);
  if (Math.abs(d) < 1e-18) return null;
  var t = ((b.x1 - a.x1) * (b.y2 - b.y1) - (b.y1 - a.y1) * (b.x2 - b.x1)) / d;
  var u = ((b.x1 - a.x1) * (a.y2 - a.y1) - (b.y1 - a.y1) * (a.x2 - a.x1)) / d;
  if (t < 0 || t > 1 || u < 0 || u > 1) return null;
  return [a.x1 + t * (a.x2 - a.x1), a.y1 + t * (a.y2 - a.y1)];
}

function knotAt(x, y) {
  var k = cellKey(x, y), kn = Store.knots.get(k);
  if (!kn) {
    kn = { key: k, x: x, y: y, n: 0, authors: new Set(), threads: [], ret: 0, retSeen: new Set(), t0: Infinity, t1: 0, grew: 0 };
    Store.knots.set(k, kn);
  }
  return kn;
}

function weaveThread(th) {
  var pts = th.pts, segs = [];
  for (var i = 0; i + 3 < pts.length; i += 2) {
    segs.push({ x1: pts[i], y1: pts[i + 1], x2: pts[i + 2], y2: pts[i + 3], a: th.a, t: th.t, id: th.id });
  }
  /* crossings against everything already woven */
  var cand = [];
  for (var s = 0; s < segs.length; s++) {
    cand.length = 0;
    gridNear((segs[s].x1 + segs[s].x2) / 2, (segs[s].y1 + segs[s].y2) / 2, cand);
    for (var c = 0; c < cand.length; c++) {
      var other = cand[c];
      if (other.id === th.id) continue;
      var p = segX(segs[s], other);
      if (!p) continue;
      var kn = knotAt(p[0], p[1]);
      kn.n++;
      kn.authors.add(th.a); kn.authors.add(other.a);
      if (kn.threads.indexOf(th.id) < 0) kn.threads.push(th.id);
      if (kn.threads.indexOf(other.id) < 0) kn.threads.push(other.id);
      kn.t0 = Math.min(kn.t0, other.t, th.t);
      kn.t1 = Math.max(kn.t1, th.t);
      kn.grew = th.t;
    }
  }
  /* return: passing through a knot again, on a later visit, thickens it */
  var day = Math.floor(th.t / 36e5); /* an hour apart counts as a return */
  for (var q = 0; q + 1 < pts.length; q += 2) {
    var kk = cellKey(pts[q], pts[q + 1]);
    var known = Store.knots.get(kk);
    if (!known) continue;
    var tag = th.a + "|" + day;
    if (!known.retSeen.has(tag)) { known.retSeen.add(tag); known.ret++; known.grew = th.t; known.t1 = Math.max(known.t1, th.t); }
  }
  for (var g = 0; g < segs.length; g++) gridPut(segs[g]);
}

function knotWeight(kn) { return kn.n + kn.authors.size * 2 + kn.ret * 2; }

function syncPips() {
  var has = Store.ops.length > 0;
  var b = document.getElementById("back");
  if (b) b.classList.toggle("show", has);
}

/* ---------- persistence ---------- */
var LS_KEY = "cg.ops." + GID;
var LS_VISIT = "cg.visit." + GID;
var MAX_OPS = 4000;

function loadLocal() {
  var raw = readLS(LS_KEY, "");
  if (!raw) return [];
  try { var a = JSON.parse(raw); return Array.isArray(a) ? a : []; } catch (e) { return []; }
}
var saveTimer = 0;
function saveLocal() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(function () {
    var ops = Store.ops;
    if (ops.length > MAX_OPS) ops = ops.slice(ops.length - MAX_OPS);
    try { localStorage.setItem(LS_KEY, JSON.stringify(ops)); }
    catch (e) {
      try { localStorage.setItem(LS_KEY, JSON.stringify(ops.slice(Math.floor(ops.length / 2)))); } catch (e2) { }
    }
  }, 350);
}

/* ============================================================
   VIEW
   ============================================================ */
var V = { x: mercX(-84.3880), y: mercY(33.7490), z: 12.4 };
var W = 0, H = 0, DPR = 1;
var cv = document.getElementById("cv");
var ctx = cv.getContext("2d", { alpha: false });

function worldSize() { return 256 * Math.pow(2, V.z); }
function toScreenX(mx) { return (mx - V.x) * worldSize() + W / 2; }
function toScreenY(my) { return (my - V.y) * worldSize() + H / 2; }
function fromScreenX(sx) { return (sx - W / 2) / worldSize() + V.x; }
function fromScreenY(sy) { return (sy - H / 2) / worldSize() + V.y; }

var SAFE_B = 0;
function safeBottom() { return SAFE_B; }
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2.5);
  try {
    var probe = document.createElement("div");
    probe.style.cssText = "position:fixed;bottom:0;height:env(safe-area-inset-bottom);width:1px;";
    document.body.appendChild(probe);
    SAFE_B = probe.getBoundingClientRect().height || 0;
    probe.remove();
  } catch (e) { SAFE_B = 0; }

  cv.width = Math.max(1, Math.round(W * DPR));
  cv.height = Math.max(1, Math.round(H * DPR));
  cv.style.width = W + "px"; cv.style.height = H + "px";
  paperTex = null;
  dirty = true;
}

/* ============================================================
   TILES — optional depth. Never required.
   ============================================================ */
var Tiles = {
  cache: new Map(), fails: 0, off: false, pending: 0, anyOk: false,
  hosts: ["a", "b", "c"],
  key: function (z, x, y) { return z + "/" + x + "/" + y; },
  get: function (z, x, y) {
    var k = this.key(z, x, y);
    var e = this.cache.get(k);
    if (e) return e;
    if (this.off || this.pending > 6) return null;
    var img = new Image();
    e = { img: img, ok: false, bad: false, born: performance.now() };
    this.cache.set(k, e);
    this.pending++;

    img.crossOrigin = "anonymous";
    img.onload = function () { self.pending--; e.ok = true; self.fails = 0; self.anyOk = true; dirty = true; };
    img.onerror = function () {
      self.pending--; e.bad = true; self.fails++;
      if (self.fails >= 4 && !self.anyOk) self.off = true;
      if (self.fails >= 12) self.off = true;
      dirty = true;
    };
    img.src = "https://" + this.hosts[(x + y) % 3] + ".tile.openstreetmap.org/" + z + "/" + x + "/" + y + ".png";
    if (this.cache.size > 320) {
      var it = this.cache.keys();
      for (var i = 0; i < 80; i++) { var kk = it.next().value; if (kk !== k) this.cache.delete(kk); }

function drawTiles() {
  if (Tiles.off) return;
  if (navigator.onLine === false) return;
  var tz = clamp(Math.round(V.z), 3, 19);
  var scale = worldSize() / (256 * Math.pow(2, tz));
  var tsize = 256 * scale;
  var n = Math.pow(2, tz);
  var left = fromScreenX(0) * n, right = fromScreenX(W) * n;
  var top = fromScreenY(0) * n, bot = fromScreenY(H) * n;
  var x0 = Math.floor(left), x1 = Math.floor(right), y0 = Math.floor(top), y1 = Math.floor(bot);
  if ((x1 - x0 + 1) * (y1 - y0 + 1) > 90) return;
  ctx.save();
  try { ctx.filter = "grayscale(1) contrast(.62) brightness(1.16)"; } catch (e) { }
  ctx.globalAlpha = 0.42;
  for (var ty = y0; ty <= y1; ty++) {
    if (ty < 0 || ty >= n) continue;
    for (var tx = x0; tx <= x1; tx++) {
      var wx = ((tx % n) + n) % n;
      var e = Tiles.get(tz, wx, ty);
      if (!e || !e.ok) continue;
      var sx = toScreenX(tx / n), sy = toScreenY(ty / n);
      ctx.drawImage(e.img, sx, sy, tsize + 1, tsize + 1);

}

/* ============================================================
   PAPER
   ============================================================ */
var paperTex = null;
function makePaper() {
  var s = 180, c = document.createElement("canvas");
  c.width = s; c.height = s;
  var g = c.getContext("2d");
  var im = g.createImageData(s, s);
  for (var i = 0; i < im.data.length; i += 4) {
    var v = 236 + ((hash01(i) * 22) | 0);
    im.data[i] = v; im.data[i + 1] = v - 3; im.data[i + 2] = v - 12; im.data[i + 3] = 26;
  }
  g.putImageData(im, 0, 0);
  return ctx.createPattern(c, "repeat");
}

/* ============================================================
   INK GROUND
   ============================================================ */
var INK_STYLE = {
  water: { col: "#8ab0b6", w: [0.9, 4.2], a: 0.60, dash: null },
  rail: { col: "#6f746f", w: [0.34, 0.85], a: 0.26, dash: [1.5, 3.4] },
  secondary: { col: "#565c56", w: [0.32, 1.05], a: 0.30, dash: null },
  primary: { col: "#3f453f", w: [0.5, 1.7], a: 0.42, dash: null },
  motorway: { col: "#323833", w: [0.85, 2.8], a: 0.56, dash: null, casing: true },
  boundary: { col: "#9a9083", w: [0.6, 1.2], a: 0.34, dash: [5, 4] }
};
var INK_ORDER = ["water", "rail", "secondary", "primary", "motorway", "boundary"];

function pathLayer(lines, ws) {
  ctx.beginPath();
  for (var i = 0; i < lines.length; i++) {
    var p = lines[i], started = false, lastX = 0, lastY = 0;
    for (var j = 0; j < p.length; j += 2) {
      var sx = (p[j] - V.x) * ws + W / 2, sy = (p[j + 1] - V.y) * ws + H / 2;
      if (started && Math.abs(sx - lastX) < 0.7 && Math.abs(sy - lastY) < 0.7) continue;
      if (!started) { ctx.moveTo(sx, sy); started = true; } else ctx.lineTo(sx, sy);
      lastX = sx; lastY = sy;
    }
  }
}

function drawInk() {
  var ws = worldSize();
  var zt = clamp((V.z - 9) / 8, 0, 1);
  var thin = Tiles.off ? 1 : 0.62;        /* when tiles carry detail, ink steps back */
  var lift = 1 - warp * 0.22;             /* the paper lifts while a thread can be left */
  for (var li = 0; li < INK_ORDER.length; li++) {
    var name = INK_ORDER[li], lines = INK[name];
    if (!lines || !lines.length) continue;
    var st = INK_STYLE[name];
    if (name === "rail" && V.z < 10.5) continue;
    if (name === "secondary" && V.z < 10.2) continue;
    var lw = lerp(st.w[0], st.w[1], zt) * thin;
    ctx.save();
    ctx.lineCap = "round"; ctx.lineJoin = "round";
    if (st.casing && V.z > 11) {
      /* an engraved road: paper cut either side of the line */
      ctx.strokeStyle = "#f3efe5"; ctx.globalAlpha = 0.75 * lift;
      ctx.lineWidth = lw + 2.2;
      pathLayer(lines, ws); ctx.stroke();
    }
    ctx.strokeStyle = st.col;
    ctx.globalAlpha = st.a * lift * (name === "boundary" ? clamp(1.4 - zt, .25, 1) : 1);
    ctx.lineWidth = lw;
    if (st.dash) ctx.setLineDash([st.dash[0] * (1 + zt), st.dash[1] * (1 + zt)]);
    pathLayer(lines, ws);
    ctx.stroke();
    ctx.restore();
  }
  drawPlaces();
}

function drawPlaces() {
  if (V.z < 10.4 || !PLACES.length) return;
  var ws = worldSize();
  var show = V.z < 12 ? ["city", "town"] : V.z < 13.5 ? ["city", "town", "suburb"] : null;
  ctx.save();
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.lineWidth = 3; ctx.lineJoin = "round";
  var drawn = [];
  for (var i = 0; i < PLACES.length; i++) {
    var p = PLACES[i];
    if (show && show.indexOf(p.kind) < 0) continue;
    var sx = (p.x - V.x) * ws + W / 2, sy = (p.y - V.y) * ws + H / 2;
    if (sx < -60 || sx > W + 60 || sy < -20 || sy > H + 20) continue;
    var clash = false;
    for (var d = 0; d < drawn.length; d++) {
      if (Math.abs(drawn[d][0] - sx) < 76 && Math.abs(drawn[d][1] - sy) < 20) { clash = true; break; }
    }
    if (clash) continue;
    drawn.push([sx, sy]);
    var big = p.kind === "city";
    ctx.font = (big ? "italic 13px " : "italic 10.5px ") + 'Georgia,"Times New Roman",serif';
    ctx.globalAlpha = 0.85 * (1 - warp * 0.4);
    ctx.strokeStyle = "rgba(239,234,221,.85)";
    ctx.strokeText(p.name, sx, sy);
    ctx.globalAlpha = (big ? 0.60 : 0.40) * (1 - warp * 0.4);
    ctx.fillStyle = "#1d201d";
    ctx.fillText(p.name, sx, sy);
  }
  ctx.restore();
}

/* ============================================================
   THE WEAVE — threads, knots, common ground
   ============================================================ */
var timeCursor = Infinity;   /* unweave cursor */
var openKnot = null;

function threadWidth() { return clamp(1.1 + (V.z - 10) * 0.5, 1.2, 5.6); }

/* a thread is a spun ribbon: thick in the middle of the gesture, tapering at both ends */
var _tx = [], _ty = [];
function threadScreen(th, upto, ws) {
  var pts = th.pts, n = 0;
  var seedBase = (th.id.charCodeAt(0) + th.id.charCodeAt(th.id.length - 1)) * 7;
  _tx.length = 0; _ty.length = 0;
  var lastX = -1e9, lastY = -1e9;
  for (var i = 0; i < upto; i++) {
    var jx = (hash01(seedBase + i * 2) - 0.5) * 0.5;
    var jy = (hash01(seedBase + i * 2 + 1) - 0.5) * 0.5;
    var sx = (pts[i * 2] - V.x) * ws + W / 2 + jx;
    var sy = (pts[i * 2 + 1] - V.y) * ws + H / 2 + jy;
    if (n > 0 && Math.abs(sx - lastX) < 0.5 && Math.abs(sy - lastY) < 0.5 && i !== upto - 1) continue;
    _tx.push(sx); _ty.push(sy); lastX = sx; lastY = sy; n++;
  }
  return n;
}

function ribbon(n, width) {
  /* offset outline, so the stroke can breathe along its length */
  ctx.beginPath();
  var i, nx, ny, len, hw;
  for (i = 0; i < n; i++) {
    var t = n < 2 ? 1 : i / (n - 1);
    hw = width * (0.34 + 0.66 * Math.sin(Math.PI * Math.pow(t, 0.72))) * 0.5 + 0.18;
    var ax = _tx[Math.min(i + 1, n - 1)] - _tx[Math.max(i - 1, 0)];
    var ay = _ty[Math.min(i + 1, n - 1)] - _ty[Math.max(i - 1, 0)];
    len = Math.hypot(ax, ay) || 1;
    nx = -ay / len * hw; ny = ax / len * hw;
    if (i === 0) ctx.moveTo(_tx[i] + nx, _ty[i] + ny); else ctx.lineTo(_tx[i] + nx, _ty[i] + ny);
  }
  for (i = n - 1; i >= 0; i--) {
    var t2 = n < 2 ? 1 : i / (n - 1);
    hw = width * (0.34 + 0.66 * Math.sin(Math.PI * Math.pow(t2, 0.72))) * 0.5 + 0.18;
    var bx = _tx[Math.min(i + 1, n - 1)] - _tx[Math.max(i - 1, 0)];
    var by = _ty[Math.min(i + 1, n - 1)] - _ty[Math.max(i - 1, 0)];
    len = Math.hypot(bx, by) || 1;
    nx = -by / len * hw; ny = bx / len * hw;
    ctx.lineTo(_tx[i] - nx, _ty[i] - ny);
  }
  ctx.closePath();
}

function drawThread(th, alpha, width, dim) {
  var ws = worldSize();
  var count = th.pts.length / 2;
  var upto = th.drawn >= 1 ? count : Math.max(2, Math.floor(count * th.drawn));
  if (upto < 2) return;
  var n = threadScreen(th, upto, ws);
  if (n < 2) return;
  ctx.save();
  /* the fibre around the thread */
  ctx.globalAlpha = alpha * (dim ? 0.04 : 0.09);
  ctx.strokeStyle = th.c; ctx.lineWidth = width * 2.4;
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  ctx.beginPath();
  for (var i = 0; i < n; i++) { if (i === 0) ctx.moveTo(_tx[i], _ty[i]); else ctx.lineTo(_tx[i], _ty[i]); }
  ctx.stroke();
  /* the thread itself */
  ctx.globalAlpha = alpha * (dim ? 0.16 : 1);
  ctx.fillStyle = th.c;
  ribbon(n, width);
  ctx.fill();
  ctx.restore();
}

function drawWeave(now) {
  var ws = worldSize();
  var base = threadWidth();
  var dimOthers = !!openKnot;
  var live = openKnot ? openKnot.threads : null;

  /* threads */
  for (var i = 0; i < Store.threads.length; i++) {
    var th = Store.threads[i];
    if (th.t > timeCursor) continue;
    if (th.drawn < 1) { th.drawn = Math.min(1, th.drawn + 0.028); dirty = true; }
    var age = Store.bounds.t1 > Store.bounds.t0
      ? (th.t - Store.bounds.t0) / (Store.bounds.t1 - Store.bounds.t0 || 1) : 1;
    var a = 0.52 + 0.42 * age;
    var dim = dimOthers && live.indexOf(th.id) < 0;
    var w = base * (0.78 + 0.42 * age);
    if (dimOthers && !dim) w *= 1.25;
    drawThread(th, a, w, dim);
  }

  /* knots gather as you pull back: at a distance the weave is fabric, not beads */
  buildKnotClusters();
  for (var k = 0; k < renderedKnots.length; k++) drawKnot(renderedKnots[k], now, base);

  /* words in place */
  drawNotes(now);

/* ---- screen-space gathering: near knots become one knot ---- */
var renderedKnots = [];
function minWeightForZoom() { return clamp(2 + Math.max(0, 14.8 - V.z) * 3.4, 2, 44); }

function buildKnotClusters() {
  var ws = worldSize(), cell = clamp(17 + (14.5 - V.z) * 4, 17, 34);
  var buckets = new Map();
  var wMin = minWeightForZoom();
  Store.knots.forEach(function (kn) {
    if (kn.t0 > timeCursor) return;
    var sx = (kn.x - V.x) * ws + W / 2, sy = (kn.y - V.y) * ws + H / 2;
    if (sx < -70 || sx > W + 70 || sy < -70 || sy > H + 70) return;
    var key = ((sx / cell) | 0) + ":" + ((sy / cell) | 0);
    var b = buckets.get(key);
    if (!b) {
      b = { x: 0, y: 0, sw: 0, n: 0, ret: 0, authors: new Set(), threads: [], grew: 0, t0: Infinity, members: 0 };
      buckets.set(key, b);
    }
    var w = knotWeight(kn);
    b.x += kn.x * w; b.y += kn.y * w; b.sw += w; b.members++;
    b.n += kn.n; b.ret += kn.ret;
    kn.authors.forEach(function (a) { b.authors.add(a); });
    for (var i = 0; i < kn.threads.length; i++) if (b.threads.indexOf(kn.threads[i]) < 0) b.threads.push(kn.threads[i]);
    if (kn.grew > b.grew) b.grew = kn.grew;
    if (kn.t0 < b.t0) b.t0 = kn.t0;
  });
  renderedKnots.length = 0;
  buckets.forEach(function (b) {
    if (!b.sw) return;
    b.x /= b.sw; b.y /= b.sw;
    b.w = b.n + b.authors.size * 2 + b.ret * 2;
    if (b.n < 2 && b.ret < 1) return;
    if (b.w < wMin) return;
    renderedKnots.push(b);
  });
  renderedKnots.sort(function (a, b) { return a.w - b.w; });
  if (renderedKnots.length > 140) renderedKnots = renderedKnots.slice(renderedKnots.length - 140);

  if (openKnot && renderedKnots.indexOf(openKnot) < 0) {
    var found = null, bd = 1e9;
    for (var i = 0; i < renderedKnots.length; i++) {
      var d = Math.hypot(renderedKnots[i].x - openKnot.x, renderedKnots[i].y - openKnot.y);
      if (d < bd) { bd = d; found = renderedKnots[i]; }
    }
    openKnot = (found && bd < CELL * 6) ? found : null;
  }
}

function drawKnot(kn, now, base) {
  var ws = worldSize();
  var sx = (kn.x - V.x) * ws + W / 2, sy = (kn.y - V.y) * ws + H / 2;
  if (sx < -80 || sx > W + 80 || sy < -80 || sy > H + 80) return;
  var w = kn.w;
  var r = clamp(2.8 + Math.sqrt(w) * (1.45 + clamp(V.z - 11, 0, 6) * 0.20), 2.8, 42);
  var fresh = clamp(1 - (Date.now() - kn.grew) / 2600, 0, 1);
  var isOpen = openKnot === kn;
  var many = kn.authors.size > 1;

  ctx.save();
  ctx.translate(sx, sy);

  /* common ground: a woven field where many have crossed and returned */
  if (w >= minWeightForZoom() * 3.4 && w >= 14) {
    var fr = r * 2.4;
    var g = ctx.createRadialGradient(0, 0, r * 0.3, 0, 0, fr);
    g.addColorStop(0, "rgba(47,125,132,.11)");
    g.addColorStop(1, "rgba(47,125,132,0)");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, fr, 0, TAU); ctx.fill();
    ctx.save();
    ctx.rotate(Math.PI / 4);
    ctx.globalAlpha = 0.30;
    ctx.strokeStyle = "#2f7d84"; ctx.lineWidth = 0.65;
    var step = Math.max(2.6, r / 3.4);
    ctx.beginPath();
    for (var q = -r; q <= r; q += step) {
      var h = Math.sqrt(Math.max(0, r * r - q * q));
      ctx.moveTo(q, -h); ctx.lineTo(q, h);
      ctx.moveTo(-h, q); ctx.lineTo(h, q);
    }
    ctx.stroke();
    ctx.restore();
  }

  /* a knot sits on a small clearing so the threads read under it */
  if (r > 6) {
    ctx.globalAlpha = 0.16;
    ctx.fillStyle = "#f3efe5";
    ctx.beginPath(); ctx.arc(0, 0, r * 0.8, 0, TAU); ctx.fill();
  }

  /* rings — one for each order of crossing */
  var rings = clamp(1 + Math.floor(w / (minWeightForZoom() * 1.7)), 1, 3);
  for (var i = 0; i < rings; i++) {
    var rr = r * (0.42 + 0.58 * ((i + 1) / rings));
    ctx.beginPath();
    ctx.arc(0, 0, rr, 0, TAU);
    var outer = i === rings - 1;
    ctx.strokeStyle = (outer && w >= minWeightForZoom() * 2) ? (many ? "#bf4526" : "#2f7d84") : "rgba(29,32,29,.7)";
    ctx.globalAlpha = (0.30 + 0.44 * ((i + 1) / rings)) * (isOpen ? 1 : 0.9);
    ctx.lineWidth = 0.7 + (outer ? 0.4 : 0);
    ctx.stroke();
  }

  /* ticks appear once a knot has held several returns */
  if (w >= minWeightForZoom() * 2.2 && r > 7) {
    ctx.globalAlpha = 0.36; ctx.strokeStyle = "rgba(29,32,29,.75)"; ctx.lineWidth = 0.6;

    var off = (Math.abs(kn.x) * 977) % 1;
    ctx.beginPath();
    for (var s = 0; s < spokes; s++) {
      var ang = (s / spokes) * TAU + off;
      ctx.moveTo(Math.cos(ang) * r * 1.02, Math.sin(ang) * r * 1.02);
      ctx.lineTo(Math.cos(ang) * r * 1.26, Math.sin(ang) * r * 1.26);
    }
    ctx.stroke();
  }

  /* the eye of the knot */
  ctx.globalAlpha = 0.88;
  ctx.fillStyle = (w >= minWeightForZoom() * 3.4 && w >= 14) ? "#bf4526" : "#1d201d";
  ctx.beginPath(); ctx.arc(0, 0, clamp(r * 0.2, 0.9, 3.4), 0, TAU); ctx.fill();

  /* a knot that just tightened sends out one pulse */
  if (fresh > 0) {
    ctx.globalAlpha = fresh * 0.5;
    ctx.strokeStyle = "#bf4526"; ctx.lineWidth = 1.1;
    ctx.beginPath(); ctx.arc(0, 0, r + (1 - fresh) * 34, 0, TAU); ctx.stroke();
    dirty = true;
  }
  if (isOpen) {
    ctx.globalAlpha = 0.5;
    ctx.strokeStyle = "#bf4526"; ctx.lineWidth = 1;
    ctx.setLineDash([2, 3]);
    ctx.beginPath(); ctx.arc(0, 0, r + 9 + Math.sin(now / 420) * 1.6, 0, TAU); ctx.stroke();
  }
  ctx.restore();
}

function drawNotes(now) {
  var ws = worldSize();
  if (!openKnot && V.z < 13.8) return;
  ctx.save();
  ctx.textBaseline = "middle";
  var placed = [];
  for (var i = 0; i < Store.notes.length; i++) {
    var n = Store.notes[i];
    if (n.t > timeCursor) continue;
    if (n.drawn < 1) { n.drawn = Math.min(1, n.drawn + 0.05); dirty = true; }
    var sx = (n.x - V.x) * ws + W / 2, sy = (n.y - V.y) * ws + H / 2;
    if (sx < -140 || sx > W + 140 || sy < -30 || sy > H + 30) continue;
    var near = openKnot ? Math.hypot(n.x - openKnot.x, n.y - openKnot.y) < CELL * 8 : false;
    if (openKnot && !near) continue;
    var clash = false;
    for (var q = 0; q < placed.length; q++) {
      if (Math.abs(placed[q][0] - sx) < 150 && Math.abs(placed[q][1] - sy) < 22) { clash = true; break; }
    }
    if (clash) continue;
    placed.push([sx, sy]);
    var a = n.drawn;
    ctx.globalAlpha = a;
    /* the tick that pins the word to the ground */
    ctx.strokeStyle = n.c; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx, sy - 13); ctx.stroke();
    ctx.beginPath(); ctx.arc(sx, sy, 2.1, 0, TAU); ctx.fillStyle = n.c; ctx.fill();
    ctx.font = 'italic 12.5px Georgia,"Times New Roman",serif';
    ctx.textAlign = "left";
    var tw = ctx.measureText(n.text).width;
    var tx = sx + 6 > W - tw - 8 ? sx - 6 - tw : sx + 6;
    ctx.globalAlpha = a * 0.85;
    ctx.strokeStyle = "rgba(239,234,221,.9)"; ctx.lineWidth = 3; ctx.lineJoin = "round";
    ctx.strokeText(n.text, tx, sy - 16);
    ctx.globalAlpha = a;
    ctx.fillStyle = "#1d201d";
    ctx.fillText(n.text, tx, sy - 16);
  }
  ctx.restore();
}

/* ---------- live strokes (mine in progress, and other people's) ---------- */
var drawingPts = null;      /* Float64Array-ish array of merc pairs */
var livePeers = new Map();  /* author -> {pts:[], c, ts} */

function drawLive(now) {
  var ws = worldSize();
  if (drawingPts && drawingPts.length >= 4) {
    ctx.save();
    ctx.strokeStyle = MY_COLOR; ctx.globalAlpha = 0.95;
    ctx.lineWidth = threadWidth() * 1.05; ctx.lineCap = "round"; ctx.lineJoin = "round";
    ctx.beginPath();
    for (var i = 0; i < drawingPts.length; i += 2) {
      var sx = (drawingPts[i] - V.x) * ws + W / 2, sy = (drawingPts[i + 1] - V.y) * ws + H / 2;
      if (i === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
    }
    ctx.stroke();
    /* the needle */
    var lx = (drawingPts[drawingPts.length - 2] - V.x) * ws + W / 2;
    var ly = (drawingPts[drawingPts.length - 1] - V.y) * ws + H / 2;
    ctx.globalAlpha = 0.5; ctx.beginPath(); ctx.arc(lx, ly, 5 + Math.sin(now / 160) * 1.2, 0, TAU);
    ctx.strokeStyle = MY_COLOR; ctx.lineWidth = 1; ctx.stroke();
    ctx.restore();
  }
  livePeers.forEach(function (lp, a) {
    if (now - lp.ts > 6000) { livePeers.delete(a); return; }
    if (lp.pts.length < 4) return;
    ctx.save();
    ctx.strokeStyle = lp.c; ctx.globalAlpha = 0.8;
    ctx.lineWidth = threadWidth(); ctx.lineCap = "round"; ctx.lineJoin = "round";
    ctx.setLineDash([]);
    ctx.beginPath();
    for (var i = 0; i < lp.pts.length; i += 2) {
      var sx = (lp.pts[i] - V.x) * ws + W / 2, sy = (lp.pts[i + 1] - V.y) * ws + H / 2;
      if (i === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
    }
    ctx.stroke();
    ctx.restore();
    dirty = true;
  });
}

/* ---------- presence ---------- */
var peers = new Map(); /* author -> {c, x, y, ts} */
function drawPresence(now) {
  var ws = worldSize();
  peers.forEach(function (p, a) {
    if (now - p.ts > 14000) { peers.delete(a); refreshPeopleGlyph(); return; }
    if (p.x == null) return;
    var sx = (p.x - V.x) * ws + W / 2, sy = (p.y - V.y) * ws + H / 2;
    if (sx < -40 || sx > W + 40 || sy < -40 || sy > H + 40) return;
    var pulse = 0.5 + 0.5 * Math.sin(now / 900 + a.charCodeAt(0));
    ctx.save();
    ctx.globalAlpha = 0.16 + pulse * 0.1;
    var g = ctx.createRadialGradient(sx, sy, 0, sx, sy, 34);
    g.addColorStop(0, p.c); g.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(sx, sy, 34, 0, TAU); ctx.fill();
    ctx.globalAlpha = 0.6; ctx.fillStyle = p.c;
    ctx.beginPath(); ctx.arc(sx, sy, 2.6, 0, TAU); ctx.fill();
    ctx.restore();
    dirty = true;
  });
}

/* ---------- the loom warp (only while a thread can be left) ---------- */
var warp = 0;
function drawWarp() {
  if (warp <= 0.01) return;
  ctx.save();
  /* warp threads strung down the paper — the ground is on the loom */
  var gap = 7;
  ctx.strokeStyle = "#1d201d"; ctx.lineWidth = 0.5;
  ctx.beginPath();
  for (var x = 0; x < W; x += gap) {
    var a = 0.055 + 0.045 * hash01(x);
    ctx.globalAlpha = warp * a;
    ctx.beginPath(); ctx.moveTo(x + 0.5, 0); ctx.lineTo(x + 0.5, H); ctx.stroke();
  }
  /* the tensioned edge of the cloth */
  ctx.globalAlpha = warp;
  var top = ctx.createLinearGradient(0, 0, 0, 26);
  top.addColorStop(0, "rgba(29,32,29,.13)"); top.addColorStop(1, "rgba(29,32,29,0)");
  ctx.fillStyle = top; ctx.fillRect(0, 0, W, 26);
  var bot = ctx.createLinearGradient(0, H, 0, H - 26);
  bot.addColorStop(0, "rgba(29,32,29,.13)"); bot.addColorStop(1, "rgba(29,32,29,0)");
  ctx.fillStyle = bot; ctx.fillRect(0, H - 26, W, 26);
  ctx.restore();
}

/* ---------- first gesture: the ground shows you what it wants ---------- */
var ghostT = 0;
function drawGhost(now) {
  if (Store.threads.length || Store.notes.length || drawingPts) return;
  ghostT = (now % 5600) / 5600;
  /* the gesture rises out of the thread button and lays itself across the ground */
  var bx = W / 2, by = H - 58 - safeBottom();
  var span = Math.min(W * 0.66, 300);
  var t = clamp((ghostT - 0.10) / 0.52, 0, 1);
  var fade = ghostT < 0.10 ? ghostT / 0.10 : ghostT > 0.76 ? clamp((1 - ghostT) / 0.24, 0, 1) : 1;
  var N = 64;
  function gp(u) {
    /* leaves the button, arcs up and over */
    var x = bx + (u - 0.5) * span * 2 * Math.min(1, u * 3.2 + 0.12);
    var lift = Math.sin(Math.pow(u, 0.62) * Math.PI) ;
    var y = by - lift * (H * 0.34) - u * H * 0.10;
    return [x, y];
  }
  ctx.save();
  var n = Math.max(2, Math.floor(t * N));
  ctx.globalAlpha = fade * 0.5;
  ctx.strokeStyle = MY_COLOR;
  ctx.lineWidth = 2.4; ctx.lineCap = "round"; ctx.lineJoin = "round";
  ctx.setLineDash([1.5, 6]);
  ctx.beginPath();
  for (var i = 0; i < n; i++) { var p = gp(i / (N - 1)); if (i === 0) ctx.moveTo(p[0], p[1]); else ctx.lineTo(p[0], p[1]); }
  ctx.stroke();
  if (t > 0.02 && t < 1) {
    var h = gp((n - 1) / (N - 1));
    ctx.setLineDash([]); ctx.globalAlpha = fade * 0.85;
    ctx.beginPath(); ctx.arc(h[0], h[1], 4.2, 0, TAU); ctx.fillStyle = MY_COLOR; ctx.fill();
    ctx.globalAlpha = fade * 0.3;
    ctx.beginPath(); ctx.arc(h[0], h[1], 9 + Math.sin(now / 180) * 2, 0, TAU);
    ctx.strokeStyle = MY_COLOR; ctx.lineWidth = 1; ctx.stroke();
  }
  ctx.restore();
  dirty = true;
}

/* ============================================================
   FRAME
   ============================================================ */
var dirty = true;
function frame(now) {
  requestAnimationFrame(frame);
  stepMotion(now);
  if (!dirty) return;
  dirty = false;

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = "#efeadd";
  ctx.fillRect(0, 0, W, H);

  drawTiles();

  if (!paperTex) paperTex = makePaper();
  if (paperTex) { ctx.save(); ctx.fillStyle = paperTex; ctx.fillRect(0, 0, W, H); ctx.restore(); }

  drawInk();
  drawWarp();
  drawWeave(now);
  drawLive(now);
  drawPresence(now);
  drawGhost(now);
}

/* ---------- motion: inertia, zoom easing, unweaving ---------- */
var vel = { x: 0, y: 0 }, lastMotion = 0;
var unweave = { held: false, rate: 0 };

function stepMotion(now) {
  var dt = Math.min(50, now - (lastMotion || now)); lastMotion = now;
  if (!pointerDown && (Math.abs(vel.x) > 1e-9 || Math.abs(vel.y) > 1e-9)) {
    V.x -= vel.x; V.y -= vel.y;
    vel.x *= 0.90; vel.y *= 0.90;
    if (Math.abs(vel.x) < 1e-9) vel.x = 0;
    if (Math.abs(vel.y) < 1e-9) vel.y = 0;
    clampView(); dirty = true;
  }
  var targetWarp = traceMode ? 1 : 0;
  if (Math.abs(warp - targetWarp) > 0.005) { warp += (targetWarp - warp) * 0.14; dirty = true; }
  else if (warp !== targetWarp) { warp = targetWarp; dirty = true; }

  /* unweaving: hold to run the fabric backwards, release and it reweaves */
  if (Store.bounds.t1 > 0) {
    var span = Math.max(60000, Store.bounds.t1 - Store.bounds.t0);
    if (unweave.held) {
      if (timeCursor === Infinity) timeCursor = Store.bounds.t1 + 1;
      unweave.rate = Math.min(unweave.rate + dt * 0.004, 3.2);
      timeCursor -= span * (dt / 1000) * 0.55 * unweave.rate;
      if (timeCursor < Store.bounds.t0 - 1) timeCursor = Store.bounds.t0 - 1;
      dirty = true;
    } else if (timeCursor !== Infinity) {
      unweave.rate = 0;
      timeCursor += span * (dt / 1000) * 0.9;
      if (timeCursor >= Store.bounds.t1) { timeCursor = Infinity; }
      dirty = true;
    }
  }
}

function clampView() {
  V.y = clamp(V.y, 0.02, 0.98);
  V.x = ((V.x % 1) + 1) % 1;
}

/* ============================================================
   INPUT — the map is the interface
   ============================================================ */
var traceMode = false;
var pointers = new Map();
var pointerDown = false;
var pinch = null;
var stroke = null;
var holdTimer = 0, holdCandidate = null;
var lastTapTime = 0;

var stage = document.getElementById("stage");

function ptOf(e) { return { x: e.clientX, y: e.clientY, t: performance.now() }; }

var travelled = 0;
stage.addEventListener("pointerdown", function (e) {
  if (keyOpen) return;
  travelled = 0;
  stage.setPointerCapture && stage.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, ptOf(e));
  pointerDown = true;
  vel.x = 0; vel.y = 0;

  if (pointers.size === 2) {
    /* two fingers always travel — cancel any nascent thread */
    if (stroke) { stroke = null; drawingPts = null; dirty = true; }
    var it = pointers.values(), a = it.next().value, b = it.next().value;
    pinch = {
      d: Math.hypot(a.x - b.x, a.y - b.y),
      mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2, z: V.z,
      wx: fromScreenX((a.x + b.x) / 2), wy: fromScreenY((a.y + b.y) / 2)
    };
    clearTimeout(holdTimer);
    return;
  }
  if (pointers.size > 2) return;

  var p = ptOf(e);
  holdCandidate = { x: p.x, y: p.y };
  clearTimeout(holdTimer);
  holdTimer = setTimeout(function () {
    if (!holdCandidate || pointers.size !== 1) return;
    var wx = fromScreenX(holdCandidate.x), wy = fromScreenY(holdCandidate.y);
    stroke = null; drawingPts = null;
    pointers.clear(); pointerDown = false;
    openSay(holdCandidate.x, holdCandidate.y, wx, wy);
  }, HOLD_MS);

  if (traceMode) {
    stroke = { pts: [fromScreenX(p.x), fromScreenY(p.y)], sx: p.x, sy: p.y, moved: 0, t0: Date.now(), last: p };
    drawingPts = stroke.pts;
  } else {
    stroke = null;
  }
  dirty = true;
}, { passive: false });

stage.addEventListener("pointermove", function (e) {
  if (!pointers.has(e.pointerId)) return;
  var prev = pointers.get(e.pointerId);
  var p = ptOf(e);
  pointers.set(e.pointerId, p);

  if (holdCandidate && Math.hypot(p.x - holdCandidate.x, p.y - holdCandidate.y) > 9) {
    clearTimeout(holdTimer); holdCandidate = null;
  }

  if (pointers.size >= 2 && pinch) {
    var it = pointers.values(), a = it.next().value, b = it.next().value;
    var d = Math.hypot(a.x - b.x, a.y - b.y);
    var mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    if (pinch.d > 4) {
      V.z = clamp(pinch.z + Math.log2(d / pinch.d), 3.2, 19);
    }
    /* keep the world point under the pinch centre pinned */
    V.x = pinch.wx - (mx - W / 2) / worldSize();
    V.y = pinch.wy - (my - H / 2) / worldSize();
    clampView(); dirty = true;
    return;
  }

  if (stroke) {
    stroke.moved += Math.hypot(p.x - prev.x, p.y - prev.y);
    var wx = fromScreenX(p.x), wy = fromScreenY(p.y);
    var n = stroke.pts.length;
    var dx = (wx - stroke.pts[n - 2]) * worldSize(), dy = (wy - stroke.pts[n - 1]) * worldSize();
    if (dx * dx + dy * dy > 4) { stroke.pts.push(wx, wy); pushLive(); }
    dirty = true;
    e.preventDefault();
    return;
  }

  /* travel */
  travelled += Math.hypot(p.x - prev.x, p.y - prev.y);
  var ws = worldSize();
  var ddx = (p.x - prev.x) / ws, ddy = (p.y - prev.y) / ws;
  V.x -= ddx; V.y -= ddy;
  vel.x = ddx * 0.85; vel.y = ddy * 0.85;
  clampView(); dirty = true;
}, { passive: false });

function endPointer(e) {
  clearTimeout(holdTimer); holdCandidate = null;
  var had = pointers.has(e.pointerId);
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinch = null;
  if (pointers.size === 0) pointerDown = false;
  if (!had) return;

  if (stroke) {
    var s = stroke; stroke = null;
    if (s.moved >= STROKE_MIN_PX && s.pts.length >= 4) {
      settleThread(s.pts);
      drawingPts = null;
    } else {
      drawingPts = null;
      tapAt(s.sx, s.sy);
    }
    dirty = true;
    return;
  }
  if (pointers.size === 0 && e.type === "pointerup" && travelled < STROKE_MIN_PX) {
    /* a still tap while travelling: open a knot if one is there */
    tapAt(e.clientX, e.clientY);
  }
  dirty = true;
}
stage.addEventListener("pointerup", endPointer);
stage.addEventListener("pointercancel", endPointer);
stage.addEventListener("pointerleave", function (e) { if (!stroke && pointers.size <= 1) endPointer(e); });

stage.addEventListener("wheel", function (e) {
  e.preventDefault();
  var wx = fromScreenX(e.clientX), wy = fromScreenY(e.clientY);
  V.z = clamp(V.z - e.deltaY * 0.0022 * (e.deltaMode === 1 ? 16 : 1), 3.2, 19);
  V.x = wx - (e.clientX - W / 2) / worldSize();
  V.y = wy - (e.clientY - H / 2) / worldSize();
  clampView(); dirty = true;
}, { passive: false });

function tapAt(sx, sy) {
  var ws = worldSize();
  var best = null, bestScore = -1;
  for (var i = 0; i < renderedKnots.length; i++) {
    var kn = renderedKnots[i];
    var d = Math.hypot((kn.x - V.x) * ws + W / 2 - sx, (kn.y - V.y) * ws + H / 2 - sy);
    var r = clamp(2.8 + Math.sqrt(kn.w) * (1.45 + clamp(V.z - 11, 0, 6) * 0.20), 2.8, 42);
    var reach = Math.max(26, r + 14);
    if (d < reach) { var score = (reach - d) + kn.w * 0.3; if (score > bestScore) { bestScore = score; best = kn; } }
  }
  openKnot = (best && best !== openKnot) ? best : null;
  dirty = true;
}

/* ---------- leaving a thread ---------- */
function settleThread(mercPts) {
  var packed = [];
  for (var i = 0; i < mercPts.length; i += 2) {
    packed.push(Math.round(unMercY(mercPts[i + 1]) * 1e5), Math.round(unMercX(mercPts[i]) * 1e5));
  }
  var op = { i: opId(), a: ME, t: Date.now(), k: "t", d: { p: packed } };
  addOp(op); saveLocal(); publish([op]);
  lastMine = op.i; showUndo(); syncPips();
  Store.emit("thread");
  dirty = true;
}

/* ---------- saying something into place ---------- */
var say = document.getElementById("say");
var sayIn = document.getElementById("sayIn");
var micBtn = document.getElementById("mic");
var sayAt = null, recog = null;

function openSay(sx, sy, wx, wy) {
  sayAt = { x: wx, y: wy };
  say.style.display = "block";
  say.style.left = clamp(sx, 14, W - 250) + "px";
  say.style.top = clamp(sy - 26, 40, H - 120) + "px";
  sayIn.value = "";
  setTimeout(function () { try { sayIn.focus(); } catch (e) { } }, 10);
  if (window.SpeechRecognition || window.webkitSpeechRecognition) micBtn.classList.add("avail");
}
function closeSay(commit) {
  if (recog) { try { recog.stop(); } catch (e) { } recog = null; micBtn.classList.remove("on"); }
  var text = sayIn.value.trim();
  say.style.display = "none";
  if (commit && text && sayAt) {
    var op = {
      i: opId(), a: ME, t: Date.now(), k: "n",
      d: { ll: [Math.round(unMercY(sayAt.y) * 1e5), Math.round(unMercX(sayAt.x) * 1e5)], x: text.slice(0, 140) }
    };
    addOp(op); saveLocal(); publish([op]);
    lastMine = op.i; showUndo(); syncPips();
  }
  sayAt = null; sayIn.blur(); dirty = true;
}
sayIn.addEventListener("keydown", function (e) {
  if (e.key === "Enter") { e.preventDefault(); closeSay(true); }
  else if (e.key === "Escape") { closeSay(false); }
});
sayIn.addEventListener("blur", function () { setTimeout(function () { if (say.style.display === "block") closeSay(true); }, 120); });
micBtn.addEventListener("click", function (e) {
  e.stopPropagation();
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return;
  if (recog) { try { recog.stop(); } catch (er) { } recog = null; micBtn.classList.remove("on"); return; }
  try {
    recog = new SR();
    recog.interimResults = true; recog.continuous = false; recog.lang = navigator.language || "en-US";
    micBtn.classList.add("on");
    recog.onresult = function (ev) {
      var s = "";
      for (var i = 0; i < ev.results.length; i++) s += ev.results[i][0].transcript;
      sayIn.value = s.trim().slice(0, 140);
    };
    recog.onend = function () { recog = null; micBtn.classList.remove("on"); };
    recog.onerror = function () { recog = null; micBtn.classList.remove("on"); };
    recog.start();
  } catch (er) { recog = null; micBtn.classList.remove("on"); }
});

/* ============================================================
   CONTROLS
   ============================================================ */
var threadBtn = document.getElementById("thread");
var peopleBtn = document.getElementById("people");
var backBtn = document.getElementById("back");
var undoBtn = document.getElementById("undo");
var threadGlyph = document.getElementById("threadGlyph");
var threadKnob = document.getElementById("threadKnob");

function setTrace(on) {
  traceMode = on;
  threadBtn.classList.toggle("on", on);
  threadBtn.style.background = on ? MY_COLOR : "";
  threadGlyph.style.stroke = on ? "#f6f2e8" : "#1d201d";
  threadKnob.style.fill = on ? "#f6f2e8" : "#1d201d";

}
threadBtn.addEventListener("click", function () { setTrace(!traceMode); if (openKnot) { openKnot = null; } });
threadBtn.addEventListener("pointerdown", function (e) { e.stopPropagation(); });

var undoTimer = 0, lastMine = null;
function showUndo() {
  undoBtn.classList.add("show");
  clearTimeout(undoTimer);
  undoTimer = setTimeout(function () { undoBtn.classList.remove("show"); lastMine = null; }, 7000);
}
undoBtn.addEventListener("click", function (e) {
  e.stopPropagation();
  if (!lastMine) return;
  var id = lastMine;
  removeOp(id); saveLocal(); publish([{ i: "x." + id, a: ME, t: Date.now(), k: "x", d: { r: id } }]);
  lastMine = null; undoBtn.classList.remove("show"); syncPips(); dirty = true;
});
undoBtn.addEventListener("pointerdown", function (e) { e.stopPropagation(); });

/* unweave: hold */
["pointerdown"].forEach(function (ev) {

});
["pointerup", "pointercancel", "pointerleave"].forEach(function (ev) {

});
window.addEventListener("pointerup", function () { unweave.held = false; });

/* people */
function refreshPeopleGlyph() {
  var g = document.getElementById("peopleGlyph");
  var list = [MY_COLOR];
  peers.forEach(function (p) { if (list.length < 6) list.push(p.c); });
  var s = "";
  if (list.length === 1) {
    s = '<circle cx="15" cy="15" r="3.6" fill="' + MY_COLOR + '"/>' +
      '<circle cx="15" cy="15" r="9" fill="none" stroke="rgba(29,32,29,.35)" stroke-width="1" stroke-dasharray="2 3"/>';
  } else {
    var r = 8.4;
    for (var i = 0; i < list.length; i++) {
      var a = -Math.PI / 2 + (i / list.length) * TAU;
      s += '<circle cx="' + (15 + Math.cos(a) * r).toFixed(1) + '" cy="' + (15 + Math.sin(a) * r).toFixed(1) +
        '" r="3.1" fill="' + list[i] + '"/>';
    }
    s += '<circle cx="15" cy="15" r="1.5" fill="rgba(29,32,29,.5)"/>';

}
peopleBtn.addEventListener("pointerdown", function (e) { e.stopPropagation(); });
peopleBtn.addEventListener("click", function () { openKey(); });

/* ============================================================
   THE GROUND KEY — a link and a woven square
   ============================================================ */
var keyEl = document.getElementById("key");
var keyOpen = false;
function joinUrl() {
  return location.origin + location.pathname + "#g=" + GID;
}
function openKey() {
  keyOpen = true;
  keyEl.classList.add("show");
  document.getElementById("keyUrl").textContent = joinUrl();
  var n = peers.size;
  document.getElementById("keyNote").textContent =
    net.state === "open"
      ? (n === 0 ? "this ground is open. no one else is here yet." : (n === 1 ? "one other person is on this ground." : n + " others are on this ground."))
      : "this ground is yours alone right now. share it and it will try to find the others.";
  try { drawQR(document.getElementById("qr"), joinUrl()); } catch (e) { }
}
keyEl.addEventListener("click", function () { keyOpen = false; keyEl.classList.remove("show"); });
document.getElementById("keyUrl").addEventListener("click", function (e) {
  e.stopPropagation();
  try { navigator.clipboard.writeText(joinUrl()); this.textContent = "copied"; var self = this;
    setTimeout(function () { self.textContent = joinUrl(); }, 1200); } catch (er) { }
});

/* ---------- QR (byte mode, level M, versions 1-10) ---------- */
var QR = (function () {
  var EXP = new Uint8Array(512), LOG = new Uint8Array(256);
  (function () { var x = 1; for (var i = 0; i < 255; i++) { EXP[i] = x; LOG[x] = i; x <<= 1; if (x & 0x100) x ^= 0x11d; } for (var j = 255; j < 512; j++) EXP[j] = EXP[j - 255]; })();
  function mul(a, b) { return (a && b) ? EXP[LOG[a] + LOG[b]] : 0; }
  function gen(n) { var g = [1]; for (var i = 0; i < n; i++) { var ng = new Array(g.length + 1).fill(0); for (var j = 0; j < g.length; j++) { ng[j] ^= mul(g[j], EXP[i]); ng[j + 1] ^= g[j]; } g = ng; } return g; }
  function ecc(data, n) { var g = gen(n), r = new Uint8Array(data.length + n); r.set(data); for (var i = 0; i < data.length; i++) { var c = r[i]; if (c) for (var j = 0; j <= n; j++) r[i + j] ^= mul(g[j], c); } return r.subarray(data.length); }
  var RS = { 1: [10, [[1, 16]]], 2: [16, [[1, 28]]], 3: [26, [[1, 44]]], 4: [18, [[2, 32]]], 5: [24, [[2, 43]]], 6: [16, [[4, 27]]], 7: [18, [[4, 31]]], 8: [22, [[2, 38], [2, 39]]], 9: [22, [[3, 36], [2, 37]]], 10: [26, [[4, 43], [1, 44]]] };
  var ALIGN = { 1: [], 2: [6, 18], 3: [6, 22], 4: [6, 26], 5: [6, 30], 6: [6, 34], 7: [6, 22, 38], 8: [6, 24, 42], 9: [6, 26, 46], 10: [6, 28, 50] };
  function bitlen(v) { var n = 0; while (v) { n++; v >>>= 1; } return n; }
  function fmtBits(mask) { var d = (0 << 3) | mask; var r = d << 10; while (bitlen(r) >= 11) r ^= 0b10100110111 << (bitlen(r) - 11); return ((d << 10) | r) ^ 0b101010000010010; }
  function verBits(v) { var r = v << 12; while (bitlen(r) >= 13) r ^= 0b1111100100101 << (bitlen(r) - 13); return (v << 12) | r; }

  return function (text) {
    var bytes = [];
    for (var i = 0; i < text.length; i++) {
      var c = text.charCodeAt(i);
      if (c < 128) bytes.push(c);
      else if (c < 2048) bytes.push(192 | (c >> 6), 128 | (c & 63));
      else bytes.push(224 | (c >> 12), 128 | ((c >> 6) & 63), 128 | (c & 63));
    }
    var ver = 0;
    for (var v = 1; v <= 10; v++) {
      var total = RS[v][1].reduce(function (a, g) { return a + g[0] * g[1]; }, 0);
      if (bytes.length + (v < 10 ? 2 : 3) <= total) { ver = v; break; }
    }
    if (!ver) return null;
    var ecn = RS[ver][0], groups = RS[ver][1];
    var totalData = groups.reduce(function (a, g) { return a + g[0] * g[1]; }, 0);

    /* bitstream */
    var bits = [];
    function put(val, n) { for (var i = n - 1; i >= 0; i--) bits.push((val >> i) & 1); }
    put(4, 4);
    put(bytes.length, ver < 10 ? 8 : 16);
    for (var b = 0; b < bytes.length; b++) put(bytes[b], 8);
    var cap = totalData * 8;
    for (var t = 0; t < 4 && bits.length < cap; t++) bits.push(0);

        var d = Uint8Array.from(cw.slice(pos, pos + groups[gi][1])); pos += groups[gi][1];

    var maxD = Math.max.apply(null, dblocks.map(function (d) { return d.length; }));
    for (var c2 = 0; c2 < maxD; c2++) for (var bl = 0; bl < dblocks.length; bl++) if (c2 < dblocks[bl].length) final.push(dblocks[bl][c2]);
    for (var c3 = 0; c3 < ecn; c3++) for (var bl2 = 0; bl2 < eblocks.length; bl2++) final.push(eblocks[bl2][c3]);

    /* matrix */
    var size = 17 + 4 * ver;
    var m = [], fn = [];
    for (var r = 0; r < size; r++) { m.push(new Uint8Array(size)); fn.push(new Uint8Array(size)); }
    function setF(r, c, v) { if (r < 0 || c < 0 || r >= size || c >= size) return; m[r][c] = v; fn[r][c] = 1; }
    function finder(r0, c0) {
      for (var r = -1; r <= 7; r++) for (var c = -1; c <= 7; c++) {
        var rr = r0 + r, cc = c0 + c;
        if (rr < 0 || cc < 0 || rr >= size || cc >= size) continue;
        var on = (r >= 0 && r <= 6 && (c === 0 || c === 6)) || (c >= 0 && c <= 6 && (r === 0 || r === 6)) || (r >= 2 && r <= 4 && c >= 2 && c <= 4);
        setF(rr, cc, on ? 1 : 0);
      }
    }
    finder(0, 0); finder(0, size - 7); finder(size - 7, 0);
    for (var i3 = 8; i3 < size - 8; i3++) { setF(6, i3, i3 % 2 === 0 ? 1 : 0); setF(i3, 6, i3 % 2 === 0 ? 1 : 0); }
    var ac = ALIGN[ver];
    for (var a1 = 0; a1 < ac.length; a1++) for (var a2 = 0; a2 < ac.length; a2++) {
      var ar = ac[a1], acol = ac[a2];
      if ((ar <= 7 && acol <= 7) || (ar <= 7 && acol >= size - 8) || (ar >= size - 8 && acol <= 7)) continue;
      for (var r2 = -2; r2 <= 2; r2++) for (var c4 = -2; c4 <= 2; c4++) {
        setF(ar + r2, acol + c4, (Math.max(Math.abs(r2), Math.abs(c4)) !== 1) ? 1 : 0);
      }
    }
    setF(size - 8, 8, 1);
    /* reserve format */
    for (var i4 = 0; i4 < 9; i4++) { if (i4 !== 6) { setF(8, i4, 0); setF(i4, 8, 0); } }
    for (var i5 = 0; i5 < 8; i5++) { setF(8, size - 1 - i5, 0); setF(size - 1 - i5, 8, 0); }
    if (ver >= 7) {
      var vb = verBits(ver);
      for (var i6 = 0; i6 < 18; i6++) {
        var bit = (vb >> i6) & 1;
        setF(Math.floor(i6 / 3), size - 11 + (i6 % 3), bit);
        setF(size - 11 + (i6 % 3), Math.floor(i6 / 3), bit);
      }
    }
    /* data zigzag */
    var bi2 = 0, up = true;
    var dataBits = [];
    for (var f = 0; f < final.length; f++) for (var k2 = 7; k2 >= 0; k2--) dataBits.push((final[f] >> k2) & 1);
    for (var col = size - 1; col > 0; col -= 2) {
      if (col === 6) col--;
      for (var rowi = 0; rowi < size; rowi++) {
        var row = up ? size - 1 - rowi : rowi;
        for (var s2 = 0; s2 < 2; s2++) {
          var cc2 = col - s2;
          if (fn[row][cc2]) continue;
          m[row][cc2] = bi2 < dataBits.length ? dataBits[bi2] : 0;
          bi2++;
        }
      }
      up = !up;
    }
    /* masks */
    function maskFn(k, r, c) {
      switch (k) {
        case 0: return (r + c) % 2 === 0;
        case 1: return r % 2 === 0;
        case 2: return c % 3 === 0;
        case 3: return (r + c) % 3 === 0;
        case 4: return (Math.floor(r / 2) + Math.floor(c / 3)) % 2 === 0;
        case 5: return ((r * c) % 2) + ((r * c) % 3) === 0;
        case 6: return (((r * c) % 2) + ((r * c) % 3)) % 2 === 0;
        default: return (((r + c) % 2) + ((r * c) % 3)) % 2 === 0;
      }
    }
    function penalty(mm) {
      var p = 0, r, c, run, i;
      for (r = 0; r < size; r++) { run = 1; for (c = 1; c < size; c++) { if (mm[r][c] === mm[r][c - 1]) { run++; if (run === 5) p += 3; else if (run > 5) p++; } else run = 1; } }
      for (c = 0; c < size; c++) { run = 1; for (r = 1; r < size; r++) { if (mm[r][c] === mm[r - 1][c]) { run++; if (run === 5) p += 3; else if (run > 5) p++; } else run = 1; } }
      for (r = 0; r < size - 1; r++) for (c = 0; c < size - 1; c++) { var s3 = mm[r][c] + mm[r][c + 1] + mm[r + 1][c] + mm[r + 1][c + 1]; if (s3 === 0 || s3 === 4) p += 3; }
      var dark = 0; for (r = 0; r < size; r++) for (c = 0; c < size; c++) dark += mm[r][c];

    }
    var best = null, bestP = Infinity, bestMask = 0;
    for (var mk = 0; mk < 8; mk++) {
      var mm = m.map(function (row) { return Uint8Array.from(row); });
      for (var r3 = 0; r3 < size; r3++) for (var c5 = 0; c5 < size; c5++) if (!fn[r3][c5] && maskFn(mk, r3, c5)) mm[r3][c5] ^= 1;
      var fb = fmtBits(mk);
      for (var i7 = 0; i7 < 15; i7++) {
        var bit2 = (fb >> i7) & 1;
        if (i7 < 6) mm[8][i7] = bit2;
        else if (i7 === 6) mm[8][7] = bit2;
        else if (i7 === 7) mm[8][8] = bit2;
        else if (i7 === 8) mm[7][8] = bit2;
        else mm[14 - i7][8] = bit2;
        if (i7 < 8) mm[8][size - 1 - i7] = bit2;
        else mm[size - 15 + i7][8] = bit2;
      }
      mm[size - 8][8] = 1;
      var pp = penalty(mm);
      if (pp < bestP) { bestP = pp; best = mm; bestMask = mk; }
    }
    return best;
  };
})();

function drawQR(canvas, text) {
  var m = QR(text);
  if (!m) return;
  var n = m.length, quiet = 3, total = n + quiet * 2;
  var css = canvas.clientWidth || 240;
  var dpr = Math.min(window.devicePixelRatio || 1, 3);
  canvas.width = Math.round(css * dpr); canvas.height = Math.round(css * dpr);
  var g = canvas.getContext("2d");
  var s = canvas.width / total;
  g.fillStyle = "#f6f2e8"; g.fillRect(0, 0, canvas.width, canvas.height);
  for (var r = 0; r < n; r++) for (var c = 0; c < n; c++) {
    if (!m[r][c]) continue;
    var inFinder = (r < 7 && c < 7) || (r < 7 && c >= n - 7) || (r >= n - 7 && c < 7);
    g.fillStyle = inFinder ? "#bf4526" : "#1d201d";
    g.fillRect(Math.round((c + quiet) * s), Math.round((r + quiet) * s), Math.ceil(s), Math.ceil(s));
  }
}

/* ============================================================
   NETWORK — the ground tries to find the others. Never required.
   ============================================================ */
var net = { state: "local", mqtt: null, bc: null, brokers: [], tried: 0 };

function encodeMsg(o) { return JSON.stringify(o); }
function handleMsg(msg) {
  if (!msg || msg.from === ME || msg.g !== GID) return;
  if (msg.ops) {
    var added = 0;
    for (var i = 0; i < msg.ops.length; i++) {
      var op = msg.ops[i];
      if (op.k === "x") { removeOp(op.d.r); added++; continue; }
      if (addOp(op, { animate: true })) added++;
    }
    if (added) { saveLocal(); syncPips(); dirty = true; }
  }
  if (msg.hello) {
    /* someone arrived: send them what they are missing */
    var have = msg.have || {};
    var missing = Store.ops.filter(function (o) {
      var n = parseInt((o.i.split(".")[1] || "0"), 36);
      return !(have[o.a] >= n);
    });
    if (missing.length) publish(missing.slice(-800), true);
  }
  if (msg.pres) {
    var p = peers.get(msg.from) || {};
    p.c = msg.pres.c; p.x = msg.pres.x; p.y = msg.pres.y; p.ts = performance.now();
    peers.set(msg.from, p);
    refreshPeopleGlyph(); dirty = true;
  }
  if (msg.live) {
    var lp = livePeers.get(msg.from) || { pts: [], c: colorOf(msg.from) };
    var conv = [];
    for (var j = 0; j + 1 < msg.live.p.length; j += 2) conv.push(mercX(msg.live.p[j + 1] / 1e5), mercY(msg.live.p[j] / 1e5));
    lp.pts = conv; lp.ts = performance.now();
    livePeers.set(msg.from, lp);
    dirty = true;
  }
}

function publish(ops, isReply) {
  var msg = { g: GID, from: ME, ops: ops };
  send(msg);
}
function send(msg) {
  var s = encodeMsg(msg);
  try { if (net.bc) net.bc.postMessage(s); } catch (e) { }
  try { if (net.mqtt && net.mqtt.ready) net.mqtt.publish(s); } catch (e) { }
}

/* same device, other tabs — always available */
try {
  net.bc = new BroadcastChannel("cg." + GID);
  net.bc.onmessage = function (e) { try { handleMsg(JSON.parse(e.data)); } catch (er) { } };
} catch (e) { net.bc = null; }

/* ---------- minimal MQTT 3.1.1 over WebSocket ---------- */
function MqttClient(url, topic, onMsg, onOpen, onFail) {
  var ws, ready = false, pingTimer = 0, self = this;
  var cid = "cg" + ME + Math.random().toString(36).slice(2, 7);
  function enc(str) { return new TextEncoder().encode(str); }
  function rem(len) { var out = []; do { var d = len % 128; len = Math.floor(len / 128); if (len > 0) d |= 128; out.push(d); } while (len > 0); return out; }
  function pack(type, flags, payload) {
    var head = [(type << 4) | flags].concat(rem(payload.length));
    var buf = new Uint8Array(head.length + payload.length);
    buf.set(head, 0); buf.set(payload, head.length);
    return buf;
  }
  function strBuf(s) { var b = enc(s); var o = new Uint8Array(b.length + 2); o[0] = b.length >> 8; o[1] = b.length & 255; o.set(b, 2); return o; }
  function cat() { var parts = [].slice.call(arguments); var n = parts.reduce(function (a, p) { return a + p.length; }, 0); var o = new Uint8Array(n), off = 0; for (var i = 0; i < parts.length; i++) { o.set(parts[i], off); off += parts[i].length; } return o; }

  try { ws = new WebSocket(url, ["mqtt"]); } catch (e) { onFail && onFail(); return; }
  ws.binaryType = "arraybuffer";
  var failed = false;
  var guard = setTimeout(function () { if (!ready) { failed = true; try { ws.close(); } catch (e) { } onFail && onFail(); } }, 7000);

  ws.onopen = function () {
    var vh = cat(strBuf("MQTT"), new Uint8Array([4, 0x02, 0, 30]));
    ws.send(pack(1, 0, cat(vh, strBuf(cid))));
  };
  ws.onerror = function () { if (!failed) { failed = true; clearTimeout(guard); onFail && onFail(); } };
  ws.onclose = function () { ready = false; self.ready = false; if (!failed) { failed = true; clearTimeout(guard); onFail && onFail(); } };
  ws.onmessage = function (ev) {
    var d = new Uint8Array(ev.data);
    var i = 0;
    while (i < d.length) {
      var type = d[i] >> 4, mult = 1, len = 0, j = i + 1, byte;
      do { byte = d[j++]; len += (byte & 127) * mult; mult *= 128; } while (byte & 128 && j < d.length);
      var body = d.subarray(j, j + len);
      if (type === 2) { /* CONNACK */
        if (body[1] === 0) {
          ready = true; self.ready = true; clearTimeout(guard);
          ws.send(pack(8, 2, cat(new Uint8Array([0, 1]), strBuf(topic), new Uint8Array([0]))));
          pingTimer = setInterval(function () { try { ws.send(new Uint8Array([0xC0, 0])); } catch (e) { } }, 20000);
          onOpen && onOpen();
        } else { failed = true; clearTimeout(guard); onFail && onFail(); }
      } else if (type === 3) { /* PUBLISH */
        var tl = (body[0] << 8) | body[1];
        var payload = body.subarray(2 + tl);
        try { onMsg(new TextDecoder().decode(payload)); } catch (e) { }
      }
      i = j + len;
    }
  };
  this.ready = false;
  this.publish = function (str) {
    if (!ready) return;
    try { ws.send(pack(3, 0, cat(strBuf(topic), enc(str)))); } catch (e) { }
  };
  this.close = function () { clearInterval(pingTimer); try { ws.close(); } catch (e) { } };
}

var BROKERS = [
  "wss://broker.emqx.io:8084/mqtt",
  "wss://test.mosquitto.org:8081/mqtt",
  "wss://broker.hivemq.com:8884/mqtt"
];
function connectNet() {
  if (net.tried >= BROKERS.length || net.state === "open") return;
  var url = BROKERS[net.tried++];
  var topic = "unsettled-atlas/commonground/" + GID;
  net.mqtt = new MqttClient(url, topic,
    function (s) { try { handleMsg(JSON.parse(s)); } catch (e) { } },
    function () {
      net.state = "open";
      var have = {};
      Store.ops.forEach(function (o) {
        var n = parseInt((o.i.split(".")[1] || "0"), 36);
        if (!(have[o.a] >= n)) have[o.a] = n;
      });
      send({ g: GID, from: ME, hello: 1, have: have });
      sendPresence();
    },
    function () { net.state = "local"; net.mqtt = null; setTimeout(connectNet, 600); }
  );
}

function sendPresence() {
  send({ g: GID, from: ME, pres: { c: MY_COLOR, x: V.x, y: V.y } });
}
setInterval(function () { if (net.mqtt && net.mqtt.ready) sendPresence(); }, 4000);

var liveTimer = 0;
function pushLive() {
  if (liveTimer) return;
  liveTimer = setTimeout(function () {
    liveTimer = 0;
    if (!drawingPts || drawingPts.length < 4) return;
    var p = [];
    var step = Math.max(1, Math.floor(drawingPts.length / 2 / 60));
    for (var i = 0; i < drawingPts.length; i += 2 * step) {
      p.push(Math.round(unMercY(drawingPts[i + 1]) * 1e5), Math.round(unMercX(drawingPts[i]) * 1e5));
    }
    send({ g: GID, from: ME, live: { p: p } });
  }, 130);
}

/* reconnect when the device comes back */
window.addEventListener("online", function () { if (net.state !== "open") { net.tried = 0; connectNet(); } });
document.addEventListener("visibilitychange", function () {
  if (!document.hidden && net.state !== "open") { net.tried = 0; connectNet(); }
});

/* ============================================================
   BOOT
   ============================================================ */
function boot() {
  resize();
  window.addEventListener("resize", resize);
  if (window.visualViewport) window.visualViewport.addEventListener("resize", resize);

  /* restore the ground */
  var lastVisit = parseInt(readLS(LS_VISIT, "0"), 10) || 0;
  var saved = loadLocal();
  var sortedSaved = saved.slice().sort(function (a, b) { return (a.t || 0) - (b.t || 0); });
  for (var i = 0; i < sortedSaved.length; i++) {
    var op = sortedSaved[i];
    addOp(op, { animate: lastVisit > 0 && op.t > lastVisit });
  }
  writeLS(LS_VISIT, String(Date.now()));

  /* frame first, everything else after */
  setTrace(false);
  refreshPeopleGlyph();
  syncPips();
  dirty = true;
  requestAnimationFrame(frame);

  /* if the ground is empty and we are far from it, sit over the reference city */
  setTimeout(function () { try { connectNet(); } catch (e) { } }, 700);
}

window.addEventListener("keydown", function (e) {
  if (e.key === "z" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); if (lastMine) undoBtn.click(); }
  if (e.key === "Escape") { openKnot = null; keyOpen = false; keyEl.classList.remove("show"); dirty = true; }
});

window.addEventListener("error", function () { /* never let a stray error blank the ground */ });

boot();
</script>
