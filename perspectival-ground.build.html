<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#efeadd">
<meta name="description" content="Perspectival Ground — a game played on real Atlanta, where becoming something else changes what the ground is.">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Perspectival Ground</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23efeadd'/%3E%3Cpath d='M3 22c7 0 5-12 13-12s6 12 13 12' fill='none' stroke='%23bf4526' stroke-width='2.6'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%231d201d'/%3E%3C/svg%3E">
<style>
  :root{
    --paper:#efeadd; --paper-lit:#f6f2e8; --ink:#1d201d;
    --ink-soft:rgba(29,32,29,.55); --signal:#bf4526;
    --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:var(--paper);color:var(--ink)}
  body{
    font-family:Georgia,"Times New Roman",serif;
    overscroll-behavior:none;touch-action:none;
    -webkit-user-select:none;user-select:none;
  }
  #stage{position:fixed;inset:0;touch-action:none}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  #hud{position:fixed;inset:0;pointer-events:none;z-index:5}
  #hud > *{pointer-events:auto}
  #boot{
    position:fixed;inset:0;z-index:20;display:grid;place-items:center;
    background:var(--paper);transition:opacity .5s ease;
  }
  #boot.gone{opacity:0;pointer-events:none}
  #boot div{font:italic 15px/1.6 Georgia,serif;color:var(--ink-soft);text-align:center}
  @media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="stage"><canvas id="cv"></canvas></div>
<div id="hud"></div>
<div id="boot"><div>Atlanta<br>is being woven</div></div>

<script>
/* the game, folded into one file — see pg/tools/bundle.mjs */
(function () {
  var SRC = {"geo.js":"/* PERSPECTIVAL GROUND — the ground under everything.\n\n   One coordinate system, shared by every module: web mercator on the unit\n   square, x east, y south. The camera is a point in that square plus a zoom.\n   Nothing in this game stores pixels. */\n\nexport const TAU = Math.PI * 2;\n\nexport const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);\nexport const lerp = (a, b, t) => a + (b - a) * t;\nexport const ease = (t) => t * t * (3 - 2 * t);\n/* deterministic noise — the same ground must look the same on every phone */\nexport function hash01(n) {\n  const x = Math.sin(n * 127.1 + 311.7) * 43758.5453;\n  return x - Math.floor(x);\n}\n\nexport const mercX = (lng) => (lng + 180) / 360;\nexport function mercY(lat) {\n  const s = Math.sin(clamp(lat, -85.05, 85.05) * Math.PI / 180);\n  return 0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI);\n}\nexport const unMercX = (x) => x * 360 - 180;\nexport const unMercY = (y) => (180 / Math.PI) * Math.atan(Math.sinh(Math.PI * (1 - 2 * y)));\n\n/* metres per mercator unit at Atlanta */\nexport const M_PER_UNIT = 40075016.686 * Math.cos(33.75 * Math.PI / 180);\nexport const metres = (u) => u * M_PER_UNIT;\nexport const units = (m) => m / M_PER_UNIT;\n\n/* ---------- the camera ----------\n   z is tile-zoom: worldSize = 256 * 2^z pixels across the whole earth. */\nexport const View = {\n  x: mercX(-84.3880), y: mercY(33.7490), z: 14.6,\n  w: 0, h: 0, dpr: 1,\n  safeTop: 0, safeBottom: 0,\n};\n\nexport const worldSize = () => 256 * Math.pow(2, View.z);\nexport const sx = (mx) => (mx - View.x) * worldSize() + View.w / 2;\nexport const sy = (my) => (my - View.y) * worldSize() + View.h / 2;\nexport const wx = (px) => (px - View.w / 2) / worldSize() + View.x;\nexport const wy = (py) => (py - View.h / 2) / worldSize() + View.y;\n/* pixels per metre at the current zoom — how big a thing on the ground is */\nexport const pxPerM = () => (worldSize() / M_PER_UNIT);\n\nexport function viewBounds(pad = 0) {\n  r x, qy = ay + dy * t - py;\n  return { d: Math.hypot(qx, qy), t, x: ax + dx * t, y: ay + dy * t };\n}\n\n/* Ramer–Douglas–Peucker, for turning a finger's mess into a line. */\nexport function simplify(pts, tol) {\n  if (pts.length < 6) return pts.slice();\n  const keep = new Uint8Array(pts.length / 2);\n  keep[0] = keep[pts.length / 2 - 1] = 1;\n  const stack = [[0, pts.length / 2 - 1]];\n  while (stack.length) {\n    const [i0, i1] = stack.pop();\n    let worst = -1, wi = -1;\n    for (let i = i0 + 1; i < i1; i++) {\n      const { d } = distToSeg(pts[i * 2], pts[i * 2 + 1], pts[i0 * 2], pts[i0 * 2 + 1], pts[i1 * 2], pts[i1 * 2 + 1]);\n      if (d > worst) { worst = d; wi = i; }\n    }\n    if (worst > tol && wi > 0) { keep[wi] = 1; stack.push([i0, wi], [wi, i1]); }\n  }\n  const out = [];\n  for (let i = 0; i < keep.length; i++) if (keep[i]) out.push(pts[i * 2], pts[i * 2 + 1]);\n  return out;\n}\n\nexport function pathLength(pts) {\n  let L = 0;\n  for (let i = 0; i + 3 < pts.length; i += 2) L += Math.hypot(pts[i + 2] - pts[i], pts[i + 3] - pts[i + 1]);\n  return L;\n}\n\n/* walk a distance along a polyline; returns position and heading */\nexport function alongPath(pts, dist) {\n  let acc = 0;\n  for (let i = 0; i + 3 < pts.length; i += 2) {\n    const seg = Math.hypot(pts[i + 2] - pts[i], pts[i + 3] - pts[i + 1]);\n    if (acc + seg >= dist || i + 5 >= pts.length) {\n      const t = seg > 0 ? clamp((dist - acc) / seg, 0, 1) : 0;\n      return {\n        x: lerp(pts[i], pts[i + 2], t),\n        y: lerp(pts[i + 1], pts[i + 3], t),\n        a: Math.atan2(pts[i + 3] - pts[i + 1], pts[i + 2] - pts[i]),\n        done: dist >= acc + seg && i + 5 >= pts.length,\n      };\n    }\n    acc += seg;\n  }\n  return { x: pts[0], y: pts[1], a: 0, done: true };\n}\n","graph.data.js":"/* PERSPECTIVAL GROUND — compiled ground graph.\n   Generated by pg/tools/build-graph.mjs from pg/ground.data.js. Do not edit by hand.\n   Junctions are real crossings of real ways. Culverts are real ince drawn into it. It never decides what is passable.\n   That is the being's job (see beings.js), and it is the whole game.\n\n   An edge is not a road. It is a piece of ground with properties — a class, a\n   length, a grade, a width, a pitch relative to the rest of this city, whether\n   it bridges water. Ask CAR and it is a road. Ask RAIN and it is a channel\n   with a fall. Ask WHEELCHAIR and it may be a wall. */\n\nimport { GRAPH } from \"./graph.data.js\";\nimport { distToSeg, metres, units, M_PER_UNIT } from \"./geo.js\";\n\n/* ---------- ASCII varint, the inverse of the compiler's ---------- */\nfunction dec(str) {\n  const out = [];\n  let i = 0;\n  const n = str.length;\n  while (i < n) {\n    let sh = 0, r = 0, b;\n    do { b = str.charCodeAt(i++) - 63; r |= (b & 0x1f) << sh; sh += 5; } while (b >= 0x20 && i < n);\n    out.push((r & 1) ? ~(r >> 1) : (r >> 1));\n  }\n  return out;\n}\nfunction undelta(list, scale) {\n  const out = new Float64Array(list.length);\n  let acc = 0;\n  for (let i = 0; i < list.length; i++) { acc += list[i]; out[i] = acc / scale; }\n  return out;\n}\n\n/* ---------- edge classes ---------- */\n/* The four the city came with, then the two the players make. */\nexport const CLS_MOTORWAY = 0, CLS_PRIMARY = 1, CLS_SECONDARY = 2, CLS_RAIL = 3;\nexport const CLS_MARK = 4;   /* something a player drew */\nexport const CLS_GHOST = 5;  /* a desire line that enough traffic has hardened */\nexport const CLS_NAME = [\"motorway\", \"primary\", \"secondary\", \"rail\", \"mark\", \"ghost\"];\n\n/* ---------- the graph ---------- */\nexport const G = {\n  n: 0,\n  nx: null, ny: null, nh: null,   /* node mercator x, y, height in metres */\n  adj: null,                      /* node -> [edge index, ...] */\n\n  /* edges, struct-of-arrays so the render loop can stay cheap */\n  ea: [], eb: [], ec: [], elen: [], egrade: [], epitch: [], ecul: [],\n  ewidth: [],   /* metres; how much room the ground gives you */\n  ecurb: [],    /* 0..1; how hard the ; }\n  return lo / pitchTable.length;\n}\n\n/* A drawn line that ends near existing ground joins it. This is why what you\n   draw becomes infrastructure and not graffiti. */\nconst JOIN = units(26);\nfunction snapOrAdd(x, y) {\n  const n = nearestNode(x, y, JOIN);\n  if (n >= 0) return n;\n  const i = addNode(x, y);\n  indexNode(i);\n  return i;\n}\n\n/* ---------- spatial index ---------- */\nconst CELL = 1 / Math.pow(2, 16);\nconst nodeCells = new Map();\nconst edgeCells = new Map();\nconst ckey = (cx, cy) => cx * 2097152 + cy;\n\nfunction indexNode(i) {\n  const k = ckey(Math.floor(G.nx[i] / CELL), Math.floor(G.ny[i] / CELL));\n  let b = nodeCells.get(k);\n  if (!b) nodeCells.set(k, b = []);\n  b.push(i);\n}\nfunction indexEdge(i) {\n  const a = G.ea[i], b = G.eb[i];\n  const cx0 = Math.floor(Math.min(G.nx[a], G.nx[b]) / CELL), cx1 = Math.floor(Math.max(G.nx[a], G.nx[b]) / CELL);\n  const cy0 = Math.floor(Math.min(G.ny[a], G.ny[b]) / CELL), cy1 = Math.floor(Math.max(G.ny[a], G.ny[b]) / CELL);\n  for (let cx = cx0; cx <= cx1; cx++) for (let cy = cy0; cy <= cy1; cy++) {\n    const k = ckey(cx, cy);\n    let bb = edgeCells.get(k);\n    if (!bb) edgeCells.set(k, bb = []);\n    bb.push(i);\n  }\n}\nfunction buildIndex() {\n  for (let i = 0; i < G.n; i++) indexNode(i);\n  for (let i = 0; i < G.e; i++) indexEdge(i);\n}\n\n/* Which pieces of ground are on screen right now.\n   The render loop must never walk the whole city to find out what it can see;\n   it asks here and gets back only what falls in the box. Edges straddle cells,\n   so a generation stamp does the de-duplicating without allocating a Set. */\nlet vpStamp = null, vpGen = 0;\nexport function edgesInBox(x0, y0, x1, y1, out, filter) {\n  out = out || [];\n  out.length = 0;\n  if (!vpStamp || vpStamp.length < G.e) {\n    const next = new Int32Array(Math.max(4096, G.e * 2));\n    if (vpStamp) next.set(vpStamp);\n    vpStamp = next;\n  }\n  const gen = ++vpGen;\n  const cx0 = Math.floor(x0 / CELL), cx1 = Math.floor(x1 / CELL);\n  const cy0 = Math.floor(y0 / CELL), cy1 = Math.floor(y1 / CELL);\n  for (let cx = cx0; cx <= cx1; cx++) {\n    for (let cy = cy0; cy <= cy1; cy++) {\n      const b = edgeCells.get(ckey(cx, cy));\n      if (!b) continue;\n      for (let i = 0; i < b.length; i++) {\n        const e = b[i];\n        if (vpStamp[e] === gen) continue;\n        vpStamp[e] = gen;\n        if (filter && !filter(e)) continue;\n        out.push(e);\n      }\n    }\n  }\n  return out;\n}\n\nexport function nearestNode(x, y, tol) {\n  const R = Math.max(1, Math.ceil((tol || CELL) / CELL));\n  const cx = Math.floor(x / CELL), cy = Math.floor(y / CELL);\n  let best = -1, bd = tol != null ? tol : Infinity;\n  for (let dx = -R; dx <= R; dx++) for (let dy = -R; dy <= R; dy++) {\n    const b = nodeCells.get(ckey(cx + dx, cy + dy));\n    if (!b) continue;\n    for (const i of b) {\n      const d = Math.hypot(G.nx[i] - x, G.ny[i] - y);\n      if (d < bd) { bd = d; best = i; }\n    }\n  }\n  return best;\n}\n\n/* The nearest ground a given being can actually stand on. A destination that\n   only a car can reach is not a destination when you are rain. */\nexport function nearestNodeFor(x, y, being, tol) {\n  const R = Math.max(2, Math.ceil((tol || CELL * 3) / CELL));\n  const cx = Math.floor(x / CELL), cy = Math.floor(y / CELL);\n  let best = -1, bd = Infinity;\n  for (let dx = -R; dx <= R; dx++) for (let dy = -R; dy <= R; dy++) {\n    const b = nodeCells.get(ckey(cx + dx, cy + dy));\n    if (!b) continue;\n    for (const i of b) {\n      if (being && !nodeLives(i, being)) continue;\n      const d = Math.hypot(G.nx[i] - x, G.ny[i] - y);\n      if (d < bd) { bd = d; best = i; }\n    }\n  }\n  return best;\n}\nfunction nodeLives(i, being) {\n  for (const e of G.adj[i]) if (isFinite(being.cost(e, G.ea[e] === i))) return true;\n  return false;\n}\n\nexport function nearestEdge(x, y, tol, filter) {\n  const R = Math.max(1, Math.ceil((tol || CELL) / CELL));\n  const cx = Math.floor(x / CELL), cy = Math.floor(y / CELL);\n  let best = -1, bd = tol != null ? tol : Infinity, bp = null;\n  const seen = new Set();\n  for (let dx = -R; dx <= R; dx++) for (let dy = -R; dy <= R; dy++) {\n    const b = edgeCells.get(ckey(cx + dx, cy + dy));\n    if (!b) continue;\n    for (const i of b) {\n      if (seen.has(i)) continue;\n      seen.add(i);\n      if (filter && !filter(i)) continue;\n      const a = G.ea[i], c = G.eb[i];\n      const r = distToSeg(x, y, G.nx[a], G.ny[a], G.nx[c], G.ny[c]);\n      if (r.d < bd) { bd = r.d; best = i; bp = r; }\n    }\n  }\n  return best < 0 ? null : { edge: best, d: bd, ...bp };\n}\n\n/* ---------- routing ----------\n   A* over whatever topology the being can see. If a being's cost is Infinity\n   the edge is not slow for it — it does not exist for it. */\nclass Heap {\n  constructor() { this.a = []; }\n  get size() { return this.a.length; }\n  push(node, f) {\n    const a = this.a;\n    a.push({ node, f });\n    let i = a.length - 1;\n    while (i > 0) {\n      const p = (i - 1) >> 1;\n      if (a[p].f <= a[i].f) break;\n      [a[p], a[i]] = [a[i], a[p]]; i = p;\n    }\n  }\n  pop() {\n    const a = this.a, top = a[0], last = a.pop();\n    if (a.length) {\n      a[0] = last;\n      let i = 0;\n      for (;;) {\n        const l = i * 2 + 1, r = l + 1;\n        let m = i;\n        if (l < a.length && a[l].f < a[m].f) m = l;\n        if (r < a.length && a[r].f < a[m].f) m = r;\n        if (m === i) break;\n        [a[m], a[i]] = [a[i], a[m]]; i = m;\n      }\n    }\n    return top;\n  }\n}\n\nconst MAX_EXPAND = 24000;\n\n/* route(from, to, being) -> {nodes, edges, dist, cost, balk} | null\n   balk is the interesting failure: where the being got closest before the\n   ground stopped offering it anything. A balk is not an error, it is a\n   discovery, and it is what the player is invited to draw across. */\nexport function route(from, to, being) {\n  if (from < 0 || to < 0) return null;\n  if (from === to) return { nodes: [from], edges: [], dist: 0, cost: 0, balk: null };\n\n  const gScore = new Map(), cameFrom = new Map(), cameEdge = new Map();\n  const open = new Heap();\n  const tx = G.nx[to], ty = G.ny[to];\n  const h = (n) => metres(Math.hypot(G.nx[n] - tx, G.ny[n] - ty)) * being.hMul;\n\n  gScore.set(from, 0);\n  open.push(from, h(from));\n  const closed = new Set();\n  let expanded = 0;\n  let nearest = from, nearD = Infinity;\n\n  while (open.size) {\n    const { node: cur } = open.pop();\n    if (closed.has(cur)) continue;\n    closed.add(cur);\n    if (++expanded > MAX_EXPAND) break;\n\n    const d = Math.hypot(G.nx[cur] - tx, G.ny[cur] - ty);\n    if (d < nearD) { nearD = d; nearest = cur; }\n\n    if (cur === to) {\n      const nodes = [cur], edges = [];\n      let n = cur;\n      while (cameFrom.has(n)) { edges.push(cameEdge.get(n)); n = cameFrom.get(n); nodes.push(n); }\n      nodes.reverse(); edges.reverse();\n      let dist = 0;\n      for (const e of edges) dist += G.elen[e];\n      return { nodes, edges, dist, cost: gScore.get(cur), balk: null };\n    }\n\n    const gc = gScore.get(cur);\n    for (const e of G.adj[cur]) {\n      const forward = G.ea[e] === cur;\n      const nxt = forward ? G.eb[e] : G.ea[e];\n      if (closed.has(nxt)) continue;\n      const c = being.cost(e, forward);\n      if (!isFinite(c)) continue;\n      const ng = gc + c;\n      if (ng < (gScore.get(nxt) ?? Infinity)) {\n        gScore.set(nxt, ng);\n        cameFrom.set(nxt, cur);\n        cameEdge.set(nxt, e);\n        open.push(nxt, ng + h(nxt));\n      }\n    }\n  }\n\n  /* Nowhere left to go. Hand back how far it got and where it stopped. */\n  const nodes = [nearest], edges = [];\n  let n = nearest;\n  while (cameFrom.has(n)) { edges.push(cameEdge.get(n)); n = cameFrom.get(n); nodes.push(n); }\n  nodes.reverse(); edges.reverse();\n  let dist = 0;\n  for (const e of edges) dist += G.elen[e];\n  return {\n    nodes, edges, dist, cost: gScore.get(nearest) ?? 0,\n    balk: { node: nearest, x: G.nx[nearest], y: G.ny[nearest], toX: tx, toY: ty, gap: metres(nearD) },\n  };\n}\n\n/* ---------- what a turn can afford ----------\n   A turn is not a distance, it is an effort. The same effort carries a car two\n   miles down the interstate and a wheelchair four hundred metres up a hill,\n   because the interstate costs a car almost nothing and the hill costs the\n   chair almost everything. Chutes and ladders were never a separate mechanic:\n   they are what a cost function looks like when you only get so much.\n\n   Returns the part of the route the traveller can pay for, and whether it had\n   to be cut short. */\nexport function afford(r, being, budget) {\n  if (!r || !r.edges.length) return { r, cut: false, spent: 0 };\n  let spent = 0, i = 0;\n  for (; i < r.edges.length; i++) {\n    const e = r.edges[i];\n    const forward = G.ea[e] === r.nodes[i];\n    const c = being.cost(e, forward);\n    if (!isFinite(c)) break;\n    if (spent + c > budget && i > 0) break;\n    spent += c;\n  }\n  if (i >= r.edges.length) return { r, cut: false, spent };\n\n  const nodes = r.nodes.slice(0, i + 1);\n  const edges = r.edges.slice(0, i);\n  let dist = 0;\n  for (const e of edges) dist += G.elen[e];\n  return {\n    r: { nodes, edges, dist, cost: spent, balk: null, short: true },\n    cut: true, spent,\n  };\n}\n\n/* the polyline a route draws on the ground */\nexport function routePoints(r) {\n  const pts = [];\n  for (const n of r.nodes) pts.push(G.nx[n], G.ny[n]);\n  return pts;\n}\n\n/* ---------- traces ----------\n   Every passage is remembered by the ground it passed over. */\nexport function wear(edges, amount = 1) {\n  for (const e of edges) G.euse[e] += amount;\n}\n","beings.js":"/* PERSPECTIVAL GROUND — the beings.\n\n   This is the game. Not the map, not the drawing — this.\n\n   Every being is a function from the same ground to a different topology.\n   Nothing here labels an edge a ladder or a chute. A being only says what a\n   piece of ground costs it, and everything else is a consequence:\n\n     cost is Infinity  ->  the ground does not exist for you\n     cost is cheap     ->  it carries you (a ladder)\n     cost is dear      ->  it takes from you (a chute)\n\n   So the same line a player draws is genuinely three different things to\n   three different travellers, and it is three different things because of\n   what it physically IS — its fall, its width, its kerb — never because\n   somebody tagged it. There is nothing to read. You find out by going. */\n\nimport { G, CLS_MOTORWAY, CLS_PRIMARY, CLS_SECONDARY, CLS_RAIL, CLS_MARK, CLS_GHOST } from \"./graph.js\";\n\n/* A multiplier on metres. 1 is ordinary going. */\nconst LADDER = 0.62;   /* at or below this, the ground is carrying you */\nconst CHUTE = 1.85;    /* at or above this, the ground is taking from you */\n\n/* How hard the traffic on an edge presses back. Roads silt up with use; paths\n   are worn open by it. The same number, read opposite ways. */\nfunction press(e) { return Math.min(1, G.euse[e] / 26); }\n\nfunction make(def) {\n  const b = {\n    ...def,\n    hMul: def.hMul ?? 0.8,\n    /* what this being makes of a piece of ground, in one word it never says */\n    read(e, forward) {\n      const c = b.cost(e, forward);\n      if (!isFinite(c)) return { live: false, kind: \"none\", ratio: Infinity };\n      const r = G.elen[e] > 0 ? c / G.elen[e] : 1;\n      return {\n        live: true,\n        kind: r <= LADDER ? \"ladder\" : r >= CHUTE ? \"chute\" : \"plain\",\n        ratio: r,\n      };\n    },\n  };\n  return b;\n}\n\n/* ============================================================\n   CAR\n   Sees road. Does not see the creek it drives over, does not see the stair,\n   does not see the line somebody drew unless it is wide enough to drive on.\n   Its ladder is the interstate. Its chute is everybody else also driving.\n   ============================================================ */\nexport const CAR = make({\n  id: \"car\", name: \"CAR\", glyph: \"▰\",\n  ink: { live: \"#3a403a\", ladder: \"#bf4526\", chute: \"#8a6a2f\", dead: \"#c9c2b2\" },\n  speed: 260,\n  cost(e, forward) {\n    const cls = G.ec[e], len = G.elen[e];\n    if (cls === CLS_RAIL) return Infinity;\n    if (cls === CLS_MARK && G.ewidth[e] < 3) return Infinity;  /* too narrow to drive */\n    let m;\n    if (cls === CLS_MOTORWAY) m = 0.42;\n    else if (cls === CLS_PRIMARY) m = 0.74;\n    else if (cls === CLS_SECONDARY) m = 1.0;\n    else if (cls === CLS_GHOST) m = 0.88;\n    else m = 1.15;\n    /* the road silts up with everything that has used it */\n    m *= 1 + press(e) * 1.9;\n    return len * m;\n  },\n});\n\n/* ============================================================\n   RAIN\n   Does not see road at all. Sees fall. It cannot go up, ever, so most of the\n   city simply is not there. A kerb is a wall it must pool against; a culvert\n   is the fastest thing in the world.\n   ============================================================ */\nexport const RAIN = make({\n  id: \"rain\", name: \"RAIN\", glyph: \"◈\",\n  ink: { live: \"#2f7d84\", ladder: \"#0f6f70\", chute: \"#7a2f4e\", dead: \"#cfc8b8\" },\n  speed: 420,\n  hMul: 0.4,\n  cost(e, forward) {\n    const len = G.elen[e];\n    /* grade is signed a->b; going the other way flips the hill */\n    const grade = forward ? G.egrade[e] : -G.egrade[e];\n    if (grade > 0.25) return Infinity;      /* water does not climb */\n    const fall = -grade;                    /* 0 .. 18 */\n    if (G.ecul[e]) return len * 0.28;       /* a real culvert under a real road */\n    /* steeper is faster; flat ground behind a high kerb is where rain stands */\n    const m = (1.02 - Math.min(0.75, fall * 0.5)) * (1 + G.ecurb[e] * 0.95);\n    return len * Math.max(0.3, m);\n  },\n});\n\n/* ============================================================\n   WHEELCHAIR\n   Sees grade, kerb, width — and almost nothing else. The interstate is not\n   slow for it, it is absent. The steepest ground in the city is a wall. What\n   it needs most is the thing nobody draws on purpose: a wide, gentle line\n   that touches down where the kerb is.\n   ============================================================ */\nexport const CHAIR = make({\n  id: \"chair\", name: \"WHEELCHAIR\", glyph: \"◍\",\n  ink: { live: \"#484e47\", ladder: \"#19a08a\", chute: \"#bf4526\", dead: \"#d2ccbd\" },\n  speed: 95,\n  cost(e, forward) {\n    const cls = G.ec[e], len = G.elen[e];\n    if (cls === CLS_MOTORWAY || cls === CLS_RAIL) return Infinity;\n    if (G.ewidth[e] < 1.15) return Infinity;          /* will not fit */\n    if (G.epitch[e] > 0.93) return Infinity;          /* the steepest ground here is a wall */\n    if (G.ecurb[e] >= 0.7) return Infinity;           /* a kerb with no cut */\n    let m = 0.92 + Math.pow(G.epitch[e], 1.6) * 2.4;\n    if (cls === CLS_MARK || cls === CLS_GHOST) {\n      /* somebody laid a gentle wide line. this is the whole point. */\n      m = G.epitch[e] < 0.72 ? 0.5 : 1.7;\n    }\n    m *= 1 + G.ecurb[e] * 0.75;\n    return len * m;\n  },\n});\n\n/* ============================================================\n   FOOT\n   Sees the most and is slowest at it. Walks the rail corridor, cuts the\n   drawn line, and is the being whose repeated detours become the desire\n   lines everybody else eventually inherits.\n   ============================================================ */\nexport const FOOT = make({\n  id: \"foot\", name: \"FOOT\", glyph: \"⏦\",\n  ink: { live: \"#5d635c\", ladder: \"#bf4526\", chute: \"#9a9083\", dead: \"#d2ccbd\" },\n  speed: 78,\n  cost(e, forward) {\n    const cls = G.ec[e], len = G.elen[e];\n    if (cls === CLS_MOTORWAY) return Infinity;        /* nobody walks the Connector */\n    let m;\n    if (cls === CLS_RAIL) m = 1.15;                   /* the corridor is a path here */\n    else if (cls === CLS_MARK) m = 0.78;\n    else if (cls === CLS_GHOST) m = 0.6;              /* worn open by everyone before you */\n    else if (cls === CLS_PRIMARY) m = 1.5;            /* wide, loud, no shade */\n    else m = 1.0;\n    m *= 1 + G.epitch[e] * 0.5;\n    /* a path is made better by being used, not worse */\n    m *= 1 - press(e) * 0.3;\n    return len * m;\n  },\n});\n\nexport const BEINGS = [CAR, RAIN, CHAIR, FOOT];\nexport const byId = (id) => BEINGS.find((b) => b.id === id) || CAR;\n\n/* The order you become things. Never the same twice running, and never a\n   being whose board is the one you just left. */\nexport function nextBeing(cur, rand = Math.random) {\n  const others = BEINGS.filter((b) => b.id !== cur.id);\n  return others[Math.floor(rand() * others.length)];\n}\n\n/* ---------- what a being is trying to do ----------\n   Used for the travellers the ground supplies when nobody else is here, and\n   for proposing somewhere to go. Rain wants the bottom. Everyone else wants\n   somewhere that is a real distance away. */\nexport function wants(being, fromNode) {\n  if (being.id === \"rain\") return { downhill: true };\n  return { far: true };\n}\n","state.js":"/* PERSPECTIVAL GROUND — what persists.\n\n   The city is given. Everything else in here was made by somebody passing\n   through, and it outlives them. Marks become ground. Journeys become\n   pressure. Pressure becomes ghost road. Nothing is ever deleted, because\n   the whole point is that the used world accumulates.\n\n   Multiplayer with no server: every tab on this device shares one cloth over\n   a BroadcastChannel, and the cloth is written to localStorage so it is still\n   there tomorrow. When nobody else is on the ground, travellers.js supplies\n   travellers — but they write to the same cloth as a person would. */\n\nimport { G, addWay, CLS_MARK, CLS_GHOST, wear } from \"./graph.js\";\nimport { byId, CAR, BEINGS } from \"./beings.js\";\n\nconst KEY = \"pg.cloth.v1\";\nconst CH = \"pg.cloth\";\n\n/* ---------- events ----------\n   Modules talk through here and never import each other, which is what lets\n   them be rebuilt one at a time. */\nconst handlers = new Map();\nexport function on(ev, fn) {\n  let a = handlers.get(ev);\n  if (!a) handlers.set(ev, a = []);\n  a.push(fn);\n  return () => { const i = a.indexOf(fn); if (i >= 0) a.splice(i, 1); };\n}\nexport function emit(ev, payload) {\n  const a = handlers.get(ev);\n  if (a) for (const fn of a.slice()) fn(payload);\n}\n\n/* ---------- identity ---------- */\nfunction rid() { return Math.random().toString(36).slice(2, 9); }\nfunction ls(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : v; } catch { return d; } }\nexport const ME = (() => {\n  let m = ls(\"pg.me\", \"\");\n  if (!m) { m = rid(); try { localStorage.setItem(\"pg.me\", m); } catch {} }\n  return m;\n})();\n\n/* ---------- the state ---------- */\nexport const S = {\n  me: ME,\n  being: CAR,\n  turn: 0,\n\n  /* what people drew. each has become edges in G. */\n  marks: [],\n  /* every completed passage, as a polyline. this is the ghost-road archive. */\n  journeys: [],\n  /* where travel stopped because the ground offered nothing: {x,y,n,being} */\n  pressure: [],\n  /* travellers currently on the ground, mine and everyone else's */\n  travellers: [],\n\n  /* the one the player is */\n  you: null,\n\n  /* set when a mark of yours is used by somebody who is not you */\n  witness: null,\n\n  /* the crossing */\n  goal: null,\n  rival: null,\n  allowance: 1500,\n\n  seq: 0,\n  ready: false,\n};\n\n/* ---------- the log ----------\n   Ops, not snapshots, so two tabs can merge without either winning. */\nlet ops = [];\nconst seen = new Set();\n\nfunction opId() { return ME + \".\" + (++S.seq).toString(36); }\n\nexport function apply(op, { local = true } = {}) {\n  if (!op || seen.has(op.id)) return false;\n  seen.add(op.id);\n  ops.push(op);\n\n  if (op.k === \"mark\") {\n    const mark = {\n      id: op.id, pts: op.pts, width: op.w, by: op.by, being: op.b, t: op.t,\n      edges: [], use: 0, users: [],\n    };\n    mark.edges = addWay(op.pts, CLS_MARK, mark);\n    S.marks.push(mark);\n    emit(\"mark\", mark);\n  } else if (op.k === \"journey\") {\n    const j = { id: op.id, pts: op.pts, by: op.by, being: op.b, t: op.t };\n    S.journeys.push(j);\n    if (op.e) wear(op.e, 1);\n    emit(\"journey\", j);\n  } else if (op.k === \"balk\") {\n    /* tx,ty is where the body was trying to get to. It is what makes a bruise\n       into a desire line later, so it is kept even though nothing reads it yet. */\n    const p = { x: op.x, y: op.y, tx: op.tx, ty: op.ty, n: 1, being: op.b, t: op.t };\n    const near = S.pressure.find((q) => Math.hypot(q.x - p.x, q.y - p.y) < 0.0000045);\n    if (near) {\n      near.n++;\n      if (near.tx == null) { near.tx = p.tx; near.ty = p.ty; }\n    } else S.pressure.push(p);\n    emit(\"balk\", near || p);\n  } else if (op.k === \"ghost\") {\n    const g = { id: op.id, pts: op.pts, t: op.t, edges: [] };\n    g.edges = addWay(op.pts, CLS_GHOST, null);\n    S.journeys.push({ ...g, ghost: true });\n    emit(\"ghost\", g);\n  }\n\n  if (local) { broadcast(op); save(); }\n  return true;\n}\n\n/* ---------- writing into the cloth ---------- */\nexport function layMark(pts, width, being) {\n  return apply({ k: \"mark\", id: opId(), pts, w: width, by: ME, b: being.id, t: Date.now() });\n}\nexport function logJourney(pts, edges, being) {\n  return apply({ k: \"journey\", id: opId(), pts, e: edges, by: ME, b: being.id, t: Date.now() });\n}\nexport function logBalk(x, y, being, tx, ty) {\n  return apply({ k: \"balk\", id: opId(), x, y, tx, ty, b: being.id, t: Date.now() });\n}\nexport function layGhost(pts) {\n  return apply({ k: \"ghost\", id: opId(), pts, t: Date.now() });\n}\n\n/* ---------- persistence ---------- */\nlet saveTimer = 0;\nfunction save() {\n  clearTimeout(saveTimer);\n  saveTimer = setTimeout(() => {\n    try {\n      const keep = ops.slice(-2400);\n      localStorage.setItem(KEY, JSON.stringify(keep));\n    } catch {}\n  }, 400);\n}\nexport function load() {\n  let raw = [];\n  try { raw = JSON.parse(ls(KEY, \"[]\")) || []; } catch {}\n  for (const op of raw) apply(op, { local: false });\n  S.ready = true;\n  emit(\"loaded\", raw.length);\n  return raw.length;\n}\n\n/* ---------- other tabs are other players ---------- */\nlet chan = null;\nexport function connect() {\n  try {\n    chan = new BroadcastChannel(CH);\n    chan.onmessage = (e) => {\n      const m = e.data;\n      if (!m) return;\n      if (m.t === \"op\") apply(m.op, { local: false });\n      else if (m.t === \"here\") emit(\"peer\", m);\n    };\n  } catch {}\n}\nfunction broadcast(op) { try { chan && chan.postMessage({ t: \"op\", op }); } catch {} }\nexport function announce(x, y, beingId) {\n  try { chan && chan.postMessage({ t: \"here\", me: ME, x, y, b: beingId, at: Date.now() }); } catch {}\n}\n\n/* ---------- becoming ---------- */\nexport function become(b) {\n  const prev = S.being;\n  S.being = b;\n  S.turn++;\n  emit(\"become\", { from: prev, to: b, turn: S.turn });\n}\n\n/* ---------- who used what ----------\n   The moment the game is about: somebody who is not you crossed your line,\n   and it did something to them it would not have done to you. */\nexport function creditMark(mark, traveller) {\n  if (!mark) return;\n  mark.use++;\n  if (!mark.users.includes(traveller.being.id)) mark.users.push(traveller.being.id);\n  if (mark.by === ME && traveller.by !== ME) {\n    S.witness = { mark, traveller, at: Date.now() };\n    emit(\"witness\", S.witness);\n  }\n}\n\nexport function reset() {\n  try { localStorage.removeItem(KEY); } catch {}\n  location.reload();\n}\n","ground.data.js":"/* Real Atlanta ground. Google-polyline (1e5) per layer, extracted from living-mapmaker.html.\n   OpenStreetMap-derived geometry. */\nexport const GROUND = {\"bbox\":[-84.55,33.62,-84.2,33.9],\"layers\":{\"boundary\":\"tk`cOiqzlE`M?o@zq@}k@@NqKiY@kBaSbBiJkHGuD~AvAxAwCjAcAfGgA`l@uAZdB~C}@bDzDHuGxS\\\\lf@pFAkAgQjy@gAmCfSnAxS`GxHiGcBFbH`B\\\\aBnNvLKTnWsLJx@loAa}@VBlm@e|@PKbw@hPnHlClMiCRPpEqPp@JpLaXF[zE}Ni@q ground.data.js\";\nimport {\n  View, sx, sy, worldSize, viewBounds, clamp, lerp, ease, hash01,\n  mercX, mercY, pxPerM,\n} from \"./geo.js\";\nimport {\n  G, edgesInBox, CLS_MOTORWAY, CLS_PRIMARY, CLS_SECONDARY, CLS_RAIL, CLS_MARK,\n} from \"./graph.js\";\nimport { S, on } from \"./state.js\";\n\nconst PAPER = \"#efeadd\", PAPER_LIT = \"#f7f3e8\";\n\n/* How the city is inked when it is nobody's in particular. It is read through\n   the veil, so it is stronger here than it ends up on the screen. */\nconst CITY = [\n  /* CLS_MOTORWAY  */ { col: \"#3b423b\", w: [1.3, 3.6], a: 0.84, gap: 2.6, met: 0.92, bed: 0.10 },\n  /* CLS_PRIMARY   */ { col: \"#4b524a\", w: [1.0, 2.7], a: 0.74, gap: 2.0, met: 0.88, bed: 0.07 },\n  /* CLS_SECONDARY */ { col: \"#5e655c\", w: [0.65, 1.9], a: 0.60, gap: 1.3, met: 0.78, bed: 0 },\n  /* CLS_RAIL      */ { col: \"#6e736d\", w: [0.6, 1.5], a: 0.52, gap: 0.0, met: 0, stitch: 1 },\n];\n/* how wide these pieces of ground are on the earth, in metres */\nconst CLS_M = [14, 10, 7, 4];\n/* laid weakest first, so the interstate surfaces through everything */\nconst CITY_ORDER = [CLS_RAIL, CLS_SECONDARY, CLS_PRIMARY, CLS_MOTORWAY];\n\nconst WATER = { col: \"#6f9fa8\", w: [1.8, 6.4], a: 0.78 };\nconst BOUND = { col: \"#9a9083\", w: [0.6, 1.1], a: 0.24 };\n\n/* how far back the city sits when it is not yours */\nconst VEIL = 0.34, VEIL_TURN = 0.56, TURN_MS = 760;\n\n/* the margin of extra cloth woven either side of the screen, in CSS px, so\n   that panning is a blit and not a reweave */\nconst MARGIN = 64;\n\nlet LAYERS = {}, PLACES = [], WATER_RUNS = [], BOUND_RUNS = [];\n\n/* ============================================================\n   the encoded city\n   ============================================================ */\nfunction decode(str) {\n  const out = [];\n  let i = 0;\n  const n = str.length;\n  while (i < n) {\n    let lat = 0, lng = 0;\n    const pts = [];\n    while (i < n && str[i] !== \"|\") {\n      let sh = 0, r = 0, b;\n      do { b = str.charCodeAt(i++) - 63; r |= (b & 0x1f) << sh; sh += 5; } while (b >= 0x20);\n      lng += (r & 1) ? ~(r >> 1) : (r >> 1);\n      sh = 0; r = 0;\n      do { b = str.charCodeAt(i++) - 63; r |= (b & 0x1f) << sh; sh += 5; } while (b >= 0x20);\n      lat += (r & 1) ? ~(r >> 1) : (r >> 1);\n      pts.push(mercX(lng / 1e5), mercY(lat / 1e5));\n    }\n    i++;\n    if (pts.length >= 4) out.push(Float64Array.from(pts));\n  }\n  return out;\n}\n\n/* chop a polyline into short runs with tight boxes, so that at street zoom the\n   cloth only ever looks at the handful of fibres actually under the screen */\nfunction runsOf(lines, span = 20) {\n  const runs = [];\n  if (!lines) return runs;\n  for (let li = 0; li < lines.length; li++) {\n    const p = lines[li];\n    const np = p.length / 2;\n    for (let s = 0; s < np - 1; s += span) {\n      const e = Math.min(np - 1, s + span);\n      let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;\n      for (let i = s; i <= e; i++) {\n        const x = p[i * 2], y = p[i * 2 + 1];\n        if (x < x0) x0 = x; if (x > x1) x1 = x;\n        if (y < y0) y0 = y; if (y > y1) y1 = y;\n      }\n      runs.push({ p, s, e, x0, y0, x1, y1, seed: (li * 7919 + s * 131) % 99991 });\n    }\n  }\n  return runs;\n}\n\n/* ============================================================\n   PAPER\n\n   Correlated grain so that ink has something to sit in, warp and weft so that\n   it is cloth and not stone, and under both of those the wide soft stains that\n   stop the ground being one flat tone. All three live in one tile, because a\n   whole screen of cloth has to be laid in a single fill.\n   ============================================================ */\nconst PAPER_TILE = 384;\nlet paperTile = null, sheet = null;\nconst sheets = new Map();\n\n/* one sheet of made paper, a whole screen and a tile wider, kept between frames */\nfunction ensureSheet(w, h) {\n  const key = w + \"x\" + h;\n  sheet = sheets.get(key);\n  if (sheet) return;\n  sheet = document.createElement(\"canvas\");\n  sheet.width = w + PAPER_TILE; sheet.height = h + PAPER_TILE;\n  const s = sheet.getContext(\"2d\", { alpha: false });\n  s.fillStyle = s.createPattern(paperTile, \"repeat\") || PAPER;\n  s.fillRect(0, 0, sheet.width, sheet.height);\n  if (sheets.size > 2) sheets.delete(sheets.keys().next().value);\n  sheets.set(key, sheet);\n}\n\n/* value noise on a lattice that wraps, so the tile has no seam */\nfunction wrapNoise(L, salt) {\n  const lat = new Float32Array((L + 1) * (L + 1));\n  for (let i = 0; i < L; i++) for (let j = 0; j < L; j++) lat[i * (L + 1) + j] = hash01(i * 131 + j * 977 + salt);\n  for (let i = 0; i < L; i++) { lat[i * (L + 1) + L] = lat[i * (L + 1)]; lat[L * (L + 1) + i] = lat[i]; }\n  lat[L * (L + 1) + L] = lat[0];\n  return lat;\n}\nfunction sampleWrap(lat, L, s, x, y) {\n  const k = s / L, fx = x / k, fy = y / k;\n  const x0 = fx | 0, y0 = fy | 0;\n  let tx = fx - x0, ty = fy - y0;\n  const a = lat[y0 * (L + 1) + x0], b = lat[y0 * (L + 1) + x0 + 1];\n  const c = lat[(y0 + 1) * (L + 1) + x0], d = lat[(y0 + 1) * (L + 1) + x0 + 1];\n  tx = tx * tx * (3 - 2 * tx); ty = ty * ty * (3 - 2 * ty);\n  return (a + (b - a) * tx) * (1 - ty) + (c + (d - c) * tx) * ty;\n}\n\nfunction makePaper() {\n  const s = PAPER_TILE, c = document.createElement(\"canvas\");\n  c.width = c.height = s;\n  const g = c.getContext(\"2d\");\n  const tooth = wrapNoise(96, 7), stain = wrapNoise(6, 411), broad = wrapNoise(3, 53);\n  const im = g.createImageData(s, s), d = im.data;\n  for (let y = 0; y < s; y++) {\n    for (let x = 0; x < s; x++) {\n      const t = sampleWrap(tooth, 96, s, x, y);\n      const st = sampleWrap(stain, 6, s, x, y);\n      const br = sampleWrap(broad, 3, s, x, y);\n      const fine = hash01(x * 7919 + y * 104729) + hash01(x * 3079 + y * 6151 + 11) * 0.7;\n      const weave = Math.sin(x * 1.5708) * 1.4 + Math.sin(y * 1.5708) * 1.0\n        + Math.sin((x + y) * 0.19) * 1.2;\n      /* the paper of this game, not a grey: warm, and it varies */\n      const v = 231 + t * 12 + fine * 6 + weave - st * 10 - br * 8;\n      const o = (y * s + x) * 4;\n      d[o] = v + 7; d[o + 1] = v + 1; d[o + 2] = v - 13 - st * 4; d[o + 3] = 255;\n    }\n  }\n  g.putImageData(im, 0, 0);\n  return c;\n}\n\n/* ============================================================\n   THE POOL\n\n   Every fibre that reaches the screen is projected exactly once a frame into\n   one flat pair of arrays, and every pass after that reads out of it. Nothing\n   below ever calls sx()/sy() twice for the same point.\n   ============================================================ */\nlet PX = new Float32Array(1 << 15), PY = new Float32Array(1 << 15);\nlet _cum = new Float32Array(1 << 12);\nlet pcur = 0, _seed = 0;\n\nfunction poolRoom(n) {\n  if (n <= PX.length) return;\n  const s = 1 << Math.ceil(Math.log2(n));\n  const nx = new Float32Array(s), ny = new Float32Array(s);\n  nx.set(PX); ny.set(PY);\n  PX = nx; PY = ny;\n}\nfunction cumRoom(n) { if (n > _cum.length) _cum = new Float32Array(1 << Math.ceil(Math.log2(n))); }\n\n/* project a chain of the graph; returns where it landed in the pool */\nfunction poolChain(ch) {\n  poolRoom(pcur + ch.np + 2);\n  const o = pcur;\n  let n = 0, lx = -1e9, ly = -1e9;\n  for (let i = 0; i < ch.np; i++) {\n    const X = sx(ch.px[i]), Y = sy(ch.py[i]);\n    if (n > 0 && i < ch.np - 1 && Math.abs(X - lx) < 0.5 && Math.abs(Y - ly) < 0.5) continue;\n    PX[o + n] = X; PY[o + n] = Y; lx = X; ly = Y; n++;\n  }\n  pcur = o + n;\n  return n;\n}\n\n/* project a run of one of the drawn city layers */\nfunction poolRun(r) {\n  poolRoom(pcur + (r.e - r.s) + 3);\n  const o = pcur;\n  let n = 0, lx = -1e9, ly = -1e9;\n  for (let i = r.s; i <= r.e; i++) {\n    const X = sx(r.p[i * 2]), Y = sy(r.p[i * 2 + 1]);\n    if (n > 0 && i < r.e && Math.abs(X - lx) < 0.5 && Math.abs(Y - ly) < 0.5) continue;\n    PX[o + n] = X; PY[o + n] = Y; lx = X; ly = Y; n++;\n  }\n  pcur = o + n;\n  return n;\n}\n\n/* A fibre only reads as spun if it varies over a distance the eye can see, so\n   the variation is measured in screen pixels — and a long straight run is\n   given points of its own to vary at. Written past the end of the pool, where\n   it can be overwritten by the next fibre that needs it. */\nconst SPUN = 19;\nfunction densify(off, n, at) {\n  if (n < 2) return n;\n  let need = 1;\n  for (let i = 0; i < n - 1; i++) {\n    need += Math.min(18, Math.max(1, Math.round(Math.hypot(PX[off + i + 1] - PX[off + i], PY[off + i + 1] - PY[off + i]) / SPUN)));\n  }\n  if (need <= n) {\n    if (at !== off) for (let i = 0; i < n; i++) { PX[at + i] = PX[off + i]; PY[at + i] = PY[off + i]; }\n    return n;\n  }\n  poolRoom(at + need + 2);\n  let m = 0;\n  for (let i = 0; i < n - 1; i++) {\n    const x0 = PX[off + i], y0 = PY[off + i], x1 = PX[off + i + 1], y1 = PY[off + i + 1];\n    const k = Math.min(18, Math.max(1, Math.round(Math.hypot(x1 - x0, y1 - y0) / SPUN)));\n    for (let j = 0; j < k; j++) {\n      const t = j / k;\n      PX[at + m] = x0 + (x1 - x0) * t; PY[at + m] = y0 + (y1 - y0) * t; m++;\n    }\n  }\n  PX[at + m] = PX[off + n - 1]; PY[at + m] = PY[off + n - 1]; m++;\n  return m;\n}\n\n/* ============================================================\n   THREADS — a fibre is a ribbon, not a slab\n   ============================================================ */\nfunction halfWidth(t, u, w, tapA, tapB) {\n  let ends = 1;\n  if (tapA) ends *= Math.pow(clamp(t / 0.22, 0, 1), 0.7);\n  if (tapB) ends *= Math.pow(clamp((1 - t) / 0.22, 0, 1), 0.7);\n  if (tapA || tapB) ends = Math.min(1, ends + 0.06);\n  const slow = hash01(_seed + Math.floor(u)) - 0.5;\n  const slow2 = hash01(_seed + 91 + Math.floor(u * 0.37)) - 0.5;\n  return w * 0.5 * ends * (1 + slow * 0.26 + slow2 * 0.17) + 0.15;\n}\n\n/* the offset outline of a spun fibre: it swells and thins down its length */\nfunction ribbon(c, off, n, w, tapA, tapB) {\n  cumRoom(n);\n  let total = 0;\n  _cum[0] = 0;\n  for (let i = 1; i < n; i++) {\n    total += Math.hypot(PX[off + i] - PX[off + i - 1], PY[off + i] - PY[off + i - 1]);\n    _cum[i] = total;\n  }\n  const k = 1 / SPUN;\n  let i, hw, ax, ay, len;\n  for (i = 0; i < n; i++) {\n    const t = n < 2 ? 1 : i / (n - 1);\n    hw = halfWidth(t, _cum[i] * k, w, tapA, tapB);\n    ax = PX[off + Math.min(i + 1, n - 1)] - PX[off + Math.max(i - 1, 0)];\n    ay = PY[off + Math.min(i + 1, n - 1)] - PY[off + Math.max(i - 1, 0)];\n    len = Math.hypot(ax, ay) || 1;\n    if (i === 0) c.moveTo(PX[off] - ay / len * hw, PY[off] + ax / len * hw);\n    else c.lineTo(PX[off + i] - ay / len * hw, PY[off + i] + ax / len * hw);\n  }\n  for (i = n - 1; i >= 0; i--) {\n    const t = n < 2 ? 1 : i / (n - 1);\n    hw = halfWidth(t, _cum[i] * k, w, tapA, tapB);\n    ax = PX[off + Math.min(i + 1, n - 1)] - PX[off + Math.max(i - 1, 0)];\n    ay = PY[off + Math.min(i + 1, n - 1)] - PY[off + Math.max(i - 1, 0)];\n    len = Math.hypot(ax, ay) || 1;\n    c.lineTo(PX[off + i] + ay / len * hw, PY[off + i] - ax / len * hw);\n  }\n  c.closePath();\n}\n\nfunction trace(c, off, n) {\n  c.moveTo(PX[off], PY[off]);\n  for (let i = 1; i < n; i++) c.lineTo(PX[off + i], PY[off + i]);\n}\n\n/* ============================================================\n   CHAINS — the graph, read back as corridors\n\n   The graph is the city, one short segment at a time. Nothing is beautiful one\n   segment at a time, so the segments are followed through their junctions into\n   corridors that can be spun as a single fibre. Every edge belongs to exactly\n   one corridor, and a corridor remembers which way round each of its edges\n   runs, because for RAIN that is the difference between a road and a wall.\n   ============================================================ */\nlet CHAINS = [];\nconst CH_CELL = 1 / 16384;\nconst chainCells = new Map();\nconst ckey = (cx, cy) => cx * 2097152 + cy;\nlet chStamp = null, chGen = 0;\n\nfunction buildChains() {\n  const used = new Uint8Array(G.e);\n  const MAXE = 40;\n  for (let e0 = 0; e0 < G.e; e0++) {\n    if (used[e0]) continue;\n    const cls = G.ec[e0];\n    if (cls > CLS_RAIL) continue;    /* what players lay is dynamic, not cloth */\n    used[e0] = 1;\n    const nodes = [G.ea[e0], G.eb[e0]], edges = [e0];\n    grow(nodes, edges, cls, used, MAXE, true);\n    grow(nodes, edges, cls, used, MAXE, false);\n    const np = nodes.length;\n    const px = new Float64Array(np), py = new Float64Array(np);\n    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;\n    for (let i = 0; i < np; i++) {\n      const n = nodes[i];\n      px[i] = G.nx[n]; py[i] = G.ny[n];\n      if (px[i] < x0) x0 = px[i]; if (px[i] > x1) x1 = px[i];\n      if (py[i] < y0) y0 = py[i]; if (py[i] > y1) y1 = py[i];\n    }\n    CHAINS.push({\n      cls, np, px, py, e: Int32Array.from(edges), x0, y0, x1, y1,\n      seed: (CHAINS.length * 48271) % 99991, off: -1, n: 0,\n    });\n  }\n  /* one coarse net over the corridors; the screen asks it what it covers */\n  for (let i = 0; i < CHAINS.length; i++) {\n    const ch = CHAINS[i];\n    const cx0 = Math.floor(ch.x0 / CH_CELL), cx1 = Math.floor(ch.x1 / CH_CELL);\n    const cy0 = Math.floor(ch.y0 / CH_CELL), cy1 = Math.floor(ch.y1 / CH_CELL);\n    for (let cx = cx0; cx <= cx1; cx++) for (let cy = cy0; cy <= cy1; cy++) {\n      const k = ckey(cx, cy);\n      let b = chainCells.get(k);\n      if (!b) chainCells.set(k, b = []);\n      b.push(i);\n    }\n  }\n  chStamp = new Int32Array(CHAINS.length);\n}\n\n/* follow the straightest continuation of the same kind of ground */\nfunction grow(nodes, edges, cls, used, cap, atEnd) {\n  for (;;) {\n    if (edges.length >= cap) return;\n    const tip = atEnd ? nodes[nodes.length - 1] : nodes[0];\n    const prev = atEnd ? nodes[nodes.length - 2] : nodes[1];\n    const hx = G.nx[tip] - G.nx[prev], hy = G.ny[tip] - G.ny[prev];\n    const hl = Math.hypot(hx, hy) || 1;\n    let best = -1, bestDot = 0.5, bestOther = -1;\n    const adj = G.adj[tip];\n    for (let i = 0; i < adj.length; i++) {\n      const e = adj[i];\n      if (used[e] || G.ec[e] !== cls) continue;\n      const other = G.ea[e] === tip ? G.eb[e] : G.ea[e];\n      if (other === prev) continue;\n      const dx = G.nx[other] - G.nx[tip], dy = G.ny[other] - G.ny[tip];\n      const dl = Math.hypot(dx, dy) || 1;\n      const dot = (hx * dx + hy * dy) / (hl * dl);\n      if (dot > bestDot) { bestDot = dot; best = e; bestOther = other; }\n    }\n    if (best < 0) return;\n    used[best] = 1;\n    if (atEnd) { nodes.push(bestOther); edges.push(best); }\n    else { nodes.unshift(bestOther); edges.unshift(best); }\n  }\n}\n\nfunction chainsInView(b, out) {\n  out.length = 0;\n  if (!chStamp) return out;\n  const gen = ++chGen;\n  const cx0 = Math.floor(b.x0 / CH_CELL), cx1 = Math.floor(b.x1 / CH_CELL);\n  const cy0 = Math.floor(b.y0 / CH_CELL), cy1 = Math.floor(b.y1 / CH_CELL);\n  for (let cx = cx0; cx <= cx1; cx++) {\n    for (let cy = cy0; cy <= cy1; cy++) {\n      const bucket = chainCells.get(ckey(cx, cy));\n      if (!bucket) continue;\n      for (let i = 0; i < bucket.length; i++) {\n        const ci = bucket[i];\n        if (chStamp[ci] === gen) continue;\n        chStamp[ci] = gen;\n        const ch = CHAINS[ci];\n        if (ch.x1 < b.x0 || ch.x0 > b.x1 || ch.y1 < b.y0 || ch.y0 > b.y1) continue;\n        if (skipClass(ch.cls)) continue;\n        out.push(ch);\n      }\n    }\n  }\n  return out;\n}\n\n/* zoomed far enough out, the fine ground stops being information */\nfunction skipClass(cls) {\n  if (cls === CLS_RAIL && View.z < 11.5) return true;\n  if (cls === CLS_SECONDARY && View.z < 11.2) return true;\n  return false;\n}\n\n/* ============================================================\n   init\n   ============================================================ */\nexport function init() {\n  for (const k in GROUND.layers) LAYERS[k] = decode(GROUND.layers[k]);\n  WATER_RUNS = runsOf(LAYERS.water, 14);\n  BOUND_RUNS = runsOf(LAYERS.boundary, 24);\n  PLACE
