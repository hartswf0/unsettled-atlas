pointerup\", up, { passive: true });\n  cv.addEventListener(\"pointercancel\", up, { passive: true });\n  /* the photograph is of a screen that no longer exists. drop it and let the\n     cloth finish the turn on its own rather than hold up a torn city. */\n  on(\"resize\", () => { t0 = 0; });\n}\n\nfunction ready(now) {\n  if (!due || now < due || t0) return false;\n  if (fingers.size > 0 || tripping) return false;\n  if (ctxRef && ctxRef.mode !== \"travel\") return false;   /* a hand is drawing */\n  /* a way is drawn and waiting to be taken: it is theirs, not the ground's.\n     abandoned long enough, though, and the turn takes it back. */\n  if (planAt && now - planAt < 4500) return false;\n  return true;\n}\n\n/* ============================================================\n   the photograph — the city, refusing to have changed\n   ============================================================ */\nlet snap = null, sctx = null;\nlet snapX = 0, snapY = 0, snapZ = 0;\n\nfunction photograph(cv) {\n  if (!cv.width || !cv.height) return false;\n  if (!snap) { snap = document.createElement(\"canvas\"); sctx = snap.getContext(\"2d\"); }\n  if (snap.width !== cv.width || snap.height !== cv.height) {\n    snap.width = cv.width; snap.height = cv.height;\n  }\n  sctx.setTransform(1, 0, 0, 1, 0, 0);\n  sctx.clearRect(0, 0, snap.width, snap.height);\n  sctx.drawImage(cv, 0, 0);\n  snapX = View.x; snapY = View.y; snapZ = View.z;\n  return true;\n}\n\n/* Where the photograph belongs now. It is pinned to the ground and not to the\n   glass, so a camera still settling from the last arrival cannot tear it. */\nfunction snapRect() {\n  const s = Math.pow(2, View.z - snapZ);\n  const ws = 256 * Math.pow(2, View.z);\n  return {\n    x: View.w / 2 * (1 - s) + (snapX - View.x) * ws,\n    y: View.h / 2 * (1 - s) + (snapY - View.y) * ws,\n    w: View.w * s, h: View.h * s,\n  };\n}\n\n/* ============================================================\n   the difference\n\n   Asked once, at the turn, of every piece of ground on this screen: what were\n   you, and what are you now. Three answers matter — it is gone, it is here,\n   it stands. Each edge keeps how long the front takes to reach it, so a frame\n   only ever touches what is in flight.\n   ============================================================ */\nconst LOST = 0, GAINED = 1, STANDS = 2;\nconst NBUCK = 8, NSLOT = 4, NGROUP = 3 * NSLOT * 2, NBIN = NGROUP * NBUCK;\n\nlet N = 0;\nlet EAX = null, EAY = null, EBX = null, EBY = null;   /* the ends, in the world */\nlet EDEL = null, EGRP = null;\nlet PSX = null, PSY = null, PQX = null, PQY = null, PCX = null, PCY = null;\nlet ORDER = null, KEY = null, COUNT = null, START = null, CUR = null;\n\nlet LOSTC = null, NEWC = null, DEADC = null;\nlet originX = 0, originY = 0, maxD = 1, phase = 0;\nlet t0 = 0, fromB = null, held = false;\n\nfunction rgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }\nfunction css(c) { return `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})`; }\nfunction mix(a, b, t) { return [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)]; }\n\n/* what a being makes of a piece of ground, both ways round: ground you could\n   only leave by is still ground you have */\nfunction kindOf(be, e) {\n  const a = be.read(e, true), b = be.read(e, false);\n  const ra = a.live ? a.ratio : Infinity, rb = b.live ? b.ratio : Infinity;\n  const r = ra <= rb ? a : b;\n  return !r.live ? 0 : r.kind === \"ladder\" ? 2 : r.kind === \"chute\" ? 3 : 1;\n}\n\nfunction room(n) {\n  if (EAX && EAX.length >= n) return;\n  const s = Math.max(1024, 1 << Math.ceil(Math.log2(n)));\n  EAX = new Float64Array(s); EAY = new Float64Array(s);\n  EBX = new Float64Array(s); EBY = new Float64Array(s);\n  EDEL = new Float32Array(s); EGRP = new Uint8Array(s);\n  PSX = new Float32Array(s); PSY = new Float32Array(s);\n  PQX = new Float32Array(s); PQY = new Float32Array(s);\n  PCX = new Float32Array(s); PCY = new Float32Array(s);\n  ORDER = new Int32Array(s); KEY = new Int16Array(s);\n  if (!COUNT) { COUNT = new Int32Array(NBIN); START = new Int32Array(NBIN); CUR = new Int32Array(NBIN); }\n}\n\nconst _box = [];\nconst _pri = [];\n\nfunction survey(from, to, quality) {\n  /* a big screen holds more ground than a phone, and a hole in the new board\n     is worse to look at than the cost of covering it */\n  const cap = Math.round((quality > 0.7 ? 2200 : 1000) *\n    clamp((View.w * View.h) / (390 * 844), 1, 2.2));\n  const b = viewBounds(50);\n  edgesInBox(b.x0, b.y0, b.x1, b.y1, _box);\n\n  /* the front leaves the traveller, because the change is happening to them */\n  const y = S.you;\n  originX = y ? sx(y.x) : View.w / 2;\n  originY = y ? sy(y.y) : View.h / 2;\n  maxD = 1;\n  for (let i = 0; i < 4; i++) {\n    const cx = (i & 1) * View.w, cy = (i >> 1) * View.h;\n    maxD = Math.max(maxD, Math.hypot(cx - originX, cy - originY));\n  }\n\n  room(_box.length + 8);\n  N = 0;\n  _pri.length = 0;\n  for (let i = 0; i < _box.length; i++) {\n    const e = _box[i];\n    const ok = kindOf(from, e), nk = kindOf(to, e);\n    if (ok === 0 && nk === 0) continue;\n\n    let cat, slot;\n    if (nk === 0) { cat = LOST; slot = ok - 1; }\n    else if (ok === 0) { cat = GAINED; slot = nk - 1; }\n    else { cat = STANDS; slot = (nk === 2 && ok !== 2) ? 3 : nk - 1; }\n\n    const a = G.ea[e], z = G.eb[e];\n    const ax = sx(G.nx[a]), ay = sy(G.ny[a]), bx = sx(G.nx[z]), by = sy(G.ny[z]);\n    if ((ax < -40 && bx < -40) || (ax > View.w + 40 && bx > View.w + 40) ||\n        (ay < -40 && by < -40) || (ay > View.h + 40 && by > View.h + 40)) continue;\n\n    const mx = (ax + bx) / 2, my = (ay + by) / 2;\n    const wide = G.ec[e] <= 1 ? 1 : 0;\n    EAX[N] = G.nx[a]; EAY[N] = G.ny[a]; EBX[N] = G.nx[z]; EBY[N] = G.ny[z];\n    /* exactly when the front arrives here — the inverse of frontR */\n    const d = clamp(Math.hypot(mx - originX, my - originY) / (maxD * OVER), 0, 0.999);\n    EDEL[N] = HOLD + SWEEP * (1 - Math.pow(1 - d, 1 / 1.45));\n    EGRP[N] = (cat * NSLOT + slot) * 2 + wide;\n    /* what a screen can lose first: ground that only stands there */\n    _pri.push((cat === STANDS ? 0 : 1e7) + Math.hypot(bx - ax, by - ay));\n    N++;\n  }\n\n  if (N > cap) {\n    const idx = Array.from({ length: N }, (_, i) => i);\n    idx.sort((p, q) => _pri[q] - _pri[p]);\n    idx.length = cap;\n    idx.sort((p, q) => EDEL[p] - EDEL[q]);\n    const ax = EAX.slice(0, N), ay = EAY.slice(0, N), bx = EBX.slice(0, N), by = EBY.slice(0, N);\n    const dl = EDEL.slice(0, N), gp = EGRP.slice(0, N);\n    for (let i = 0; i < cap; i++) {\n      const j = idx[i];\n      EAX[i] = ax[j]; EAY[i] = ay[j]; EBX[i] = bx[j]; EBY[i] = by[j];\n      EDEL[i] = dl[j]; EGRP[i] = gp[j];\n    }\n    N = cap;\n  }\n\n  LOSTC = [rgb(from.ink.live), rgb(from.ink.ladder), rgb(from.ink.chute), rgb(from.ink.ladder)];\n  NEWC = [rgb(to.ink.live), rgb(to.ink.ladder), rgb(to.ink.chute), rgb(to.ink.ladder)];\n  DEADC = rgb(from.ink.dead);\n  phase = hash01(S.turn * 13.7 + 3) * 6.283185;\n}\n\n/* ============================================================\n   the turn\n   ============================================================ */\nexport function turn() {\n  const ctx = ctxRef;\n  fromB = S.being;\n  const to = nextBeing(S.being);\n  held = !!(ctx && ctx.cv && photograph(ctx.cv));\n  survey(fromB, to, ctx ? ctx.quality : 1);\n  become(to);\n  due = 0;\n  t0 = performance.now();\n}\n\n/* ============================================================\n   the front\n   ============================================================ */\n/* it runs a little past the far corner, so no sliver of the old board is ever\n   left standing in a corner the wobble did not quite reach */\nconst OVER = 1.16;\nfunction frontR(t) {\n  const u = clamp((t - HOLD) / SWEEP, 0, 1);\n  return maxD * OVER * (1 - Math.pow(1 - u, 1.45));\n}\n\nconst NC = 80;\nfunction contour(c, R) {\n  for (let i = 0; i <= NC; i++) {\n    const th = i / NC * 6.283185;\n    /* cloth, not radar: the front comes apart at the scale of the weave */\n    const r = R * (1 + 0.055 * Math.sin(th * 3 + phase) + 0.032 * Math.sin(th * 7 - phase * 1.7)\n      + 0.018 * Math.sin(th * 13 + 1.1));\n    const X = originX + Math.cos(th) * r, Y = originY + Math.sin(th) * r;\n    if (i === 0) c.moveTo(X, Y); else c.lineTo(X, Y);\n  }\n  c.closePath();\n}\n\n/* How much of the new board the cloth is not yet carrying. cloth.js brings the\n   ground a being can use up over its own turn; behind the front it has to be\n   all the way there, so whatever is missing is made up here and handed back. */\nfunction shortfall(t) {\n  const k = clamp(t / HAND, 0, 1);\n  const rise = ease(0.3 + k * 0.7);\n  return clamp((0.97 - rise) / (1 - rise + 0.0001), 0, 1);\n}\n\n/* ============================================================\n   the frame\n   ============================================================ */\nexport function draw(ctx, now) {\n  if (ready(now)) turn();\n  if (!t0) return;\n  const t = now - t0;\n  if (t > DUR) { t0 = 0; return; }\n  const c = ctx.c;\n\n  c.save();\n  c.lineCap = \"round\";\n  c.lineJoin = \"round\";\n\n  if (!MOTION) {\n    const k = clamp(t / 320, 0, 1);\n    if (held && k < 1) {\n      const r = snapRect();\n      c.globalAlpha = 1 - ease(k);\n      c.drawImage(snap, r.x, r.y, r.w, r.h);\n      c.globalAlpha = 1;\n    }\n    threads(c, t, ctx.quality, true);\n    name(c, t);\n    c.restore();\n    return;\n  }\n\n  const R = frontR(t);\n\n  threads(c, t, ctx.quality, false);\n\n  /* the city, refusing. everything the front has not reached is untouched. */\n  if (held && R < maxD * (OVER + 0.02)) {\n    const r = snapRect();\n    c.save();\n    c.beginPath();\n    c.rect(-2, -2, View.w + 4, View.h + 4);\n    contour(c, R);\n    c.clip(\"evenodd\");\n    c.globalAlpha = 1;\n    c.drawImage(snap, r.x, r.y, r.w, r.h);\n    c.restore();\n  }\n\n  front(c, t, R, ctx.quality);\n  name(c, t);\n\n  c.globalAlpha = 1;\n  c.restore();\n}\n\n/* ---------- the front itself ----------\n   A band where the cloth is neither board: bare lit paper with the fibre ends\n   still showing where they have just been let go of.\n   ---------- */\nfunction front(c, t, R, q) {\n  if (t < HOLD) {\n    /* it gathers at the one place it is happening to, and lets go */\n    const u = clamp(t / HOLD, 0, 1);\n    c.globalAlpha = u * 0.8;\n    c.fillStyle = LIGHT;\n    c.beginPath();\n    c.arc(originX, originY, 3 + u * 12, 0, 6.283185);\n    c.fill();\n    c.globalAlpha = 1;\n    return;\n  }\n  if (R <= 0.5) return;\n  const u = clamp((t - HOLD) / SWEEP, 0, 1);\n  const fade = (1 - u * 0.28) * (1 - clamp((u - 0.84) / 0.16, 0, 1));\n  if (fade <= 0.01) return;\n\n  c.strokeStyle = PAPER_LIT;\n  if (q > 0.5) {\n    c.globalAlpha = 0.17 * fade;\n    c.lineWidth = 38;\n    c.beginPath(); contour(c, R - 11); c.stroke();\n  }\n  c.globalAlpha = 0.34 * fade;\n  c.lineWidth = 15;\n  c.beginPath(); contour(c, R - 3); c.stroke();\n\n  c.globalAlpha = 0.6 * fade;\n  c.strokeStyle = LIGHT;\n  c.lineWidth = 2.4;\n  c.beginPath(); contour(c, R); c.stroke();\n\n  /* the ends of what has just been let go of */\n  if (q > 0.55) {\n    c.globalAlpha = 0.34 * fade;\n    c.strokeStyle = \"#9a9083\";\n    c.lineWidth = 1.1;\n    c.beginPath();\n    for (let i = 0; i < 52; i++) {\n      const th = (i / 52) * 6.283185 + phase * 0.3;\n      const j = hash01(i * 31.7 + 5);\n      const r = R * (1 + 0.055 * Math.sin(th * 3 + phase) + 0.032 * Math.sin(th * 7 - phase * 1.7));\n      const ca = Math.cos(th), sa = Math.sin(th);\n      const i0 = -3 - j * 9, i1 = 2 + hash01(i * 7.3) * 10;\n      c.moveTo(originX + ca * (r + i0), originY + sa * (r + i0));\n      c.lineTo(originX + ca * (r + i1), originY + sa * (r + i1));\n    }\n    c.stroke();\n  }\n  c.globalAlpha = 1;\n}\n\n/* ---------- the fibres ----------\n   Everything in flight this frame, counting-sorted into a handful of paths, so\n   that two thousand fibres cost a dozen strokes.\n   ---------- */\nfunction threads(c, t, q, flat) {\n  if (!N) return;\n  const sup = shortfall(t);\n  COUNT.fill(0);\n  let live = 0;\n\n  for (let i = 0; i < N; i++) {\n    const tl = flat ? 1e4 : t - EDEL[i];\n    if (tl < 0) continue;\n    const g = EGRP[i];\n    const cat = (g >> 3);\n    let bk;\n    if (cat === STANDS) {\n      /* it does not arrive. it was always there. it is only read again. */\n      if (sup <= 0.02) continue;\n      bk = Math.min(NBUCK - 1, (tl / 9) | 0);\n    } else {\n      const span = cat === LOST ? LOST_MS : GAIN_MS;\n      if (tl >= span) continue;\n      bk = Math.min(NBUCK - 1, ((tl / span) * NBUCK) | 0);\n    }\n\n    const ax = sx(EAX[i]), ay = sy(EAY[i]), bx = sx(EBX[i]), by = sy(EBY[i]);\n    const mx = (ax + bx) / 2, my = (ay + by) / 2;\n\n    if (cat === STANDS) {\n      PSX[i] = ax; PSY[i] = ay; PQX[i] = bx; PQY[i] = by;\n      PCX[i] = mx; PCY[i] = my;\n    } else {\n      /* A piece of this city is short — a block, twenty pixels — so a bow\n         alone would say nothing. What a fibre losing its tension does is come\n         away from its junctions, shorten, fall and sag, all at once, and the\n         whole board visibly comes apart at the seams. Arriving is that run\n         backwards: a short slack fragment lying low in the paper that reaches\n         out to its neighbours, rises, and pulls straight. */\n      const dx = bx - ax, dy = by - ay;\n      const L = Math.hypot(dx, dy) || 1;\n      /* of the two perpendiculars, the one pointing down the screen */\n      let px = -dy / L, py = dx / L;\n      if (py < 0) { px = -px; py = -py; }\n      const pull = 0.42 + 0.58 * py;\n      const p = tl / (cat === LOST ? LOST_MS : GAIN_MS);\n\n      let hold, drop, bow;\n      if (cat === LOST) {\n        hold = 1 - 0.5 * ease(p);\n        drop = (2 + 16 * p * p) * pull;\n        bow = Math.min(22, L * 0.34) * Math.pow(p, 1.3) * pull;\n      } else {\n        const taut = 1 - Math.pow(1 - clamp(p / 0.62, 0, 1), 2.6);\n        hold = 0.5 + 0.5 * taut;\n        drop = 7.5 * (1 - taut) * pull;\n        bow = Math.min(20, L * 0.3) * (1 - taut) * pull - Math.sin(taut * 3.14159) * 1.8;\n      }\n      PSX[i] = mx + (ax - mx) * hold + px * drop;\n      PSY[i] = my + (ay - my) * hold + py * drop;\n      PQX[i] = mx + (bx - mx) * hold + px * drop;\n      PQY[i] = my + (by - my) * hold + py * drop;\n      PCX[i] = mx + px * (drop + bow * 2);\n      PCY[i] = my + py * (drop + bow * 2);\n    }\n\n    const key = g * NBUCK + bk;\n    KEY[i] = key;\n    COUNT[key]++;\n    live++;\n  }\n  if (!live) return;\n\n  let acc = 0;\n  for (let b = 0; b < NBIN; b++) { START[b] = acc; CUR[b] = acc; acc += COUNT[b]; }\n  for (let i = 0; i < N; i++) {\n    const tl = flat ? 1e4 : t - EDEL[i];\n    if (tl < 0) continue;\n    const cat = EGRP[i] >> 3;\n    if (cat === STANDS) { if (sup <= 0.02) continue; }\n    else if (tl >= (cat === LOST ? LOST_MS : GAIN_MS)) continue;\n    ORDER[CUR[KEY[i]]++] = i;\n  }\n\n  const zt = clamp((View.z - 10.5) / 6.5, 0, 1);\n  const ppm = pxPerM();\n\n  for (let b = 0; b < NBIN; b++) {\n    const n = COUNT[b];\n    if (!n) continue;\n    const bk = b % NBUCK, g = (b / NBUCK) | 0;\n    const cat = g >> 3, wide = g & 1, slot = (g >> 1) & 3;\n    const p = (bk + 0.5) / NBUCK;\n\n    /* near enough to what the cloth will lay for the same ground, so that the\n       hand-back is a settling and never a step */\n    const base = wide\n      ? Math.max(lerp(1.15, 3.15, zt), 12 * ppm * 0.9)\n      : Math.max(lerp(0.72, 1.95, zt), 6 * ppm * 0.78);\n    const kmul = (slot === 1 || slot === 3) ? 1.7 : slot === 2 ? 1.05 : 1.25;\n    /* what drags on you was never laid as heavily as what carries you, in this\n       cloth or any other; matching that here is what makes the hand-back mute */\n    const ka = slot === 2 ? 0.6 : slot === 0 ? 0.95 : 1;\n\n    let col, alpha, w;\n    if (cat === LOST) {\n      col = css(mix(LOSTC[slot], DEADC, Math.pow(p, 0.6)));\n      alpha = Math.pow(1 - p, 1.15) * 0.95 * ka;\n      w = Math.max(0.8, base * kmul * (1 - p * 0.55));\n    } else if (cat === GAINED) {\n      /* it is there at once, and slack; what takes the time is the tightening */\n      const rise = clamp(p / 0.14, 0, 1);\n      const taut = clamp(p / 0.62, 0, 1);\n      const gone = clamp((p - 0.7) / 0.3, 0, 1);\n      alpha = rise * (1 - gone * (1 - sup * 0.9)) * (0.62 + 0.38 * taut) * ka;\n      col = css(NEWC[slot]);\n      w = Math.max(0.9, base * kmul * (0.45 + 0.55 * taut));\n    } else {\n      col = css(NEWC[slot]);\n      alpha = sup * Math.min(1, (bk + 1) / 3) * 0.86 * ka;\n      w = Math.max(0.9, base * kmul);\n    }\n    if (alpha <= 0.015) continue;\n\n    c.globalAlpha = alpha;\n    c.strokeStyle = col;\n    c.lineWidth = w;\n    c.beginPath();\n    const s0 = START[b];\n    if (cat === STANDS) {\n      /* ground that stands is straight, and a straight line is a cheaper thing\n         to rasterise than a curve — which matters, because this is the bulk */\n      for (let k = 0; k < n; k++) {\n        const i = ORDER[s0 + k];\n        c.moveTo(PSX[i], PSY[i]);\n        c.lineTo(PQX[i], PQY[i]);\n      }\n    } else {\n      for (let k = 0; k < n; k++) {\n        const i = ORDER[s0 + k];\n        c.moveTo(PSX[i], PSY[i]);\n        c.quadraticCurveTo(PCX[i], PCY[i], PQX[i], PQY[i]);\n      }\n    }\n    c.stroke();\n\n    if (q > 0.45) {\n      /* the instant a fibre goes taut, it rings */\n      if (cat === GAINED && bk === 4) {\n        c.globalAlpha = alpha * 0.75;\n        c.strokeStyle = LIGHT;\n        c.lineWidth = Math.max(0.7, w * 0.3);\n        c.stroke();\n      }\n      /* ground that has only just started carrying you blooms out of the\n         cloth, and so does ground that carries you and is about to stop */\n      if (slot === 3 || (cat !== STANDS && slot === 1)) {\n        c.globalAlpha = alpha * (slot === 3 ? 0.24 : 0.13);\n        c.strokeStyle = col;\n        c.lineWidth = w * (slot === 3 ? 3.4 : 2.6);\n        c.stroke();\n      }\n    }\n  }\n  c.globalAlpha = 1;\n}\n\n/* ============================================================\n   the name\n\n   The sentence does not change. Only the noun does — the old one lets go and\n   spreads apart as it leaves, the new one arrives loose and draws itself in.\n   It is a name and nothing else: no gloss, no list, no key.\n   ============================================================ */\nfunction runWord(c, s, x, y, sp, stroke) {\n  let X = x;\n  for (let i = 0; i < s.length; i++) {\n    if (stroke) c.strokeText(s[i], X, y); else c.fillText(s[i], X, y);\n    X += c.measureText(s[i]).width + sp;\n  }\n}\nfunction runWidth(c, s, sp) {\n  let w = 0;\n  for (let i = 0; i < s.length; i++) w += c.measureText(s[i]).width + sp;\n  return w - sp;\n}\n\nfunction name(c, t) {\n  const to = S.being;\n  if (!to || !fromB) return;\n  const size = clamp(View.w * 0.062, 23, 34);\n  const out = ease(clamp((t - 800) / 340, 0, 1));\n  const a = 1 - out;\n  if (a <= 0.01) return;\n\n  const inn = ease(clamp((t - 120) / 300, 0, 1));\n  const preA = a * ease(clamp(t / 200, 0, 1)) * 0.5;\n  const oldOut = ease(clamp((t - 30) / 260, 0, 1));\n\n  const pre = \"you are\";\n  c.textAlign = \"left\";\n  c.textBaseline = \"alphabetic\";\n  c.lineJoin = \"round\";\n\n  c.font = `italic ${size * 0.56}px Georgia, serif`;\n  const preW = c.measureText(pre).width;\n\n  c.font = `italic ${size}px Georgia, serif`;\n  const nName = to.name.toLowerCase();\n  const spNew = lerp(size * 0.2, size * 0.055, inn);\n  const nW = runWidth(c, nName, spNew);\n\n  const gap = size * 0.44;\n  const x0 = (View.w - (preW + gap + nW)) / 2;\n  const y = View.h * 0.315 + (1 - inn) * 6;\n  const xN = x0 + preW + gap;\n\n  c.font = `italic ${size * 0.56}px Georgia, serif`;\n  c.globalAlpha = preA * 1.5;\n  c.strokeStyle = PAPER_LIT; c.lineWidth = 5;\n  c.strokeText(pre, x0, y - size * 0.03);\n  c.globalAlpha = preA;\n  c.fillStyle = \"#1d201d\";\n  c.fillText(pre, x0, y - size * 0.03);\n\n  /* what you were, letting go */\n  if (oldOut < 1) {\n    const spOld = lerp(size * 0.055, size * 0.3, oldOut);\n    c.font = `italic ${size}px Georgia, serif`;\n    c.globalAlpha = (1 - oldOut) * 0.85;\n    c.strokeStyle = PAPER_LIT; c.lineWidth = 5;\n    runWord(c, fromB.name.toLowerCase(), xN, y - oldOut * 7, spOld, true);\n    c.globalAlpha = (1 - oldOut) * 0.55;\n    c.fillStyle = fromB.ink.live;\n    runWord(c, fromB.name.toLowerCase(), xN, y - oldOut * 7, spOld, false);\n  }\n\n  /* what you are, drawing itself in */\n  c.font = `italic ${size}px Georgia, serif`;\n  c.globalAlpha = a * inn * 0.9;\n  c.strokeStyle = PAPER_LIT; c.lineWidth = 6;\n  runWord(c, nName, xN, y, spNew, true);\n  c.globalAlpha = a * inn;\n  c.fillStyle = to.ink.live;\n  runWord(c, nName, xN, y, spNew, false);\n\n  /* one hairline, drawn under it at the speed the word tightens */\n  c.globalAlpha = a * inn * 0.45;\n  c.strokeStyle = to.ink.ladder;\n  c.lineWidth = 1.2;\n  c.beginPath();\n  c.moveTo(xN, y + size * 0.24);\n  c.lineTo(xN + nW * inn, y + size * 0.24);\n  c.stroke();\n\n  c.globalAlpha = 1;\n}\n","goal.js":"/* PERSPECTIVAL GROUND — the crossing.\n\n   Without this file the rest is a world. This is the game.\n\n   THE CROSSING. Somewhere across Atlanta there is a real place. You are trying\n   to reach it. So is somebody else, and they are as fast as you are.\n\n   THE TURN. A turn is not a distance, it is an effort — and what an effort buys\n   depends entirely on what you have become. The interstate costs a car almost\n   nothing, so as a car one turn is two miles. A hill costs a wheelchair almost\n   everything, so as a wheelchair the same turn is four hundred metres. That is\n   chutes and ladders, and it was already sitting in the cost function; all this\n   does is give you only so much of it.\n\n   WHY DRAWING MATTERS. Three reasons, and none of them is explained anywhere in\n   the game:\n     - past a balk it is the only move you have.\n     - a good line is a ladder for the body that needs it, so the ramp you lay\n       today is the reason a later turn covers three kilometres instead of four\n       hundred metres. Drawing is how you buy future speed.\n     - your rival can use it too. Everything you lay into the ground is laid\n       into their ground. Sometimes the honest move is not to build.\n\n   You draw the world without knowing who it will serve. Here that stops being\n   a theme and starts costing you the crossing. */\n\nimport { GROUND } from \"./ground.data.js\";\nimport {\n  View, sx, sy, mercX, mercY, metres, units, clamp, lerp, ease, TAU,\n  worldSize, viewBounds,\n} from \"./geo.js\";\nimport { G, route, routePoints, nearestNodeFor, afford, wear } from \"./graph.js\";\nimport { BEINGS, nextBeing, byId } from \"./beings.js\";\nimport { S, on, emit, creditMark, logBalk } from \"./state.js\";\n\n/* one turn's worth of going */\nconst ALLOWANCE = 1500;\n/* how near is arrived */\nconst ARRIVE = 260;\n\nconst AMBER = \"#c98a2e\", AMBER_DEEP = \"#8a5a12\";\n\nlet goal = null;        /* {x,y,name} */\nlet rival = null;       /* {node,x,y,being,trip,reached} */\nlet over = null;        /* {who, turns} */\nlet turns = 0;\nlet banner = null;      /* {text, t0, life} */\n\nexport function init(ctx) {\n  S.allowance = ALLOWANCE;\n  on(\"boot\", () => setTimeout(start, 60));\n  on(\"arrive\", () => { if (!over) setTimeout(rivalTurn, 520); });\n  on(\"become\", () => { turns++; });\n  /* the moment the game is actually about */\n  on(\"witness\", (w) => {\n    say(`${w.traveller.being.name.toLowerCase()} took your line`);\n  });\n}\n\n/* ---------- setting up a crossing ---------- */\nfunction start() {\n  const me = S.you;\n  if (!me) { setTimeout(start, 120); return; }\n\n  /* a real place, far enough that it is a journey and near enough that it is\n     not a joke. the name is real; nothing about it is a legend. */\n  const here = { x: me.x, y: me.y };\n  const cands = (GROUND.places || [])\n    .map((p) => ({ name: p[0], kind: p[1], x: mercX(p[2] / 1e5), y: mercY(p[3] / 1e5) }))\n    .map((p) => ({ ...p, d: metres(Math.hypot(p.x - here.x, p.y - here.y)) }))\n    .filter((p) => p.d > 2600 && p.d < 7000)\n    .sort((a, b) => a.d - b.d);\n  const pick = cands.length ? cands[Math.floor(Math.random() * Math.min(4, cands.length))] : null;\n  if (!pick) { goal = null; return; }\n\n  const gn = nearestNodeFor(pick.x, pick.y, null, units(1200));\n  goal = gn >= 0 ? { x: G.nx[gn], y: G.ny[gn], node: gn, name: pick.name }\n                 : { x: pick.x, y: pick.y, node: -1, name: pick.name };\n\n  /* the other one starts where you start. the ground is the only advantage\n     either of you gets. */\n  rival = {\n    x: me.x, y: me.y, node: me.node,\n    being: nextBeing(S.being), trip: null, reached: false,\n  };\n  S.rival = rival;\n  S.goal = goal;\n  over = null; turns = 0;\n  say(pick.name.toLowerCase());\n  emit(\"crossing\", { goal, rival });\n}\n\nfunction say(text) { banner = { text, t0: performance.now(), life: 2400 }; }\n\n/* ---------- the other one ----------\n   It plays by your rules exactly: it becomes something, it gets one turn's\n   effort, it takes what the ground will give it, and it uses whatever anybody\n   has drawn. It is not cheating and it is not being kind. */\nfunction rivalTurn() {\n  if (!rival || !goal || over) return;\n  rival.being = nextBeing(rival.being);\n\n  const from = nearestNodeFor(rival.x, rival.y, rival.being, units(900));\n  if (from < 0) return checkOver();\n  rival.node = from;\n\n  const to = goal.node >= 0 ? goal.node : nearestNodeFor(goal.x, goal.y, rival.being, units(1200));\n  if (to < 0) return checkOver();\n\n  const full = route(from, to, rival.being);\n  if (!full || full.nodes.length < 2) return checkOver();\n  const { r } = afford(full, rival.being, ALLOWANCE);\n  if (!r || r.nodes.length < 2) return checkOver();\n\n  wear(r.edges, 1);\n  for (const e of r.edges) {\n    const m = G.emark[e];\n    if (m) creditMark(m, { being: rival.being, by: \"rival\" });\n  }\n  if (full.balk) logBalk(full.balk.x, full.balk.y, rival.being, full.balk.toX, full.balk.toY);\n\n  const pts = routePoints(r);\n  S.journeys.push({ pts, by: \"rival\", being: rival.being.id, t: Date.now() });\n  rival.trip = { pts, at: 0, T: 1500, e: 0, last: r.nodes[r.nodes.length - 1] };\n}\n\nfunction checkOver() {\n  if (over || !goal) return;\n  const me = S.you;\n  if (me && metres(Math.hypot(me.x - goal.x, me.y - goal.y)) < ARRIVE) {\n    over = { who: \"you\", turns };\n    say(\"you crossed first\");\n    emit(\"crossing-over\", over);\n  } else if (rival && metres(Math.hypot(rival.x - goal.x, rival.y - goal.y)) < ARRIVE) {\n    over = { who: \"rival\", turns };\n    say(\"it crossed first\");\n    emit(\"crossing-over\", over);\n  }\n}\n\n/* ============================================================\n   drawing\n   ============================================================ */\nexport function draw(ctx, now) {\n  const c = ctx.c;\n  if (rival && rival.trip) stepRival(ctx);\n  checkOver();\n\n  if (goal) drawGoal(c, now);\n  if (rival) drawRival(c, now);\n  if (banner) drawBanner(c, now);\n}\n\nfunction stepRival(ctx) {\n  const t = rival.trip;\n  t.e += ctx.dt;\n  const k = clamp(t.e / t.T, 0, 1);\n  const s = ease(k);\n  /* walk the polyline */\n  let total = 0;\n  for (let i = 0; i + 3 < t.pts.length; i += 2) {\n    total += Math.hypot(t.pts[i + 2] - t.pts[i], t.pts[i + 3] - t.pts[i + 1]);\n  }\n  let want = total * s, acc = 0;\n  for (let i = 0; i + 3 < t.pts.length; i += 2) {\n    const seg = Math.hypot(t.pts[i + 2] - t.pts[i], t.pts[i + 3] - t.pts[i + 1]);\n    if (acc + seg >= want || i + 5 >= t.pts.length) {\n      const u = seg > 0 ? clamp((want - acc) / seg, 0, 1) : 0;\n      rival.x = lerp(t.pts[i], t.pts[i + 2], u);\n      rival.y = lerp(t.pts[i + 1], t.pts[i + 3], u);\n      break;\n    }\n    acc += seg;\n  }\n  if (k >= 1) { rival.node = t.last; rival.trip = null; }\n}\n\n/* The place you are both going. A real name on real ground, standing there\n   whether or not anybody can reach it. */\nfunction drawGoal(c, now) {\n  const X = sx(goal.x), Y = sy(goal.y);\n  const on = X > -80 && X < View.w + 80 && Y > -80 && Y < View.h + 80;\n  const pulse = 0.5 + 0.5 * Math.sin(now / 900);\n\n  if (on) {\n    c.save();\n    c.globalAlpha = 0.24 + pulse * 0.12;\n    c.strokeStyle = \"#1d201d\";\n    c.lineWidth = 1.4;\n    c.beginPath();\n    c.arc(X, Y, 20 + pulse * 5, 0, TAU);\n    c.stroke();\n\n    c.globalAlpha = 1;\n    c.fillStyle = \"#1d201d\";\n    c.beginPath();\n    c.arc(X, Y, 5.5, 0, TAU);\n    c.fill();\n    c.strokeStyle = \"#f6f2e8\";\n    c.lineWidth = 2;\n    c.stroke();\n\n    c.font = \"italic 14px Georgia, serif\";\n    c.textAlign = \"center\";\n    c.textBaseline = \"bottom\";\n    c.lineWidth = 3.5;\n    c.strokeStyle = \"rgba(246,242,232,.9)\";\n    c.strokeText(goal.name, X, Y - 26);\n    c.fillStyle = \"#1d201d\";\n    c.fillText(goal.name, X, Y - 26);\n    c.restore();\n    return;\n  }\n\n  /* off screen: it still exists, and it is still that way. an arrow at the\n     edge of the glass, because losing the thing you are racing for is not a\n     difficulty worth having. */\n  const cx = View.w / 2, cy = View.h / 2;\n  const a = Math.atan2(Y - cy, X - cx);\n  const m = 40;\n  const rx = Math.min(cx - m, Math.abs(Math.cos(a)) > 1e-4 ? Math.abs((cx - m) / Math.cos(a)) : 1e9);\n  const ry = Math.min(cy - m, Math.abs(Math.sin(a)) > 1e-4 ? Math.abs((cy - m) / Math.sin(a)) : 1e9);\n  const rr = Math.min(rx, ry);\n  const ex = cx + Math.cos(a) * rr, ey = cy + Math.sin(a) * rr;\n\n  c.save();\n  c.translate(ex, ey);\n  c.rotate(a);\n  c.globalAlpha = 0.8;\n  c.fillStyle = \"#1d201d\";\n  c.beginPath();\n  c.moveTo(9, 0); c.lineTo(-6, 5.5); c.lineTo(-6, -5.5);\n  c.closePath();\n  c.fill();\n  c.restore();\n\n  c.save();\n  c.globalAlpha = 0.7;\n  c.font = \"italic 12px Georgia, serif\";\n  c.textAlign = \"center\";\n  c.textBaseline = \"middle\";\n  const lx = cx + Math.cos(a) * (rr - 22), ly = cy + Math.sin(a) * (rr - 22);\n  c.lineWidth = 3;\n  c.strokeStyle = \"rgba(246,242,232,.9)\";\n  c.strokeText(goal.name, lx, ly);\n  c.fillStyle = \"#1d201d\";\n  c.fillText(goal.name, lx, ly);\n  c.restore();\n}\n\n/* The other one. Amber, square, and always drawn — if it is off screen it is\n   pinned to the edge, because the whole tension is knowing where it is. */\nfunction drawRival(c, now) {\n  const X = sx(rival.x), Y = sy(rival.y);\n  const on = X > -40 && X < View.w + 40 && Y > -40 && Y < View.h + 40;\n  c.save();\n  if (on) {\n    if (rival.trip) {\n      c.globalAlpha = 0.3;\n      c.strokeStyle = AMBER;\n      c.lineWidth = 2;\n      c.beginPath();\n      c.moveTo(sx(rival.trip.pts[0]), sy(rival.trip.pts[1]));\n      for (let i = 2; i + 1 < rival.trip.pts.length; i += 2) {\n        c.lineTo(sx(rival.trip.pts[i]), sy(rival.trip.pts[i + 1]));\n      }\n      c.stroke();\n    }\n    c.globalAlpha = 1;\n    c.translate(X, Y);\n    c.fillStyle = AMBER;\n    c.strokeStyle = AMBER_DEEP;\n    c.lineWidth = 2;\n    c.beginPath();\n    c.rect(-7, -7, 14, 14);\n    c.fill();\n    c.stroke();\n  } else {\n    const cx = View.w / 2, cy = View.h / 2;\n    const a = Math.atan2(Y - cy, X - cx);\n    const m = 26;\n    const rx = Math.abs(Math.cos(a)) > 1e-4 ? Math.abs((cx - m) / Math.cos(a)) : 1e9;\n    const ry = Math.abs(Math.sin(a)) > 1e-4 ? Math.abs((cy - m) / Math.sin(a)) : 1e9;\n    const rr = Math.min(rx, ry, Math.max(cx, cy));\n    c.globalAlpha = 0.75;\n    c.translate(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr);\n    c.fillStyle = AMBER;\n    c.strokeStyle = AMBER_DEEP;\n    c.lineWidth = 1.5;\n    c.beginPath();\n    c.rect(-5, -5, 10, 10);\n    c.fill();\n    c.stroke();\n  }\n  c.restore();\n}\n\n/* The only words the game says, and it says each of them once. */\nfunction drawBanner(c, now) {\n  const k = (now - banner.t0) / banner.life;\n  if (k >= 1) { banner = null; return; }\n  const a = k < 0.12 ? k / 0.12 : k > 0.75 ? (1 - k) / 0.25 : 1;\n  c.save();\n  c.globalAlpha = clamp(a, 0, 1) * 0.9;\n  c.font = \"italic 17px Georgia, serif\";\n  c.textAlign = \"center\";\n  c.textBaseline = \"middle\";\n  const y = View.h * 0.17;\n  c.lineWidth = 4;\n  c.strokeStyle = \"rgba(246,242,232,.92)\";\n  c.strokeText(banner.text, View.w / 2, y);\n  c.fillStyle = over ? \"#bf4526\" : \"#1d201d\";\n  c.fillText(banner.text, View.w / 2, y);\n  c.restore();\n}\n\n/* tapping after it is over starts another crossing, from where you stand */\nexport function onTap(ctx, p) {\n  if (!over) return false;\n  start();\n  return true;\n}\n\nexport const state = () => ({ goal, rival, over, turns });\n","hud.js":"/* PERSPECTIVAL GROUND — the almost-nothing on screen.\n\n   The only thing the player is ever told is what they currently are. Not what\n   that means, not what it can use, not what any mark does for it. That is\n   found out by going. */\n\nimport { View } from \"./geo.js\";\nimport { S, on } from \"./state.js\";\n\nlet who = null;\n\nexport function init(ctx) {\n  who = document.createElement(\"div\");\n  Object.assign(who.style, {\n    position: \"fixed\", left: \"50%\", transform: \"translateX(-50%)\",\n    top: \"calc(14px + var(--sat))\",\n    font: \"italic 15px/1 Georgia, serif\", letterSpacing: \".04em\",\n    color: \"var(--ink)\", opacity: \".75\", pointerEvents: \"none\",\n    transition: \"opacity .4s ease\",\n  });\n  ctx.hud.appendChild(who);\n  const set = () => { who.textContent = S.being ? \"you are \" + S.being.name.toLowerCase() : \"\"; };\n  on(\"boot\", set);\n  on(\"become\", set);\n  set();\n}\n","main.js":"/* PERSPECTIVAL GROUND — the loop.\n\n   main.js owns exactly three things: the canvas, the order the organs draw\n   in, and which organ a finger currently belongs to. It owns no game rules.\n\n   The gesture grammar, decided once and for all:\n     tap ground          go there\n     drag                move the map          (Google Maps, and nothing else)\n     two fingers         zoom\n     tap the pip, drag   lay a line into the ground\n   There is no mode picker. The pip is one control, and it starts pulsing on\n   its own the moment the ground refuses to carry you somewhere. */\n\nimport { View, fitCanvas, panBy, zoomAt, clamp } from \"./geo.js\";\nimport { loadGraph, G } from \"./graph.js\";\nimport { S, load, connect, on, emit } from \"./state.js\";\nimport { CAR } from \"./beings.js\";\n\nimport * as cloth from \"./cloth.js\";\nimport * as traces from \"./traces.js\";\nimport * as draw from \"./draw.js\";\nimport * as travellers from \"./travellers.js\";\nimport * as move from \"./move.js\";\nimport * as become from \"./become.js\";\nimport * as goal from \"./goal.js\";\nimport * as hud from \"./hud.js\";\n\nconst cv = document.getElementById(\"cv\");\nconst g2 = cv.getContext(\"2d\", { alpha: false });\n\n/* what every organ is handed */\nexport const ctx = {\n  c: g2, cv,\n  quality: 1,        /* drops when frames run long; organs must respect it */\n  now: 0, dt: 0,\n  mode: \"travel\",    /* \"travel\" | \"draw\" — main owns this, draw.js requests it */\n  hud: document.getElementById(\"hud\"),\n  arm(on) { ctx.mode = on ? \"draw\" : \"travel\"; emit(\"mode\", ctx.mode); },\n};\n\nconst ORGANS = [cloth, traces, draw, travellers, goal, move, become, hud];\n\n/* ---------- boot ---------- */\nfunction boot() {\n  loadGraph();\n  connect();\n  load();\n  for (const o of ORGANS) o.init && o.init(ctx);\n  emit(\"boot\");\n  resize();\n  requestAnimationFrame(frame);\n  setTimeout(() => document.getElementById(\"boot\").classList.add(\"gone\"), 260);\n}\n\nfunction resize() {\n  fitCanvas(cv);\n  g2.setTransform(View.dpr, 0, 0, View.dpr, 0, 0);\n  emit(\"resize\");\n}\naddEventListener(\"resize\", resize);\naddEventListener(\"orientationchange\", () => setTimeout(resize, 120));\n\n/* ---------- the loop ---------- */\nlet last = 0, slow = 0;\nfunction frame(now) {\n  ctx.dt = last ? Math.min(64, now - last) : 16;\n  ctx.now = now;\n  last = now;\n\n  const t0 = performance.now();\n  g2.setTransform(View.dpr, 0, 0, View.dpr, 0, 0);\n  for (const o of ORGANS) if (o.draw) o.draw(ctx, now);\n  const cost = performance.now() - t0;\n\n  /* one honest quality dial rather than each organ guessing */\n  slow = slow * 0.9 + cost * 0.1;\n  if (slow > 13 && ctx.quality > 0.35) ctx.quality = Math.max(0.35, ctx.quality - 0.02);\n  else if (slow < 7 && ctx.quality < 1) ctx.quality = Math.min(1, ctx.quality + 0.01);\n\n  requestAnimationFrame(frame);\n}\n\n/* ---------- fingers ----------\n   One place decides whether a gesture is the map's, the pip's or a tap. */\nconst pts = new Map();\nlet pan = null, pinch = null, claimed = null;\nconst TAP_SLOP = 9, TAP_MS = 320;\n\nfunction xy(e) {\n  const r = cv.getBoundingClientRect();\n  return { x: e.clientX - r.left, y: e.clientY - r.top };\n}\n\ncv.addEventListener(\"pointerdown\", (e) => {\n  cv.setPointerCapture(e.pointerId);\n  const p = xy(e);\n  pts.set(e.pointerId, { ...p, x0: p.x, y0: p.y, t: performance.now(), moved: false });\n\n  if (pts.size === 2) { pan = null; pinch = spread(); return; }\n\n  /* the organs get first refusal, in order; drawing wants the finger when armed */\n  claimed = null;\n  for (const o of ORGANS) {\n    if (o.onDown && o.onDown(ctx, p, e)) { claimed = o; break; }\n  }\n  if (!claimed) pan = { ...p };\n});\n\ncv.addEventListener(\"pointermove\", (e) => {\n  const rec = pts.get(e.pointerId);\n  if (!rec) return;\n  const p = xy(e);\n  if (Math.hypot(p.x - rec.x0, p.y - rec.y0) > TAP_SLOP) rec.moved = true;\n\n  if (pts.size >= 2) {\n    const d = spread();\n    if (pinch && d.dist > 0) {\n      zoomAt(d.cx, d.cy, Math.log2(d.dist / pinch.dist));\n      pinch = d;\n    }\n    rec.x = p.x; rec.y = p.y;\n    return;\n  }\n\n  if (claimed && claimed.onMove) claimed.onMove(ctx, p, e);\n  else if (pan) { panBy(p.x - rec.x, p.y - rec.y); }\n  rec.x = p.x; rec.y = p.y;\n});\n\nfunction up(e) {\n  const rec = pts.get(e.pointerId);\n  pts.delete(e.pointerId);\n  if (pts.size < 2) pinch = null;\n  if (!rec) return;\n  const p = xy(e);\n  const tap = !rec.moved && performance.now() - rec.t < TAP_MS * 3;\n\n  if (claimed && claimed.onUp) claimed.onUp(ctx, p, e, { tap });\n  else if (tap) {\n    for (const o of ORGANS) if (o.onTap && o.onTap(ctx, p, e)) break;\n  }\n  claimed = null; pan = null;\n}\ncv.addEventListener(\"pointerup\", up);\ncv.addEventListener(\"pointercancel\", up);\n\nfunction spread() {\n  const a = [...pts.values()];\n  if (a.length < 2) return null;\n  return {\n    dist: Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y),\n    cx: (a[0].x + a[1].x) / 2, cy: (a[0].y + a[1].y) / 2,\n  };\n}\n\ncv.addEventListener(\"wheel\", (e) => {\n  e.preventDefault();\n  const r = cv.getBoundingClientRect();\n  zoomAt(e.clientX - r.left, e.clientY - r.top, -e.deltaY * 0.0022);\n}, { passive: false });\n\n/* A handle for the harness: critics drive the real build through this, and\n   pg/tools/age.mjs uses it to fast-forward a world so the late game can be\n   looked at without playing it for an hour. Not used by the game itself. */\nwindow.PG = { ctx, View, G, S, on, emit, organs: { cloth, traces, draw, travellers, move, goal, become, hud } };\n\nboot();\n"};
  var ORDER = ["geo.js","graph.data.js","graph.js","beings.js","state.js","ground.data.js","cloth.js","traces.js","draw.js","travellers.js","move.js","become.js","goal.js","hud.js","main.js"];
  var urls = Object.create(null);
  for (var i = 0; i < ORDER.length; i++) {
    var name = ORDER[i];
    var code = SRC[name].replace(/(["'])\.\/([\w.\-]+\.js)\1/g, function (m, q, dep) {
      return urls[dep] ? JSON.stringify(urls[dep]) : m;
    });
    urls[name] = URL.createObjectURL(new Blob([code], { type: "text/javascript" }));
  }
  var s = document.createElement("script");
  s.type = "module";
  s.src = urls["main.js"];
  document.body.appendChild(s);
})();
</script>
