 = S.being;\n  const b = viewBounds(40);\n  edgesInBox(b.x0, b.y0, b.x1, b.y1, _dyn, (e) => G.ec[e] >= CLS_MARK);\n  if (!_dyn.length) return;\n  c.lineCap = \"round\";\n  c.lineJoin = \"round\";\n  /* the hand that drew it decided how wide it is, so widths vary; they are\n     rounded into a handful of gauges and each gauge is laid in one stroke */\n  const gauge = (e) => Math.round(Math.max(1.5, Math.max(lerp(1.0, 2.4, zt), G.ewidth[e] * ppm * 0.9)) * 2) / 2;\n  const seen = [];\n  for (let i = 0; i < _dyn.length; i++) {\n    const e = _dyn[i], kind = kindAt(e);\n    if (!kind) continue;\n    const key = kind * 64 + Math.min(63, gauge(e) * 2);\n    if (seen.indexOf(key) < 0) seen.push(key);\n  }\n  for (let pass = 0; pass < 2; pass++) {\n    for (const key of seen) {\n      const kind = (key / 64) | 0, g = (key % 64) / 2;\n      const w = g * (kind === 2 ? 1.8 : kind === 3 ? 1.05 : 1.3);\n      if (pass === 0) {\n        c.globalAlpha = 0.75 * rise;\n        c.strokeStyle = PAPER_LIT;\n        c.lineWidth = w + 3.2;\n      } else {\n        c.globalAlpha = (kind === 3 ? 0.8 : 1) * rise;\n        c.strokeStyle = being.ink[KIND_COL[kind]];\n        c.lineWidth = w;\n      }\n      c.beginPath();\n      for (let i = 0; i < _dyn.length; i++) {\n        const e = _dyn[i];\n        if (kindAt(e) !== kind || Math.min(63, gauge(e) * 2) !== key % 64) continue;\n        const a = G.ea[e], z = G.eb[e];\n        c.moveTo(sx(G.nx[a]), sy(G.ny[a]));\n        c.lineTo(sx(G.nx[z]), sy(G.ny[z]));\n      }\n      c.stroke();\n    }\n  }\n  c.globalAlpha = 1;\n}\n\n/* ============================================================\n   PLACES — you always know where you are\n   ============================================================ */\nconst _drawn = [];\nfunction drawPlaces(c) {\n  if (View.z < 10.4 || !PLACES.length) return;\n  const b = viewBounds(0);\n  _drawn.length = 0;\n  c.textAlign = \"center\";\n  c.textBaseline = \"middle\";\n  c.lineJoin = \"round\";\n  for (const p of PLACES) {\n    if (p.x < b.x0 || p.x > b.x1 || p.y < b.y0 || p.y > b.y1) continue;\n    const big = p.kind === \"city\";\n    if (!big && View.z < 11.9) continue;\n    const X = sx(p.x), Y = sy(p.y);\n    let clash = false;\n    for (let i = 0; i < _drawn.length; i += 2) {\n      if (Math.abs(_drawn[i] - X) < 84 && Math.abs(_drawn[i + 1] - Y) < 20) { clash = true; break; }\n    }\n    if (clash) continue;\n    _drawn.push(X, Y);\n    c.font = `italic ${big ? 15 : 11.5}px Georgia, serif`;\n    /* the name lifts off the cloth the same way a live thread does */\n    c.globalAlpha = 0.85;\n    c.strokeStyle = PAPER;\n    c.lineWidth = 4;\n    c.strokeText(p.name, X, Y);\n    c.globalAlpha = big ? 0.66 : 0.5;\n    c.fillStyle = \"#1d201d\";\n    c.fillText(p.name, X, Y);\n  }\n  c.globalAlpha = 1;\n}\n\n/* ============================================================\n   the frame\n   ============================================================ */\n/* What the frames themselves say about how much the machine has left. The\n   canvas does its real work after the loop has stopped timing itself, so the\n   only honest measure of a heavy cloth is the length of the frame it caused. */\nlet slowness = 16;\n\nexport function draw(ctx) {\n  const c = ctx.c;\n  const ws = worldSize();\n  slowness = slowness * 0.9 + Math.min(70, ctx.dt || 16) * 0.1;\n\n  /* The city is rewoven only when the camera has run past the spare cloth at\n     the edge of the screen. Everything between is one straight copy. */\n  if (baseDirty || bz !== View.z || bw !== View.w || bh !== View.h || bdpr !== View.dpr ||\n      Math.abs((bx - View.x) * ws) > MARGIN - 8 || Math.abs((by - View.y) * ws) > MARGIN - 8) {\n    renderBase(View.dpr);\n  }\n\n  /* the city, blitted whole, in one opaque copy */\n  c.globalAlpha = 1;\n  const px = MARGIN - (bx - View.x) * ws, py = MARGIN - (by - View.y) * ws;\n  c.drawImage(base, px * bdpr, py * bdpr, View.w * bdpr, View.h * bdpr, 0, 0, View.w, View.h);\n\n  /* and set back a step, because it is not yours */\n  const k = turnAt ? clamp((performance.now() - turnAt) / TURN_MS, 0, 1) : 1;\n  c.globalAlpha = turnAt ? lerp(VEIL_TURN, VEIL, ease(k)) : VEIL;\n  c.fillStyle = PAPER;\n  c.fillRect(0, 0, View.w, View.h);\n  c.globalAlpha = 1;\n\n  drawLive(ctx, chainsInView(viewBounds(60), _vis));\n  drawPlaces(c);\n  c.globalAlpha = 1;\n}\n","traces.js":"/* PERSPECTIVAL GROUND — what passage leaves behind.\n\n   The city was planned by somebody who is not here. Everything in this layer\n   was made by going, and going is the only thing that makes it.\n\n   There are three states and a passage moves through all of them:\n\n     WEAR      every journey darkens the ground it crossed. One passage is\n               almost nothing. Forty passages over the same block is a road\n               that no one drew.\n\n     PRESSURE  where a body wanted to go and the ground offered it nothing,\n               a bruise. Bruises in the same place stack.\n\n     GHOST     past a threshold the bruise gives way: the line the traffic\n               kept wanting becomes ground, and the next body through can\n               simply use it. Nobody planned it. It is the most valuable\n               thing on the map and it is made of other people's failures.\n\n   The visual argument of the whole game lives here. Early on this layer is\n   nothing and Atlanta is everything. Late on, the paper is written over by\n   use, and the planned city reads as the faint thing underneath. That\n   inversion is the point, so it is drawn with more care than anything else. */\n\nimport {\n  View, sx, sy, worldSize, viewBounds, clamp, lerp, ease, hash01,\n  units, metres, pathLength, distToSeg,\n} from \"./geo.js\";\nimport { G, nearestNode } from \"./graph.js\";\nimport { S, on, emit, layGhost } from \"./state.js\";\n\n\n/* how many times a body has to be refused in one place before the ground\n   gives way and the wanted line becomes real */\nconst HARDEN = 3;\n\n/* the wear layer is redrawn onto its own cloth and blitted, because it grows\n   without bound and must not cost a frame */\nconst MARGIN = 150;\nlet layer = null, lctx = null;\nlet lx = NaN, ly = NaN, lz = NaN, lw = 0, lh = 0;\nlet dirty = true;\n\n/* The colour of use itself — not any being's, everybody's. Deliberately warm,\n   where the city's ink is cool grey: wear has to read as earth worn open\n   rather than as more road, or the two layers collapse into one another and\n   Atlanta stops being legible under its own traffic. */\nconst WORN = \"94,66,44\";\nconst GHOST_INK = \"#8a5a3c\";\n\n/* Wear thickens ground in proportion to what that ground already is, so a\n   busy side street never grows into something that reads like the Connector.\n   The city's hierarchy has to survive its own traffic. */\nconst CLASS_BODY = [1.0, 0.78, 0.55, 0.42, 0.4, 0.6];\n\nexport function init() {\n  on(\"balk\", (p) => { dirty = true; if (p.n >= HARDEN && !p.hardened) harden(p); });\n  on(\"journey\", () => { dirty = true; });\n  on(\"ghost\", () => { dirty = true; });\n  on(\"mark\", () => { dirty = true; });\n  on(\"loaded\", () => { dirty = true; });\n  on(\"resize\", () => { layer = null; dirty = true; });\n}\n\n/* ---------- a bruise becomes ground ----------\n   The desire line is not invented. It is the piece the traffic kept asking\n   for: from where bodies actually got stuck, to the ground they were trying\n   to reach, tied at both ends into what already exists. */\nfunction harden(p) {\n  const a = nearestNode(p.x, p.y, units(140));\n  if (a < 0 || p.tx == null) return;\n\n  /* Where the traffic kept wanting to be, tied into whatever ground is\n     actually there. The desire line is not invented — it is the piece that\n     was missing, and the bodies named it by failing at it. */\n  const z = nearestNode(p.tx, p.ty, units(400));\n  if (z < 0 || z === a) return;\n\n  const gap = metres(Math.hypot(G.nx[z] - G.nx[a], G.ny[z] - G.ny[a]));\n  if (gap < 15 || gap > 900) return;\n  p.hardened = true;\n\n  layGhost([G.nx[a], G.ny[a], G.nx[z], G.ny[z]]);\n  emit(\"hardened\", { x: G.nx[a], y: G.ny[a], tx: G.nx[z], ty: G.ny[z], at: performance.now() });\n  dirty = true;\n}\n\n/* ---------- how much has happened here ----------\n   Used by the rest of the game to know whether the world is young or old. */\nexport function era() {\n  let worn = 0;\n  for (let e = 0; e < G.e; e++) if (G.euse[e] > 0) worn++;\n  return clamp(worn / Math.max(1, G.e * 0.22), 0, 1);\n}\n\n/* ============================================================\n   the cloth of use\n   ============================================================ */\nfunction ensure() {\n  const w = Math.ceil(View.w + MARGIN * 2), h = Math.ceil(View.h + MARGIN * 2);\n  if (!layer || lw !== w || lh !== h) {\n    layer = document.createElement(\"canvas\");\n    lw = w; lh = h;\n    layer.width = Math.round(w * View.dpr);\n    layer.height = Math.round(h * View.dpr);\n    lctx = layer.getContext(\"2d\");\n    dirty = true;\n  }\n}\n\n/* has the camera moved far enough that the blit would lie? */\nfunction stale() {\n  if (lz !== View.z) return true;\n  const ws = worldSize();\n  const dx = (View.x - lx) * ws, dy = (View.y - ly) * ws;\n  return Math.abs(dx) > MARGIN - 8 || Math.abs(dy) > MARGIN - 8;\n}\n\nfunction reweave() {\n  const c = lctx;\n  c.setTransform(View.dpr, 0, 0, View.dpr, 0, 0);\n  c.clearRect(0, 0, lw, lh);\n  lx = View.x; ly = View.y; lz = View.z;\n\n  const ws = worldSize();\n  const ox = MARGIN + View.w / 2, oy = MARGIN + View.h / 2;\n  const X = (mx) => (mx - lx) * ws + ox;\n  const Y = (my) => (my - ly) * ws + oy;\n\n  const b = {\n    x0: lx - (ox) / ws, x1: lx + (lw - ox) / ws,\n    y0: ly - (oy) / ws, y1: ly + (lh - oy) / ws,\n  };\n\n  c.lineCap = \"round\";\n  c.lineJoin = \"round\";\n\n  /* ---- 1. wear ----\n     Journeys are drawn faint and they are drawn on top of each other. Nothing\n     computes a heat value; the heat IS the overlap, the way a path in grass is\n     the overlap of everyone who cut the corner. */\n  const zt = clamp((View.z - 11) / 6, 0, 1);\n  const base = lerp(2.4, 7.5, zt);\n  const js = S.journeys;\n  const start = Math.max(0, js.length - 2600);\n  for (let i = start; i < js.length; i++) {\n    const j = js[i];\n    if (j.ghost) continue;\n    const pts = j.pts;\n    if (!pts || pts.length < 4) continue;\n    if (!crosses(pts, b)) continue;\n\n    /* the older a passage the more it has settled into the ground */\n    const age = clamp((js.length - i) / 260, 0, 1);\n    c.strokeStyle = `rgba(${WORN},${0.055 + age * 0.05})`;\n    c.lineWidth = base * (0.62 + age * 0.5);\n    c.beginPath();\n    c.moveTo(X(pts[0]), Y(pts[1]));\n    for (let k = 2; k + 1 < pts.length; k += 2) c.lineTo(X(pts[k]), Y(pts[k + 1]));\n    c.stroke();\n  }\n\n  /* ---- 2. the ground that use has actually changed ----\n     Edges carry a count. Past a certain amount of traffic a piece of ground\n     stops being a road somebody drew and becomes a road everybody made, and\n     it is drawn like fibre, not like a highlight. */\n  /* How busy is busy? Against an absolute scale, an hour of play saturates\n     every arterial and the whole city goes one flat colour — the difference\n     between used and unused disappears exactly when it should be loudest. So\n     busy is a rank among the ground that is used at all: a tenth of the\n     traffic reads heavy whether this world is an hour old or a week old. */\n  const busy = wearScale();\n  for (let e = 0; e < G.e; e++) {\n    const u = G.euse[e];\n    if (u < 2) continue;\n    const a = G.ea[e], z = G.eb[e];\n    const ax = G.nx[a], ay = G.ny[a];\n    if (ax < b.x0 || ax > b.x1 || ay < b.y0 || ay > b.y1) continue;\n    const k = busy(u);\n    c.strokeStyle = `rgba(${WORN},${0.04 + k * k * 0.30})`;\n    c.lineWidth = base * CLASS_BODY[G.ec[e]] * (0.34 + k * 1.0);\n    c.beginPath();\n    c.moveTo(X(ax), Y(ay));\n    c.lineTo(X(G.nx[z]), Y(G.ny[z]));\n    c.stroke();\n  }\n\n  /* ---- 3. what people drew, and what the drawing became ---- */\n  for (const m of S.marks) {\n    const pts = m.pts;\n    if (!pts || pts.length < 4 || !crosses(pts, b)) continue;\n    const used = clamp(m.use / 9, 0, 1);\n    /* a mark nobody has used is a thin intention; a used one is infrastructure */\n    c.strokeStyle = `rgba(122,47,78,${0.5 + used * 0.42})`;\n    c.lineWidth = lerp(2.0, 6.4, zt) * (0.7 + used * 0.9);\n    strokePts(c, pts, X, Y);\n    if (used > 0) {\n      c.strokeStyle = `rgba(247,243,232,${0.35 * used})`;\n      c.lineWidth = lerp(0.7, 2.0, zt);\n      strokePts(c, pts, X, Y);\n    }\n  }\n\n  /* ---- 4. ghost roads ----\n     Drawn last and drawn as real ground, because that is what they are. */\n  for (const j of S.journeys) {\n    if (!j.ghost || !j.pts || j.pts.length < 4) continue;\n    if (!crosses(j.pts, b)) continue;\n    c.strokeStyle = `rgba(138,90,60,.30)`;\n    c.lineWidth = lerp(5, 13, zt);\n    strokePts(c, j.pts, X, Y);\n    c.strokeStyle = GHOST_INK;\n    c.lineWidth = lerp(1.6, 4.2, zt);\n    strokePts(c, j.pts, X, Y);\n    /* it was made of many passes, so it is drawn as many strands */\n    c.strokeStyle = `rgba(247,243,232,.5)`;\n    c.lineWidth = lerp(0.5, 1.3, zt);\n    c.setLineDash([lerp(2, 6, zt), lerp(3, 9, zt)]);\n    strokePts(c, j.pts, X, Y);\n    c.setLineDash([]);\n  }\n\n  dirty = false;\n}\n\n/* the distribution of traffic, rebuilt when the cloth is rewoven */\nfunction wearScale() {\n  const used = [];\n  for (let e = 0; e < G.e; e++) if (G.euse[e] >= 2) used.push(G.euse[e]);\n  if (used.length < 8) return (u) => clamp(Math.log2(u) / 5.2, 0, 1);\n  used.sort((a, z) => a - z);\n  return (u) => {\n    let lo = 0, hi = used.length;\n    while (lo < hi) { const mid = (lo + hi) >> 1; if (used[mid] < u) lo = mid + 1; else hi = mid; }\n    return lo / used.length;\n  };\n}\n\nfunction strokePts(c, pts, X, Y) {\n  c.beginPath();\n  c.moveTo(X(pts[0]), Y(pts[1]));\n  for (let k = 2; k + 1 < pts.length; k += 2) c.lineTo(X(pts[k]), Y(pts[k + 1]));\n  c.stroke();\n}\n\nfunction crosses(pts, b) {\n  for (let i = 0; i + 1 < pts.length; i += 2) {\n    if (pts[i] > b.x0 && pts[i] < b.x1 && pts[i + 1] > b.y0 && pts[i + 1] < b.y1) return true;\n  }\n  return false;\n}\n\n/* ============================================================\n   draw\n   ============================================================ */\nexport function draw(ctx, now) {\n  ensure();\n  if (dirty || stale()) reweave();\n\n  const c = ctx.c;\n  const ws = worldSize();\n  const ox = MARGIN + View.w / 2, oy = MARGIN + View.h / 2;\n  const dx = (lx - View.x) * ws + View.w / 2 - ox;\n  const dy = (ly - View.y) * ws + View.h / 2 - oy;\n\n  c.save();\n  c.setTransform(1, 0, 0, 1, 0, 0);\n  c.drawImage(layer, Math.round(dx * View.dpr), Math.round(dy * View.dpr));\n  c.restore();\n  c.setTransform(View.dpr, 0, 0, View.dpr, 0, 0);\n\n  /* bruises breathe, so they are live rather than baked */\n  drawPressure(c, now);\n}\n\n/* A bruise is a small, quiet thing. It has to be findable without being\n   decoration, and above all it must not tile the city in rings — the ground\n   is what the player is here to read. So: only the ones that are actually\n   close to giving way get any weight, only a handful are drawn at all, and a\n   bruise that has already become a road is simply gone. */\nconst SHOWN = 8;\n\nfunction drawPressure(c, now) {\n  const b = viewBounds(30);\n  const live = [];\n  for (const p of S.pressure) {\n    if (p.hardened || p.n < 2) continue;\n    if (p.x < b.x0 || p.x > b.x1 || p.y < b.y0 || p.y > b.y1) continue;\n    live.push(p);\n  }\n  /* the ground gives way where it has been asked most, so that is what shows */\n  live.sort((a, z) => z.n - a.n);\n\n  for (let i = 0; i < Math.min(SHOWN, live.length); i++) {\n    const p = live[i];\n    const X = sx(p.x), Y = sy(p.y);\n    const k = clamp((p.n - 1) / HARDEN, 0, 1);\n    const pulse = 0.5 + 0.5 * Math.sin(now / 700 + p.x * 9e4);\n    const r = lerp(5, 10, k);\n\n    c.globalAlpha = (0.16 + k * 0.3) * (0.55 + pulse * 0.45);\n    c.strokeStyle = \"#bf4526\";\n    c.lineWidth = 1.3;\n    c.beginPath();\n    c.arc(X, Y, r, 0, Math.PI * 2);\n    c.stroke();\n\n    /* one refusal away from becoming ground: the ring starts to break open */\n    if (p.n >= HARDEN - 1) {\n      c.setLineDash([2.5, 5]);\n      c.globalAlpha = 0.45 * pulse;\n      c.beginPath();\n      c.arc(X, Y, r + 5, 0, Math.PI * 2);\n      c.stroke();\n      c.setLineDash([]);\n    }\n  }\n  c.globalAlpha = 1;\n}\n","draw.js":"/* PERSPECTIVAL GROUND — laying a line into the ground.\n\n   One control. Tap the pip, drag, and what you drew is ground now — with the\n   same rights as the interstate beside it. It starts pulsing by itself the\n   moment the ground refuses to carry you somewhere, which is the only tutorial\n   this game gets.\n\n   Everything in here is about the difference between drawing ON a map and\n   laying a thread INTO cloth:\n\n     THE THREAD LIES IN THE CLOTH. It opens a channel of bare paper around\n     itself, it is bedded into the ground under it, and where it meets a fibre\n     the city already has, it goes UNDER — the thread simply stops and the road\n     runs on across it. Over and under is what makes cloth cloth.\n\n     THE HAND IS IN THE THREAD. A deliberate hand pays out a wide thread; a\n     hurried one pays out a thin one, and if you hold still the ink pools. You\n     watch that happen live. Nothing says what a width is for. It is simply\n     how much ground you laid, and later a car either fits or it doesn't.\n\n     COMMITTING IS PHYSICAL. On release the thread drops: it steadies onto the\n     streets under it, evens out to one gauge, and a press runs down its whole\n     length from the hand that started it. Where it lands on ground that is\n     already there it binds — a stitch, and a little of the new material runs\n     out into the old.\n\n   What it does NOT do is tell you what you made. No width readout, no preview\n   of who could use this, no name for anything. You find out by watching a\n   traveller. */\n\nimport {\n  View, sx, sy, wx, wy, simplify, pathLength, units, metres,\n  clamp, lerp, ease, hash01, pxPerM, TAU,\n} from \"./geo.js\";\nimport { G, edgesInBox, nearestNode, nearestEdge, CLS_RAIL, CLS_MARK } from \"./graph.js\";\nimport { S, on, layMark } from \"./state.js\";\n\n/* the cloth immediately around a thread, cleared of everything else */\nconst CHANNEL = \"#fbf8ef\";\n/* the shadow a laid cord makes in the tooth of the paper */\nconst PRESS = \"rgba(58,48,32,1)\";\n\n/* the thread before it is anything: raw fibre, nobody's colour. it warms into\n   the colour of laid ground as it seats, so the handover to the cloth is a\n   change of state and not a change of subject. */\nconst FIBRE = [84, 66, 42];\nconst SEATED = [122, 47, 78];\nfunction fibreCol(t, a) {\n  const r = Math.round(lerp(FIBRE[0], SEATED[0], t));\n  const g = Math.round(lerp(FIBRE[1], SEATED[1], t));\n  const b = Math.round(lerp(FIBRE[2], SEATED[2], t));\n  return `rgba(${r},${g},${b},${a})`;\n}\n\n/* ============================================================\n   THE PEN — how wide a thread the hand is paying out\n\n   Width is not chosen. It is how the line was made: slow is wide, hurried is\n   thin, and standing still lets the ink pool. Nothing here knows or cares that\n   3 metres is where a car starts to fit (beings.js), and nothing tells the\n   player. It is just what happens when you take your time.\n   ============================================================ */\nconst W_MIN = 1.25, W_MAX = 7.2;         /* metres of ground */\nconst V_SLOW = 0.15, V_FAST = 1.6;       /* screen px per ms */\nconst POOL = 0.00012;                    /* how fast standing still pools ink */\n\nfunction widthFor(v) {\n  const d = clamp((V_FAST - v) / (V_FAST - V_SLOW), 0, 1);\n  return W_MIN + (W_MAX - W_MIN) * Math.pow(d, 1.45);\n}\n\n/* How wide that is on this screen. Below street zoom a true-scale road is a\n   third of a pixel, so the gauge reads as a ratio there and only becomes\n   literal metres once you are close enough for metres to mean anything. */\nfunction penPx(wm, zt, ppm) {\n  const nominal = lerp(0.9, 2.2, zt) * (0.55 + wm / 4.6);\n  return Math.max(1.25, Math.max(nominal, wm * ppm * 0.95));\n}\n\n/* how far a sample may be nudged onto ground that is already there: about\n   seven screen pixels' worth, and never a correction bigger than a street */\nfunction settleTol() { return units(clamp(7 / pxPerM(), 10, 34)); }\n\n/* a thread pulled taut goes a little past where it lands and comes back */\nfunction taut(x) {\n  const u = x - 1;\n  return 1 + 2.1 * u * u * u + 1.35 * u * u;\n}\n\nlet calm = false;\ntry { calm = matchMedia(\"(prefers-reduced-motion: reduce)\").matches; } catch {}\n\n/* ============================================================\n   state\n   ============================================================ */\nlet pip = null, armed = false, urgent = false, ctxRef = null;\nlet live = null;    /* the stroke in the hand */\nlet seat = null;    /* the stroke coming to rest */\nlet entry = null;   /* the needle going in */\n\n/* ============================================================\n   THE PIP\n\n   One control, and it never becomes two. It is a bead of thread: press it and\n   the next thing your finger does pays thread out. When the ground has balked\n   it knocks on its own, which is the only instruction in the game.\n   ============================================================ */\nexport function init(ctx) {\n  ctxRef = ctx;\n  pip = document.createElement(\"button\");\n  pip.id = \"pip\";\n  pip.setAttribute(\"aria-label\", \"lay a line into the ground\");\n  pip.innerHTML = `<svg viewBox=\"0 0 44 44\" width=\"44\" height=\"44\" aria-hidden=\"true\">\n    <path class=\"gl\" d=\"M9 29.5c6.2 0 4.4-15 12.5-15s6.2 15 12.4 15\" fill=\"none\"\n      stroke=\"currentColor\" stroke-width=\"2.7\" stroke-linecap=\"round\"/>\n    <circle class=\"knob\" cx=\"9\" cy=\"29.5\" r=\"2.5\" fill=\"currentColor\"/>\n  </svg>`;\n  ctx.hud.appendChild(pip);\n\n  /* every state of it lives in one rule, so that arming it can actually\n     change how it looks — an inline style would outrank the class */\n  const style = document.createElement(\"style\");\n  style.textContent = `\n    #pip{\n      position:fixed;left:50%;bottom:calc(22px + var(--sab));\n      width:72px;height:72px;border-radius:50%;border:0;padding:0;\n      display:grid;place-items:center;\n      background:var(--paper-lit);color:var(--ink);\n      box-shadow:inset 0 0 0 1px rgba(29,32,29,.34), 0 1px 3px rgba(29,32,29,.14);\n      transform:translateX(-50%) scale(1);animation:none;\n      transition:background .22s ease, color .22s ease,\n                 box-shadow .22s ease, opacity .2s ease}\n    #pip:active{transform:translateX(-50%) scale(.93)}\n    #pip::after{\n      content:\"\";position:absolute;inset:-5px;border-radius:50%;\n      border:1.6px solid var(--signal);opacity:0;pointer-events:none}\n    @keyframes pgbeat{\n      0%,100%{transform:translateX(-50%) scale(1)}\n      12%{transform:translateX(-50%) scale(1.075)}\n      26%{transform:translateX(-50%) scale(.995)}\n      38%{transform:translateX(-50%) scale(1.03)}\n      56%{transform:translateX(-50%) scale(1)}}\n    @keyframes pgknock{\n      0%{transform:scale(.9);opacity:.55}\n      70%{transform:scale(1.42);opacity:0}\n      100%{transform:scale(1.42);opacity:0}}\n    @keyframes pgseat{\n      0%{transform:translateX(-50%) scale(.82)}\n      44%{transform:translateX(-50%) scale(1.07)}\n      100%{transform:translateX(-50%) scale(1)}}\n    #pip.beat{animation:pgbeat 1.7s ease-in-out infinite}\n    #pip.beat::after{animation:pgknock 1.7s ease-out infinite}\n    #pip.beat:active{animation:none}\n    #pip.on{\n      background:var(--signal);color:var(--paper-lit);\n      transform:translateX(-50%) scale(1.06);\n      box-shadow:inset 0 0 0 1px rgba(29,32,29,.2), 0 3px 12px rgba(191,69,38,.3)}\n    #pip.on:active{transform:translateX(-50%) scale(1)}\n    #pip.on::after{animation:none;opacity:0}\n    #pip.away{opacity:.26}\n    #pip.seated{animation:pgseat .46s cubic-bezier(.2,.9,.25,1)}\n    @media (prefers-reduced-motion:reduce){\n      #pip.beat,#pip.beat::after,#pip.seated{animation:none}}`;\n  document.head.appendChild(style);\n\n  /* pointerdown so it answers the finger, click so it answers a keyboard */\n  let swallow = false;\n  pip.addEventListener(\"pointerdown\", (e) => {\n    e.preventDefault();\n    swallow = true;\n    setTimeout(() => { swallow = false; }, 600);\n    setArmed(!armed);\n  });\n  pip.addEventListener(\"click\", () => { if (!swallow) setArmed(!armed); swallow = false; });\n  pip.addEventListener(\"animationend\", (e) => {\n    if (e.animationName === \"pgseat\") pip.classList.remove(\"seated\");\n  });\n\n  /* The ground itself asks for the line. Other bodies balk all day and the pip\n     does not knock for them — this is the ground refusing to carry YOU. And a\n     gap belongs to the ground, not to whoever found it, so becoming something\n     else does not answer it; only arriving somewhere whole does, or drawing. */\n  on(\"arrive\", ({ balk }) => setAsking(!!balk));\n  on(\"become\", () => {\n    if (live) { unpick(live); live = null; }\n    if (armed) setArmed(false);\n  });\n\n  /* a second finger is the map's, never the thread's */\n  addEventListener(\"pointerdown\", (e) => {\n    if (live && e.pointerId !== live.id) {\n      unpick(live); live = null; pip.classList.remove(\"away\"); knock();\n    }\n  }, true);\n}\n\nfunction setArmed(v) {\n  armed = v;\n  if (ctxRef) ctxRef.arm(v);\n  pip.classList.toggle(\"on\", v);\n  knock();\n}\n\n/* how long the ground goes on asking before it gives up on being answered */\nconst ASK_MS = 13000;\nlet askTimer = 0;\nfunction setAsking(v) {\n  urgent = v;\n  clearTimeout(askTimer);\n  if (v) askTimer = setTimeout(() => { urgent = false; knock(); }, ASK_MS);\n  knock();\n}\n/* the knock is the asking made visible, and it gets out of the way of a hand */\nfunction knock() {\n  pip.classList.toggle(\"beat\", urgent && !armed && !live);\n}\n/* The little bob it makes when a line becomes ground. The class is taken off\n   again the moment it is done, or it would outrank the knock. */\nfunction seatedPip() {\n  pip.classList.remove(\"seated\");\n  void pip.offsetWidth;\n  pip.classList.add(\"seated\");\n}\n\n/* ============================================================\n   THE HAND\n   ============================================================ */\nexport function onDown(ctx, p, e) {\n  if (ctx.mode !== \"draw\") return false;\n  const now = performance.now();\n  live = {\n    id: e ? e.pointerId : 0,\n    xs: [wx(p.x)], ys: [wy(p.y)], ws: [W_MIN * 1.6], n: 1,\n    px: p.x, py: p.y, lastT: now, v: 0.9,\n    seed: (Math.random() * 90000) | 0,\n    cross: [], caught: -1,\n  };\n  /* did the needle go in on ground that is already there? */\n  live.caught = nearestNode(live.xs[0], live.ys[0], units(26));\n  entry = { x: live.xs[0], y: live.ys[0], t0: now, bound: live.caught >= 0 };\n  pip.classList.add(\"away\");\n  knock();\n  return true;\n}\n\nexport function onMove(ctx, p) {\n  const L = live;\n  if (!L) return;\n  const d = Math.hypot(p.x - L.px, p.y - L.py);\n  if (d < 2.2) return;\n  const now = performance.now();\n  const dt = Math.max(1, now - L.lastT);\n  const v = d / dt;\n  L.v = L.n < 3 ? v : lerp(L.v, v, 0.34);\n  L.px = p.x; L.py = p.y; L.lastT = now;\n\n  const x = wx(p.x), y = wy(p.y);\n  crossingsOf(L, L.xs[L.n - 1], L.ys[L.n - 1], x, y);\n  L.xs.push(x); L.ys.push(y); L.ws.push(widthFor(L.v)); L.n++;\n  /* the first samples inherit the hand the gesture turned out to have */\n  if (L.n === 4) { L.ws[0] = L.ws[3] * 0.9; L.ws[1] = L.ws[3] * 0.95; }\n  L.caught = nearestNode(x, y, units(26));\n}\n\n/* Holding still lets the ink pool where the finger is standing. It swells the\n   stretch just behind the tip rather than the tip itself, because the very end\n   of the thread is still tapering off the needle and nothing shows there. */\nfunction pool(now) {\n  const L = live;\n  if (!L || L.n < 3) return;\n  const still = now - L.lastT;\n  if (still < 110) return;\n  const gain = Math.min(0.09, (still - 110) * POOL);\n  for (let i = Math.max(0, L.n - 14); i < L.n; i++) {\n    const k = 1 - (L.n - 1 - i) / 16;\n    L.ws[i] = Math.min(W_MAX, L.ws[i] + gain * k);\n  }\n}\n\nexport function onUp(ctx, p) {\n  const L = live;\n  if (!L) return;\n  live = null;\n  pip.classList.remove(\"away\");\n  setArmed(false);\n\n  const flat = [];\n  for (let i = 0; i < L.n; i++) flat.push(L.xs[i], L.ys[i]);\n  if (L.n < 4 || metres(pathLength(flat)) < 25) { unpick(L); return; }\n\n  /* what the hand meant, without what the hand wobbled */\n  const tol = units(clamp(6 / pxPerM(), 6, 30));\n  const pts = simplify(flat, tol);\n  if (pts.length < 4) { unpick(L); return; }\n\n  /* the width of each kept point, carried over from the sample it came from:\n     simplify() returns a subsequence, so one forward walk matches them up */\n  const kw = new Float32Array(pts.length / 2);\n  for (let i = 0, k = 0; i + 1 < pts.length; i += 2) {\n    while (k < L.n - 1 && (L.xs[k] !== pts[i] || L.ys[k] !== pts[i + 1])) k++;\n    kw[i / 2] = L.ws[Math.min(k, L.n - 1)];\n    k++;\n  }\n\n  /* one gauge for the whole thing: mostly the hand's average, pulled some of\n     the way toward its most deliberate stretch */\n  let sum = 0, len = 0, top = 0;\n  for (let i = 0; i + 3 < pts.length; i += 2) {\n    const s = Math.hypot(pts[i + 2] - pts[i], pts[i + 3] - pts[i + 1]);\n    sum += (kw[i / 2] + kw[i / 2 + 1]) * 0.5 * s;\n    len += s;\n    if (kw[i / 2] > top) top = kw[i / 2];\n  }\n  const gauge = clamp((len > 0 ? sum / len : W_MIN) * 0.68 + top * 0.32, W_MIN, W_MAX);\n\n  /* Given a body at graph scale, so that wherever it runs past a junction it\n     has a vertex there to be tied by, and then dropped onto whatever is under\n     it — a nudge, not a correction, so a deliberate cut across a car park\n     stays a cut across a car park. */\n  const dense = bodied(pts, kw);\n  const fin = settleOnto(dense.xy);\n  /* every place it will tie into ground that already exists, found BEFORE the\n     mark is laid, or it would only find itself */\n  const binds = bindsOf(fin);\n\n  layMark(fin, gauge, S.being);\n  try { navigator.vibrate && navigator.vibrate(14); } catch {}\n  seatedPip();\n  setAsking(false);\n\n  seat = {\n    kind: \"seat\", a: dense.xy, b: fin, wa: dense.w, wb: gauge,\n    n: dense.xy.length / 2,\n    /* where the city crosses the line it actually became, so the weave that\n       was true in the hand is still true on the ground */\n    binds, cross: crossingsAlong(fin), seed: L.seed, t0: performance.now(),\n  };\n}\n\n/* A thread has to have a body before it can be tied into anything. The city's\n   own ground has a junction about every eighty metres, so a line given a\n   vertex at that scale meets the city wherever it actually runs past it —\n   which is what makes a drawing infrastructure instead of a picture of one. */\nfunction bodied(pts, kw) {\n  const total = pathLength(pts);\n  const step = Math.max(units(30), total / 64);\n  const xy = [], w = [];\n  for (let i = 0; i + 3 < pts.length; i += 2) {\n    const ax = pts[i], ay = pts[i + 1], bx = pts[i + 2], by = pts[i + 3];\n    const k = Math.max(1, Math.round(Math.hypot(bx - ax, by - ay) / step));\n    for (let j = 0; j < k; j++) {\n      const t = j / k;\n      xy.push(lerp(ax, bx, t), lerp(ay, by, t));\n      w.push(lerp(kw[i / 2], kw[i / 2 + 1], t));\n    }\n  }\n  xy.push(pts[pts.length - 2], pts[pts.length - 1]);\n  w.push(kw[kw.length - 1]);\n  return { xy: Float64Array.from(xy), w: Float32Array.from(w) };\n}\n\n/* a stroke too short to be ground is taken back, not deleted: it shrinks into\n   the paper so the hand can see that nothing was kept */\nfunction unpick(L) {\n  if (!L || L.n < 2) { entry = null; return; }\n  const a = [];\n  for (let i = 0; i < L.n; i++) a.push(L.xs[i], L.ys[i]);\n  seat = {\n    kind: \"unpick\", a, b: a, wa: Float32Array.from(L.ws), wb: 0, n: L.n,\n    binds: [], cross: L.cross, seed: L.seed, t0: performance.now(),\n  };\n  pip.classList.remove(\"away\");\n}\n\n/* ---------- settling ---------- */\nfunction settleOnto(pts) {\n  const tol = settleTol();\n  const out = Float64Array.from(pts);\n  for (let i = 0; i + 1 < pts.length; i += 2) {\n    const near = nearestEdge(pts[i], pts[i + 1], tol);\n    if (!near) continue;\n    out[i] = lerp(pts[i], near.x, 0.55);\n    out[i + 1] = lerp(pts[i + 1], near.y, 0.55);\n  }\n  /* neighbouring samples catch on different streets, and a line that jinks\n     between them is not settled, it is nervous. Two passes take the jink out\n     and leave the pull. */\n  const n = out.length;\n  const t = Float64Array.from(out);\n  for (let pass = 0; pass < 2; pass++) {\n    for (let i = 2; i + 3 < n; i += 2) {\n      out[i] = t[i] * 0.5 + t[i - 2] * 0.25 + t[i + 2] * 0.25;\n      out[i + 1] = t[i + 1] * 0.5 + t[i - 1] * 0.25 + t[i + 3] * 0.25;\n    }\n    t.set(out);\n  }\n  return out;\n}\n\n/* Where a thread ties into ground that is already there. Both ends if they\n   land on anything, and the strongest of whatever it crossed on the way. */\nfunction bindsOf(pts) {\n  const tol = units(26);\n  const np = pts.length / 2;\n  const found = [];\n  for (let i = 0; i < np; i++) {\n    const n = nearestNode(pts[i * 2], pts[i * 2 + 1], tol);\n    if (n < 0) continue;\n    if (found.length && found[found.length - 1].node === n) continue;\n    const adj = G.adj[n];\n    if (!adj || !adj.length) continue;\n    const p = Math.max(0, i - 1), q = Math.min(np - 1, i + 1);\n    found.push({\n      node: n, x: G.nx[n], y: G.ny[n], edges: adj.slice(0, 5),\n      /* how far down the thread this tie is, so the press reaches them in turn */\n      u: np < 2 ? 0 : i / (np - 1),\n      ang: Math.atan2(pts[q * 2 + 1] - pts[p * 2 + 1], pts[q * 2] - pts[p * 2]),\n    });\n  }\n  /* a tie every hundred metres is a bound line; a tie every ten is a mess */\n  if (found.length < 2) return found;\n  const APART = units(110);\n  const keep = [found[0]];\n  for (let i = 1; i < found.length - 1 && keep.length < 3; i++) {\n    const p = keep[keep.length - 1];\n    if (Math.hypot(found[i].x - p.x, found[i].y - p.y) > APART) keep.push(found[i]);\n  }\n  const last = found[found.length - 1], p = keep[keep.length - 1];\n  if (Math.hypot(last.x - p.x, last.y - p.y) > units(60)) keep.push(last);\n  return keep;\n}\n\n/* ============================================================\n   WHERE THE THREAD MEETS THE CITY\n\n   A crossing is remembered as the stroke is made, one new segment at a time,\n   so nothing walks the whole line every frame. The heavy fibres of the city\n   go over the new thread; the fine ones go under it. Which is which is fixed\n   by the ground itself, so a thread woven now looks the same tomorrow.\n   ============================================================ */\nconst _eb = [];\nfunction crossingsOf(L, ax, ay, bx, by) {\n  if (L.cross.length > 56) return;\n  const pad = units(4);\n  edgesInBox(\n    Math.min(ax, bx) - pad, Math.min(ay, by) - pad,\n    Math.max(ax, bx) + pad, Math.max(ay, by) + pad, _eb, over);\n  for (let i = 0; i < _eb.length; i++) {\n    const e = _eb[i];\n    const p = G.ea[e], q = G.eb[e];\n    const h = hit(ax, ay, bx, by, G.nx[p], G.ny[p], G.nx[q], G.ny[q]);\n    if (!h) continue;\n    L.cross.push({ e, x: h.x, y: h.y, cls: G.ec[e] });\n    if (L.cross.length > 56) return;\n  }\n}\n\n/* the same question asked of a finished line, all at once */\nfunction crossingsAlong(pts) {\n  const L = { cross: [] };\n  for (let i = 0; i + 3 < pts.length; i += 2) {\n    crossingsOf(L, pts[i], pts[i + 1], pts[i + 2], pts[i + 3]);\n  }\n  return L.cross;\n}\n\n/* the fibres the city laid first surface through the ones laid today */\nfunction over(e) {\n  const cls = G.ec[e];\n  if (cls >= CLS_MARK) return false;\n  if (cls === CLS_RAIL) return hash01(e * 7 + 3) > 0.2;\n  if (cls === 2) return hash01(e * 13 + 5) > 0.36;\n  return true;\n}\n\nfunction hit(ax, ay, bx, by, cx, cy, dx, dy) {\n  const r1 = bx - ax, r2 = by - ay, s1 = dx - cx, s2 = dy - cy;\n  const den = r1 * s2 - r2 * s1;\n  if (!den) return null;\n  const t = ((cx - ax) * s2 - (cy - ay) * s1) / den;\n  const u = ((cx - ax) * r2 - (cy - ay) * r1) / den;\n  if (t < 0 || t > 1 || u < 0 || u > 1) return null;\n  return { x: ax + r1 * t, y: ay + r2 * t };\n}\n\n/* how much of the thread one of those fibres hides */\nconst CITY_W = [[1.3, 3.6], [1.0, 2.7], [0.65, 1.9], [0.6, 1.5]];\nconst CITY_M = [14, 10, 7, 4], CITY_MET = [0.92, 0.88, 0.78, 0];\nfunction hideRadius(cls, zt, ppm) {\n  const w = Math.max(lerp(CITY_W[cls][0], CITY_W[cls][1], zt), CITY_M[cls] * ppm * CITY_MET[cls]);\n  return clamp(w * 0.62 + 1.5, 3, 18);\n}\n\n/* ============================================================\n   THE RIBBON — a thread is spun, not extruded\n   ============================================================ */\nlet BX = new Float32Array(1024), BY = new Float32Array(1024);\nlet BW = new Float32Array(1024), BC = new Float32Array(1024);\nlet BH = new Uint8Array(1024);\nlet CX = new Float32Array(1024), CY = new Float32Array(1024), CW = new Float32Array(1024);\nlet BN = 0;\n\nfunction room(n) {\n  if (n <= BX.length) return;\n  const s = 1 << Math.ceil(Math.log2(n));\n  const g = (old, T) => { const a = new T(s); a.set(old); return a; };\n  BX = g(BX, Float32Array); BY = g(BY, Float32Array);\n  BW = g(BW, Float32Array); BC = g(BC, Float32Array);\n  BH = g(BH, Uint8Array);\n  CX = new Float32Array(s); CY = new Float32Array(s); CW = new Float32Array(s);\n}\n\n/* world -> screen, densified so a long straight has something to breathe at,\n   and smoothed once so a hurried gesture reads as fibre and not as a polyline */\nfunction project(xs, ys, ws, n, zt, ppm, step) {\n  room(n + 8);\n  BN = 0;\n  let lx = -1e9, ly = -1e9;\n  for (let i = 0; i < n; i++) {\n    const X = sx(xs[i]), Y = sy(ys[i]);\n    if (BN > 0 && i < n - 1 && Math.abs(X - lx) < 0.5 && Math.abs(Y - ly) < 0.5) continue;\n    BX[BN] = X; BY[BN] = Y; BW[BN] = penPx(ws[i], zt, ppm) * 0.5; BN++;\n    lx = X; ly = Y;\n  }\n  if (step) densify(step);\n  if (BN > 5) smooth();\n  cumulate();\n}\n\nfunction densify(step) {\n  let need = 1;\n  for (let i = 0; i + 1 < BN; i++) {\n    need += Math.max(1, Math.min(26, Math.round(Math.hypot(BX[i + 1] - BX[i], BY[i + 1] - BY[i]) / step)));\n  }\n  if (need <= BN) return;\n  room(need + 8);\n  let m = 0;\n  for (let i = 0; i + 1 < BN; i++) {\n    const k = Math.max(1, Math.min(26, Math.round(Math.hypot(BX[i + 1] - BX[i], BY[i + 1] - BY[i]) / step)));\n    for (let j = 0; j < k; j++) {\n      const t = j / k;\n      CX[m] = lerp(BX[i], BX[i + 1], t);\n      CY[m] = lerp(BY[i], BY[i + 1], t);\n      CW[m] = lerp(BW[i], BW[i + 1], t);\n      m++;\n    }\n  }\n  CX[m] = BX[BN - 1]; CY[m] = BY[BN - 1]; CW[m] = BW[BN - 1]; m++;\n  const tx = BX, ty = BY, tw = BW;\n  BX = CX; BY = CY; BW = CW;\n  CX = tx; CY = ty; CW = tw;\n  BN = m;\n}\n\nfunction smooth() {\n  for (let i = 0; i < BN; i++) { CX[i] = BX[i]; CY[i] = BY[i]; }\n  for (let i = 1; i < BN - 1; i++) {\n    BX[i] = CX[i] * 0.5 + CX[i - 1] * 0.25 + CX[i + 1] * 0.25;\n    BY[i] = CY[i] * 0.5 + CY[i - 1] * 0.25 + CY[i + 1] * 0.25;\n  }\n}\n\nfunction cumulate() {\n  BC[0] = 0;\n  for (let i = 1; i < BN; i++) BC[i] = BC[i - 1] + Math.hypot(BX[i] - BX[i - 1], BY[i] - BY[i - 1]);\n}\n\nlet _off = 0, _mul = 1, _seed = 0, _tapPx = 20, _tapA = 1, _tapB = 1, _i0 = 0, _i1 = 0;\nfunction hw(i) {\n  let ends = 1;\n  if (_tapA) ends *= Math.pow(clamp((BC[i] - BC[_i0]) / _tapPx, 0, 1), 0.62);\n  if (_tapB) ends *= Math.pow(clamp((BC[_i1] - BC[i]) / _tapPx, 0, 1), 0.62);\n  if (_tapA || _tapB) ends = Math.min(1, ends + 0.07);\n  const u = BC[i] * 0.058;\n  const s1 = hash01(_seed + Math.floor(u)) - 0.5;\n  const s2 = hash01(_seed + 91 + Math.floor(u * 0.37)) - 0.5;\n  return Math.max(0.3, BW[i] * _mul * ends * (1 + s1 * 0.30 + s2 * 0.20) + _off + 0.12);\n}\n\nfunction ribbon(c, i0, i1) {\n  _i0 = i0; _i1 = i1;\n  let ax, ay, len, w;\n  for (let i = i0; i <= i1; i++) {\n    w = hw(i);\n    ax = BX[Math.min(i + 1, i1)] - BX[Math.max(i - 1, i0)];\n    ay = BY[Math.min(i + 1, i1)] - BY[Math.max(i - 1, i0)];\n    len = Math.hypot(ax, ay) || 1;\n    if (i === i0) c.moveTo(BX[i] - ay / len * w, BY[i] + ax / len * w);\n    else c.lineTo(BX[i] - ay / len * w, BY[i] + ax / len * w);\n  }\n  for (let i = i1; i >= i0; i--) {\n    w = hw(i);\n    ax = BX[Math.min(i + 1, i1)] - BX[Math.max(i - 1, i0)];\n    ay = BY[Math.min(i + 1, i1)] - BY[Math.max(i - 1, i0)];\n    len = Math.hypot(ax, ay) || 1;\n    c.lineTo(BX[i] + ay / len * w, BY[i] - ax / len * w);\n  }\n  c.closePath();\n}\n\n/* the thread, in as many pieces as the city cut it into */\nconst _runs = [];\nfunction runs(cross, zt, ppm, quality) {\n  _runs.length = 0;\n  let hidden = 0;\n  for (let i = 0; i < BN; i++) BH[i] = 0;\n  /* Only the length of this scan is worth trading away. The weave itself is\n     what a thread IS, and there is only ever one thread in a hand, so it is\n     not something a slow machine gets a version of the game without. */\n  if (cross && cross.length) {\n    const cap = Math.min(quality > 0.6 ? 48 : 18, cross.length);\n    for (let k = 0; k < cap; k++) {\n      const X = sx(cross[k].x), Y = sy(cross[k].y);\n      const r = hideRadius(cross[k].cls, zt, ppm), r2 = r * r;\n      for (let i = 0; i < BN; i++) {\n        if (BH[i]) continue;\n        const dx = BX[i] - X, dy = BY[i] - Y;\n        if (dx * dx + dy * dy < r2) { BH[i] = 1; hidden++; }\n      }\n    }\n  }\n  /* a thread that is more under the city than over it has stopped being a\n     weave and started being a dotted line, so it surfaces whole */\n  if (hidden > BN * 0.5) { for (let i = 0; i < BN; i++) BH[i] = 0; }\n  let s = -1;\n  for (let i = 0; i < BN; i++) {\n    if (!BH[i] && s < 0) s = i;\n    else if (BH[i] && s >= 0) { if (i - 1 > s) _runs.push(s, i - 1); s = -1; }\n  }\n  if (s >= 0 && BN - 1 > s) _runs.push(s, BN - 1);\n  return _runs;\n}\n\n/* one pass of the thread at a given swell, in every piece it survives in */\nfunction lay(c, rs, off, mul, style, alpha) {\n  if (alpha <= 0.004 || !rs.length) return;\n  _off = off; _mul = mul;\n  c.globalAlpha = alpha;\n  c.fillStyle = style;\n  c.beginPath();\n  for (let i = 0; i < rs.length; i += 2) {\n    _tapA = i === 0 ? 1 : 0;\n    _tapB = i + 2 >= rs.length ? 1 : 0;\n    ribbon(c, rs[i], rs[i + 1]);\n  }\n  c.fill();\n  _off = 0; _mul = 1;\n}\n\n/* ---------- the whole thread, in the order cloth is made ----------\n   Under it the paper is pressed; around it the paper is clear; in it the fibre\n   sits, with a lit crown along the top of the cord so it reads as something\n   lying in the cloth rather than a line printed on it. */\nfunction layThread(c, rs, warm, a, q) {\n  if (a <= 0.01) return;\n  c.save();\n  c.translate(0.6, 0.9);\n  lay(c, rs, 1.5, 1, PRESS, 0.14 * a);\n  c.restore();\n  lay(c, rs, 1.9, 1, CHANNEL, 0.8 * a);\n  layInk(c, rs, warm, a, q);\n}\n\n/* the material of the thread, on its own, so that a piece of it can be one\n   thing while the rest of it is still another */\nfunction layInk(c, rs, warm, a, q) {\n  if (a <= 0.01 || !rs.length) return;\n  const ink = fibreCol(warm, 1);\n  lay(c, rs, 1.0, 1, ink, 0.13 * a);\n  lay(c, rs, 0, 1, ink, 0.97 * a);\n  if (q > 0.3) {\n    c.save();\n    c.translate(-0.35, -0.45);\n    lay(c, rs, 0, 0.3, \"rgba(228,216,192,1)\", 0.22 * a);\n    c.restore();\n  }\n}\n\n/* the part of the thread the press has already been over */\nconst _behind = [];\nfunction upTo(rs, i) {\n  _behind.length = 0;\n  for (let k = 0; k < rs.length; k += 2) {\n    if (rs[k] > i) break;\n    _behind.push(rs[k], Math.min(rs[k + 1], i));\n  }\n  if (_behind.length && _behind[_behind.length - 1] <= _behind[_behind.length - 2]) _behind.length -= 2;\n  return _behind;\n}\n\n/* ============================================================\n   the frame\n   ============================================================ */\nexport function draw(ctx) {\n  const c = ctx.c;\n  const now = performance.now();\n  const zt = clamp((View.z - 10.5) / 6.5, 0, 1);\n  const ppm = pxPerM();\n  c.lineCap = \"round\";\n  c.lineJoin = \"round\";\n\n  if (entry) drawEntry(c, now);\n  if (live) { pool(now); drawLive(ctx, c, zt, ppm, now); }\n  if (seat) drawSeat(ctx, c, zt, ppm, now);\n\n  c.globalAlpha = 1;\n  c.setLineDash([]);\n}\n\n/* ---------- the needle going in ---------- */\nfunction drawEntry(c, now) {\n  const k = (now - entry.t0) / (entry.bound ? 420 : 260);\n  if (k >= 1) { entry = null; return; }\n  const X = sx(entry.x), Y = sy(entry.y);\n  const e = ease(clamp(k, 0, 1));\n  c.globalAlpha = (1 - e) * 0.5;\n  c.strokeStyle = fibreCol(0, 1);\n  c.lineWidth = lerp(2.2, 0.5, e);\n  c.beginPath();\n  c.arc(X, Y, lerp(1.5, entry.bound ? 21 : 13, e), 0, TAU);\n  c.stroke();\n  c.globalAlpha = 1;\n}\n\n/* ---------- the thread in the hand ---------- */\nfunction drawLive(ctx, c, zt, ppm, now) {\n  const L = live;\n  if (L.n < 2) return;\n  const q = ctx.quality;\n  project(L.xs, L.ys, L.ws, L.n, zt, ppm, 0);\n  const rs = runs(L.cross, zt, ppm, q);\n  _seed = L.seed;\n  _tapPx = clamp(BC[BN - 1] * 0.22, 6, 22);\n\n  layThread(c, rs, 0, 1, q);\n\n  /* the tip: where the thread is still coming off the needle */\n  const tx = BX[BN - 1], ty = BY[BN - 1], tw = Math.max(1.2, BW[BN - 1]);\n  c.globalAlpha = 0.92;\n  c.fillStyle = CHANNEL;\n  c.beginPath(); c.arc(tx, ty, tw + 2.3, 0, TAU); c.fill();\n  c.globalAlpha = 1;\n  c.fillStyle = fibreCol(0, 1);\n  c.beginPath(); c.arc(tx, ty, tw * 0.95, 0, TAU); c.fill();\n\n  /* the tip is over ground that would take it */\n  if (L.caught >= 0) {\n    const cxp = sx(G.nx[L.caught]), cyp = sy(G.ny[L.caught]);\n    const b = calm ? 0.5 : 0.5 + 0.5 * Math.sin(now * 0.009);\n    c.globalAlpha = 0.16 + b * 0.16;\n    c.strokeStyle = fibreCol(0, 1);\n    c.lineWidth = 1.1;\n    c.beginPath(); c.arc(cxp, cyp, 7.5 + b * 1.6, 0, TAU); c.stroke();\n  }\n  c.globalAlpha = 1;\n}\n\n/* ---------- the thread coming to rest ----------\n   Three things happen at once and they are all the same event: the line drops\n   onto the ground under it, its width evens out into one gauge of ground, and\n   a press runs down it from the end the hand started at. */\nconst SETTLE = 320, HOLD = 620, FADE = 620, WAVE = 620, BIND = 1220;\nfunction drawSeat(ctx, c, zt, ppm, now) {\n  const S0 = seat;\n  const t = now - S0.t0;\n  const unpicking = S0.kind === \"unpick\";\n  const life = unpicking ? 240 : Math.max(HOLD + FADE, WAVE, BIND);\n  if (t > life) { seat = null; return; }\n  const q = ctx.quality;\n\n  const k = calm ? ease(clamp(t / SETTLE, 0, 1)) : taut(clamp(t / SETTLE, 0, 1));\n  const n = S0.n;\n  room(n + 8);\n\n  /* the shape and the gauge arrive together */\n  const xs = [], ys = [], ws = new Float32Array(n);\n  if (unpicking) {\n    const g = 1 - clamp(t / 240, 0, 1);\n    for (let i = 0; i < n; i++) { xs.push(S0.a[i * 2]); ys.push(S0.a[i * 2 + 1]); ws[i] = S0.wa[i] * g; }\n  } else {\n    for (let i = 0; i < n; i++) {\n      xs.push(lerp(S0.a[i * 2], S0.b[i * 2], k));\n      ys.push(lerp(S0.a[i * 2 + 1], S0.b[i * 2 + 1], k));\n      ws[i] = lerp(S0.wa[i], S0.wb, k);\n    }\n  }\n\n  project(xs, ys, ws, n, zt, ppm, 6);\n  const rs = runs(S0.cross, zt, ppm, q);\n  _seed = S0.seed;\n  _tapPx = clamp(BC[BN - 1] * 0.14, 6, 26);\n\n  const a = unpicking\n    ? Math.pow(1 - clamp(t / 240, 0, 1), 0.8)\n    : 1 - ease(clamp((t - HOLD) / FADE, 0, 1));\n\n  /* laid as raw fibre first, all of it */\n  layThread(c, rs, 0, a, q);\n\n  if (unpicking) { c.globalAlpha = 1; return; }\n\n  /* THE PRESS — a hand running down the whole length, once, from the end the\n     gesture started at. Where it passes the cloth takes the cord: the paper\n     around it goes down in shadow, the thread comes up bright, and BEHIND it\n     the thread is not thread any more. That is the whole event. It is not a\n     colour change on a timer; it is the press doing it, a length at a time. */\n  const wk = clamp(t / WAVE, 0, 1);\n  const at = ease(wk) * BC[BN - 1];\n  let wi = 1;\n  while (wi < BN - 1 && BC[wi] < at) wi++;\n  if (wk >= 1) wi = BN - 1;\n  layInk(c, upTo(rs, wi), 1, a, q);\n\n  if (wk < 1 && BN > 2) {\n    const i = wi;\n    const X = BX[i], Y = BY[i];\n    const fade = Math.sin(Math.PI * Math.pow(wk, 0.8));\n    const r = (7 + BW[i] * 3.4) * (0.7 + 0.5 * fade);\n    const gr = c.createRadialGradient(X, Y, r * 0.15, X, Y, r);\n    gr.addColorStop(0, `rgba(74,60,38,${0.30 * fade})`);\n    gr.addColorStop(0.62, `rgba(74,60,38,${0.10 * fade})`);\n    gr.addColorStop(1, \"rgba(74,60,38,0)\");\n    c.globalAlpha = 1;\n    c.fillStyle = gr;\n    c.beginPath(); c.arc(X, Y, r, 0, TAU); c.fill();\n    /* and the cord is momentarily proud of the cloth where it is pressed */\n    const j0 = Math.max(0, i - 5), j1 = Math.min(BN - 1, i + 5);\n    c.globalAlpha = 0.72 * fade;\n    c.strokeStyle = fibreCol(0.5, 1);\n    c.lineWidth = Math.max(1.2, BW[i] * 2.2);\n    c.lineCap = \"round\";\n    c.beginPath();\n    c.moveTo(BX[j0], BY[j0]);\n    for (let j = j0 + 1; j <= j1; j++) c.lineTo(BX[j], BY[j]);\n    c.stroke();\n    c.globalAlpha = 0.5 * fade;\n    c.strokeStyle = \"rgba(236,226,204,1)\";\n    c.lineWidth = Math.max(0.6, BW[i] * 0.55);\n    c.stroke();\n  }\n\n  /* the stitches: where it ties into ground that was already here */\n  if (t < BIND) drawBinds(c, S0, t, zt, ppm, q);\n  c.globalAlpha = 1;\n}\n\n/* THE BIND — the press reaches a place where the new thread lies over ground\n   that was already here, and ties it down there. Two whipping stitches across\n   the cord, and a little of the new material bled out into the old both ways,\n   because from here on a body can come off one onto the other. */\nconst TIE = 560;\nfunction drawBinds(c, S0, t, zt, ppm, q) {\n  const gw = penPx(S0.wb, zt, ppm);\n  for (let i = 0; i < S0.binds.length; i++) {\n    const b = S0.binds[i];\n    const bt = t - ease(b.u) * WAVE * 0.92;\n    if (bt < 0 || bt > TIE) continue;\n    const k = bt / TIE, e = ease(k), fade = Math.pow(1 - k, 0.75);\n    const X = sx(b.x), Y = sy(b.y);\n    if (X < -60 || Y < -60 || X > View.w + 60 || Y > View.h + 60) continue;\n\n    /* a little of the new material runs out into the old */\n    if (q > 0.3) {\n      for (let j = 0; j < b.edges.length; j++) {\n        const ed = b.edges[j];\n        const o = G.ea[ed] === b.node ? G.eb[ed] : G.ea[ed];\n        const dx = sx(G.nx[o]) - X, dy = sy(G.ny[o]) - Y;\n        const L = Math.hypot(dx, dy) || 1;\n        const reach = Math.min(L, lerp(4, 30, e));\n        const ex = X + dx / L * reach, ey = Y + dy / L * reach;\n        const gr = c.createLinearGradient(X, Y, ex, ey);\n        gr.addColorStop(0, fibreCol(1, 0.62 * fade));\n        gr.addColorStop(1, fibreCol(1, 0));\n        c.globalAlpha = 1;\n        c.strokeStyle = gr;\n        c.lineWidth = gw * 0.85;\n        c.beginPath(); c.moveTo(X, Y); c.lineTo(ex, ey); c.stroke();\n      }\n    }\n\n    /* the tie closing */\n    c.globalAlpha = fade * 0.5;\n    c.strokeStyle = fibreCol(1, 1);\n    c.lineWidth = lerp(2.1, 0.6, e);\n    c.beginPath();\n    c.arc(X, Y, lerp(1.5, 14, e), 0, TAU);\n    c.stroke();\n\n    /* the whipping: two stitches drawn across the cord, in turn */\n    const ca = Math.cos(b.ang), sa = Math.sin(b.ang);\n    const span = Math.max(3.4, gw * 1.15);\n    c.lineCap = \"round\";\n    for (let s = 0; s < 2; s++) {\n      const kk = clamp((k - 0.06 - s * 0.16) / 0.3, 0, 1);\n      if (kk <= 0) continue;\n      const px = X + ca * (s ? 1 : -1) * span * 0.75;\n      const py = Y + sa * (s ? 1 : -1) * span * 0.75;\n      const r = span * 0.95 * kk;\n      c.globalAlpha = fade * 0.85;\n      c.strokeStyle = fibreCol(1, 1);\n      c.lineWidth = Math.max(1.1, gw * 0.36);\n      c.beginPath();\n      c.moveTo(px + sa * r, py - ca * r);\n      c.lineTo(px - sa * r, py + ca * r);\n      c.stroke();\n    }\n  }\n  c.globalAlpha = 1;\n}\n","travellers.js":"/* PERSPECTIVAL GROUND — the others.\n\n   If nobody else is on the ground, the ground supplies travellers. They are\n   not decoration and they are not opponents: they are the only way you ever\n   find out that the line you laid is a ramp to one of them, a wall to the\n   next, and nothing at all to a third. They use the same graph, the same\n   route(), the same beings as you. They are you, being someone else. */\n\nimport { View, sx, sy, alongPath, pathLength, units, viewBounds } from \"./geo.js\";\nimport { G, route, routePoints, nearestNodeFor, wear } from \"./graph.js\";\nimport { BEINGS, byId } from \"./beings.js\";\nimport { S, on, emit, creditMark, logBalk } from \"./state.js\";\n\nconst WANT = 5;\nlet mob = [];\n\nexport function init() {\n  on(\"boot\", () => { for (let i = 0; i < WANT; i++) spawn(i); });\n}\n\nfunction spawn(i) {\n  const being = BEINGS[i % BEINGS.length];\n  const b = viewBounds(0);\n  const x = b.x0 + Math.random() * (b.x1 - b.x0);\n  const y = b.y0 + Math.random() * (b.y1 - b.y0);\n  const n = nearestNodeFor(x, y, being, units(1400));\n  if (n < 0) return;\n  const t = { id: \"t\" + i + \".\" + Date.now().toString(36), being, node: n, x: G.nx[n], y: G.ny[n], trip: null, by: \"ground\" };\n  mob.push(t);\n  S.travellers = mob;\n  pick(t);\n}\n\nfunction pick(t) {\n  const b = viewBounds(260);\n  const x = b.x0 + Math.random() * (b.x1 - b.x0);\n  const y = b.y0 + Math.random() * (b.y1 - b.y0);\n  const to = nearestNodeFor(x, y, t.being, units(900));\n  if (to < 0 || to === t.node) return;\n  const r = route(t.node, to, t.being);\n  if (!r || r.edges.length === 0) return;\n  t.trip = { r, pts: routePoints(r), at: 0 };\n}\n\nexport function draw(ctx) {\n  const c = ctx.c;\n  for (const t of mob) {\n    if (t.trip) step(ctx, t);\n    else if (Math.random() < 0.02) pick(t);\n\n    const X = sx(t.x), Y = sy(t.y);\n    if (X < -30 || X > View.w + 30 || Y < -30 || Y > View.h + 30) continue;\n    c.beginPath();\n    c.arc(X, Y, 5, 0, Math.PI * 2);\n    c.fillStyle = t.being.ink.live;\n    c.fill();\n    c.lineWidth = 1.5;\n    c.strokeStyle = \"#f4f0e5\";\n    c.stroke();\n  }\n}\n\nfunction step(ctx, t) {\n  t.trip.at += units(t.being.speed * (ctx.dt / 1000) * 0.3);\n  const q = alongPath(t.trip.pts, t.trip.at);\n  t.x = q.x; t.y = q.y;\n  if (q.done) {\n    const r = t.trip.r;\n    t.node = r.nodes[r.nodes.length - 1];\n    wear(r.edges, 1);\n    /* did they use something a person drew? */\n    for (const e of r.edges) {\n      const m = G.emark[e];\n      if (m) creditMark(m, t);\n    }\n    if (r.balk) logBalk(r.balk.x, r.balk.y, t.being);\n    S.journeys.push({ pts: t.trip.pts, by: \"ground\", being: t.being.id, t: Date.now() });\n    t.trip = null;\n  }\n}\n\nexport const all = () => mob;\n","move.js":"/* PERSPECTIVAL GROUND — going somewhere.\n\n   Google Maps grammar and nothing cleverer: tap the ground, the way appears,\n   you go. The only thing that is not Google Maps is that the way is computed\n   for whatever you currently are, so the same tap on the same corner gives a\n   different line — or no line at all — depending on who is asking.\n\n   Three things live in here and nothing else:\n\n     THE WAY      a real route: paper halo, dark casing, bright core, chevrons\n                  running toward a pin. It has to read as a route in one glance\n                  or the tap did not land.\n\n     THE CAMERA   a leash, not a lock. While you travel it holds you near the\n                  middle; the moment a finger moves the map the leash goes\n                  slack and the camera stops arguing. When the finger has been\n                  still a while the leash tightens again. It is never possible\n                  to be trapped and never possible to lose yourself.\n\n     THE BALK     where the ground stopped offering this being anything. The\n                  traveller hits it and stops — squashes, rebounds, rings out —\n                  and the distance it fell short of is drawn as a measured gap\n                  between two ticks, with the wanted place still standing there\n                  unreached. Nothing is explained. You can see exactly how much\n                  is missing, and the only thing in the world that can close it\n                  is a line, which is the one thing your hand can make. */\n\nimport {\n  View, sx, sy, wx, wy, centerOn, clampView, alongPath, pathLength, distToSeg,\n  lerp, clamp, ease, units, metres, worldSize,\n} from \"./geo.js\";\nimport { G, route, routePoints, nearestNodeFor, wear, afford } from \"./graph.js\";\nimport { S, on, emit, logJourney, logBalk } from \"./state.js\";\n\n/* The route is the one thing in this world that is not of this world: it is an\n   instruction, not ground. So it gets the one colour Atlanta never wears, and\n   the destination gets the signal red every map has agreed on. */\nconst CORE = \"#2c62ab\", CASE = \"#16304f\", HALO = \"rgba(246,242,232,.94)\";\nconst SPENT = \"#8f8d84\";\nconst SIGNAL = \"#bf4526\", PAPER = \"#f6f2e8\", INK = \"#1d201d\";\n\nconst PAD = { t: 84, b: 132, x: 54 };\n\n/* Some people cannot take a screen that keeps moving. Everything that only\n   breathes or marches on the spot stops; the travelling itself does not. */\nconst MOTION = (() => {\n  try { return matchMedia(\"(prefers-reduced-motion: reduce)\").matches ? 0 : 1; }\n  catch { return 1; }\n})();\n\n/* #rrggbb -> rgba(), so a being's own ink can fade out under it */\nfunction hexA(hex, a) {\n  const n = parseInt(hex.slice(1), 16);\n  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;\n}\n\nlet you = null;       /* {node,x,y,ang} */\nlet plan = null;      /* {r,pts,to,t0,tx,ty} */\nlet trip = null;      /* {r,pts,len,at,T,e,hard,...} */\nlet balked = null;    /* {x,y,tx,ty,ang,t0,stale} */\nconst fx = [];        /* short-lived world-anchored flourishes */\n\n/* ---------- the camera ----------\n   It only ever owns three numbers, and it writes them last, after every organ\n   has drawn with the ones from the frame before. */\nconst cam = {\n  lx: NaN, ly: NaN, lz: NaN,   /* what we left View at, to notice a finger */\n  userAt: -1e9,\n  frame: null,                 /* {x,y,z} a place we are easing to */\n  zHome: null,                 /* zoom to dive back to once we set off */\n};\n\nexport function init(ctx) {\n  on(\"boot\", () => place());\n  on(\"become\", () => {\n    plan = null; trip = null;\n    /* the gap does not belong to the being that found it. it stays a while\n       longer, quieter, and then the ground keeps it instead of the screen. */\n    if (balked && !balked.stale) { balked.stale = true; balked.staleAt = performance.now(); }\n    if (you) reseat();\n  });\n}\n\nfunction place() {\n  const n = nearestNodeFor(View.x, View.y, S.being, 0.004);\n  if (n < 0) return;\n  you = { node: n, x: G.nx[n], y: G.ny[n], ang: 0 };\n  S.you = you;\n  centerOn(you.x, you.y);\n}\n/* when you become something else you do not teleport — you stay where you are\n   standing, on whatever ground the new body can stand on nearest to it */\nfunction reseat() {\n  const n = nearestNodeFor(you.x, you.y, S.being, 0.004);\n  if (n >= 0) { you.node = n; you.x = G.nx[n]; you.y = G.ny[n]; }\n}\n\n/* ======================================================================\n   tap\n   ====================================================================== */\nexport function onTap(ctx, p) {\n  if (ctx.mode !== \"travel\" || !you) return false;\n  /* already going. the touch is felt but the journey is the journey. */\n  if (trip) { ripple(wx(p.x), wy(p.y)); return true; }\n\n  /* tapping the way you were shown means: go */\n  if (plan && hitPlan(p)) { go(); return true; }\n\n  const tx = wx(p.x), ty = wy(p.y);\n  const to = nearestNodeFor(tx, ty, S.being, units(700));\n  if (to < 0 || to === you.node) { ripple(tx, ty); return true; }\n\n  const full = route(you.node, to, S.being);\n  if (!full || full.nodes.length < 2) { ripple(tx, ty); return true; }\n\n  /* You get one turn's worth of effort, and a ladder buys more of the city\n     with it than a chute does. Whatever is past that is still drawn — you can\n     see exactly where this body runs out — but you do not get there today. */\n  const { r, cut } = afford(full, S.being, S.allowance);\n  if (!r || r.nodes.length < 2) { ripple(tx, ty); return true; }\n\n  balked = null;\n  plan = {\n    r, to, cut, full, restPts: cut ? routePoints(full) : null,\n    pts: routePoints(r), t0: performance.now(),\n    tx: G.nx[to], ty: G.ny[to],\n  };\n  frameFor(plan);\n  emit(\"plan\", plan);\n  return true;\n}\n\n/* the pin, or anywhere along the way it drew */\nfunction hitPlan(p) {\n  const pts = plan.pts;\n  if (Math.hypot(sx(plan.tx) - p.x, sy(plan.ty) - p.y - 12) < 42) return true;\n  for (let i = 0; i + 3 < pts.length; i += 2) {\n    const d = distToSeg(p.x, p.y, sx(pts[i]), sy(pts[i + 1]), sx(pts[i + 2]), sy(pts[i + 3])).d;\n    if (d < 20) return true;\n  }\n  return false;\n}\n\nfunction go() {\n  const len = pathLength(plan.pts);\n  if (plan.pts.length < 4 || len <= 0) { plan = null; return; }\n  const hard = !!plan.r.balk;\n  const secs = clamp(metres(len) / (S.being.speed * 0.95), 1.5, 6.2);\n  trip = {\n    r: plan.r, pts: plan.pts, len, at: 0, e: 0, T: secs * 1000,\n    hard, t0: performance.now(), vn: 0,\n    tx: plan.r.balk ? plan.r.balk.toX : plan.tx,\n    ty: plan.r.balk ? plan.r.balk.toY : plan.ty,\n  };\n  fx.push({ k: \"off\", x: you.x, y: you.y, t: 0, life: 520 });\n  /* whatever the framing did to the zoom, dive back in as we set off */\n  cam.frame = null;\n  emit(\"depart\", trip);\n  plan = null;\n}\n\nfunction ripple(x, y) { fx.push({ k: \"miss\", x, y, t: 0, life: 640 }); }\n\n/* ======================================================================\n   the frame\n   ====================================================================== */\nfunction inComfort(X, Y) {\n  return X > PAD.x && X < View.w - PAD.x && Y > PAD.t && Y < View.h - PAD.b;\n}\n\n/* never past legibility, and never argues with a finger */\nfunction fitTo(coords, maxOut, maxIn) {\n  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;\n  for (let i = 0; i + 1 < coords.length; i += 2) {\n    if (coords[i] < x0) x0 = coords[i];\n    if (coords[i] > x1) x1 = coords[i];\n    if (coords[i + 1] < y0) y0 = coords[i + 1];\n    if (coords[i + 1] > y1) y1 = coords[i + 1];\n  }\n  const w = Math.max(1e-9, x1 - x0), h = Math.max(1e-9, y1 - y0);\n  const aw = Math.max(80, View.w - PAD.x * 2);\n  const ah = Math.max(80, View.h - PAD.t - PAD.b);\n  let z = clamp(Math.log2(Math.min(aw / w, ah / h) / 256), 12.2, 16.2);\n  if (!maxIn) z = Math.min(z, View.z);\n  else z = Math.min(z, View.z + maxIn);\n  if (maxOut != null) z = Math.max(z, View.z - maxOut);\n  const ws = 256 * Math.pow(2, z);\n  return {\n    x: (x0 + x1) / 2,\n    y: (y0 + y1) / 2 - (PAD.t - PAD.b) / (2 * ws),\n    z,\n  };\n}\n\nfunction frameFor(pl) {\n  if (performance.now() - cam.userAt < 260) return;\n  const a = inComfort(sx(you.x), sy(you.y));\n  const b = inComfort(sx(pl.tx), sy(pl.ty));\n  if (a && b) return;                       /* it is already all on screen */\n  if (cam.zHome == null) cam.zHome = View.z;\n  cam.frame = fitTo([you.x, you.y, pl.tx, pl.ty], 2.6);\n}\n\n/* ======================================================================\n   the loop\n   ====================================================================== */\nexport function draw(ctx, now) {\n  const c = ctx.c;\n  const q = ctx.quality;\n\n  /* 1. the world moves first, so everything drawn this frame agrees */\n  if (trip) advance(ctx, now);\n  for (let i = fx.length - 1; i >= 0; i--) {\n    fx[i].t += ctx.dt;\n    if (fx[i].t > fx[i].life) fx.splice(i, 1);\n  }\n\n  /* 2. draw with the camera every other organ already used */\n  c.lineCap = \"round\";\n  c.lineJoin = \"round\";\n\n  if (balked) drawBalk(c, now, q);\n  if (plan) drawPlan(c, now);\n  if (trip) drawTrip(c, now);\n  drawFx(c, q);\n  if (you) drawYou(c, now, q);\n\n  c.globalAlpha = 1;\n  c.setLineDash([]);\n  c.lineDashOffset = 0;\n\n  /* 3. and move the camera last, for the frame after this one */\n  camera(ctx, now);\n}\n\n/* ---------- travelling ---------- */\nfunction advance(ctx, now) {\n  trip.e += ctx.dt;\n  const p = clamp(trip.e / trip.T, 0, 1);\n  const prev = trip.at;\n  trip.at = profile(p, trip.hard) * trip.len;\n  const q = alongPath(trip.pts, trip.at);\n  you.x = q.x; you.y = q.y; you.ang = q.a;\n  /* speed relative to the trip's mean, for the camera's look-ahead */\n  const inst = (trip.at - prev) / Math.max(1, ctx.dt);\n  trip.vn = lerp(trip.vn, inst / (trip.len / trip.T), 0.18);\n\n  if (p >= 1) arrive(now);\n}\n\n/* Pull away, cruise, settle. A short ease off the mark so the tap feels\n   answered, a long steady middle so the going is watchable, and a decent\n   deceleration into the pin — except when the ground ends, where there is no\n   deceleration at all and the traveller simply runs out of world. */\nfunction profile(p, hard) {\n  const a = 0.10, b = hard ? 0 : 0.24;\n  const I = 1 - a / 2 - b / 2;\n  let s;\n  if (p < a) s = (p * p) / (2 * a);\n  else if (p <= 1 - b) s = a / 2 + (p - a);\n  else { const u = 1 - p; s = I - (u * u) / (2 * b); }\n  return clamp(s / I, 0, 1);\n}\n\nfunction arrive(now) {\n  const r = trip.r;\n  const last = r.nodes[r.nodes.length - 1];\n  you.node = last;\n  you.x = G.nx[last]; you.y = G.ny[last];\n  wear(r.edges, 1);\n  logJourney(trip.pts, r.edges, S.being);\n\n  if (r.balk) {\n    logBalk(r.balk.x, r.balk.y, S.being);\n    balked = {\n      x: r.balk.x, y: r.balk.y, tx: r.balk.toX, ty: r.balk.toY,\n      ang: you.ang, gang: Math.atan2(r.balk.toY - r.balk.y, r.balk.toX - r.balk.x),\n      t0: now, stale: false,\n    };\n    fx.push({ k: \"stop\", x: r.balk.x, y: r.balk.y, t: 0, life: 1200 });\n    /* the gap becomes the whole picture: what you reached, what you wanted,\n       and the exact amount of nothing in between */\n    setTimeout(() => {\n      if (!balked || balked.stale || performance.now() - cam.userAt < 1200) return;\n      const D = Math.hypot(sx(balked.tx) - sx(balked.x), sy(balked.ty) - sy(balked.y));\n      /* only reframe if you cannot already see the whole of what is missing */\n      if (D > 110 && inComfort(sx(balked.tx), sy(balked.ty)) &&\n          inComfort(sx(balked.x), sy(balked.y))) return;\n      cam.zHome = null;\n      cam.frame = fitTo([balked.x, balked.y, balked.tx, balked.ty], 1.8, 1.4);\n    }, 420);\n  } else {\n    fx.push({ k: \"land\", x: you.x, y: you.y, t: 0, life: 820 });\n  }\n\n  const bk = r.balk;\n  trip = null;\n  /* on a balk the arrival is held back: the stop, the rebound, the gap drawing\n     itself out and the traveller trying the wall twice are the event, and\n     nothing is allowed to talk over them. */\n  setTimeout(() => emit(\"arrive\", { balk: bk }), bk ? 3200 : 420);\n}\n\n/* ======================================================================\n   the way\n   ====================================================================== */\nfunction screenOf(pts) {\n  const sp = new Float64Array(pts.length);\n  for (let i = 0; i + 1 < pts.length; i += 2) { sp[i] = sx(pts[i]); sp[i + 1] = sy(pts[i + 1]); }\n  return sp;\n}\nfunction pathOf(sp) {\n  const p = new Path2D();\n  p.moveTo(sp[0], sp[1]);\n  for (let i = 2; i + 1 < sp.length; i += 2) p.lineTo(sp[i], sp[i + 1]);\n  return p;\n}\nfunction cumOf(sp) {\n  const n = sp.length / 2;\n  const cum = new Float64Array(n);\n  for (let i = 1; i < n; i++) {\n    cum[i] = cum[i - 1] + Math.hypot(sp[i * 2] - sp[i * 2 - 2], sp[i * 2 + 1] - sp[i * 2 - 1]);\n  }\n  return cum;\n}\nfunction ptAt(sp, cum, d) {\n  const n = cum.length;\n  let lo = 0, hi = n - 1;\n  while (lo < hi - 1) { const m = (lo + hi) >> 1; if (cum[m] ---- the pin ---------- */\nfunction pin(c, X, Y, k, now, mode, a = 1) {\n  if (a <= 0.01) return;\n  const e = 1 - Math.pow(1 - clamp(k, 0, 1), 3);\n  const lift = -34 * (1 - e);\n  const breathe = mode === \"solid\" ? Math.sin(now * 0.0037) * 0.028 * MOTION : 0;\n  const s = (0.6 + 0.4 * e) * (1 + breathe);\n  const r = 9.4 * s, h = 25 * s;\n\n  /* what it stands on */\n  c.globalAlpha = 0.22 * e * a;\n  c.fillStyle = INK;\n  c.beginPath();\n  c.ellipse(X, Y, 7.4 * s, 2.7 * s, 0, 0, Math.PI * 2);\n  c.fill();\n  c.globalAlpha = a;\n\n  const ty = Y + lift;\n  c.beginPath();\n  c.moveTo(X, ty);\n  c.quadraticCurveTo(X - r * 1.06, ty - h * 0.52, X - r, ty - h + r * 0.16);\n  c.arc(X, ty - h + r * 0.16, r, Math.PI, 0, false);\n  c.quadraticCurveTo(X + r * 1.06, ty - h * 0.52, X, ty);\n  c.closePath();\n\n  if (mode === \"wanting\") {\n    /* it is still standing there. nothing reaches it. */\n    c.fillStyle = PAPER; c.fill();\n    c.setLineDash([3.2, 3.2]);\n    c.strokeStyle = SIGNAL; c.lineWidth = 2;\n    c.stroke();\n    c.setLineDash([]);\n    const ph = MOTION ? (now * 0.00042) % 1 : 0.4;\n    c.globalAlpha = (1 - ph) * 0.5 * a;\n    c.strokeStyle = SIGNAL; c.lineWidth = 1.5;\n    c.beginPath();\n    c.arc(X, Y, 5 + ph * 26, 0, Math.PI * 2);\n    c.stroke();\n  } else {\n    c.fillStyle = SIGNAL; c.fill();\n    c.strokeStyle = PAPER; c.lineWidth = 2.1; c.stroke();\n    c.beginPath();\n    c.arc(X, ty - h + r * 0.16, r * 0.34, 0, Math.PI * 2);\n    c.fillStyle = PAPER; c.fill();\n  }\n  c.globalAlpha = 1;\n}\n\n/* ======================================================================\n   the balk — the most important thing that can happen\n   ====================================================================== */\n\n/* A measured gap: two ticks and, between them, a line that is not there. It\n   wavers the way a line does before a hand has made it, and it marches toward\n   the place it wants to reach. There is no word for it anywhere on screen. */\nfunction gapLine(c, ax, ay, bx, by, rev, now, alpha) {\n  const fd = Math.hypot(bx - ax, by - ay);\n  if (fd < 26) return;\n  /* stand clear of the traveller and of the pin, so both ticks can be read */\n  const inA = Math.min(15, fd * 0.16), inB = Math.min(12, fd * 0.14);\n  const X0 = ax + (bx - ax) * (inA / fd), Y0 = ay + (by - ay) * (inA / fd);\n  const X1 = bx - (bx - ax) * (inB / fd), Y1 = by - (by - ay) * (inB / fd);\n  const dx = X1 - X0, dy = Y1 - Y0;\n  const D = Math.hypot(dx, dy);\n  if (D < 5) return;\n  const px = -dy / D, py = dx / D;\n  const r = ease(clamp(rev, 0, 1));\n  const amp = Math.min(7, D * 0.055);\n  const n = clamp(Math.round(D / 11), 3, 34);\n\n  c.save();\n  c.strokeStyle = SIGNAL;\n  c.lineCap = \"round\";\n\n  /* the line that is not there */\n  c.beginPath();\n  for (let i = 0; i <= n; i++) {\n    const t = (r * i) / n;\n    const w = Math.sin(t * Math.PI) * Math.sin(t * 7.4 + now * 0.0011 * MOTION) * amp;\n    const X = X0 + dx * t + px * w, Y = Y0 + dy * t + py * w;\n    if (i === 0) c.moveTo(X, Y); else c.lineTo(X, Y);\n  }\n  c.setLineDash([6, 6]);\n  c.lineDashOffset = MOTION ? -((now * 0.036) % 12) : 0;\n  c.globalAlpha = alpha * 0.30;\n  c.lineWidth = 6.5;\n  c.stroke();\n  c.globalAlpha = alpha * (0.80 + 0.20 * Math.sin(now * 0.0027) * MOTION);\n  c.lineWidth = 2.6;\n  c.stroke();\n  c.setLineDash([]);\n  c.lineDashOffset = 0;\n\n  /* the ticks are what make it a measurement rather than a scribble */\n  c.globalAlpha = alpha;\n  c.lineWidth = 2.6;\n  c.beginPath();\n  c.moveTo(X0 + px * 9, Y0 + py * 9); c.lineTo(X0 - px * 9, Y0 - py * 9);\n  c.stroke();\n  if (r > 0.985) {\n    c.beginPath();\n    c.moveTo(X1 + px * 9, Y1 + py * 9); c.lineTo(X1 - px * 9, Y1 - py * 9);\n    c.stroke();\n  }\n  c.restore();\n  c.globalAlpha = 1;\n}\n\nfunction drawBalk(c, now, q) {\n  const age = now - balked.t0;\n  const X = sx(balked.x), Y = sy(balked.y);\n  const TX = sx(balked.tx), TY = sy(balked.ty);\n  let dim = 1;\n  if (balked.stale) {\n    dim = under a finger this very frame. do not push back on it. */\n  if (moved) { clampView(); cam.lx = View.x; cam.ly = View.y; cam.lz = View.z; return; }\n\n  if (cam.frame) {\n    const k = 1 - Math.exp(-dt / 260);\n    View.x += (cam.frame.x - View.x) * k;\n    View.y += (cam.frame.y - View.y) * k;\n    View.z += (cam.frame.z - View.z) * k;\n    const ws = worldSize();\n    if (Math.abs(cam.frame.z - View.z) < 0.005 &&\n        Math.hypot((cam.frame.x - View.x) * ws, (cam.frame.y - View.y) * ws) < 1.2) {\n      View.x = cam.frame.x; View.y = cam.frame.y; View.z = cam.frame.z;\n      cam.frame = null;\n    }\n  } else if (trip) {\n    /* dive back to the zoom you were at before we showed you the whole route */\n    if (cam.zHome != null) {\n      const k = 1 - Math.exp(-dt / 520);\n      View.z += (cam.zHome - View.z) * k;\n      if (Math.abs(cam.zHome - View.z) < 0.006) { View.z = cam.zHome; cam.zHome = null; }\n    }\n\n    const ws = worldSize();\n    /* look a little way up the road, further the faster you are going */\n    const leadPx = Math.min(View.h * 0.15, 104) * clamp(trip.vn, 0, 1.5) / 1.5;\n    const tx = you.x + Math.cos(you.ang) * leadPx / ws;\n    const ty = you.y + Math.sin(you.ang) * leadPx / ws;\n\n    /* The leash. Right after a finger it is long and lazy — it will only ever\n       catch a traveller about to walk off the edge of the screen — and then\n       over a second and a half it draws back in to a proper follow. */\n    const back = ease(clamp((since - 1600) / 1500, 0, 1));\n    const slack = lerp(Math.min(View.w, View.h) * 0.42, 9, back);\n    const tau = lerp(1000, 250, back);\n\n    const dx = tx - View.x, dy = ty - View.y;\n    const dpx = Math.hypot(dx * ws, dy * ws);\n    if (dpx > slack) {\n      const pull = (dpx - slack) / dpx;\n      const k = 1 - Math.exp(-dt / tau);\n      View.x += dx * pull * k;\n      View.y += dy * pull * k;\n    }\n  }\n\n  clampView();\n  cam.lx = View.x; cam.ly = View.y; cam.lz = View.z;\n}\n\nexport const state = () => ({ you, plan, trip, balked });\n","become.js":"/* PERSPECTIVAL GROUND — becoming.\n\n   The signature move, and the one thing that must never feel like a filter\n   being applied. The camera does not move. The city does not move. Your\n   position does not move. What changes is which of it is ground.\n\n   The moment is built out of one refusal and one difference.\n\n   THE REFUSAL. The instant before the turn the screen is photographed, and the\n   photograph is held over everything, pinned to the ground it was taken of.\n   Ahead of the front, Atlanta is exactly, pixel for pixel, the city you were\n   just standing in. It is not dissolving, it is not sliding, it is not being\n   replaced. It has simply not been re-read yet.\n\n   THE DIFFERENCE. A front leaves you and crosses the cloth, and behind it the\n   ground is asked again — and answers at once, at full strength, so that the\n   board is never a pale version of itself. Every fibre the old body could use\n   and the new one cannot lets go: it sags under its own weight, greys, and is\n   gone. Every fibre that was not there a moment ago comes up slack out of the\n   paper and pulls taut into existence in the new body's ink. Everything else\n   stands exactly where it stood and is simply worth something else now.\n\n   Nothing moves except tension. That difference is the whole content of the\n   moment, and it is never named: the thread that dies for one traveller is the\n   thread that arrives for the next, and the only way to learn which is which\n   is to have been both. */\n\nimport { View, sx, sy, clamp, lerp, ease, hash01, viewBounds, pxPerM } from \"./geo.js\";\nimport { S, on, become } from \"./state.js\";\nimport { nextBeing } from \"./beings.js\";\nimport { G, edgesInBox } from \"./graph.js\";\n\nconst PAPER_LIT = \"#f7f3e8\", LIGHT = \"#fffdf4\";\n\n/* Some people cannot take a screen that keeps moving. They still become — the\n   board still reorganises — it simply does it without the
