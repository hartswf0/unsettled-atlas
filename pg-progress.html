<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Perspectival Ground — build log</title>
<style>
  :root{
    --paper:#efeadd; --paper-lit:#f6f2e8; --ink:#1d201d;
    --soft:rgba(29,32,29,.58); --signal:#bf4526; --teal:#2f7d84;
    --rule:rgba(29,32,29,.16);
  }
  *{box-sizing:border-box}
  body{
    margin:0;background:var(--paper);color:var(--ink);
    font:16px/1.6 Georgia,"Times New Roman",serif;
    padding:clamp(20px,5vw,56px) clamp(16px,5vw,40px) 80px;
    -webkit-text-size-adjust:100%;
  }
  main{max-width:78ch;margin:0 auto}
  h1{font-size:clamp(26px,6vw,40px);line-height:1.1;margin:0 0 .3em;letter-spacing:-.01em}
  .line{font-style:italic;color:var(--soft);margin:0 0 1.6em;font-size:clamp(15px,2.4vw,18px)}
  .bar{
    border-left:3px solid var(--signal);padding:.7em 0 .7em 1.1em;margin:0 0 2.6em;
    font-style:italic;color:var(--soft);font-size:14.5px;line-height:1.75;
  }
  .round{border-top:1px solid var(--rule);padding-top:1.8em;margin-top:2.4em}
  .head{display:flex;flex-wrap:wrap;align-items:baseline;gap:.7em;margin-bottom:.5em}
  .id{
    font:600 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.14em;
    text-transform:uppercase;color:var(--paper-lit);background:var(--ink);
    padding:5px 8px;border-radius:3px;
  }
  h2{font-size:clamp(20px,3.6vw,27px);margin:0;font-weight:400}
  .when{font:11px/1 ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--soft)}
  .what{margin:.6em 0 1.2em}
  .proof{
    background:var(--paper-lit);border:1px solid var(--rule);border-radius:4px;
    padding:.85em 1.1em;margin:0 0 1.4em;font-style:italic;font-size:15px;
  }
  .nums{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
    gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:4px;
    overflow:hidden;margin:0 0 1.5em;
  }
  .nums div{background:var(--paper);padding:.7em .85em}
  .nums dt{font:10px/1.4 ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--soft)}
  .nums dd{margin:.25em 0 0;font-size:19px;font-variant-numeric:tabular-nums}
  figure{margin:0 0 1.4em}
  .shots{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin:0 0 1.5em}
  .shots img{
    width:100%;height:auto;display:block;border:1px solid var(--rule);border-radius:4px;
    background:var(--paper-lit);
  }
  figcaption{font-size:12.5px;color:var(--soft);font-style:italic;margin-top:.5em}
  h3{
    font:600 11px/1 ui-monospace,monospace;letter-spacing:.14em;text-transform:uppercase;
    color:var(--soft);margin:1.8em 0 .8em;
  }
  table{width:100%;border-collapse:collapse;font-size:14.5px;margin:0 0 1.4em}
  th,td{text-align:left;padding:.6em .7em;border-bottom:1px solid var(--rule);vertical-align:top}
  th{font:600 10.5px/1.4 ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--soft)}
  td.organ{font:600 13px/1.5 ui-monospace,monospace;letter-spacing:.04em}
  .score{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:700}
  .s-hi{color:var(--teal)} .s-mid{color:#8a6a2f} .s-lo{color:var(--signal)}
  .yes{color:var(--teal);font-weight:700} .no{color:var(--signal)}
  ul.gaps{margin:0 0 1em;padding-left:1.2em}
  ul.gaps li{margin-bottom:.45em}
  .violation{color:var(--signal);font-style:italic}
  footer{margin-top:3.5em;padding-top:1.4em;border-top:1px solid var(--rule);
    font-size:12.5px;color:var(--soft);font-style:italic}
  @media (max-width:520px){
    .shots{grid-template-columns:1fr 1fr}
    table{font-size:13px}
  }
</style>
</head>
<body>
<main>
  <h1>Perspectival Ground</h1>
  <p class="line" id="line"></p>
  <p class="bar" id="bar"></p>
  <div id="rounds"></div>
  <footer id="foot"></footer>
</main>
<script>
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function scoreClass(n) { return n >= 7.5 ? "s-hi" : n >= 5.5 ? "s-mid" : "s-lo"; }

function render(d) {
  document.getElementById("line").textContent = d.line || "";
  document.getElementById("bar").textContent = d.bar || "";
  const out = [];
  const rounds = (d.rounds || []).slice().reverse();
  for (const r of rounds) {
    let h = `<section class="round"><div class="head">
      <span class="id">${esc(r.id)}</span>
      <h2>${esc(r.title)}</h2>
      <span class="when">${esc(r.when || "")}</span></div>`;
    if (r.what) h += `<p class="what">${esc(r.what)}</p>`;
    if (r.proof) h += `<p class="proof">${esc(r.proof)}</p>`;
    if (r.numbers && Object.keys(r.numbers).length) {
      h += `<dl class="nums">` + Object.entries(r.numbers).map(([k, v]) =>
        `<div><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join("") + `</dl>`;
    }
    if (r.shots && r.shots.length) {
      h += `<div class="shots">` + r.shots.map((s) =>
        `<figure><img loading="lazy" src="${esc(s.src)}" alt="${esc(s.cap)}">
         <figcaption>${esc(s.cap)}</figcaption></figure>`).join("") + `</div>`;
    }
    if (r.verdicts && r.verdicts.length) {
      h += `<h3>Critic verdicts</h3><table><thead><tr>
        <th>Organ</th><th>Score</th><th>Beats ref</th><th>Biggest remaining gap</th></tr></thead><tbody>`;
      for (const v of r.verdicts) {
        h += `<tr><td class="organ">${esc(v.organ)}</td>
          <td class="score ${scoreClass(v.score)}">${esc(v.score)}/10</td>
          <td class="${v.prefersOverReference ? "yes" : "no"}">${v.prefersOverReference ? "yes" : "not yet"}</td>
          <td>${esc(v.biggestGap)}${(v.lawViolations && v.lawViolations.length)
            ? `<div class="violation">law: ${v.lawViolations.map(esc).join("; ")}</div>` : ""}</td></tr>`;
      }
      h += `</tbody></table>`;
    }
    if (r.gaps && r.gaps.length) {
      h += `<h3>Open gaps</h3><ul class="gaps">` +
        r.gaps.map((g) => `<li>${esc(g)}</li>`).join("") + `</ul>`;
    }
    h += `</section>`;
    out.push(h);
  }
  document.getElementById("rounds").innerHTML = out.join("");
  document.getElementById("foot").textContent =
    `${(d.rounds || []).length} round(s). The run stops when the whole experience is unusually fun, immediately legible, visually excellent, mobile-performant, and the critics prefer it to the references.`;
}

fetch("pg/progress/log.json", { cache: "no-store" })
  .then((r) => r.json())
  .then(render)
  .catch((e) => {
    document.getElementById("rounds").innerHTML =
      `<p class="line">Could not load the log: ${esc(e.message)}</p>`;
  });
</script>
</body>
</html>
