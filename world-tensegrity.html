/* --------------------------- 9a · LANGUAGE ------------------------------
   Not a chat box, and not a menu wearing a costume. The sentence is parsed
   into slots the world can actually hold, and the parse is shown to you so
   you can correct the world's reading of what you said.  ------------------ */
const ACTWORDS = [
  ['channel', /\b(channel|ditch|trench|drain(age)?|dig|cut a|swale)\b/],
  ['culvert', /\b(culvert|pipe|widen|enlarge|bigger)\b/],
  ['berm',    /\b(berm|levee|raise the ground|embankment|bund|wall of earth)\b/],
  ['crossing',/\b(crossing|bridge|boardwalk|safer way|cross(ing)? here|raised walk)\b/],
  ['plant',   /\b(plant|replant|restore|trees|buffer|meadow|wetland|reforest)\b/],
  ['clear',   /\b(clear|fell|cut down|remove the trees|grub)\b/],
  ['build',   /\b(build|apartments|housing|homes|units|develop)\b/],
  ['pump',    /\b(pump|pumping|abstract|draw water)\b/],
];
const CONDWORDS = [
  ['water.walk', /\b(standing water|water.*(walk|crossing|path)|wade|puddle|collects)\b/],
  ['water.row',  /\b(doorstep|water.*(row|house|home)|flood(ed|ing)? (the )?row)\b/],
  ['water.table',/\b(water table|groundwater|aquifer|well level)\b/],
  ['water.out',  /\b(downstream|out of the world|leaves|sent away)\b/],
  ['land.orchard',/\b(orchard|canopy|trees.*health|woods)\b/],
  ['land.sealed',/\b(sealed|concrete|paved|hard ?standing|impervious)\b/],
  ['housing.units',/\b(homes standing|units|apartments built)\b/],
  ['housing.left',/\b(moved away|left the row|moving out|displaced)\b/],
  ['money.rent', /\b(rent|rents)\b/],
  ['money.value',/\b(land value|price|speculat)\b/],
  ['movement.walk',/\b(walk time|how far|detour|long way)\b/],
  ['movement.road',/\b(road.*(closed|cut|under)|impassable)\b/],
  ['school.attend',/\b(attendance|absent|not turning up|empty desks)\b/],
  ['school.enroll',/\b(enrol|enroll|roll|children on the register)\b/],
];
function parse(text){
  const t = ' ' + text.toLowerCase() + ' ';
  const r = {text, place:null, act:null, cond:null, cond2:null, promise:null};
  let best=null, bestAt=1e9;
  for(const pid in ALIAS) for(const a of ALIAS[pid]){
    const at = t.indexOf(' '+a);
    if(at>=0 && at<bestAt){ bestAt=at; best=pid }
  }
  r.place = best;
  for(const [k,re] of ACTWORDS) if(re.test(t)){ r.act=k; break }
  const cs=[];
  for(const [k,re] of CONDWORDS) if(re.test(t)) cs.push(k);
  r.cond = cs[0]||null; r.cond2 = cs[1]||null;
  // a promise is a conditional commitment with a party, a place and a test
  const isProm = /\b(we('ll| will)|i('ll| will)|promise|guarantee|as long as|provided|on condition)\b/.test(t);
  if(isProm){
    let kind=null, level=20, due=null;
    if(/\b(no|not|never|won'?t|no more)\b[^.]*\b(build|develop|apartment|hous)/.test(t) ||
       /\b(nothing (gets )?built|leave it vacant|keep it open)\b/.test(t)) kind='nobuild';
    else if(/\b(trees?|orchard|buffer|canopy|woods)\b[^.]*\b(stay|remain|untouched|standing|alone)\b/.test(t) ||
            /\b(not|won'?t|never)\b[^.]*\b(clear|cut|fell|touch)\b/.test(t)) kind='keepveg';
    else if(/\b(stays?|keep|remain)s?\b[^.]*\b(dry|under|below)\b/.test(t)) {
      kind='keepdry'; const m=t.match(/(\d{1,3})\s*(cm)?/); if(m) level=Math.max(5,Math.min(90,+m[1]));
    }
    else if(/\b(plant|restore|replant|raise|fix|mend|see to|put right|sort)\b/.test(t)) {
      kind='restore'; const m=t.match(/week\s*(\d{1,2})/); due = m? +m[1] : week()+8 }
    if(kind) r.promise = {kind, place:r.place, level, due};
  }
  return r;
}

/* --------------------------- 9b · READINGS ------------------------------ */
function readingsAt(placeId, who){
  const doms = who ? [ ...domainsOfSeat(seatOf(G,who)) ] : myDoms();
  const at = who ? AC[who].at : null;
  return CONDS.filter(c=>c.place===placeId).map(c=>({
    c, val: G.state.cur[c.id],
    readable: doms.includes(c.dom) && (!at || at.includes(c.place)),
    onRecord: c.id in monitored(),
  }));
}
function whoReads(cid){
  const d = CO[cid].dom;
  return ACTORS.filter(a=>domainsOfSeat(seatOf(G,a.id)).includes(d) && a.at.includes(CO[cid].place));
}
function delta(cid){
  const a=G.state.cur[cid], b=G.state.prev[cid];
  return (a==null||b==null)?0:a-b;
}

/* --------------------------- 9c · CO-SIGNING ---------------------------- */
function proposerSeatOf(act){
  const p = G.players[act.by];
  return p ? p.seat : mySeat();
}
function makeDraft(act){
  const {diff} = previewDiff(G, act);
  const need = requiredSeats(diff, proposerSeatOf(act));
  const signed = new Set(G.log.filter(e=>{
    if(e.k!=='sign' || e.pid!==act.id) return false;
    const h = G.holder[e.seat];                  // you cannot sign a cable you do not hold
    return h && h.kind==='player' && h.id===e.by;
  }).map(e=>e.seat));
  signed.add(proposerSeatOf(act));                    // proposing is signing
  const rows = need.map(s=>{
    const h = G.holder[s];
    if(!h) return {seat:s, empty:true, ok:false};
    if(h.kind==='player'){
      const ok = signed.has(s);
      return {seat:s, player:true, id:h.id, name:h.name, you:h.id===G.me, ok};
    }
    const v = actorVerdict(G, G.state, h.id, diff, act.by);
    return {seat:s, actor:h.id, name:h.name, verdict:v, ok:v.sign};
  });
  return {act, diff, need, rows};
}
function draftReady(d){ d = d||G.draft; return !!d && d.rows.every(r=>r.ok) }
function onTable(){
  const done = new Set(G.log.filter(e=>e.k==='commit').map(e=>e.pid));
  const dropped = new Set(G.log.filter(e=>e.k==='drop').map(e=>e.pid));
  const open = G.log.filter(e=>e.k==='propose' && !done.has(e.id) && !dropped.has(e.id));
  // nobody gets to bury the table: only the last three from each author stand
  const per = {};
  return open.filter(e=>{ per[e.by]=(per[e.by]||0)+1; return true })
    .filter(e=>{ per[e.by]--; return per[e.by] < 3 });
}
function needsMe(){
  return onTable().some(a=>{
    if(a.by===G.me) return false;
    const d = makeDraft(a);
    return d.rows.some(r=>r.player && r.you && !r.ok);
  });
}

/* --------------------------- 9d · RENDERING UI -------------------------- */
function renderAll(){ renderSeatline(); renderVerbs(); renderBody(); renderCallout(); renderBar() }

function renderBar(){
  const wb=$('#weekbtn'); wb.textContent = G.week;
  const rain = rainAt(G.week);
  wb.classList.toggle('storm', rain>0);
  wb.title = rain? `${rain} mm fell this week` : 'week';
  document.body.classList.toggle('peace', isPeace() && !(G.peaceSnooze>G.week));
}
/* Peace is not a score and not a win. It is a stretch of weeks in which
   nothing here is being made to carry more than it can — and it has to have
   survived a real storm to count. */
function isPeace(){
  const S=G.state; if(!S) return false;
  const r=S.obs.slice(-8); if(r.length<8) return false;
  if(S.slack<4 || S.broken.length) return false;
  if(onTable().length) return false;          // nothing is at peace mid-argument
  if(!r.some(o=>o.rain>=25)) return false;
  // note what is NOT in this list: standing water. A floodplain under water
  // is not a crisis. A child who cannot get to school is.
  return r.every(o=> o['water.row']<12 && o['school.attend']>95.5 && o['movement.walk']<16 &&
                     o['land.orchard']>72 && o['money.rent']<115 && o['housing.left']<6 &&
                     o['water.table']>45);
}
function renderSeatline(){
  const s=$('#seatline'); const [a,b]=myDoms(); const me=meActor();
  const S=G.state;
  s.innerHTML='';
  s.appendChild(el('span','', `you hold <span class="cable">${a} ↔ ${b}</span>${me?` · <span class="who">${esc(me.name)}</span>`:''}`));
  s.appendChild(el('span','slk', `SLACK <i>${'●'.repeat(S.slack)}${'○'.repeat(Math.max(0,5-S.slack))}</i>`));
  s.onclick = openSeatSheet;
}
const VERBS = [
  ['notice','NOTICE','○'], ['claim','CLAIM','◎'], ['connect','CONNECT','◇'],
  ['propose','PROPOSE','△'], ['commit','COMMIT','◉'], ['witness','WITNESS','↻'],
];
function renderVerbs(){
  const v=$('#verbstrip'); v.innerHTML='';
  VERBS.forEach(([k,label,gl])=>{
    const b=el('button','verb'+(G.verb===k?' on':''), `<i>${gl}</i>${label}`);
    if(k==='commit'){
      const t = onTable();
      if(!t.length) b.setAttribute('disabled','');
      else if(G.needsMe) b.classList.add('ready');
    }
    if(k==='witness' && Object.keys(monitored()).length && !G.log.some(e=>e.k==='witness' && e.by===G.me))
      b.classList.add('ready');
    b.onclick=()=>{ G.verb=k; if(k!=='witness') G.mode='earth'; syncMode(); renderAll(); draw() };
    v.appendChild(b);
  });
}
function syncMode(){ document.querySelectorAll('.mode').forEach(m=>m.classList.toggle('on', m.dataset.mode===G.mode)) }

function renderCallout(){
  const ov=$('#overlay'); ov.innerHTML=''; G.calloutRect=null;
  if(G.mode!=='earth' || !G.focus) return;
  const p=PL[G.focus]; if(p._sx==null) return;
  const rs = readingsAt(G.focus).filter(r=>r.readable);
  const un = readingsAt(G.focus).filter(r=>!r.readable);
  let html, cls='callout';
  if(rs.length){
    const r=rs.sort((a,b)=>Math.abs(delta(b.c.id))-Math.abs(delta(a.c.id)))[0];
    html = `${r.c.label} — <b>${r.val}${r.c.unit}</b>`;
    const d=delta(r.c.id);
    if(Math.abs(d)>0.4) html += ` <span style="opacity:.7">(${d>0?'+':''}${d.toFixed(1)} this week)</span>`;
    if(d>0 && r.c.bad>0) cls+=' warn';
  } else if(un.length){
    const who = whoReads(un[0].c.id);
    html = `you cannot read ${un[0].c.label} here.${who.length?` <b>${who[0].name}</b> can.`:''}`;
    cls+=' mute';
  } else { html = p.name; cls+=' mute' }
  const d=el('div',cls,html); d.id='calloutEl';
  const cx = Math.max(96, Math.min(VW-96, p._sx));
  d.style.left = cx+'px';
  ov.appendChild(d);
  const hgt = d.offsetHeight || 44;
  // keep the callout out of the model: high in the empty air above it, or
  // just below the point when the point itself is already high
  const below = p._sy < VH*0.42;
  let top = below ? Math.min(VH-hgt-10, p._sy+38)
                  : Math.max(20, Math.min(p._sy - hgt - 46, VH*0.30));
  d.style.top = top+'px';
  d.style.transform = 'translateX(-50%)';
  G.calloutRect = {x:cx, top, bottom:top+hgt, below};
}

/* ------------------------------ panels ---------------------------------- */
function renderBody(){
  const B=$('#body'); B.innerHTML='';
  if(G.mode==='system') return panelSystem(B);
  if(G.mode==='assembly') return panelRoom(B);
  ({notice:panelNotice, claim:panelClaim, connect:panelConnect,
    propose:panelPropose, commit:panelCommit, witness:panelWitness}[G.verb]||panelNotice)(B);
  $('#say').placeholder = {
    notice:'say what you can see here',
    claim:'say what you think caused what',
    connect:'say what is related to what',
    propose:'say what should be done here',
    commit:'promise something to get a signature',
    witness:'say what you make of this',
  }[G.verb];
}

function panelNotice(B){
  if(!G.focus){ B.appendChild(el('div','note','<em>Touch the ground.</em> Every reading belongs to a place, and you can only read the two domains your cable spans. The rest of the world is held by other people.')); return }
  const p=PL[G.focus]; const mon=monitored();
  const blk=el('div','blk'); blk.appendChild(el('h3','',p.name));
  readingsAt(G.focus).forEach(r=>{
    const row=el('div','rowi');
    row.appendChild(el('span','dom'+(myDoms().includes(r.c.dom)?' mine':''), r.c.dom));
    row.appendChild(el('span','k', r.c.label));
    if(r.readable || (r.c.id in mon)){
      const d=delta(r.c.id);
      const v=el('span','v'+(Math.abs(d)<0.3?'':(d>0===(r.c.bad>0)?' up':' dn')), `${r.val}${r.c.unit}`);
      row.appendChild(v);
    } else row.appendChild(el('span','v na','—'));
    blk.appendChild(row);
    if(r.readable && !(r.c.id in mon)){
      const b=el('button','btn pri', `PUT “${r.c.label.toUpperCase()}” ON THE RECORD`);
      b.style.marginTop='6px';
      b.onclick=()=>{ push({k:'notice', cond:r.c.id, place:G.focus, text:$('#say').value||''});
        $('#say').value='';
        toast('On the record. Nothing moves in Brookside until somebody lets a week pass — that is WITNESS.', 5200) };
      blk.appendChild(b);
    }
  });
  B.appendChild(blk);
  const un = readingsAt(G.focus).filter(r=>!r.readable && !(r.c.id in mon));
  un.forEach(r=>{
    const w=whoReads(r.c.id);
    if(!w.length){ B.appendChild(el('div','note',`<em>${r.c.label}</em> — nobody is watching it, and nobody can from where they sit.`)); return }
    const row=el('button','act');
    row.appendChild(el('span','av', initials(w[0].name)));
    const t=el('span',''); t.appendChild(el('div','nm', `ASK ${w[0].name}`));
    t.appendChild(el('div','sb', `they can read ${r.c.label} — you cannot`));
    row.appendChild(t);
    row.onclick=()=>askActor(w[0].id);
    B.appendChild(row);
  });
}

function panelClaim(B){
  const mon = Object.keys(monitored());
  if(mon.length<2){ B.appendChild(el('div','note','A claim needs two things on the record. <em>Notice</em> something first, and get somebody else to notice theirs.')); return }
  const d = G.claimDraft = G.claimDraft || {cause:null, effect:null};
  const blk=el('div','blk'); blk.appendChild(el('h3','','I think this caused that'));
  ['cause','effect'].forEach(slot=>{
    const w=el('div',''); w.appendChild(el('h3','', slot==='cause'?'because of':'this happened'));
    mon.forEach(cid=>{
      const c=CO[cid]; const ch=el('button','chip'+(d[slot]===cid?' on':''), c.label);
      ch.onclick=()=>{ d[slot]=cid; renderBody() }; w.appendChild(ch);
    });
    blk.appendChild(w);
  });
  B.appendChild(blk);
  if(d.cause && d.effect && d.cause!==d.effect){
    const rival = G.log.filter(e=>e.k==='claim' && e.effect===d.effect && e.cause!==d.cause);
    if(rival.length) B.appendChild(el('div','note',
      `<em>${esc(nameOf(rival[0].by))}</em> says ${CO[rival[0].cause].label} caused that instead. Recording this makes it a contested reading — and only a counterfactual can settle it.`));
    const b=el('button','btn hot','RECORD THE CLAIM');
    b.onclick=()=>{ push({k:'claim', cause:d.cause, effect:d.effect, text:$('#say').value||''});
      $('#say').value=''; G.claimDraft=null; G.mode='system'; syncMode(); toast('Your claim is on the record and can be tested.') };
    B.appendChild(b);
  }
}

function panelConnect(B){
  const mon = Object.keys(monitored());
  if(mon.length<2){ B.appendChild(el('div','note','Nothing can be connected until two things are on the record.')); return }
  const d = G.connDraft = G.connDraft || {a:null,b:null};
  const blk=el('div','blk'); blk.appendChild(el('h3','','these two move together'));
  mon.forEach(cid=>{
    const c=CO[cid]; const on = d.a===cid||d.b===cid;
    const ch=el('button','chip'+(on?' on':''), `${c.label}`);
    ch.onclick=()=>{ if(d.a===cid) d.a=null; else if(d.b===cid) d.b=null; else if(!d.a) d.a=cid; else d.b=cid; renderBody() };
    blk.appendChild(ch);
  });
  B.appendChild(blk);
  if(d.a&&d.b){
    const e = (G.edges||[]).find(x=>(x.a===d.a&&x.b===d.b)||(x.a===d.b&&x.b===d.a));
    B.appendChild(el('div','note', e
      ? `The record agrees they move together (r = ${e.r.toFixed(2)} over ${e.n} weeks). That is not a cause. Somebody still has to say which way it runs.`
      : `Nothing in the record links them yet. You can still say it — the world will keep watching.`));
    const b=el('button','btn pri','CONNECT THEM');
    b.onclick=()=>{ push({k:'connect', a:d.a, b:d.b, text:$('#say').value||''}); $('#say').value=''; G.connDraft=null; G.mode='system'; syncMode() };
    B.appendChild(b);
  }
}

const ACTIONS = [
  {k:'channel', n:'CUT A CHANNEL', g:'line', d:'lower a line of ground'},
  {k:'berm',    n:'RAISE GROUND',  g:'line', d:'a bank of earth'},
  {k:'culvert', n:'WIDEN CULVERT NINE', g:'point', fixed:'culvert', d:'let the creek through the road'},
  {k:'crossing',n:'RAISE THE CROSSING', g:'line', d:'a walk that stays above water'},
  {k:'plant',   n:'PLANT',         g:'point', d:'trees hold water where they stand'},
  {k:'clear',   n:'CLEAR',         g:'point', d:'take the cover off'},
  {k:'build',   n:'BUILD HOMES',   g:'point', d:'sixty homes, and everything that follows'},
  {k:'pump',    n:'CHANGE PUMPING',g:'point', fixed:'wells', d:'more or less water out of the ground'},
];
function panelPropose(B){
  const d = G.propDraft = G.propDraft || {type:null, pts:[], x:null, y:null};
  const blk=el('div','blk'); blk.appendChild(el('h3','','a possible world'));
  ACTIONS.forEach(a=>{
    const ch=el('button','chip'+(d.type===a.k?' on':''), a.n);
    ch.onclick=()=>{ d.type=a.k; d.pts=[]; d.x=null;
      if(a.fixed){ d.x=PL[a.fixed].x; d.y=PL[a.fixed].y; d.place=a.fixed }
      G.drawing = !a.fixed; renderBody(); toast(a.fixed?'Sited. Now preview it.':(a.g==='line'?'Drag a line on the ground.':'Touch the ground to site it.')) };
    blk.appendChild(ch);
  });
  B.appendChild(blk);
  if(!d.type){ B.appendChild(el('div','note','Or just say it: <em>“cut a drainage channel toward the creek”</em>, <em>“build a safer way for children to cross here”</em>.')); return }
  const A = ACTIONS.find(a=>a.k===d.type);
  B.appendChild(el('div','note', A.d + (d.pts.length||d.x!=null ? ' — sited.' : ' — <em class="err">not sited yet.</em>')));
  if(d.type==='pump'){
    const r=el('div','btnrow');
    [0.4,1.0,1.6].forEach(v=>{ const b=el('button','btn'+(d.rate===v?' pri':''), v<1?'LESS':v>1?'MORE':'AS NOW');
      b.onclick=()=>{ d.rate=v; renderBody() }; r.appendChild(b) });
    B.appendChild(r);
  }
  const sited = d.pts.length>1 || (d.x!=null && (d.type!=='pump' || d.rate!=null));
  const b=el('button','btn hot','PREVIEW WHAT IT DOES');
  if(!sited) b.setAttribute('disabled','');
  b.onclick=()=>{
    if(onTable().filter(a=>a.by===G.me).length >= 3)
      return toast('You already have three things on the table. Settle one before adding another.', 4600);
    if(d.type==='channel'){
      const g = grade(d.pts);
      if(!g || g.fall < 0.5) return toast('Water will not run that way. Both ends are at the same height — draw it downhill.', 5200);
    }
    const id = uid();
    push({k:'propose', id, type:d.type,
      place:d.place|| nearestPlace(d.pts.length?d.pts[0][0]:d.x, d.pts.length?d.pts[0][1]:d.y),
      geom:{pts:d.pts.length>1?d.pts:null, x:d.x, y:d.y, rate:d.rate}, text:$('#say').value||''});
    $('#say').value='';
    G.draftId = id; G.verb='commit'; G.propDraft=null; G.drawing=false;
    renderAll(); draw();
    toast('It is on the table. Everyone it touches can see it now.', 4200);
  };
  B.appendChild(b);
}
function nearestPlace(x,y){ let best=PLACES[0], bd=1e9;
  PLACES.forEach(p=>{ const d=Math.hypot(p.x-x,p.y-y); if(d<bd){bd=d;best=p} }); return best.id }

function panelCommit(B){
  const table = onTable();
  if(!table.length){ B.appendChild(el('div','note','Nothing is on the table. <em>Propose</em> something, or wait — somebody else may put something up.')); return }
  const cur = table.find(a=>a.id===G.draftId) || table[0];
  if(table.length>1){
    const w=el('div','blk'); w.appendChild(el('h3','',`${table.length} things are on the table`));
    table.forEach(a=>{ const ch=el('button','chip'+(a.id===cur.id?' on':''),
      `${(ACTIONS.find(x=>x.k===a.type)||{n:a.type}).n} · ${esc(nameOf(a.by))}`);
      ch.onclick=()=>{ G.draftId=a.id; renderBody() }; w.appendChild(ch) });
    B.appendChild(w);
  }
  const d = G.draft = makeDraft(cur);
  const A = ACTIONS.find(a=>a.k===cur.type) || {n:cur.type, d:''};
  const need = d.rows.length, refuse = d.rows.filter(r=>!r.ok).length;
  B.appendChild(el('div','blk', `<h3>${A.n} · ${PL[cur.place]?PL[cur.place].name:''} · put up by ${nameOf(cur.by)}</h3>`
    + (cur.text? `<div class="note" style="padding:0 0 6px">“${esc(cur.text)}”</div>`:'')
    + `<div class="note" style="padding:0">${need} cable${need>1?'s':''} must sign`
    + (refuse? ` — <em class="err">${refuse} will not, yet</em>` : ' — <em>all of them will</em>') + `.</div>`));

  const blk=el('div','blk'); blk.appendChild(el('h3','','what you can see it doing'));
  const mon=monitored(); let anyVisible=false;
  CONDS.forEach(c=>{
    const v=d.diff[c.id]; if(Math.max(Math.abs(v.rel),Math.abs(v.relPeak))<0.05) return;
    const vis = myDoms().includes(c.dom) || (c.id in mon);
    const row=el('div','rowi');
    row.appendChild(el('span','dom'+(myDoms().includes(c.dom)?' mine':''), c.dom));
    row.appendChild(el('span','k', c.label));
    if(vis){ anyVisible=true;
      const worse = (Math.abs(v.relPeak)>Math.abs(v.rel)?v.peak:v.delta) > 0 === (c.bad>0);
      row.appendChild(el('span','v'+(worse?' up':' dn'),
        fmtDelta(c,v) + (Math.abs(v.peak)>Math.abs(v.delta)*1.4 ? ` · worst ${fmtDelta(c,{delta:v.peak})}` : '')));
    } else row.appendChild(el('span','v na','unknown to you'));
    blk.appendChild(row);
  });
  if(!anyVisible) blk.appendChild(el('div','note','Nothing you can read moves. That does not mean nothing moves.'));
  B.appendChild(blk);

  B.appendChild(el('div','blk','<h3>it pulls on these cables — they have to sign</h3>'));
  d.rows.forEach(r=>{
    const row=el('button','act');
    row.appendChild(el('span','av', r.empty?'?':initials(r.name)));
    const t=el('span',''); t.appendChild(el('div','nm', r.empty? 'NOBODY HOLDS THIS CABLE' : r.name + (r.you?' · YOU':'')));
    t.appendChild(el('div','sb', r.seat.replace('|',' ↔ ')));
    row.appendChild(t);
    if(r.empty) row.appendChild(el('span','tag wait','SEAT IT'));
    else if(r.player) row.appendChild(el('span','tag '+(r.ok?'sign':(r.you?'you':'wait')), r.ok?'SIGNED':(r.you?'SIGN?':'WAITING')));
    else row.appendChild(el('span','tag '+(r.verdict.sign?'sign':'ref'), r.verdict.sign?'SIGNS':'REFUSES'));
    row.onclick=()=>{
      if(r.empty) return seatSomebody(r.seat);
      if(r.player && r.you && !r.ok){ push({k:'sign', pid:cur.id, seat:r.seat}); return toast('You have signed.') }
      if(r.actor){ toast(`${r.name}: “${r.verdict.line}”`, 5600);
        if(!r.verdict.sign) offerPromise(r); }
      else if(r.player) toast(`${r.name} holds ${r.seat.replace('|',' ↔ ')}. Only they can sign it.`, 4000);
    };
    B.appendChild(row);
  });

  const mine = d.rows.find(r=>r.player && r.you && !r.ok);
  if(mine){
    const sb=el('button','btn pri','SIGN IT — '+mine.seat.replace('|',' ↔ '));
    sb.onclick=()=>{ push({k:'sign', pid:cur.id, seat:mine.seat}); toast('Signed.') };
    B.appendChild(sb);
  }
  const ready=draftReady(d);
  const c=el('button','btn '+(ready?'hot':''), ready?'COMMIT IT TO THE WORLD':'NOT EVERY CABLE HAS SIGNED');
  if(!ready) c.setAttribute('disabled','');
  c.onclick=()=>{
    push({k:'commit', pid:cur.id});
    G.draftId=null; G.verb='witness'; renderAll(); draw();
    toast('Committed. It takes '+(BUILDTIME[cur.type]||1)+' weeks to arrive.', 4200);
  };
  B.appendChild(c);
  if(cur.by===G.me){
    const x=el('button','btn warnb','TAKE IT OFF THE TABLE');
    x.onclick=()=>{ push({k:'drop', pid:cur.id}); G.draftId=null; G.verb='propose'; renderAll() };
    B.appendChild(x);
  }
}

function offerPromise(r){
  const n=el('div','note');
  n.innerHTML = `<em>${r.name}</em> will not sign. You can change the design — or say something binding, such as <em>“we will not build at The Flats”</em>, and record it as a promise. The world will hold you to it.`;
  const b=$('#body'); b.insertBefore(n, b.firstChild); b.scrollTop=0;
  G.promiseTarget = r.actor;
}

function panelWitness(B){
  const S=G.state;
  const b=el('button','btn hot','LET A WEEK PASS');
  b.onclick=()=>{ if(G.week>=MAXWEEK) return toast('The year is done.');
    push({k:'witness'}); G.verb='witness'; renderAll(); draw();
    const S2=G.state; const ev=S2.events.filter(e=>e.wk===G.week);
    if(ev.length) toast(ev[ev.length-1].text, 4200);
    const rs = reassemble(G,S2,G.loads,G.holder);
    if(rs){ push({k:'reseat', actor:rs.actor, to:rs.to}); }
  };
  B.appendChild(b);
  const feed = S.events.slice().reverse().slice(0,40);
  if(!feed.length) B.appendChild(el('div','note','Nothing has happened yet. Let a week pass.'));
  feed.forEach(e=>{
    const d=el('button','evt'+(e.big?' big':'')+(e.bad?' bad':'')+(e.mem?' mem':''));
    d.appendChild(el('span','wk',`WEEK ${e.wk}`));
    d.appendChild(el('span','',e.text));
    if(e.aid){
      const src=el('span','src','why did that happen? <u>test it against a world without this</u>');
      d.appendChild(src);
      d.onclick=()=>openTest(e.aid);
    } else if(e.kind==='water'||e.kind==='school'||e.kind==='money'||e.kind==='land'||e.kind==='housing'){
      const acts=G.state.acts.filter(a=>a.committed<=e.wk);
      if(acts.length){ d.appendChild(el('span','src','<u>test this against a world where we did not do that</u>'));
        d.onclick=()=>openTest(acts[acts.length-1].id) }
    }
    B.appendChild(d);
  });
}

/* --------------------------- 9e · THE COUNTERFACTUAL --------------------
   The only thing in this file that can settle an argument, and it costs
   the world some of its slack to run.  ------------------------------------ */
function openTest(aid){
  const S=G.state; const act=S.acts.find(a=>a.id===aid); if(!act) return;
  if(S.slack<1) return toast('There is no slack left to run a test. The world is too stretched to spare the attention.', 5000);
  const without = G.log.filter(e=>!(e.id===aid) && !(e.k==='commit' && e.pid===aid));
  const alt = runWorld(without, G.week);
  const mon = monitored();
  const since = act.committed;
  const worst = (obs, c) => {
    let v = 0, wk = null;
    obs.forEach(o=>{ if(o.week < since) return;
      const x = c.bad<0 ? -o[c.id] : o[c.id];
      if(wk===null || x > v){ v = x; wk = o.week } });
    return {v: wk===null?0:(c.bad<0?-v:v), wk};
  };
  const rows = CONDS.map(c=>{
    const a=worst(S.obs,c), b=worst(alt.obs,c);
    return {c, real:a.v, alt:b.v, wk:a.wk, d:a.v-b.v,
            vis: myDoms().includes(c.dom) || (c.id in mon)};
  }).filter(r=>Math.abs(r.d) > Math.max(0.4, Math.abs(r.alt)*0.02));
  rows.sort((x,y)=> (y.vis-x.vis) || (Math.abs(y.d)/(y.c.sc||10) - Math.abs(x.d)/(x.c.sc||10)));
  const m=$('#modalin'); m.innerHTML='';
  m.appendChild(el('h2','',`A WORLD WITHOUT — ${(VERB_TEXT[act.type]||act.type).toUpperCase()}, WEEK ${act.committed}`));
  const lead = rows.find(r=>r.vis);
  if(lead) m.appendChild(el('div','note',
    `Without it, the worst week for <em>${lead.c.label}</em> would have been <em>${lead.alt}${lead.c.unit}</em> instead of <em>${lead.real}${lead.c.unit}</em>.`));
  if(!rows.length) m.appendChild(el('div','note','Nothing measurable would have been different. That is an answer too — and it is not the answer anybody expected.'));
  let hidden=0;
  rows.forEach(r=>{
    if(!r.vis){ hidden++; return }
    const row=el('div','rowi'); row.style.padding='8px 12px';
    row.appendChild(el('span','dom'+(myDoms().includes(r.c.dom)?' mine':''), r.c.dom));
    row.appendChild(el('span','k', `${r.c.label}<br><span style="opacity:.55;font-size:10px">worst in week ${r.wk}</span>`));
    row.appendChild(el('span','v'+((r.d>0)===(r.c.bad>0)?' up':' dn'),
      `${r.alt}${r.c.unit} → ${r.real}${r.c.unit}`));
    m.appendChild(row);
  });
  if(hidden) m.appendChild(el('div','note',
    `<em>${hidden} more thing${hidden>1?'s':''} moved</em> in domains nobody at this table is watching. The test cannot tell you what you never looked at.`));
  m.appendChild(el('div','note','This is the same world folded again with one action deleted, and nothing else changed. It is the only thing here that can settle an argument, which is why it costs the world some of its slack.'));
  const close=el('button','btn pri','ACCEPT THE RESULT — COSTS ONE SLACK');
  close.onclick=()=>{
    $('#modal').classList.remove('on');
    push({k:'test', target:aid, pair:testPair(rows), supported:rows.length>0});
  };
  m.appendChild(close);
  $('#modal').classList.add('on');
}
function testPair(rows){
  if(rows.length<2) return '';
  return rows[0].c.id+'>'+rows[1].c.id;
}

/* --------------------------- 9f · SYSTEM PANEL -------------------------- */
function panelSystem(B){
  const mon=monitored();
  const kn=Object.keys(mon).length;
  B.appendChild(el('div','note',`The record holds <em>${kn} of ${CONDS.length}</em> conditions. Nothing that nobody watches has a history, and nothing without a history can be argued about.`));
  const live=(G.edges||[]).filter(e=>e.status!=='faint').sort((a,b)=>Math.abs(b.r)-Math.abs(a.r));
  if(!live.length) B.appendChild(el('div','note','No relation has shown itself yet.'));
  live.forEach(e=>{
    const row=el('button','evt');
    const st={noticed:'MOVES TOGETHER',hypothesis:'CLAIMED',contested:'CONTESTED',tested:'TESTED',weakened:'WEAKENED'}[e.status];
    row.appendChild(el('span','wk', `${st} · r ${e.r>0?'+':''}${e.r.toFixed(2)} · ${e.n} weeks`));
    row.appendChild(el('span','', `${CO[e.a].label} <span style="color:var(--dim)">↔</span> ${CO[e.b].label}`));
    if(e.claims.length){
      row.appendChild(el('span','src', e.claims.map(c=>`<u>${esc(nameOf(c.by))}</u>: ${CO[c.cause].label} caused ${CO[c.effect].label}`).join(' · ')));
    }
    if(e.status==='contested') row.appendChild(el('span','src','two people disagree about which way this runs. Test it.'));
    row.onclick=()=>{ const a=G.state.acts; if(a.length) openTest(a[a.length-1].id); else toast('Nothing has been done yet to test against.') };
    B.appendChild(row);
  });
}
function nameOf(id){
  if(G.players[id]) return G.players[id].name;
  if(AC[id]) return AC[id].name;
  return id===G.me?'you':id;
}

/* --------------------------- 9g · THE ROOM ------------------------------ */
function panelRoom(B){
  const S=G.state;
  const anyLoad = SEATS.some(s=>(G.loads[s]||0) > 0.02);
  if(!anyLoad) B.appendChild(el('div','note',
    'No cable is carrying anything. Nothing is on the record, so the assembly does not yet know that anybody needs anybody. <em>Notice something</em>, and get somebody else to notice theirs.'));
  const loaded = SEATS.filter(s=>(G.loads[s]||0)>0.45 && !G.holder[s]);
  if(loaded.length) B.appendChild(el('div','note',
    `<em>${loaded.length} cable${loaded.length>1?'s are':' is'} under load with nobody on it.</em> When that happens the world drags somebody onto it, and everything you propose will need their name.`));
  ACTORS.forEach(a=>{
    const seat=seatOf(G,a.id); const held=G.holder[seat];
    const taken = held && held.kind==='player';
    const row=el('button','act'+(G.focus&&a.at.includes(G.focus)?' here':''));
    row.appendChild(el('span','av', initials(a.name)));
    const t=el('span',''); t.appendChild(el('div','nm', a.name + (taken?` · ${held.name}`:'')));
    t.appendChild(el('div','sb', `${seat.replace('|',' ↔ ')} · ${a.role}`));
    row.appendChild(t);
    const st=S.standing[a.id]??1;
    row.appendChild(el('span','tag '+(st<1?'ref':''), st<1?'WRONGED':`LOAD ${Math.round((G.loads[seat]||0)*100)}`));
    row.onclick=()=>askActor(a.id);
    B.appendChild(row);
  });
  if(S.broken.length){
    B.appendChild(el('div','blk','<h3>what was promised</h3>'));
    G.log.filter(e=>e.k==='promise').forEach(pr=>{
      const br=S.broken.find(b=>b.id===pr.id);
      const d=el('div','evt'+(br?' mem':''));
      d.appendChild(el('span','wk',`WEEK ${pr.week} · ${br?'BROKEN IN WEEK '+br.brokenWk:'STANDING'}`));
      d.appendChild(el('span','', `“${esc(pr.text||PROMISE_KINDS[pr.kind].t(pr))}”`));
      B.appendChild(d);
    });
  }
}
function askActor(id){
  const a=AC[id], S=G.state, mon=monitored();
  const doms=domainsOfSeat(seatOf(G,id));
  const rs=CONDS.filter(c=>doms.includes(c.dom) && a.at.includes(c.place));
  const m=$('#modalin'); m.innerHTML='';
  m.appendChild(el('h2','',`${a.name} — ${a.role}`));
  m.appendChild(el('div','note',`Reads only <em>${doms.join('</em> and <em>')}</em>, and only where they stand.`));
  if(!rs.length) m.appendChild(el('div','note','“I have nothing to tell you. I am not where that happens.”'));
  rs.forEach(c=>{
    const row=el('div','rowi'); row.style.padding='8px 12px';
    row.appendChild(el('span','dom',c.dom));
    row.appendChild(el('span','k',c.label));
    row.appendChild(el('span','v', `${S.cur[c.id]}${c.unit}`));
    m.appendChild(row);
    if(!(c.id in mon)){
      const harm = (c.bad>0? delta(c.id) : -delta(c.id));
      const willing = harm > 0.2 || (S.standing[id]??1) >= 1 && (c.id in a.cares);
      const b=el('button','btn'+(willing?' pri':''), willing?'ASK THEM TO PUT IT ON THE RECORD':'THEY WILL NOT PUT THIS ON THE RECORD');
      if(!willing) b.setAttribute('disabled','');
      b.onclick=()=>{ push({k:'notice', cond:c.id, place:c.place, by:id, text:`${a.name} said it out loud.`});
        $('#modal').classList.remove('on'); toast(`${a.name} put ${c.label} on the record.`) };
      m.appendChild(b);
    }
  });
  const cl=el('button','btn','CLOSE'); cl.onclick=()=>$('#modal').classList.remove('on');
  m.appendChild(cl);
  $('#modal').classList.add('on');
}
function seatSomebody(seat){
  const doms=domainsOfSeat(seat);
  const cands=ACTORS.filter(a=>!Object.values(G.players).some(p=>p.actor===a.id))
    .filter(a=>domainsOfSeat(seatOf(G,a.id)).some(d=>doms.includes(d)))
    .sort((a,b)=>(G.loads[seatOf(G,a.id)]||0)-(G.loads[seatOf(G,b.id)]||0));
  const m=$('#modalin'); m.innerHTML='';
  m.appendChild(el('h2','',`NOBODY HOLDS ${seat.replace('|',' ↔ ')}`));
  m.appendChild(el('div','note','Your proposal pulls on a cable with no one on it. Somebody has to move seats — and when they move, they stop watching what they were watching.'));
  cands.slice(0,4).forEach(a=>{
    const row=el('button','act');
    row.appendChild(el('span','av',initials(a.name)));
    const t=el('span',''); t.appendChild(el('div','nm',a.name));
    t.appendChild(el('div','sb',`leaves ${seatOf(G,a.id).replace('|',' ↔ ')}`));
    row.appendChild(t);
    row.onclick=()=>{ $('#modal').classList.remove('on');
      push({k:'reseat', actor:a.id, to:seat});
      toast(`${a.name} has moved onto ${seat.replace('|',' ↔ ')}. They have stopped watching what they were watching.`, 5200) };
    m.appendChild(row);
  });
  const cl=el('button','btn','CLOSE'); cl.onclick=()=>$('#modal').classList.remove('on');
  m.appendChild(cl);
  $('#modal').classList.add('on');
}

function openSeatSheet(){
  const m=$('#modalin'); m.innerHTML='';
  const me=meActor();
  m.appendChild(el('h2','','YOUR SEAT'));
  m.appendChild(el('div','note',`You are not above this place. You are one cable of it: <em>${mySeat().replace('|',' ↔ ')}</em>${me?`, standing where <em>${me.name}</em> stands`:''}. You can read those two domains and nothing else. Everything else in Brookside belongs to somebody's attention, and you will have to ask.`));
  m.appendChild(el('div','blk','<h3>take a different seat</h3>'));
  ACTORS.forEach(a=>{
    const taken = Object.values(G.players).some(p=>p.actor===a.id && p.id!==G.me);
    const row=el('button','act');
    row.appendChild(el('span','av',initials(a.name)));
    const t=el('span',''); t.appendChild(el('div','nm',a.name));
    t.appendChild(el('div','sb',`${seatOf(G,a.id).replace('|',' ↔ ')} · ${a.role}`));
    row.appendChild(t);
    if(taken) row.appendChild(el('span','tag','TAKEN'));
    row.onclick=()=>{ if(taken) return;
      G.players[G.me]={id:G.me,name:G.players[G.me]?G.players[G.me].name:'YOU',seat:seatOf(G,a.id),actor:a.id};
      net.send({t:'player', p:G.players[G.me]});
      $('#modal').classList.remove('on'); afterChange() };
    m.appendChild(row);
  });
  m.appendChild(el('div','blk','<h3>play with other people</h3>'));
  const r=el('div','note',`Multiplayer room: <b>${esc(G.room||'—')}</b>. Anyone opening <em>?room=${esc(G.room||'NAME')}</em> sits at a different cable and sees a different half of Brookside.`);
  m.appendChild(r);
  const cl=el('button','btn','CLOSE'); cl.onclick=()=>$('#modal').classList.remove('on');
  m.appendChild(cl);
  $('#modal').classList.add('on');
}
</script>
<script>
/* ============================ 10 · HANDS ================================ */
let toastT=null;
function toast(msg, ms){
  const t=$('#toast'); t.textContent=msg; t.classList.add('on');
  t.classList.toggle('bad', /refus|broke|cannot|no slack/i.test(msg));
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'), ms||2600);
}
function screenToGrid(sx,sy){
  let best=null, bd=1e9;
  const T=G.state.T;
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){
    const i=idx(x,y); if(!TRI[i]) continue;
    const p=proj(x+0.5,y+0.5,T.e[i]);
    const d=(p[0]-sx)*(p[0]-sx)+(p[1]-sy)*(p[1]-sy);
    if(d<bd){ bd=d; best=[x+0.5,y+0.5] }
  }
  return bd < 4200 ? best : null;
}
(function pointer(){
  const st=$('#stage');
  let pts=new Map(), start=null, moved=0, dragYaw=0, dragTilt=0, pinch0=null, drawing=false;
  st.addEventListener('pointerdown', e=>{
    st.setPointerCapture(e.pointerId);
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===1){
      const r=st.getBoundingClientRect();
      start={x:e.clientX,y:e.clientY,t:performance.now(),lx:e.clientX-r.left,ly:e.clientY-r.top};
      moved=0; dragYaw=cam.yaw; dragTilt=cam.tilt;
      const d=G.propDraft;
      drawing = !!(G.drawing && d && d.type && ACTIONS.find(a=>a.k===d.type).g==='line');
      if(drawing){ d.pts=[]; const g=screenToGrid(start.lx,start.ly); if(g) d.pts.push(g) }
    } else if(pts.size===2){
      const a=[...pts.values()]; pinch0={d:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y), s:cam.scale};
    }
    $('#hint').style.opacity=0;
    if(document.body.classList.contains('peace')){ document.body.classList.remove('peace'); G.peaceSnooze=G.week+6 }
  });
  st.addEventListener('pointermove', e=>{
    if(!pts.has(e.pointerId)) return;
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===2 && pinch0){
      const a=[...pts.values()]; const d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);
      cam.scale=Math.max(3.4,Math.min(30, pinch0.s*d/pinch0.d)); recentre(); draw(0.5); return;
    }
    if(!start) return;
    const r=st.getBoundingClientRect();
    const dx=e.clientX-start.x, dy=e.clientY-start.y;
    moved=Math.max(moved, Math.hypot(dx,dy));
    if(drawing){
      const g=screenToGrid(e.clientX-r.left, e.clientY-r.top);
      const d=G.propDraft;
      if(g && (!d.pts.length || Math.hypot(g[0]-d.pts[d.pts.length-1][0], g[1]-d.pts[d.pts.length-1][1])>1.1)) d.pts.push(g);
      draw(0.5); drawDraftLine(); return;
    }
    cam.yaw = dragYaw + dx*0.006;
    cam.tilt = Math.max(0.24, Math.min(0.96, dragTilt + dy*0.0022));
    recentre(); draw(0.5);
  });
  const end = e=>{
    pts.delete(e.pointerId); if(pts.size<2) pinch0=null;
    if(pts.size) return;
    if(drawing){ drawing=false; G.drawing=false; renderBody(); draw(); drawDraftLine();
      toast(`${G.propDraft.pts.length} points. Preview it.`); start=null; return }
    if(start && moved<7){
      const r=st.getBoundingClientRect();
      const g=screenToGrid(start.lx,start.ly);
      if(g){
        const d=G.propDraft;
        if(d && d.type && ACTIONS.find(a=>a.k===d.type).g==='point' && !ACTIONS.find(a=>a.k===d.type).fixed){
          d.x=g[0]; d.y=g[1]; d.place=nearestPlace(g[0],g[1]); renderBody(); draw(); drawDraftLine();
          toast(`Sited at ${PL[d.place].name}.`);
        } else {
          G.focus = nearestPlace(g[0],g[1]);
          if(G.verb!=='propose' && G.mode==='earth') { G.verb = G.verb==='witness'?'witness':G.verb }
          renderAll(); draw();
        }
      }
    }
    start=null; draw();
  };
  st.addEventListener('pointerup', end); st.addEventListener('pointercancel', end);
  st.addEventListener('wheel', e=>{ e.preventDefault();
    cam.scale=Math.max(3.4,Math.min(30, cam.scale*(e.deltaY>0?0.92:1.08))); recentre(); draw() }, {passive:false});
})();
function drawDraftLine(){
  const d=G.propDraft; if(!d) return;
  const T=G.state.T;
  ctx.save(); ctx.strokeStyle='#5ec8ff'; ctx.lineWidth=2.4; ctx.setLineDash([6,4]); ctx.lineJoin='round';
  if(d.pts && d.pts.length>1){
    ctx.beginPath();
    d.pts.forEach((p,k)=>{ const i=idx(Math.floor(p[0]),Math.floor(p[1]));
      const q=proj(p[0],p[1], TRI[i]?T.e[i]:40); k?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]) });
    ctx.stroke();
  } else if(d.x!=null){
    const i=idx(Math.floor(d.x),Math.floor(d.y));
    const q=proj(d.x,d.y, TRI[i]?T.e[i]:40);
    ctx.beginPath(); ctx.ellipse(q[0],q[1], cam.scale*3, cam.scale*3*cam.tilt, 0,0,7); ctx.stroke();
  }
  ctx.restore();
}

/* --------------------------- the say bar -------------------------------- */
function say(){
  const inp=$('#say'); const text=inp.value.trim(); if(!text) return;
  const p=parse(text);
  if(p.promise && p.promise.kind){
    const place = p.promise.place || G.focus;
    if(!place) return toast('A promise needs a place. Touch the ground first.', 3400);
    const target = G.promiseTarget || (ACTORS.find(a=>a.at.includes(place))||{}).id;
    push({k:'promise', kind:p.promise.kind, place, level:p.promise.level, due:p.promise.due,
      toActor:target, text, baseline:G.state.cur['land.orchard']});
    inp.value=''; G.promiseTarget=null;
    return toast(`Recorded as a promise to ${target?AC[target].name:'the room'}. The world will check it every week.`, 4600);
  }
  if(G.verb==='propose'){
    if(!p.act) { toast('The world could not find an action in that. Pick one below, or say it plainer.', 4200); return }
    const d = G.propDraft = G.propDraft || {};
    d.type=p.act; d.pts=[]; d.x=null;
    const fixed=ACTIONS.find(a=>a.k===p.act).fixed;
    const pl = fixed || p.place || G.focus;
    if(fixed){ d.x=PL[fixed].x; d.y=PL[fixed].y; d.place=fixed; G.drawing=false }
    else if(ACTIONS.find(a=>a.k===p.act).g==='point' && pl){ d.x=PL[pl].x; d.y=PL[pl].y; d.place=pl; G.drawing=false }
    else { G.drawing=true; if(pl){ d.place=pl } }
    inp.value=''; renderBody(); draw();
    return toast(G.drawing? 'Understood. Now drag the line on the ground.' : `Understood — ${p.act} at ${PL[d.place].name}. Preview it.`, 3600);
  }
  if(G.verb==='notice'){
    const cid = p.cond || (G.focus? (readingsAt(G.focus).find(r=>r.readable)||{}).c?.id : null);
    if(!cid) return toast('Say what you saw, and where. Touch a place first.', 3600);
    if(!canPublish(cid)) return toast(`That belongs to ${CO[cid].dom}. You cannot read it from your seat — ask whoever can.`, 4600);
    push({k:'notice', cond:cid, place:CO[cid].place, text});
    inp.value=''; G.focus=CO[cid].place; renderAll(); draw();
    return toast('On the record.');
  }
  if(G.verb==='claim'){
    if(p.cond && p.cond2){ push({k:'claim', cause:p.cond, effect:p.cond2, text}); inp.value='';
      G.mode='system'; syncMode(); afterChange(); return toast('Claim recorded. It can now be contested and tested.') }
    return toast('A claim needs two things that are already on the record. Name both.', 4200);
  }
  if(G.verb==='connect'){
    if(p.cond && p.cond2){ push({k:'connect', a:p.cond, b:p.cond2, text}); inp.value='';
      G.mode='system'; syncMode(); afterChange(); return toast('Connected.') }
    return toast('Name two conditions.', 3200);
  }
  push({k:'utter', text}); inp.value=''; toast('Said. Nobody can act on it until it names a place or a thing.', 4200);
}
$('#saygo').onclick=say;
$('#say').addEventListener('keydown', e=>{ if(e.key==='Enter') say() });
document.querySelectorAll('.mode').forEach(m=>m.onclick=()=>{ G.mode=m.dataset.mode; syncMode(); renderAll(); draw() });
$('#seatbtn').onclick=openSeatSheet;
$('#weekbtn').onclick=()=>{ G.verb='witness'; G.mode='earth'; syncMode(); renderAll(); draw() };
$('#modal').onclick=e=>{ if(e.target.id==='modal') $('#modal').classList.remove('on') };

/* ============================ 11 · OTHER PEOPLE =========================
   Peers exchange log entries, never state. Everyone folds the same world.
   ======================================================================== */
const net = {
  peer:null, conns:[], host:false,
  send(msg){ if(!this.peer) return; this.conns.forEach(c=>{ try{ c.send(msg) }catch(e){} }) },
  start(room){
    if(!room || typeof Peer==='undefined') return;
    G.room=room;
    const hostId='wtens-'+room.toLowerCase().replace(/[^a-z0-9]/g,'');
    const asHost=()=>{
      this.peer=new Peer(hostId); this.host=true; G.host=true;
      this.peer.on('open',()=>toast('You are holding the room. Others can join with ?room='+room, 4200));
      this.peer.on('connection', c=>{
        this.conns.push(c);
        c.on('open',()=>c.send({t:'sync', log:G.log, players:G.players}));
        c.on('data', m=>{ this.take(m); this.conns.forEach(x=>{ if(x!==c) try{x.send(m)}catch(e){} }) });
        c.on('close',()=>{ this.conns=this.conns.filter(x=>x!==c) });
      });
      this.peer.on('error', e=>{ if(e.type==='unavailable-id') asGuest(); });
    };
    const asGuest=()=>{
      this.peer=new Peer(); G.host=false;
      this.peer.on('open',()=>{
        const c=this.peer.connect(hostId,{reliable:true});
        c.on('open',()=>{ this.conns=[c]; c.send({t:'player', p:G.players[G.me]}); toast('Joined '+room, 3000) });
        c.on('data', m=>this.take(m));
      });
      this.peer.on('error', e=>toast('Cannot reach room '+room, 3200));
    };
    asHost();
  },
  take(m){
    if(m.t==='entry'){ if(!G.log.some(e=>e.id===m.e.id)){ G.log.push(m.e); afterChange() } }
    else if(m.t==='player' && m.p && m.p.id){
      G.players[m.p.id] = {id:String(m.p.id).slice(0,24),
        name:String(m.p.name||'?').replace(/[^\w .'-]/g,'').slice(0,14).toUpperCase() || '?',
        seat: SEATS.includes(m.p.seat) ? m.p.seat : SEATS[0],
        actor: AC[m.p.actor] ? m.p.actor : null};
      afterChange();
    }
    else if(m.t==='sync'){ G.log=m.log; Object.assign(G.players,m.players); afterChange() }
  }
};

/* ============================ 12 · BOOT ================================= */
function rebuildDerived(){
  G.moved={}; for(const e of G.log) if(e.k==='reseat') G.moved[e.actor]=e.to;
  G.tests = G.log.filter(e=>e.k==='test').map(e=>({pair:e.pair,supported:e.supported}));
}
const _recompute = recompute;
recompute = function(){ rebuildDerived(); _recompute() };

(function boot(){
  const q=new URLSearchParams(location.search);
  G.me = 'p'+Math.floor(Math.random()*1e6).toString(36);
  const seatWanted = q.get('seat');
  const actor = seatWanted && AC[seatWanted] ? AC[seatWanted] : AC.okonjo;
  G.players[G.me] = {id:G.me, name:(q.get('name')||'YOU').toUpperCase().slice(0,12),
    seat:seatId(actor.seat[0],actor.seat[1]), actor:actor.id};
  G.players[G.me].name = G.players[G.me].name.replace(/[^\w .'-]/g,'').slice(0,14) || 'YOU';
  // Brookside did not start when you arrived.
  for(let k=0;k<12;k++) G.log.push({k:"witness", id:"seed"+k, by:"world", week:k});
  resize(); recompute();
  G.focus='crossing'; G.verb='notice';
  draw(); renderAll(); loop();
  const room=q.get('room'); if(room) net.start(room);
  setTimeout(()=>{ $('#hint').style.opacity=1 }, 600);
})();
